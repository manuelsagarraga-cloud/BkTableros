name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Antes de publicar: el JSX compila y el lector/semáforo dan lo esperado con un cronograma de prueba.
      # Si falla, no se publica y el sitio queda con la versión anterior.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas
        run: |
          npm i --no-save --no-package-lock @babel/standalone@7.23.9 @xmldom/xmldom@0.8.10
          node tests/run.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp index.html _site/404.html
          # Los datos (cronogramas, Excel de proyectos y de pagos) viven en Supabase, no en el sitio público

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
