<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Análisis de Cabida — se mudó</title>
<meta name="robots" content="noindex"/>
<style>
:root{--bg:#fafbfc;--el:#fff;--c0:#1a1f2e;--c1:#5a6178;--b0:#e2e5ea;--ac:#9E0101}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--el:#1e2636;--c0:#e4e8ee;--c1:#8b95a8;--b0:#2a3344}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--c0);font-family:Lato,-apple-system,sans-serif;padding:16px;box-sizing:border-box}
.box{background:var(--el);border:1px solid var(--b0);border-radius:4px;padding:24px;max-width:440px}
h1{font-size:17px;margin:0 0 8px;color:var(--ac)}p{font-size:14px;color:var(--c1);line-height:1.5;margin:0 0 14px}
a{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:8px 14px;border-radius:3px;font-weight:700;font-size:13px}
</style>
<script>
  // La herramienta se mudó a su propio sitio. Se conserva el #lat,lon para que los links a un lote sigan andando.
  var destino = 'https://manuelsagarraga-cloud.github.io/Analisis-Cabida/' + (location.hash || '');
  location.replace(destino);
</script>
</head>
<body>
<div class="box">
  <h1>Normativa y Cabida se mudó</h1>
  <p>La herramienta ahora vive en su propio sitio, con la cartera de lotes por empresa.</p>
  <a id="ir" href="https://manuelsagarraga-cloud.github.io/Analisis-Cabida/">Ir a Análisis de Cabida</a>
</div>
<script>document.getElementById('ir').href = destino;</script>
</body>
</html>
