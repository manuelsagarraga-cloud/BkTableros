.leaflet-container{font-family:var(--ff)}
.leaflet-tooltip.calle{background:var(--el);color:var(--c0);border:1px solid var(--ac);font-family:var(--fm);font-size:11px;padding:2px 6px;box-shadow:none}

@media print{
  body{overflow:visible;height:auto;background:#fff;color:#000}

<script>
/* ==========================================================================
   Motor de normativa y cabida — Córdoba capital
   Datos: IDECOR / Municipalidad de Córdoba (capas WFS públicas)
   Estimación preliminar: no reemplaza la visación municipal.
   ========================================================================== */
(function (root) {
  'use strict';
  const EPS = 1e-6;

  // ---------------------------------------------------------------- texto
  function str(v) {
    if (v == null) return '';
    const s = String(v).replace(/\s+/g, ' ').trim();
    if (s === '' || /^<null>$/i.test(s) || s === 'null') return '';
    return s;
  }
  function num(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(',', '.').trim();
    if (!s) return null;
    const n = parseFloat(s);
    return isFinite(n) ? n : null;
  }
  function pnum(s) { return s == null ? null : parseFloat(String(s).replace(',', '.')); }
  function pisos(s) {
    s = str(s);
    if (!s) return null;
    const m = s.match(/planta baja\s*\+\s*(\d+)/i);
    if (m) return parseInt(m[1], 10) + 1;
    if (/planta baja/i.test(s)) return 1;
    return null;
  }

  // ---------------------------------------------------------------- geometría
  function outerRing(geom) {
    if (!geom) return null;
    let c = geom.coordinates || geom;
    if (geom.type === 'MultiPolygon' || (Array.isArray(c[0]) && Array.isArray(c[0][0]) && Array.isArray(c[0][0][0]))) {
      // elegir el polígono de mayor área
      let best = null, bestA = -1;
      c.forEach(function (poly) { const r = poly[0]; const a = Math.abs(areaLL(r)); if (a > bestA) { bestA = a; best = r; } });
      c = best;
    } else if (geom.type === 'Polygon' || Array.isArray(c[0][0])) {
      c = c[0];
    }
    const r = c.slice();
    if (r.length > 1 && r[0][0] === r[r.length - 1][0] && r[0][1] === r[r.length - 1][1]) r.pop();
    return r;
  }
  function areaLL(r) { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return a / 2; }
  function makeProj(lon0, lat0) {
    const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
    return {
      f: function (p) { return [(p[0] - lon0) * kx, (p[1] - lat0) * ky]; },
      inv: function (p) { return [p[0] / kx + lon0, p[1] / ky + lat0]; }
    };
  }
  function area(r) { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += r[j][0] * r[i][1] - r[i][0] * r[j][1]; return Math.abs(a / 2); }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function len(v) { return Math.hypot(v[0], v[1]); }
  function segDist(p, a, b) {
    const ab = sub(b, a), ap = sub(p, a);
    const L2 = ab[0] * ab[0] + ab[1] * ab[1];
    let t = L2 > 0 ? (ap[0] * ab[0] + ap[1] * ab[1]) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    return len([ap[0] - t * ab[0], ap[1] - t * ab[1]]);
  }
  function distToRing(p, r) { let d = Infinity; for (let i = 0; i < r.length; i++) d = Math.min(d, segDist(p, r[i], r[(i + 1) % r.length])); return d; }
  function inside(p, r) {
    let c = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      if (((r[i][1] > p[1]) !== (r[j][1] > p[1])) && (p[0] < (r[j][0] - r[i][0]) * (p[1] - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0])) c = !c;
    }
    return c;
  }
  function centroid(r) { let x = 0, y = 0; r.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / r.length, y / r.length]; }
  function angDeg(v) { let a = Math.atan2(v[1], v[0]) * 180 / Math.PI; a = ((a % 180) + 180) % 180; return a; }
  function angDiff(a, b) { let d = Math.abs(a - b) % 180; return d > 90 ? 180 - d : d; }
  function rayHit(o, d, a, b) {
    // rayo o + t d contra segmento a-b → t o null
    const e = sub(b, a);
    const den = d[0] * e[1] - d[1] * e[0];
    if (Math.abs(den) < 1e-12) return null;
    const w = sub(a, o);
    const t = (w[0] * e[1] - w[1] * e[0]) / den;
    const u = (w[0] * d[1] - w[1] * d[0]) / den;
    if (t > 0 && u >= 0 && u <= 1) return t;
    return null;
  }

  /**
   * Analiza la geometría del lote contra su manzana y las manzanas vecinas.
   * parcelGeom, mzGeom: GeoJSON (lon/lat). neighbors: [{nom, geom}]. mzNom: nomenclatura de la manzana propia.
   */
  function analyzeLot(parcelGeom, mzGeom, neighbors, mzNom) {
    const pr = outerRing(parcelGeom);
    if (!pr || pr.length < 3) return null;
    const c0 = centroid(pr);
    const P = makeProj(c0[0], c0[1]);
    const ring = pr.map(P.f);
    const res = { areaGeo: area(ring), frentes: [], esquina: false, pasante: false, interior: false, notes: [] };
    const mr = mzGeom ? outerRing(mzGeom) : null;
    if (!mr) { res.notes.push('No se encontró la manzana: frente y fondo estimados por la forma del lote.'); }
    const M = mr ? mr.map(P.f) : null;
    const TOL = 1.0;
    // aristas sobre la línea municipal (borde de manzana)
    const edges = ring.map(function (a, i) {
      const b = ring[(i + 1) % ring.length];

  function parseUnits(t) {

  // Art. 42 (Ord. 12596): decimales ≥ 0,50 suman una unidad

  function unitsCalc(N, S, total) {

      if (min2 && n < 2) { n = 2; parts.push('mínimo 2 por Art. 26'); }

      const noBonus = (z === 'F3' && u.perS === 100) || (['F4', 'G2', 'G3', 'H2'].indexOf(z) >= 0 && !!u.perFOT);

        const capCV = z === 'F3' ? 5 : null;
        let nCV = roundUF(S / u.perS_CV); if (capCV && nCV > capCV) nCV = capCV;

      }
      else if (u.perFOT && u.perS && N.fot) r.alt = { n: roundUF(N.fot * S / u.perFOT), txt: '1 cada ' + u.perFOT + ' m² del FOT con factibilidad de cloacas' };

    return { n: null, label: 'Sin tope', txt: u.txt || 'La capa no fija tope de unidades: lo define la superficie construible.' };
  }

  // ---------------------------------------------------------------- cabida
  /**
   * N: norma (parseNorma). L: lote {S, a, f, W, esq, cmOn, lfi, min8060S}. o: {hp, minD, leExtra}

    out.hp = hp;
    const D = L.cmOn && L.lfi ? Math.min(f, L.lfi) : f;
    const cmExtra = (L.cmOn && L.lfi && f > L.lfi) ? 0.25 * a * (f - L.lfi) : 0;
    const whys = new Set();

    function fosAt(zt) {
      let v = N.fos;
      if (N.fosBySup) { v = S < N.fosBySup.lim ? N.fosBySup.a : N.fosBySup.b; whys.add('FOS según superficie de parcela (' + Math.round(v * 100) + '%)'); }

    let assumed45 = false;

    function frontAt(zt) {

      } else if (N.hLM && N.hMax && N.hMax > N.hLM + EPS && zt > N.hLM + EPS) {

    function runPerfil(latTotal) {

        } else fr = frontAt(zt);

      let best = null;
      const nMaxT = Math.floor((N.hPerim + EPS) / hp);
      for (let n = base + 1; n <= nMaxT; n++) {

async function wfs(layer, cql, opt) {
  opt = opt || {};
  const p = new URLSearchParams({ service: 'WFS', version: '2.0.0', request: 'GetFeature', outputFormat: 'application/json', srsName: 'EPSG:4326', typeNames: 'idecor:' + layer });
  if (cql) p.set('CQL_FILTER', cql);
  if (opt.props) p.set('propertyName', opt.props);
  if (opt.count) p.set('count', String(opt.count));
  const ctrl = new AbortController();
  const t = setTimeout(function () { ctrl.abort(); }, opt.timeout || 25000);
  try {
    const r = await fetch(WFS + '?' + p.toString(), { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    return j.features || [];
  } finally { clearTimeout(t); }
}

async function consultar(lat, lon) {
  const pt = 'SRID=4326;POINT(' + lon + ' ' + lat + ')';
  const I = 'INTERSECTS(geom,' + pt + ')';
  const dw = function (m) { return 'DWITHIN(geom,' + pt + ',' + m + ',meters)'; };
  const d = 0.0012;
  const bb = 'BBOX(geom,' + (lon - d) + ',' + (lat - d) + ',' + (lon + d) + ',' + (lat + d) + ",'EPSG:4326')";
  const jobs = {
    parcela: wfs('parcelas', I, { count: 1 }),
    manzana: wfs('manzana', I, { count: 1 }),
    zona: wfs('CBA_Ordenanza_8256', I, { props: P8256 }),
    cm: wfs('CBA_Centro_de_Manzana_8256', I, { props: 'nomenclatura,centro_manzana,caracteristica,ordenanza' }),
    uso: wfs('CBA_Ordenanza_8133', I, { props: 'patron,descripcion,localizacion,informacion_adicional,antecedentes,observaciones,anexo' }),
    fracc: wfs('CBA_Ordenanza_8060_Modificaciones', I, { props: 'zonificacion,sector,descripcion,frente,superficie,plan_vivienda_frente,plan_vivienda_superficie,antecedentes,observaciones,excepciones' }),
    o13131: wfs('ord_13131', I, { props: 'patron,descripcion,digesto_municipal' }),
    franja: wfs('franja_ecoprod_13131', I, { props: 'franja_eco' }),
    resguardo: wfs('buffer_13131', I, { props: 'layer' }),
    apu: wfs('CBA_Areas_Promocion_Urbana_8256', I, { props: 'id' }),
    app: wfs('cba_area_de_proteccion_patrimonial', I, { props: 'nombre_app' }),
    arq: wfs('cba_area_arqueologica_de_riesgo', I, { props: 'escalas,observacio' }),
    loteoA: wfs('loteos_muni_aprobados', I, { props: PLOTEO }),
    loteoU: wfs('loteos_muni_autorizados', I),
    vt: wfs('valor_tierra_urbana_2025', I, { props: 'nomenclatura,vut_pesos,superficie_terreno' }),
    alq: wfs('alquileres_parcela_urbano_2026', I, { props: 'nomenclatura,estado,vua,vua_comercial' }),
    cat: wfs('cba_inmuebles_catalogados', dw(45)),
    sitios: wfs('cba_sitios_de_interes', dw(80)),
    elem: wfs('cba_elemento_urbano_ambiental', dw(40), { props: 'nombre,tipo,categoria,app,mhnac,mhpcial,dmunicipal,observacio' }),
    gal: wfs('cba_galerias_comerciales', dw(40)),
    vial: wfs('CBA_Red_Vial_8060', dw(45), { props: 'tipo,nombre,descripcion,antecedentes_legales' }),
    v9089: wfs('CBA_Red_Vial_9089', dw(520), { props: 'detalle' }),
    vecinas: wfs('manzana', bb, { props: 'nomenclatura,geom' })
  };
  const keys = Object.keys(jobs);
  const res = await Promise.allSettled(keys.map(function (k) { return jobs[k]; }));
  const D = { lat: lat, lon: lon, errors: {}, t: Date.now() };
  keys.forEach(function (k, i) {
    if (res[i].status === 'fulfilled') D[k] = res[i].value;
    else { D[k] = []; D.errors[k] = String(res[i].reason && res[i].reason.message || res[i].reason); }
  });
  return D;
}

function nomMuni(p) {
  p = String(p || '');
  if (p.length < 16) return '';
  return p.slice(6, 8) + '-' + p.slice(8, 10) + '-' + p.slice(10, 13) + '-' + p.slice(13, 16);
}
function nomProv(m) {
  const parts = m.split('-').map(function (x) { return x.trim(); });
  if (parts.length !== 4) return null;
  const pad = function (s, n) { return ('000' + s).slice(-n); };

}
function interiorPoint(geom) {
  const r = E.outerRing(geom);
  if (!r) return null;
  let cx = 0, cy = 0; r.forEach(function (p) { cx += p[0]; cy += p[1]; }); cx /= r.length; cy /= r.length;
  if (E.inside([cx, cy], r)) return [cx, cy];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  r.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
  for (let i = 1; i < 12; i++) for (let j = 1; j < 12; j++) { const q = [x0 + (x1 - x0) * i / 12, y0 + (y1 - y0) * j / 12]; if (E.inside(q, r)) return q; }
  return [cx, cy];
}

/* ═══════ Modelo del lote ═══════ */
function buildModel(D) {
  const M = { D: D };
  const parcel = D.parcela[0] || null;
  const mz = D.manzana[0] || null;
  M.parcel = parcel; M.pp = parcel ? parcel.properties : null; M.mz = mz;
  M.geo = parcel ? E.analyzeLot(parcel.geometry, mz && mz.geometry, D.vecinas.map(function (f) { return { nom: f.properties.nomenclatura, geom: f.geometry }; }), mz && mz.properties.nomenclatura) : null;
  // normas de ocupación (puede haber superposición: convenio + zona base)
  const normas = D.zona.map(function (f) { return E.parseNorma(f.properties); });
  normas.sort(function (a, b) {
    const sa = (a.convenio && !a.noCalc ? 0 : (!a.noCalc ? 1 : 2)), sb = (b.convenio && !b.noCalc ? 0 : (!b.noCalc ? 1 : 2));
    return sa - sb;
  });
  M.normas = normas;
  M.convenioSinParam = normas.find(function (n) { return n.convenio && n.noCalc; }) || null;
  M.fracc = D.fracc[0] ? D.fracc[0].properties : null;
  // superficie y dimensiones detectadas
  const g = M.geo;
  const det = {};
  if (parcel) {
    const Sc = E.num(M.pp.Superficie_Tierra_Urbana);
    det.S = Sc && Sc > 0 ? Sc : (g ? Math.round(g.areaGeo) : null);
    det.Sgeo = g ? g.areaGeo : null;
  }
  if (g) {
    const fr = g.frente || g.frenteEst;
    const fmx = g.fondoMax || g.fondoEst;
    det.frenteReal = fr;
    if (det.S && fr) {
      const fMed = det.S / fr;
      det.f = fmx ? Math.min(fmx, fMed) : fMed;
      det.a = det.S / det.f;
    }
    det.W = g.anchoCalle ? Math.round(g.anchoCalle * 10) / 10 : null;
    det.esq = !!g.esquina;
    det.a2 = g.esquina ? g.frenteCorto : null;
  }
  // centro de manzana
  const cm = D.cm[0] ? D.cm[0].properties : null;
  M.cm = cm;
  if (cm && g && g.mzProf) {
    const tipo = S_(cm.centro_manzana);
    let fac = 2 / 7, fnote = 'Art. 28: 2/7 de la distancia entre líneas municipales opuestas';
    if (/rectangular/i.test(tipo)) {
      const sobreLadoLargo = g.mzLargo >= g.mzProf;
      fac = sobreLadoLargo ? 2 / 7 : 1 / 3;
      fnote = 'Art. 29 inc. c: ' + (sobreLadoLargo ? '2/7' : '1/3') + ' de la distancia entre líneas municipales opuestas';
    } else if (!/t[ií]pica/i.test(tipo)) fnote = 'Manzana atípica: se usó 2/7 como aproximación. Verificar con la Dirección de Planeamiento.';
    det.cmOn = true; det.lfi = Math.round(fac * g.mzProf * 10) / 10; det.cmNote = fnote;
  } else det.cmOn = false;
  if (M.fracc) det.min8060S = E.num(M.fracc.superficie);
  if (M.pp) det.suquia = retiroSuquia(nomMuni(M.pp.Nomenclatura));
  det.patron = D.uso[0] ? S_(D.uso[0].properties.patron) : '';
  M.det = det;
  return M;
}

/* ═══════ Ordenanzas que alcanzan al lote ═══════ */
function ordsDelLote(M) {
  const D = M.D;
  const map = new Map();
  function add(o, rol, fuente, link) {
    const k = E.ordKey(o);
    if (!map.has(k)) map.set(k, { tipo: o.tipo, num: o.num, anio: o.anio, roles: new Set(), fuentes: new Set(), link: null });
    const it = map.get(k);
    if (o.anio && !it.anio) it.anio = o.anio;
    it.roles.add(rol); it.fuentes.add(fuente);
    if (link && !it.link) it.link = link;
  }
  function scan(text, rol, fuente, link) { E.extractOrds(text).forEach(function (o) { add(o, rol, fuente, link); }); }
  M.normas.forEach(function (N) {
    scan(N.ordOriginal, 'Norma base de ocupación', 'Ocupación del suelo');
    scan(N.ordModif, N.convenio ? 'Convenio urbanístico' : 'Modificatoria vigente', 'Ocupación del suelo');
    [N.observ, N.otras, N.otrosRetiros, N.retiroFrente, N.unidadesTxt, N.art].forEach(function (t) { scan(t, 'Mencionada en la norma de la zona', 'Ocupación del suelo'); });
    if (N.convenio) {
      add({ tipo: 'Ord.', num: '13557', anio: '25' }, 'Régimen actual de convenios urbanísticos', 'Ocupación del suelo');
      add({ tipo: 'Ord.', num: '12077', anio: '12' }, 'Régimen de convenios con el que se firmaron los anteriores a 2025 (derogada)', 'Ocupación del suelo');

  if (M.cm) scan(M.cm.ordenanza, 'Centro de manzana', 'Centros de manzana');
  if (D.uso.length) { add({ tipo: 'Ord.', num: '8133', anio: '85' }, 'Uso del suelo (patrón ' + S_(D.uso[0].properties.patron) + ')', 'Uso del suelo'); scan(D.uso[0].properties.antecedentes, 'Antecedente de uso del suelo', 'Uso del suelo'); scan(D.uso[0].properties.observaciones, 'Observación de uso del suelo', 'Uso del suelo'); }
  if (M.fracc) { add({ tipo: 'Ord.', num: '8060', anio: '85' }, 'Fraccionamiento del suelo', 'Fraccionamiento'); ['antecedentes', 'observaciones', 'excepciones'].forEach(function (k) { scan(M.fracc[k], 'Fraccionamiento', 'Fraccionamiento'); }); }
  if (D.o13131.length) add({ tipo: 'Ord.', num: '13131', anio: '21' }, 'Plan del área intermedia y periférica (patrón ' + S_(D.o13131[0].properties.patron) + ')', 'Ord. 13131', S_(D.o13131[0].properties.digesto_municipal));
  if (D.franja.length) add({ tipo: 'Ord.', num: '13131', anio: '21' }, 'Franja ecoproductiva: no admite uso residencial', 'Ord. 13131');
  if (D.resguardo.length) add({ tipo: 'Ord.', num: '13131', anio: '21' }, 'Zona de resguardo del patrón V: no admite uso residencial', 'Ord. 13131');
  D.loteoA.concat(D.loteoU).forEach(function (f) {
    const p = f.properties;
    scan(p.decresapro, 'Aprobación del loteo ' + (S_(p.nombre) || S_(p.nombfant)), 'Loteos');
    Object.keys(LOTEO_ORDS).forEach(function (k) { const v = S_(p[k]); if (v) add({ tipo: 'Ord.', num: LOTEO_ORDS[k], anio: '' }, 'Encuadre del loteo ' + (S_(p.nombre) || ''), 'Loteos', /^https?:/.test(v) ? v : null); });
  });
  D.vial.forEach(function (f) { scan(f.properties.antecedentes_legales, 'Jerarquía vial de ' + S_(f.properties.nombre), 'Red vial'); });
  if (D.v9089.length) add({ tipo: 'Ord.', num: '9089', anio: '' }, 'Distancia a ejes viales', 'Red vial');
  M.catEn && M.catEn.forEach(function (c) { const p = c.properties; scan(p.dmunicipal, 'Declaración patrimonial de ' + S_(p.identifica), 'Patrimonio'); });
  return Array.from(map.values()).sort(function (a, b) { return (a.tipo === b.tipo ? 0 : a.tipo === 'Ord.' ? -1 : 1) || (parseInt(a.num, 10) - parseInt(b.num, 10)); });

/* ═══════ Corte esquemático ═══════ */
function Corte({ r, N, L }) {
  if (!r || !r.rows || !r.rows.length) return null;
  const rows = r.rows;
  const W = r.W, half = W / 2, f = L.f;
  const xMin = -half - 1, xMax = f + 1.5;
  let topZ = 0; rows.forEach(function (x) { topZ = Math.max(topZ, x.zt); });
  if (N && N.hMax) topZ = Math.max(topZ, N.hMax);
  const yMax = Math.max(topZ, 9) + 3;
  const Wd = 640, pad = { l: 40, r: 14, t: 12, b: 28 };
  const s = Math.min((Wd - pad.l - pad.r) / (xMax - xMin), 330 / yMax);
  const Hd = Math.round(yMax * s + pad.t + pad.b);
  const X = function (x) { return pad.l + (x - xMin) * s; };
  const Y = function (y) { return pad.t + (yMax - y) * s; };
  const mono = { fontFamily: 'JetBrains Mono, monospace', fontSize: 10 };
  const ticks = []; const tk = yMax > 40 ? 10 : (yMax > 20 ? 5 : 3);
  for (let h = 0; h <= yMax - 1; h += tk) ticks.push(h);
  const step = N && N.step && N.step.type === 'eje' && !L.esq ? Math.max(0, N.step.d - half) : 0;
  return (
    <svg viewBox={'0 0 ' + Wd + ' ' + Hd} role="img" aria-label="Corte esquemático del volumen edificable">
      <rect x={X(-half)} y={Y(0)} width={half * s} height={4} fill="var(--bg2)" />
      <line x1={X(-half)} y1={Y(0)} x2={X(-half)} y2={Y(yMax - 1)} stroke="var(--c2)" strokeDasharray="6 4 1 4" />
      <text x={X(-half) + 4} y={Y(yMax - 1) + 10} fill="var(--c2)" style={mono}>EJE</text>
      <line x1={X(0)} y1={Y(0)} x2={X(0)} y2={Y(yMax - 1)} stroke="var(--c0)" strokeDasharray="3 3" />
      <text x={X(0) + 4} y={Y(yMax - 1) + 10} fill="var(--c0)" style={mono}>LM</text>
      {step > 0 && <g><line x1={X(step)} y1={Y(0)} x2={X(step)} y2={Y(yMax - 1)} stroke="var(--ac)" strokeDasharray="2 4" /><text x={X(step) + 4} y={Y(yMax - 1) + 22} fill="var(--ac)" style={mono}>12 m del eje</text></g>}
      {L.cmOn && L.lfi && L.lfi < f && <g><line x1={X(L.lfi)} y1={Y(0)} x2={X(L.lfi)} y2={Y(yMax - 1)} stroke="var(--warn)" strokeDasharray="5 3" /><text x={X(L.lfi) + 4} y={Y(yMax - 1) + 10} fill="var(--warn)" style={mono}>LFI</text></g>}
      {N && N.hMax && <g><line x1={X(0)} y1={Y(N.hMax)} x2={X(f)} y2={Y(N.hMax)} stroke="var(--c2)" strokeDasharray="1 3" /><text x={X(f) - 4} y={Y(N.hMax) - 3} textAnchor="end" fill="var(--c2)" style={mono}>{'máx. ' + n2(N.hMax) + ' m'}</text></g>}
      <line x1={X(f)} y1={Y(0)} x2={X(f)} y2={Y(Math.min(yMax - 1, topZ + 2))} stroke="var(--c2)" />
      {rows.map(function (x) {
        const used = x.area > 1e-6;
        return <rect key={x.k} x={X(x.front)} y={Y(x.zt)} width={Math.max(0, x.depth * s)} height={(x.zt - x.zb) * s} fill={used ? 'var(--floor)' : 'none'} stroke="var(--ac)" strokeWidth={used ? 1 : 0.8} strokeDasharray={used ? null : '4 3'} />;
      })}
      {r.rows[0] && L.cmOn && L.lfi && L.lfi < f && r.rows[0].note && r.rows[0].note.indexOf('centro de manzana') >= 0 &&
        <rect x={X(L.lfi)} y={Y(Math.min(r.hp, 4))} width={(f - L.lfi) * s} height={Math.min(r.hp, 4) * s} fill="var(--floor2)" stroke="var(--ac)" strokeWidth={0.7} strokeDasharray="2 2" />}
      <line x1={X(xMin)} y1={Y(0)} x2={X(xMax)} y2={Y(0)} stroke="var(--c0)" strokeWidth={1.5} />
      {ticks.map(function (h) { return <g key={h}><line x1={pad.l - 6} y1={Y(h)} x2={pad.l - 2} y2={Y(h)} stroke="var(--c2)" /><text x={pad.l - 9} y={Y(h) + 3.5} textAnchor="end" fill="var(--c2)" style={mono}>{h}</text></g>; })}
      <text x={X(-half / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'½ calle ' + nf(W, 1)}</text>
      <text x={X(f / 2)} y={Y(0) + 18} textAnchor="middle" fill="var(--c2)" style={mono}>{'fondo ' + n2(f) + ' m'}</text>
    </svg>
  );
}

      <div className="title-lote">Punto sin parcela catastral</div>
      <p className="sub">Tocaste la calle o un espacio público. La normativa de la zona se muestra igual; para calcular la cabida cargá superficie, frente y fondo a mano.</p>
      <p className="sub mono">{D.lat.toFixed(6)}, {D.lon.toFixed(6)}</p>
    </Card>
  );
  const muni = nomMuni(pp.Nomenclatura);
  const vutM = vt && E.num(vt.vut_pesos);
  return (
    <Card title="Lote" src="Parcelario y valuación · IDECOR" hero>
      <div className="title-lote">{muni ? 'Parcela ' + muni : 'Parcela'}</div>
      <div className="sub">{(det.esq ? 'Esquina' : g && g.pasante ? 'Frente a dos calles' : g && g.interior ? 'Lote interno' : 'Entre medianeras') + ' · ' + nf(det.S) + ' m² · ' + S_(pp.Estado).toLowerCase()}</div>
      <div className="tags" style={{ marginTop: 8 }}>
        {M.normas[0] && <span className="tag tag-ac">{M.normas[0].etiqueta}</span>}
        {D.app.length > 0 && <span className="tag tag-warn">{S_(D.app[0].properties.nombre_app)}</span>}
        {M.catEn && M.catEn.length > 0 && <span className="tag tag-err">Inmueble catalogado</span>}
        {M.convenioSinParam && <span className="tag tag-warn">Convenio urbanístico</span>}
        {(D.loteoA.length > 0 || D.loteoU.length > 0) && <span className="tag tag-grey">Loteo aprobado</span>}
        {D.franja.length > 0 && <span className="tag tag-err">Franja ecoproductiva</span>}
      </div>
      <div style={{ marginTop: 12 }}>
        <KV items={[
          ['Nomenclatura', muni + '  (prov. ' + pp.Nomenclatura + ')', true],
          ['Cuenta', String(pp.Nro_Cuenta || ''), true],
          ['Superficie catastral', nf(det.S, 2) + ' m²' + (det.Sgeo && Math.abs(det.Sgeo - det.S) / det.S > 0.05 ? '  (polígono: ' + nf(det.Sgeo) + ' m²)' : ''), true],
          ['Frente', g && g.frentes.length ? g.frentes.map(function (x) { return n2(x.L) + ' m'; }).join(' + ') + (g.ochava ? ' + ochava' : '') : (g && g.frenteEst ? '≈ ' + n2(g.frenteEst) + ' m (estimado)' : null), true],
          ['Fondo', g && g.fondoMax ? n2(g.fondoMax) + ' m máx. · ' + n2(g.fondoMedio) + ' m medio' : null, true],
          ['Ancho de calle', g && g.frentes.length ? g.frentes.map(function (x) { return x.ancho ? '≈ ' + nf(x.ancho, 1) + ' m' : 'sin dato'; }).join(' · ') : null, true],
          ['Superficie cubierta', pp.Superficie_Mejoras ? nf(pp.Superficie_Mejoras) + ' m² existentes' : 'Sin mejoras registradas', true],
          ['Cuentas', pp.Cantidad_Cuentas > 1 ? pp.Cantidad_Cuentas + ' (propiedad horizontal)' : null],
          ['Valuación fiscal', money(E.num(pp.Valuacion)), true],
          ['VUT fiscal', pp.vut_vigente ? money(pp.vut_vigente) + '/m²' : null, true],
          ['Valor de la tierra', vutM ? money(vutM) + '/m² · ' + money(vutM * det.S) + ' total' : null, true],
          ['Alquiler de referencia', alq && E.num(alq.vua) ? money(alq.vua) + '/m² vivienda · ' + money(alq.vua_comercial) + '/m² comercial' : null, true]
        ]} />
      </div>
      {g && g.notes.length > 0 && <div className="alert">{g.notes.join(' ')}</div>}
      <p className="small muted" style={{ marginTop: 8 }}>Valor de la tierra 2025 y alquiler enero 2026: estimaciones de IDECOR a partir del Observatorio del Mercado Inmobiliario. La valuación fiscal es la vigente en Catastro provincial.</p>
    </Card>
  );
}

const DEF = { hp: '', minD: 4, leExtra: 0 };
function CabidaCard({ M, normaSel, setNormaSel }) {
  const det = M.det;
  const normas = M.normas.filter(function (n) { return !n.noCalc; });
  const N = normaSel != null && M.normas[normaSel] ? M.normas[normaSel] : (normas[0] || M.normas[0] || null);
  const init = function () { return { S: det.S || '', a: det.a ? Math.round(det.a * 100) / 100 : '', f: det.f ? Math.round(det.f * 100) / 100 : '', W: det.W || '', esq: !!det.esq, cmOn: !!det.cmOn, lfi: det.lfi || '', hp: '', minD: 4, leExtra: 0 }; };
  const [v, setV] = useState(init);
  useEffect(function () { setV(init()); }, [M.D.t]);
  const set = function (k) { return function (e) { const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value; setV(function (o) { const n = Object.assign({}, o); n[k] = val; return n; }); }; };
  const num = function (x) { const n = parseFloat(String(x).replace(',', '.')); return isFinite(n) ? n : NaN; };
  const L = { S: num(v.S), a: num(v.a), f: num(v.f), W: num(v.W), esq: v.esq, cmOn: v.cmOn, lfi: num(v.lfi), min8060S: det.min8060S, a2: v.esq ? det.a2 : null, patron: det.patron };
  const r = useMemo(function () { return N ? E.cabida(N, L, { hp: num(v.hp), minD: num(v.minD), leExtra: num(v.leExtra) }) : null; }, [N, v.S, v.a, v.f, v.W, v.esq, v.cmOn, v.lfi, v.hp, v.minD, v.leExtra, det.min8060S, det.a2, det.patron]);
  M.cabida = r; M.cabidaL = L; M.cabidaN = N;
  const isDet = function (k) { return det[k] != null && String(det[k] === true ? true : (Math.round(det[k] * 100) / 100)) === String(v[k]); };
  const fld = function (k, label, unit, step) {
    const d = det[k] != null && det[k] !== '' && det[k] !== false;
    return <label className={'fld' + (!d && (k === 'S' || k === 'a' || k === 'f') ? ' man' : '')}>
      <span>{label} {d && isDet(k) ? <span className="det">· detectado</span> : null}</span>
      <span className="row"><input type="number" inputMode="decimal" step={step || '0.01'} value={v[k]} onChange={set(k)} placeholder={k === 'hp' && N ? n2(N.hpAuto || 3) : ''} /><span className="u">{unit}</span></span>
    </label>;
  };
  const used = r && r.rows ? r.rows.filter(function (x) { return x.area > 1e-6; }) : [];
  const limTxt = !r || r.error ? '' : r.limit === 'FOT' ? 'Limita el FOT' : r.limit === 'FOS' ? 'Limita el FOS' : r.limit === 'Retiros' ? 'Limitan los retiros' : 'Limita el perfil';
  return (
    <Card title="Cabida máxima" src="Cálculo con parámetros de la capa oficial" hero>
      {M.normas.length > 1 && <label className="fld" style={{ marginBottom: 10 }}>
        <span>Norma aplicada (el punto cae en {M.normas.length} polígonos)</span>
        <span className="row"><select value={normaSel != null ? normaSel : M.normas.indexOf(N)} onChange={function (e) { setNormaSel(parseInt(e.target.value, 10)); }}>
          {M.normas.map(function (n, i) { return <option key={i} value={i}>{n.etiqueta + ' · ' + (n.ordModif || n.ordOriginal || n.clave) + (n.noCalc ? ' (sin parámetros)' : '')}</option>; })}
        </select></span>
      </label>}
      {!N && <div className="alert err">No hay norma de ocupación para este punto.</div>}
      {r && r.error && <div className="alert err">{r.error}</div>}
      {r && !r.error && <Fragment>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
          <div>
            <div className="lbl">Superficie construible estimada · {N.etiqueta}</div>
            <div className="big">{nf(r.total)}<small>m²</small></div>
            <div className="sub">cubiertos sobre cota de predio · {N.ordModif || N.ordOriginal}</div>
          </div>
          <div className="tags"><span className="tag tag-ac">{limTxt}</span>{r.alt && <span className="tag tag-grey">Alternativa disponible</span>}</div>
        </div>
        <div className="metrics">
          <div className="metric"><div className="lbl">Plantas</div><div className="v">{r.floors <= 1 ? 'PB' : 'PB + ' + (r.floors - 1)}</div><div className="d">{N.pisosMax ? 'norma: ' + (N.pisosMax <= 1 ? 'PB' : 'PB + ' + (N.pisosMax - 1)) : 'según FOS y FOT'}</div></div>
          <div className="metric"><div className="lbl">Altura</div><div className="v">{n2(r.hReached)} m</div><div className="d">{n2(r.hp)} m entre pisos</div></div>
          <div className="metric"><div className="lbl">Índice</div><div className="v">{n2(r.index)}</div><div className="d">m² por m² de lote{N.fot ? ' · FOT ' + nf(N.fot, 2) : ''}</div></div>
          <div className="metric"><div className="lbl">Unidades</div><div className="v">{r.units.label}</div><div className="d">{r.units.alt ? r.units.alt.n + ' ' + r.units.alt.txt.toLowerCase() : r.units.txt}</div></div>
        </div>
        {r.alt && <p className="small">{r.alt.label}: {nf(r.alt.total)} m²{r.alt.approx ? ' (aproximado, ver gráfico del perfil)' : ''}.</p>}
      </Fragment>}
      <div className="inputs no-print" style={{ marginTop: 10 }}>
        {fld('S', 'Superficie', 'm²')}
        {fld('a', 'Frente equivalente', 'm')}
        {fld('f', 'Fondo', 'm', '0.1')}
        {fld('W', 'Ancho de calle', 'm', '0.1')}
        {fld('hp', 'Altura entre pisos', 'm', '0.05')}
        {fld('leExtra', 'Retiro de LE extra', 'm', '0.5')}
      </div>
      <div className="no-print" style={{ display: 'flex', gap: 16, flexWrap: 'wrap', marginTop: 10, alignItems: 'center' }}>
        <label className="chk"><input type="checkbox" checked={v.esq} onChange={set('esq')} /> Esquina</label>
        <label className="chk"><input type="checkbox" checked={v.cmOn} onChange={set('cmOn')} /> Centro de manzana</label>
        {v.cmOn && <label className="fld" style={{ width: 150 }}><span>Línea de frente interno</span><span className="row"><input type="number" step="0.1" value={v.lfi} onChange={set('lfi')} /><span className="u">m</span></span></label>}
        <button className="btn" onClick={function () { setV(init()); }}>Restablecer detectados</button>
      </div>
      {det.frenteReal && det.a && Math.abs(det.frenteReal - det.a) / det.a > 0.1 && <p className="small muted" style={{ marginTop: 6 }}>Lote irregular: frente real {n2(det.frenteReal)} m; se usa un frente equivalente de {n2(det.a)} m para que frente × fondo dé la superficie.</p>}
      {r && !r.error && <Fragment>
        <div className="corte"><Corte r={r} N={N} L={L} /></div>
        <div className="legend"><span><i className="u"></i>Planta computada</span>{r.rows.some(function (x) { return x.area <= 1e-6; }) && <span><i className="g"></i>Volumen que el perfil permite pero el FOT no</span>}<span>Alturas en m desde cota de predio</span></div>
        <div className="tw"><table className="t">
          <thead><tr><th>Nivel</th><th>Altura</th><th>Retiro frente</th><th>Prof.</th><th>Ancho</th><th>FOS</th><th>m²</th><th>Nota</th></tr></thead>
          <tbody>{r.rows.map(function (x) {
            const off = x.area <= 1e-6;
            return <tr key={x.k} className={off ? 'off' : ''}><td>{x.k === 0 ? 'PB' : x.k + '° piso'}{!off && <span className="bytag">{x.by}</span>}</td><td>{n2(x.zt)}</td><td>{n2(x.front)}</td><td>{n2(x.depth)}</td><td>{n2(x.width)}</td><td>{nf(x.fos * 100)}%</td><td>{nf(x.area, 1)}</td><td>{x.note}</td></tr>;
          })}</tbody>
          <tfoot><tr><td>Total</td><td colSpan="5"></td><td>{nf(r.total, 1)}</td><td>{r.envTotal > r.total + 0.5 ? 'El perfil permitiría ' + nf(r.envTotal) + ' m²' : (r.fotCap ? 'FOT × sup. = ' + nf(r.fotCap) + ' m²' : '')}</td></tr></tfoot>
        </table></div>
        {(r.refs.length > 0) && <ul className="refs">{r.refs.map(function (t, i) { return <li key={i}>{t}</li>; })}{det.cmOn && det.cmNote && <li>{det.cmNote}</li>}</ul>}
        {r.warns.map(function (t, i) { return <div key={'w' + i} className="alert">{t}</div>; })}
        {r.notes.map(function (t, i) { return <div key={'n' + i} className="alert info">{t}</div>; })}
      </Fragment>}
      {N && /CENTRO HIST/i.test(N.otras || '') && M.D.app.some(function (f) { return /CENTRO HIST/i.test(S_(f.properties.nombre_app)); }) && <div className="alert">Manzana del Centro Histórico: las alturas máximas las fija la Dirección de Planeamiento Urbano, así que esta cabida es indicativa hasta tener esa consulta.</div>}
      {det.suquia && <div className="alert">Manzana con retiro obligatorio de <b>{det.suquia} m</b> en los frentes al Río Suquía o a la Av. Costanera (Art. 9 bis, Ord. 12483). {num(v.leExtra) >= det.suquia ? 'Ya está aplicado en el cálculo.' : <button className="btn" style={{ marginLeft: 6 }} onClick={function () { setV(function (o) { return Object.assign({}, o, { leExtra: det.suquia }); }); }}>Aplicar {det.suquia} m</button>}</div>}
      {M.convenioSinParam && <div className="alert">Esta parcela está alcanzada por un convenio urbanístico ({M.convenioSinParam.ordModif}). La cabida real la fija ese convenio: el cálculo de arriba usa la zona base como referencia.</div>}
      <p className="small muted" style={{ marginTop: 10 }}>Estimación preliminar. No descuenta patios reglamentarios, núcleos ni circulaciones; los subsuelos de cocheras no computan. No reemplaza la visación ni el certificado de uso del suelo.</p>
    </Card>
  );
}

        ['Plano a 45°', N.plano45 || null],

      <p className="small" style={{ marginTop: 6 }}>{S_(cm.caracteristica)}</p>

// Avisos de normas que cambiaron la zonificación y que la capa oficial todavía no cita
function AvisosNorma({ M }) {
  const dg = React.useContext(DigCtx);
  if (!dg) return null;
  const muni = M.pp ? nomMuni(M.pp.Nomenclatura) : '';
  const out = [];
  dg.marco.forEach(function (g) {
    g.items.forEach(function (it) {
      if (it.poly && E.inside([M.D.lon, M.D.lat], it.poly)) {

        out.push(<div key={it.k + 'p'} className="alert info">{it.aviso || ('El lote parece estar dentro del ámbito de la ' + it.k + '.')} {d0 && <DocLinks d={d0} small />}</div>);

      }

      if (it.mz.some(function (m) { return muni.indexOf(m) === 0; })) {

        out.push(<div key={it.k} className="alert">La <b>{it.k}/{d ? String(d.anio).slice(-2) : ''}</b> cambió la zonificación de esta manzana y la capa oficial todavía no la cita: los parámetros de abajo pueden estar desactualizados. {d && <DocLinks d={d} small />}</div>);

    });
  });
  return out.length ? <Fragment>{out}</Fragment> : null;
}

function classifyCat(M) {
  const D = M.D;
  M.catEn = []; M.catLin = []; M.catCerca = [];
  if (!D.cat.length) return;
  const pr = M.parcel ? E.outerRing(M.parcel.geometry) : null;
  D.cat.forEach(function (f) {
    const cr = E.outerRing(f.geometry);
    if (!pr || !cr) { M.catCerca.push(f); return; }
    const c0 = pr[0];
    const P = E.makeProj(c0[0], c0[1]);
    const A = pr.map(P.f), B = cr.map(P.f);
    const overlap = A.some(function (p) { return E.inside(p, B); }) || B.some(function (p) { return E.inside(p, A); });
    // área en común aproximada: si comparten nomenclatura, es la misma parcela
    const same = S_(f.properties.nc_muni) && S_(f.properties.nc_muni) === nomMuni(M.pp && M.pp.Nomenclatura);
    if (same || overlap) { M.catEn.push(f); return; }
    let dmin = Infinity;
    A.forEach(function (p) { B.forEach(function (q) { dmin = Math.min(dmin, Math.hypot(p[0] - q[0], p[1] - q[1])); }); });
    if (dmin < 2.5) M.catLin.push(f); else M.catCerca.push(f);
  });
}

  if (pp) t.push('Superficie ' + nf(M.det.S, 2) + ' m² · frente ' + n2(L.a) + ' m · fondo ' + n2(L.f) + ' m · calle ' + nf(L.W, 1) + ' m' + (L.esq ? ' · esquina' : ''));
  if (N) t.push('Zona: ' + N.etiqueta + ' (' + (N.ordModif || N.ordOriginal) + ') · FOS ' + (N.fos != null ? nf(N.fos * 100) + '%' : '—') + ' · FOT ' + (N.fot != null ? nf(N.fot, 2) : '—') + ' · altura ' + (N.hMax ? n2(N.hMax) + ' m' : 'sin límite'));
  if (r && !r.error) {
    t.push('Cabida máxima estimada: ' + nf(r.total) + ' m² (' + (r.floors <= 1 ? 'PB' : 'PB + ' + (r.floors - 1)) + ', ' + n2(r.hReached) + ' m, índice ' + n2(r.index) + ')');
    t.push('Unidades: ' + r.units.label + (r.units.txt ? ' (' + r.units.txt + ')' : ''));
  }
  const D = M.D;
  if (D.uso[0]) t.push('Uso del suelo: patrón ' + S_(D.uso[0].properties.patron) + ' (Ord. 8133)');
  if (M.fracc) t.push('Fraccionamiento: zona ' + S_(M.fracc.zonificacion) + ', mínimo ' + nf(E.num(M.fracc.superficie)) + ' m² / frente ' + nf(E.num(M.fracc.frente)) + ' m (Ord. 8060)');
  if (D.app[0]) t.push('Patrimonio: ' + S_(D.app[0].properties.nombre_app));

  t.push('Fuente: capas oficiales IDECOR / Municipalidad de Córdoba. Estimación preliminar, verificar con visación municipal.');
  t.push(location.origin + location.pathname + '#' + M.D.lat.toFixed(6) + ',' + M.D.lon.toFixed(6));
  return t.join('\n');
}

    const w = function (layer, extra) { return L.tileLayer.wms(WMS, Object.assign({ layers: 'idecor:' + layer, format: 'image/png', transparent: true, version: '1.1.1', attribution: 'IDECOR · Municipalidad de Córdoba' }, extra || {})); };

    const ecop = w('franja_ecoprod_13131', { opacity: 0.6 });
    L.control.layers({ 'Mapa claro': base, 'Calles (OSM)': osm, 'Satélite': sat }, { 'Ocupación del suelo': zon, 'Parcelas': par, 'Centros de manzana': cm, 'Patrimonio catalogado': pat, 'Uso del suelo (8133)': uso, 'Loteos aprobados': lot, 'Franja ecoproductiva': ecop }, { collapsed: true }).addTo(map);
    L.control.scale({ imperial: false }).addTo(map);
    grp.current = L.layerGroup().addTo(map);
    map.on('click', function (e) { pickRef.current(e.latlng.lat, e.latlng.lng); });
    mapRef.current = map;
    return function () { map.remove(); };
  }, []);
  useEffect(function () { if (active && mapRef.current) setTimeout(function () { mapRef.current.invalidateSize(); }, 50); }, [active]);
  useEffect(function () {
    const map = mapRef.current, g = grp.current;
    if (!map || !g) return;
    g.clearLayers();
    if (!M) return;
    const D = M.D;
    L.circleMarker([D.lat, D.lon], { radius: 4, color: '#9E0101', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(g);
    if (M.mz) L.geoJSON(M.mz.geometry, { style: { color: '#5a6178', weight: 1.2, dashArray: '4 4', fill: false } }).addTo(g);
    if (M.parcel) {
      const lay = L.geoJSON(M.parcel.geometry, { style: { color: '#9E0101', weight: 2, fillColor: '#9E0101', fillOpacity: 0.12 } }).addTo(g);
      if (M.geo) {
        M.geo.frentes.forEach(function (fr) { fr.edgesLL.forEach(function (e) { L.polyline([[e[0][1], e[0][0]], [e[1][1], e[1][0]]], { color: '#E40000', weight: 5, opacity: 0.9 }).addTo(g); }); });
        if (M.geo.rayLL) L.polyline([[M.geo.rayLL[0][1], M.geo.rayLL[0][0]], [M.geo.rayLL[1][1], M.geo.rayLL[1][0]]], { color: '#1a1f2e', weight: 1.5, dashArray: '3 3' }).bindTooltip('calle ≈ ' + nf(M.geo.anchoCalle, 1) + ' m', { permanent: true, className: 'calle', direction: 'center' }).addTo(g);

  useEffect(function () {

/* ═══════ Búsqueda ═══════ */
async function buscar(q) {
  q = q.trim();
  let m;
  if ((m = q.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/))) {
    let a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (Math.abs(a) > Math.abs(b)) { const t = a; a = b; b = t; } // lat ~ -31, lon ~ -64
    return { go: { lat: a, lon: b } };
  }
  let prov = null;
  if (/^\d{1,2}\s*-\s*\d{1,2}\s*-\s*\d{1,3}\s*-\s*\d{1,3}$/.test(q)) prov = nomProv(q.replace(/\s/g, ''));
  else if (/^\d{16}$/.test(q)) prov = q;
  if (prov) {
    const fs = await wfs('parcelas', "Nomenclatura='" + prov + "'", { count: 1 });
    if (!fs.length) return { error: 'No encontré la parcela ' + q + ' en el parcelario provincial.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  if (/^\d{10,13}$/.test(q)) {
    const fs = await wfs('parcelas', 'Nro_Cuenta=' + q, { count: 1 });
    if (!fs.length) return { error: 'No encontré la cuenta ' + q + '.' };
    const p = interiorPoint(fs[0].geometry); return { go: { lat: p[1], lon: p[0] } };
  }
  // dirección: Georef (datos.gob.ar) y, si no responde, OpenStreetMap
  const out = [];
  try {
    const u = 'https://apis.datos.gob.ar/georef/api/direcciones?direccion=' + encodeURIComponent(q) + '&provincia=' + encodeURIComponent('Córdoba') + '&departamento=Capital&max=6';
    const j = await (await fetch(u)).json();
    (j.direcciones || []).forEach(function (d) { if (d.ubicacion && d.ubicacion.lat != null) out.push({ label: d.nomenclatura, lat: d.ubicacion.lat, lon: d.ubicacion.lon }); });
  } catch (e) { }
  if (!out.length) {
    try {
      const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=ar&viewbox=-64.36,-31.28,-64.04,-31.56&bounded=1&q=' + encodeURIComponent(q);
      const j = await (await fetch(u)).json();
      j.forEach(function (d) { out.push({ label: d.display_name.split(', Pedanía')[0], lat: parseFloat(d.lat), lon: parseFloat(d.lon) }); });
    } catch (e) { }
  }
  if (!out.length) return { error: 'No encontré "' + q + '". Probá con calle y altura (ej. "Obispo Trejo 300"), nomenclatura (04-02-065-002) o cuenta.' };
  if (out.length === 1) return { go: out[0] };
  return { list: out };
}

}

        const add = function (o, ctx) {
          const k = E.ordKey(o);
          if (!idx.has(k)) idx.set(k, { tipo: o.tipo, num: o.num, anio: o.anio, capas: new Set(), roles: new Set(), zonas: new Set(), n: 0, convenio: false, link: null, layer: null, cql: null });
          const it = idx.get(k);
          if (o.anio && !it.anio) it.anio = o.anio;
          it.n++; it.capas.add(ctx.capa); if (ctx.rol) it.roles.add(ctx.rol); if (ctx.zona) it.zonas.add(ctx.zona);
          if (ctx.convenio) it.convenio = true;
          if (ctx.link && !it.link) it.link = ctx.link;
          if (!it.layer && ctx.layer) { it.layer = ctx.layer; it.cql = ctx.cql; }
        };
        const scan = function (t, ctx) { E.extractOrds(t).forEach(function (o) { add(o, Object.assign({}, ctx, ctx.cqlFn ? { cql: ctx.cqlFn(o) } : {})); }); };
        const cql8256 = function (o) { return "ord_modificatoria LIKE '%" + o.num + "%' OR ord_original LIKE '%" + o.num + "%' OR observacion LIKE '%" + o.num + "%' OR otras_disposiciones LIKE '%" + o.num + "%'"; };
        z.forEach(function (f) {
          const p = f.properties, N = E.parseNorma(p);
          const base = { capa: 'Ocupación del suelo', zona: N.convenio ? null : N.etiqueta, layer: 'CBA_Ordenanza_8256', cqlFn: cql8256 };
          scan(p.ord_original, Object.assign({ rol: 'Norma base' }, base));
          scan(p.ord_modificatoria, Object.assign({ rol: N.convenio ? 'Convenio urbanístico' : 'Modificatoria', convenio: N.convenio }, base));
          [p.observacion, p.otras_disposiciones, p.otros_retiros, p.retiro_frente, p.cantidad_unidades, p.art_ord].forEach(function (t) { scan(t, Object.assign({ rol: 'Citada en la norma de zona' }, base)); });
        });
        const loteos = [];
        la.concat(lu).forEach(function (f, i) {
          const p = f.properties;
          const tipoL = i < la.length ? 'Aprobado' : 'Autorizado a la venta';
          const ords = [];
          scan(p.decresapro || p.decreto || '', { capa: 'Loteos', rol: 'Aprobación de loteo', layer: i < la.length ? 'loteos_muni_aprobados' : 'loteos_muni_autorizados', cqlFn: function (o) { return "decresapro LIKE '%" + o.num + "%'"; } });
          Object.keys(LOTEO_ORDS).forEach(function (k) {
            const v = S_(p[k]);
            if (v) { ords.push({ num: LOTEO_ORDS[k], link: /^https?:/.test(v) ? v : null }); add({ tipo: 'Ord.', num: LOTEO_ORDS[k], anio: '' }, { capa: 'Loteos', rol: 'Encuadre de loteos', link: /^https?:/.test(v) ? v : null, layer: 'loteos_muni_aprobados', cql: k + ' IS NOT NULL' }); }
          });
          loteos.push({ tipo: tipoL, nombre: S_(p.nombre) || S_(p.nombfant) || S_(p.nombre_loteo) || '—', tl: S_(p.tipoloteo), lotes: S_(p.cantlotes), viv: S_(p.cantviv), dec: S_(p.decresapro) || S_(p.decreto), exp: S_(p.expediente_1) || S_(p.expediente), ords: ords, id: p.id, layer: i < la.length ? 'loteos_muni_aprobados' : 'loteos_muni_autorizados' });
        });
        cmz.forEach(function (f) { scan(f.properties.ordenanza, { capa: 'Centros de manzana', rol: 'Centro de manzana' }); });
        uso.forEach(function (f) { ['antecedentes', 'observaciones'].forEach(function (k) { scan(f.properties[k], { capa: 'Uso del suelo', rol: 'Uso del suelo' }); }); });
        fr.forEach(function (f) { ['antecedentes', 'observaciones', 'excepciones'].forEach(function (k) { scan(f.properties[k], { capa: 'Fraccionamiento', rol: 'Fraccionamiento' }); }); });
        cat.forEach(function (f) { scan(f.properties.dmunicipal, { capa: 'Patrimonio', rol: 'Declaración patrimonial' }); });
        ['8256', '8057', '8133', '8060', '13131', '9089'].forEach(function (n) { if (!idx.has('Ord. ' + n)) add({ tipo: 'Ord.', num: n, anio: '' }, { capa: 'Capa propia', rol: 'Norma con capa propia en IDECOR' }); });
        const list = Array.from(idx.values());
        setSt({ loading: false, list: list, loteos: loteos, nZ: z.length });
      } catch (e) { if (!off) setSt({ loading: false, error: String(e.message || e) }); }
    })();
    return function () { off = true; };
  }, []);
  if (st.loading) return <Fragment><MarcoNormativo dg={dg} idx={null} onMapa={onMapa} /><div className="ld"><div className="sp" /><span>Leyendo las capas de normativa de toda la ciudad…</span></div></Fragment>;
  if (st.error) return <Fragment><MarcoNormativo dg={dg} idx={null} onMapa={onMapa} /><div className="alert err">No pude leer las capas de IDECOR ({st.error}). Probá de nuevo en unos minutos.</div></Fragment>;
  const qq = q.trim().toLowerCase();
  const list = st.list.filter(function (o) {
    if (tipo === 'convenios' && !o.convenio) return false;
    if (tipo === 'modificatorias' && !o.roles.has('Modificatoria')) return false;
    if (tipo === 'loteos' && !o.capas.has('Loteos')) return false;
    if (tipo === 'decretos' && o.tipo !== 'Dec.') return false;
    if (!qq) return true;
    const dd = digDoc(dg, o);
    const hay = (o.tipo + ' ' + o.num + ' ' + (o.anio || '') + ' ' + Array.from(o.zonas).join(' ') + ' ' + Array.from(o.roles).join(' ') + ' ' + (E.ORD_INFO[o.num] || '') + ' ' + (dd ? dd.asunto + ' ' + dd.anio : '')).toLowerCase();
    return hay.indexOf(qq) >= 0;
  }).sort(function (a, b) { return (a.tipo === b.tipo ? 0 : a.tipo === 'Ord.' ? -1 : 1) || (parseInt(b.num, 10) - parseInt(a.num, 10)); });
  const nConv = st.list.filter(function (o) { return o.convenio; }).length;
  const nOrd = st.list.filter(function (o) { return o.tipo === 'Ord.'; }).length;
  return <Fragment>
    <MarcoNormativo dg={dg} idx={st.list} onMapa={onMapa} />
    <h2 className="lbl" style={{ margin: '22px 0 8px', fontSize: 12 }}>Todas las normas citadas en las capas oficiales</h2>
    <div className="stats">
      <div className="stat"><div className="v">{nOrd}</div><div className="d">Ordenanzas</div></div>
      <div className="stat"><div className="v">{st.list.length - nOrd}</div><div className="d">Decretos</div></div>
      <div className="stat"><div className="v">{nConv}</div><div className="d">Convenios urbanísticos</div></div>
      <div className="stat"><div className="v">{st.loteos.length}</div><div className="d">Loteos registrados</div></div>
      <div className="stat"><div className="v">{st.nZ}</div><div className="d">Polígonos de zonificación</div></div>
    </div>
    <div className="filters">
      <input className="sin" style={{ maxWidth: 320 }} placeholder="Buscar número, zona o tema" value={q} onChange={function (e) { setQ(e.target.value); }} />
      {[['todas', 'Todas'], ['modificatorias', 'Modificatorias'], ['convenios', 'Convenios'], ['loteos', 'Loteos'], ['decretos', 'Decretos']].map(function (x) { return <button key={x[0]} className={'pill' + (tipo === x[0] ? ' on' : '')} onClick={function () { setTipo(x[0]); }}>{x[1]}</button>; })}
      <span className="small muted">{list.length} resultados</span>
    </div>
    <div className="tw" style={{ background: 'var(--el)' }}><table className="t wrap" style={{ minWidth: 760 }}>
      <thead><tr><th>Norma</th><th style={{ textAlign: 'left' }}>Qué regula / rol</th><th style={{ textAlign: 'left' }}>Dónde aparece</th><th>Polígonos</th><th>Ver</th></tr></thead>
      <tbody>{list.map(function (o, i) {
        const zonas = Array.from(o.zonas);
        const d = digDoc(dg, o);
        const info = (o.tipo === 'Ord.' ? E.ORD_INFO[o.num] : null) || (d && d.asunto);
        const anio = o.anio || (d ? String(d.anio).slice(-2) : '');
        return <tr key={i}>
          <td><b>{o.tipo} {o.num}{anio ? '/' + anio : ''}</b>{o.convenio && <span className="bytag">convenio</span>}{d && d.fecha ? <div className="small muted" style={{ fontFamily: 'var(--ff)' }}>{d.fecha}</div> : null}</td>
          <td style={{ textAlign: 'left', fontFamily: 'var(--ff)' }}>{info ? <b style={{ fontWeight: 700 }}>{info}. </b> : null}<span className="muted">{Array.from(o.roles).join(' · ')}</span>{zonas.length > 0 && <div className="small muted">{zonas.slice(0, 8).join(', ')}{zonas.length > 8 ? ' y ' + (zonas.length - 8) + ' más' : ''}</div>}</td>
          <td style={{ textAlign: 'left', fontFamily: 'var(--ff)' }}>{Array.from(o.capas).join(', ')}</td>
          <td>{o.n}</td>
          <td style={{ whiteSpace: 'nowrap' }}>
            {o.layer && o.cql && <button className="btn" onClick={function () { onMapa({ layer: o.layer, cql: o.cql, label: o.tipo + ' ' + o.num }); }}>Mapa</button>}{' '}
            {d ? <DocLinks d={d} /> : (o.link ? <a className="btn" href={o.link} target="_blank" rel="noopener">Digesto ↗</a> : (o.tipo === 'Ord.' ? <a className="btn" href={digestoSearch(o.num)} target="_blank" rel="noopener">Texto ↗</a> : null))}
          </td>
        </tr>;
      })}</tbody>
    </table></div>
    <h2 className="lbl" style={{ margin: '22px 0 8px', fontSize: 12 }}>Loteos registrados por la Municipalidad (desde 2006)</h2>
    <div className="tw" style={{ background: 'var(--el)' }}><table className="t wrap" style={{ minWidth: 760 }}>
      <thead><tr><th>Loteo</th><th style={{ textAlign: 'left' }}>Tipo</th><th>Lotes</th><th>Viviendas</th><th style={{ textAlign: 'left' }}>Decreto / expediente</th><th>Ver</th></tr></thead>
      <tbody>{st.loteos.filter(function (l) { return !qq || (l.nombre + ' ' + l.dec + ' ' + l.tl).toLowerCase().indexOf(qq) >= 0; }).map(function (l, i) {
        return <tr key={i}>
          <td><b style={{ fontFamily: 'var(--ff)' }}>{l.nombre}</b><div className="small muted" style={{ fontFamily: 'var(--ff)' }}>{l.tipo}</div></td>
          <td style={{ textAlign: 'left', fontFamily: 'var(--ff)' }}>{l.tl}</td>
          <td>{l.lotes || '—'}</td><td>{l.viv || '—'}</td>
          <td style={{ textAlign: 'left', fontFamily: 'var(--ff)' }}>{l.dec}{l.exp ? <div className="small muted">{l.exp}</div> : null}{l.ords.length > 0 && <div className="small">{l.ords.map(function (o, j) { return o.link ? <a key={j} href={o.link} target="_blank" rel="noopener" style={{ marginRight: 8 }}>Ord. {o.num} ↗</a> : <span key={j} style={{ marginRight: 8 }}>Ord. {o.num}</span>; })}</div>}</td>
          <td>{l.id != null && <button className="btn" onClick={function () { onMapa({ layer: l.layer, cql: 'id=' + l.id, label: l.nombre, zoomLayer: l.layer, zoomId: l.id }); }}>Mapa</button>}</td>
        </tr>;
      })}</tbody>
    </table></div>
    <p className="small muted" style={{ marginTop: 12, maxWidth: 820 }}>El índice se arma leyendo en vivo las capas de ocupación del suelo (Ord. 8256, 8057 y modificatorias, incluidos los convenios urbanísticos), loteos aprobados y autorizados, centros de manzana, uso del suelo, fraccionamiento y patrimonio publicadas por la Municipalidad en IDECOR. Las normas que todavía no están cargadas en esas capas no aparecen: una ordenanza nueva figura acá cuando la Municipalidad actualiza la capa.</p>
  </Fragment>;
}

/* ═══════ Guardados ═══════ */
const KEY = 'bk.normativa.lotes.v1';
function loadSaved() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function storeSaved(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); return true; } catch (e) { return false; } }

/* ═══════ Theme ═══════ */
function useTheme() {
  const [t, setT] = useState(function () { try { return localStorage.getItem('bk.theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); } catch (e) { return 'light'; } });
  useEffect(function () { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('bk.theme', t); } catch (e) { } }, [t]);
  return [t, useCallback(function () { setT(function (v) { return v === 'light' ? 'dark' : 'light'; }); }, [])];
}

/* ═══════ APP ═══════ */
function App() {
  const [theme, togTheme] = useTheme();
  const [tab, setTab] = useState('lote');
  const [M, setM] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState('');
  const [opts, setOpts] = useState(null);
  const [normaSel, setNormaSel] = useState(null);
  const [overlay, setOverlay] = useState(null);
  const [saved, setSaved] = useState(loadSaved);
  const [toast, setToast] = useState('');
  const reqId = useRef(0);
  const dg = useDigesto();

  const pick = useCallback(async function (lat, lon, noFit) {
    const id = ++reqId.current;
    setBusy(true); setErr(null); setOpts(null); setTab('lote');
    try {
      const D = await consultar(lat, lon);
      if (id !== reqId.current) return;
      const model = buildModel(D);
      classifyCat(model);
      model.noFit = !!noFit;
      setNormaSel(null);
      setM(model);
      try { history.replaceState(null, '', '#' + lat.toFixed(6) + ',' + lon.toFixed(6)); } catch (e) { }
      const nErr = Object.keys(D.errors).length;
      if (nErr) setErr('Algunas capas no respondieron (' + Object.keys(D.errors).join(', ') + '). El resto de la ficha está completa.');
    } catch (e) {
      if (id === reqId.current) setErr('No pude consultar IDECOR: ' + (e.message || e) + '. Revisá la conexión y probá de nuevo.');
    } finally { if (id === reqId.current) setBusy(false); }
  }, []);

  useEffect(function () {
    const m = location.hash.match(/^#(-?\d+\.\d+),(-?\d+\.\d+)$/);
    if (m) pick(parseFloat(m[1]), parseFloat(m[2]));
  }, []);

  const doSearch = async function (e) {
    e && e.preventDefault();
    if (!q.trim()) return;
    setBusy(true); setErr(null); setOpts(null);
    try {
      const r = await buscar(q);
      if (r.error) { setErr(r.error); setBusy(false); }
      else if (r.list) { setOpts(r.list); setBusy(false); }
      else pick(r.go.lat, r.go.lon);
    } catch (e2) { setErr('La búsqueda falló: ' + (e2.message || e2)); setBusy(false); }
  };

  const flash = function (t) { setToast(t); setTimeout(function () { setToast(function (x) { return x === t ? '' : x; }); }, 2500); };
  const copy = function () {
    if (!M) return;
    const txt = resumen(M);
    const fb = function () { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); flash('Resumen copiado'); } catch (e) { flash('No se pudo copiar'); } ta.remove(); };
    try { navigator.clipboard.writeText(txt).then(function () { flash('Resumen copiado'); }, fb); } catch (e) { fb(); }
  };
  const save = function () {
    if (!M) return;
    const r = M.cabida;
    const it = { id: Date.now(), lat: M.D.lat, lon: M.D.lon, nom: M.pp ? nomMuni(M.pp.Nomenclatura) : '', S: M.det.S || null, zona: M.cabidaN ? M.cabidaN.etiqueta : (M.normas[0] ? M.normas[0].etiqueta : ''), total: r && !r.error ? Math.round(r.total) : null, nota: q || '' };
    const l = [it].concat(saved.filter(function (x) { return !(Math.abs(x.lat - it.lat) < 1e-6 && Math.abs(x.lon - it.lon) < 1e-6); })).slice(0, 60);
    setSaved(l); storeSaved(l) ? flash('Lote guardado en este navegador') : flash('Este navegador no permite guardar');
  };
  const showOnMap = async function (o) {
    let bounds = null;
    if (o.zoomLayer) {
      try { const fs = await wfs(o.zoomLayer, 'id=' + o.zoomId); if (fs.length) bounds = L.geoJSON(fs[0]).getBounds(); } catch (e) { }
    }
    setOverlay({ layer: o.layer, cql: o.cql, label: o.label, bounds: bounds });
    setTab('lote');
  };

  return <DigCtx.Provider value={dg}>
    <div className="hdr">
      <a href="index.html" className="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="4" y="2" width="16" height="20" rx="2" /><path d="M9 22v-4h6v4" /><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01" /></svg>
        BkTableros
      </a>
      <span className="hdr-sep" style={{ color: 'var(--b0)' }}>|</span>
      <span className="hdr-title">Normativa y Cabida · Córdoba</span>
      <div className="seg" style={{ marginLeft: 8 }}>
        <button className={tab === 'lote' ? 'on' : ''} onClick={function () { setTab('lote'); }}>Lote</button>
        <button className={tab === 'ord' ? 'on' : ''} onClick={function () { setTab('ord'); }}>Ordenanzas</button>
        <button className={tab === 'guard' ? 'on' : ''} onClick={function () { setTab('guard'); }}>Guardados{saved.length ? ' · ' + saved.length : ''}</button>
      </div>
      <div className="acts">
        <a className="btn-i" href={MAPA311} target="_blank" rel="noopener" title="Abrir el mapa oficial 311 de MapasCórdoba" style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}>↗</a>
        <button className="btn-i" onClick={togTheme} title="Cambiar tema">{theme === 'light' ? '🌙' : '☀️'}</button>
      </div>
    </div>

    <div style={{ display: tab === 'lote' ? 'contents' : 'none' }}>
      <form className="sbar" onSubmit={doSearch}>
        <input className="sin" value={q} onChange={function (e) { setQ(e.target.value); }} placeholder="Dirección (Obispo Trejo 300), nomenclatura (04-02-065-002), cuenta o coordenadas" aria-label="Buscar lote" />
        <button className="btn pri" type="submit" disabled={busy}>{busy ? 'Consultando…' : 'Buscar'}</button>
        {overlay && <span className="tag tag-ac" style={{ cursor: 'pointer' }} onClick={function () { setOverlay(null); }} title="Quitar resaltado">{overlay.label} en el mapa ✕</span>}
        <span className="shint">o tocá el lote en el mapa</span>
        {opts && <div className="sres">{opts.map(function (o, i) { return <button key={i} type="button" onClick={function () { setOpts(null); pick(o.lat, o.lon); }}>{o.label}</button>; })}</div>}
      </form>
      <div className="main">
        <MapView onPick={pick} M={M} overlay={overlay} active={tab === 'lote'} />
        <div className="panel">
          {err && <div className="alert" style={{ marginTop: 0, marginBottom: 10 }}>{err}</div>}
          {busy && <div className="ld"><div className="sp" /><span>Consultando 23 capas de IDECOR para este punto…</span></div>}
          {!M && !busy && <div className="card"><div className="empty">
            <h2>Normativa y cabida por lote</h2>
            <p>Datos oficiales de la Municipalidad de Córdoba publicados en IDECOR, consultados en vivo.</p>
            <div className="steps">
              <div><b>1</b><span>Buscá la dirección, la nomenclatura o la cuenta, o tocá el lote en el mapa.</span></div>
              <div><b>2</b><span>La ficha junta ocupación, uso y fraccionamiento del suelo, centro de manzana, patrimonio, loteos, convenios y valores de referencia.</span></div>
              <div><b>3</b><span>La cabida se calcula con el FOS, FOT, alturas y retiros vigentes de la zona y la geometría real del lote. Podés ajustar cada dato.</span></div>
            </div>
            <p className="small muted" style={{ marginTop: 14 }}>Probá con <a href="#-31.413500,-64.188800" onClick={function (e) { e.preventDefault(); pick(-31.4135, -64.1888); }}>un lote en Nueva Córdoba</a>.</p>
          </div></div>}
          {M && !busy && <Fragment>
            <div className="print-only" style={{ marginBottom: 10 }}><b>Normativa y Cabida · Córdoba</b> — BkTableros · {new Date().toLocaleDateString('es-AR')}</div>
            <div className="no-print" style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10, alignItems: 'center' }}>
              <button className="btn pri" onClick={copy}>Copiar resumen</button>
              <button className="btn" onClick={function () { window.print(); }}>Imprimir / PDF</button>
              <button className="btn" onClick={save}>Guardar lote</button>
              <a className="btn" href={MAPA311} target="_blank" rel="noopener">Ver en MapasCórdoba ↗</a>
              {toast && <span className="small" style={{ color: 'var(--ok)', fontWeight: 700 }}>{toast}</span>}
            </div>
            <AvisosNorma M={M} />
            <LoteCard M={M} />
            <CabidaCard M={M} normaSel={normaSel} setNormaSel={setNormaSel} />
            <NormaCard M={M} />
            <UsoCard M={M} />
            <FraccCard M={M} />
            <CMCard M={M} />
            <PatrimonioCard M={M} />
            <EntornoCard M={M} />
            <OrdLoteCard M={M} />
            <p className="small muted">Fuente: capas WFS de IDECOR (Infraestructura de Datos Espaciales de la Provincia de Córdoba) con información de la Dirección de Planeamiento Urbano municipal y Catastro provincial, consultadas el {new Date(M.D.t).toLocaleString('es-AR')}. Herramienta de consulta: no reemplaza la visación ni el certificado de uso del suelo.</p>
          </Fragment>}
        </div>
      </div>
    </div>

    {tab === 'ord' && <div className="page"><div className="page-in">
      <h1 className="title-lote" style={{ fontSize: 20 }}>Ordenanzas que impactan en la ciudad</h1>
      <p className="sub" style={{ marginBottom: 14 }}>Marco normativo vigente según el Digesto municipal, más el índice de todas las normas citadas en las capas oficiales: zonas, perfiles, modificatorias, convenios urbanísticos y loteos aprobados.</p>
      <OrdIndex onMapa={showOnMap} />
    </div></div>}

    {tab === 'guard' && <div className="page"><div className="page-in" style={{ maxWidth: 760 }}>
      <h1 className="title-lote" style={{ fontSize: 20 }}>Lotes guardados</h1>
      <p className="sub" style={{ marginBottom: 14 }}>Se guardan solo en este navegador.</p>
      {!saved.length && <div className="card"><div className="empty"><p>Todavía no guardaste lotes. Consultá uno y tocá "Guardar lote".</p></div></div>}
      {saved.map(function (s) {
        return <div key={s.id} className="card"><div className="card-b" style={{ display: 'flex', gap: 12, alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap' }}>
          <div><b>{s.nom ? 'Parcela ' + s.nom : s.lat.toFixed(5) + ', ' + s.lon.toFixed(5)}</b> <span className="muted">· {s.zona}{s.S ? ' · ' + nf(s.S) + ' m²' : ''}</span><div className="small muted">{s.nota}{s.nota ? ' · ' : ''}{new Date(s.id).toLocaleDateString('es-AR')}</div></div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}><span className="mono" style={{ fontSize: 15 }}>{s.total != null ? nf(s.total) + ' m²' : '—'}</span><button className="btn pri" onClick={function () { pick(s.lat, s.lon); }}>Abrir</button><button className="btn" onClick={function () { const l = saved.filter(function (x) { return x.id !== s.id; }); setSaved(l); storeSaved(l); }}>Quitar</button></div>
        </div></div>;
      })}
    </div></div>}
  </DigCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
