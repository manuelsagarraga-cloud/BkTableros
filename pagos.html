<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Programación de Pagos — Bauvek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
:root{--bg:#fafbfc;--bg1:#f1f3f5;--bg2:#e9ecef;--el:#fff;--c0:#1a1f2e;--c1:#5a6178;--c2:#8b92a5;--b0:#e2e5ea;--b1:#eef0f3;--ac:#3b6cf5;--ac2:#2d5be0;--acbg:rgba(59,108,245,.08);--ok:#10b981;--err:#ef4444;--warn:#f59e0b;--sh:0 1px 2px rgba(0,0,0,.04);--shm:0 2px 8px rgba(0,0,0,.06);--ff:'Inter',-apple-system,sans-serif;--fm:'JetBrains Mono',monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--bg1:#1a2030;--bg2:#242d3d;--el:#1e2636;--c0:#e4e8ee;--c1:#8b95a8;--c2:#5e6882;--b0:#2a3344;--b1:#222b3a;--acbg:rgba(59,108,245,.12);--sh:0 1px 2px rgba(0,0,0,.2);--shm:0 2px 8px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0f1419;--bg1:#1a2030;--bg2:#242d3d;--el:#1e2636;--c0:#e4e8ee;--c1:#8b95a8;--c2:#5e6882;--b0:#2a3344;--b1:#222b3a;--acbg:rgba(59,108,245,.12);--sh:0 1px 2px rgba(0,0,0,.2);--shm:0 2px 8px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--c0);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b0);border-radius:3px}

.hdr{height:44px;background:var(--el);border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--c0)}
.logo span{color:var(--c2);font-weight:400;font-size:12px;margin-left:2px}
.hdr-title{font-size:14px;font-weight:600;color:var(--ac)}
.acts{margin-left:auto;display:flex;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;font-size:12px;font-weight:500;font-family:var(--ff);border-radius:4px;border:1px solid var(--b0);background:var(--el);color:var(--c1);cursor:pointer}.btn:hover{background:var(--bg1);color:var(--c0)}
.btn-i{padding:5px;width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--c1);border-radius:4px}.btn-i:hover{background:var(--bg1)}
.seg{display:inline-flex;background:var(--bg1);border-radius:4px;padding:2px;gap:1px;margin:0 8px}
.seg button{padding:4px 14px;font-size:12px;font-weight:500;font-family:var(--ff);border:none;background:transparent;color:var(--c1);cursor:pointer;border-radius:3px}.seg button:hover{color:var(--c0)}.seg button.on{background:var(--el);color:var(--c0);box-shadow:var(--sh)}

.filters{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg1);border-bottom:1px solid var(--b1);flex-wrap:wrap;flex-shrink:0}
.fl{font-size:11px;color:var(--c2);font-weight:500}
.fsel{padding:4px 24px 4px 8px;font-size:11px;font-family:var(--ff);font-weight:500;border:1px solid var(--b0);border-radius:4px;background:var(--el);color:var(--c0);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6178' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center}
.fin{padding:4px 8px;font-size:11px;font-family:var(--fm);border:1px solid var(--b0);border-radius:4px;background:var(--el);color:var(--c0);width:120px}
.fbadge{display:inline-flex;align-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:white;font-size:10px;font-weight:600;padding:0 4px}
.fclr{font-size:11px;color:var(--ac);border:none;background:none;cursor:pointer;font-family:var(--ff);font-weight:500;padding:4px 6px;border-radius:4px}.fclr:hover{background:var(--acbg)}

.content{flex:1;overflow-y:auto;padding:16px 20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--el);border:1px solid var(--b1);border-radius:6px;padding:14px;border-left:3px solid var(--ac)}
.kpi.ok{border-left-color:var(--ok)}.kpi.err{border-left-color:var(--err)}.kpi.warn{border-left-color:var(--warn)}
.kpi-v{font-size:20px;font-weight:700;font-family:var(--fm);line-height:1.1}
.kpi-l{font-size:11px;color:var(--c1);margin-top:4px;font-weight:500}

.donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.donut-card{background:var(--el);border:1px solid var(--b1);border-radius:6px;padding:16px;text-align:center}
.donut-title{font-size:11px;font-weight:600;color:var(--c1);margin-bottom:8px}
.donut-main{font-size:13px;font-weight:600;margin-top:8px}
.donut-sub{font-size:11px;color:var(--c2);margin-top:2px}

.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--el);border:1px solid var(--b1);border-radius:6px;overflow:hidden}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg1);font-weight:600;font-size:11px;color:var(--c1);text-align:left;padding:8px 8px;border-bottom:1px solid var(--b0);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th:hover{color:var(--c0)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--b1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tbl tr:hover td{background:rgba(59,108,245,.04)}
.tbl tr:nth-child(even) td{background:rgba(0,0,0,.015)}
.tbl tr:nth-child(even):hover td{background:rgba(59,108,245,.04)}
.tbl .total-row td{font-weight:700;background:var(--bg1);border-top:2px solid var(--b0)}
.mono{font-family:var(--fm);font-size:11px;color:var(--c1)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
.tag-ok{background:rgba(16,185,129,.1);color:var(--ok)}
.tag-err{background:rgba(239,68,68,.1);color:var(--err)}
.tag-warn{background:rgba(245,158,11,.1);color:var(--warn)}
.tag-grey{background:rgba(139,146,165,.1);color:var(--c2)}

.ld{display:flex;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--c2);font-size:13px}
.sp{width:18px;height:18px;border:2px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.drop{max-width:400px;margin:40px auto;padding:24px;border:1.5px dashed var(--b0);border-radius:6px;text-align:center;color:var(--c2);font-size:12px;cursor:pointer}.drop:hover{border-color:var(--ac);background:var(--acbg);color:var(--ac)}
.drop input{display:none}

@media print{
  .hdr,.filters{display:none!important}
  .content{overflow:visible!important}
  @page{size:landscape;margin:10mm}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback,useMemo}=React;

/* ═══════ Parse Excel ═══════ */
function parseExcel(data){
  const wb=XLSX.read(data,{type:'array',cellDates:true});
  const skip=['Proveedores','Calendario','Resumens','Consultas'];
  const obraSheets=wb.SheetNames.filter(s=>!skip.includes(s));
  
  const invoices=[];
  const obras=new Set();
  const proveedores=new Set();
  const rubros=new Set();
  
  for(const sn of obraSheets){
    const ws=wb.Sheets[sn];
    if(!ws) continue;
    
    /* Find header row (row with "OBRA" or "Condición") */
    let headerRow=-1;
    const colMap={};
    
    for(let r=1;r<=15;r++){
      const cols=['OBRA','Fecha de FC','Condición','Razón social','Descripción','Proveedor','Rubro',
        'Importe final Pesos (Iva incluido)','Importe final USD (Iva incluido)',
        'Observaciones','Estado Factura Cliente','Estado Factura Bauvek','Estado material',
        'Resarcimiento Bauvek','Nº Remito','Encargado'];
      
      for(let c=1;c<=20;c++){
        const cell=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
        if(cell&&typeof cell.v==='string'){
          const idx=cols.findIndex(h=>cell.v.trim().toLowerCase()===h.toLowerCase());
          if(idx>=0){
            colMap[cols[idx]]=c-1;
            headerRow=r;
          }
        }
      }
      if(Object.keys(colMap).length>=5) break;
    }
    
    if(headerRow<0) continue;
    
    const range=XLSX.utils.decode_range(ws['!ref']||'A1');
    for(let r=headerRow;r<=range.e.r;r++){
      const getV=(col)=>{
        if(colMap[col]===undefined) return null;
        const cell=ws[XLSX.utils.encode_cell({r,c:colMap[col]})];
        return cell?cell.v:null;
      };
      
      const obra=getV('OBRA');
      const desc=getV('Descripción');
      const prov=getV('Proveedor');
      const impPesos=getV('Importe final Pesos (Iva incluido)');
      const impUSD=getV('Importe final USD (Iva incluido)');
      
      /* Skip empty rows and totals */
      if(!desc&&!prov&&!impPesos&&!impUSD) continue;
      if(typeof prov==='string'&&prov.toUpperCase()==='TOTAL') continue;
      
      let fechaFC=getV('Fecha de FC');
      if(fechaFC instanceof Date&&!isNaN(fechaFC)){/* ok */}
      else if(typeof fechaFC==='number'){fechaFC=new Date((fechaFC-25569)*86400000)}
      else if(typeof fechaFC==='string'&&fechaFC){try{fechaFC=new Date(fechaFC)}catch(e){fechaFC=null}}
      else fechaFC=null;
      
      const inv={
        obra:obra||sn.replace('Obra ','').replace('Casa ','').replace('Proyecto ',''),
        sheetName:sn,
        fechaFC,
        condicion:getV('Condición')||'',
        razonSocial:getV('Razón social')||'',
        descripcion:desc||'',
        proveedor:prov||'',
        rubro:getV('Rubro')||'',
        importePesos:typeof impPesos==='number'?impPesos:0,
        importeUSD:typeof impUSD==='number'?impUSD:0,
        observaciones:getV('Observaciones')||'',
        estadoCliente:getV('Estado Factura Cliente')||'',
        estadoBauvek:getV('Estado Factura Bauvek')||'',
        estadoMaterial:getV('Estado material')||'',
        resarcimiento:getV('Resarcimiento Bauvek')||'',
        remito:getV('Nº Remito')||'',
        encargado:getV('Encargado')||''
      };
      
      invoices.push(inv);
      if(inv.obra) obras.add(inv.obra);
      if(inv.proveedor) proveedores.add(inv.proveedor);
      if(inv.rubro&&typeof inv.rubro==='string') rubros.add(inv.rubro);
    }
  }
  
  return{
    invoices,
    obras:[...obras].sort(),
    proveedores:[...proveedores].sort(),
    rubros:[...rubros].sort(),
    sheetCount:obraSheets.length
  };
}

/* ═══════ Donut SVG ═══════ */
function Donut({segments,size=100}){
  const total=segments.reduce((s,seg)=>s+seg.value,0);
  if(!total) return <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={size/2-4} fill="none" stroke="var(--bg2)" strokeWidth="8"/></svg>;
  
  const r=size/2-4;
  const circ=2*Math.PI*r;
  let offset=0;
  
  return <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
    {segments.map((seg,i)=>{
      const pct=seg.value/total;
      const dash=pct*circ;
      const el=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={seg.color} strokeWidth="8" strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={-offset}/>;
      offset+=dash;
      return el;
    })}
  </svg>;
}

/* ═══════ Format helpers ═══════ */
function fmtMoney(v,currency){
  if(!v||v===0) return currency==='USD'?'USD 0':'$0';
  const prefix=currency==='USD'?'USD ':'$';
  return prefix+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d||!(d instanceof Date)||isNaN(d)) return '—';
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'2-digit'});
}
function tagClass(estado){
  if(!estado) return 'tag-grey';
  const l=estado.toLowerCase();
  if(l.includes('pagado')&&!l.includes('no ')) return 'tag-ok';
  if(l.includes('no pagado')||l.includes('cuenta corriente')) return 'tag-err';
  if(l.includes('recibido')) return 'tag-ok';
  return 'tag-warn';
}

/* ═══════ Theme ═══════ */
function useTheme(){
  const[t,setT]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',t)},[t]);
  return[t,useCallback(()=>setT(v=>v==='light'?'dark':'light'),[])];
}

/* ═══════ APP ═══════ */
function App(){
  const[theme,togTheme]=useTheme();
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  
  /* Filters */
  const[moneda,setMoneda]=useState('pesos');
  const[fObra,setFObra]=useState('all');
  const[fProv,setFProv]=useState('all');
  const[fEstCli,setFEstCli]=useState('all');
  const[fRubro,setFRubro]=useState('all');
  const[fDesde,setFDesde]=useState('');
  const[fHasta,setFHasta]=useState('');
  
  /* Sort */
  const[sortCol,setSortCol]=useState('importePesos');
  const[sortDir,setSortDir]=useState('desc');
  
  /* Load Excel */
  useEffect(()=>{
    fetch('data/Pagos/Programaci%C3%B2n%20gastos%20de%20obras.xlsx?t='+Date.now())
      .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.arrayBuffer()})
      .then(buf=>{
        const d=parseExcel(new Uint8Array(buf));
        setData(d);setLoading(false);
      })
      .catch(e=>{
        setError(e.message);setLoading(false);
      });
  },[]);
  
  const handleLocalFile=useCallback(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const d=parseExcel(new Uint8Array(e.target.result));
        setData(d);setError(null);
      }catch(err){setError(err.message)}
    };
    reader.readAsArrayBuffer(file);
  },[]);
  
  const resetFilters=useCallback(()=>{setFObra('all');setFProv('all');setFEstCli('all');setFRubro('all');setFDesde('');setFHasta('')},[]);
  const fCount=useMemo(()=>{let c=0;if(fObra!=='all')c++;if(fProv!=='all')c++;if(fEstCli!=='all')c++;if(fRubro!=='all')c++;if(fDesde||fHasta)c++;return c},[fObra,fProv,fEstCli,fRubro,fDesde,fHasta]);
  
  /* Filtered invoices */
  const filtered=useMemo(()=>{
    if(!data) return[];
    return data.invoices.filter(inv=>{
      /* Moneda: only show rows that have value in selected currency */
      if(moneda==='pesos'&&!inv.importePesos) return false;
      if(moneda==='usd'&&!inv.importeUSD) return false;
      if(fObra!=='all'&&inv.obra!==fObra) return false;
      if(fProv!=='all'&&inv.proveedor!==fProv) return false;
      if(fEstCli!=='all'&&inv.estadoCliente!==fEstCli) return false;
      if(fRubro!=='all'){if(!inv.rubro)return false;if(inv.rubro!==fRubro)return false}
      if(fDesde){const d=new Date(fDesde);if(!inv.fechaFC||inv.fechaFC<d)return false}
      if(fHasta){const d=new Date(fHasta);if(!inv.fechaFC||inv.fechaFC>d)return false}
      return true;
    });
  },[data,moneda,fObra,fProv,fEstCli,fRubro,fDesde,fHasta]);
  
  /* Sorted */
  const sorted=useMemo(()=>{
    const arr=[...filtered];
    arr.sort((a,b)=>{
      let va=a[sortCol],vb=b[sortCol];
      if(typeof va==='string') va=va.toLowerCase();
      if(typeof vb==='string') vb=vb.toLowerCase();
      if(va==null) va=sortDir==='desc'?'':'\uffff';
      if(vb==null) vb=sortDir==='desc'?'':'\uffff';
      if(va<vb) return sortDir==='asc'?-1:1;
      if(va>vb) return sortDir==='asc'?1:-1;
      return 0;
    });
    return arr;
  },[filtered,sortCol,sortDir]);
  
  const doSort=col=>{if(sortCol===col)setSortDir(d=>d==='desc'?'asc':'desc');else{setSortCol(col);setSortDir('desc')}};
  
  /* KPIs */
  const impKey=moneda==='usd'?'importeUSD':'importePesos';
  const curr=moneda==='usd'?'USD':'ARS';
  const total=filtered.reduce((s,i)=>s+i[impKey],0);
  const noPagCli=filtered.filter(i=>!i.estadoCliente||i.estadoCliente.toLowerCase().includes('no pagado')||i.estadoCliente.toLowerCase().includes('cuenta corriente')).reduce((s,i)=>s+i[impKey],0);
  const noPagBvk=filtered.filter(i=>!i.estadoBauvek||i.estadoBauvek.toLowerCase().includes('no pagado')||i.estadoBauvek.toLowerCase().includes('cuenta corriente')).reduce((s,i)=>s+i[impKey],0);
  const ctaCte=filtered.filter(i=>i.estadoCliente&&i.estadoCliente.toLowerCase().includes('cuenta corriente')).reduce((s,i)=>s+i[impKey],0);
  
  /* Donut data */
  const estCliMap={};filtered.forEach(i=>{const e=i.estadoCliente||'(Vacío)';estCliMap[e]=(estCliMap[e]||0)+1});
  const estBvkMap={};filtered.forEach(i=>{const e=i.estadoBauvek||'(Vacío)';estBvkMap[e]=(estBvkMap[e]||0)+1});
  const estMatMap={};filtered.forEach(i=>{const e=i.estadoMaterial||'(Vacío)';estMatMap[e]=(estMatMap[e]||0)+1});
  
  const donutColors=['var(--ac)','var(--ok)','var(--err)','var(--warn)','var(--c2)','#8b5cf6','#ec4899'];
  const toDonut=map=>Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k,value:v,color:donutColors[i%donutColors.length]}));
  
  /* Unique estados for filter */
  const estadosCli=useMemo(()=>{if(!data)return[];return[...new Set(data.invoices.map(i=>i.estadoCliente).filter(Boolean))].sort()},[data]);
  
  if(loading) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="ld"><div className="sp"/><span>Cargando Excel...</span></div></div>;
  
  return <>
    <div className="hdr">
      <a href="index.html" className="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01M8 14h.01M16 14h.01M12 14h.01"/></svg>
        BkTableros
      </a>
      <span style={{color:'var(--b0)'}}>|</span>
      <span className="hdr-title">Programación de Pagos</span>
      
      <div className="seg">
        <button className={moneda==='pesos'?'on':''} onClick={()=>setMoneda('pesos')}>$ Pesos</button>
        <button className={moneda==='usd'?'on':''} onClick={()=>setMoneda('usd')}>USD Dólares</button>
      </div>
      
      <div className="acts">
        <span style={{fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)'}}>{filtered.length} facturas</span>
        <button className="btn-i" onClick={togTheme}>{theme==='light'?'🌙':'☀️'}</button>
      </div>
    </div>
    
    <div className="filters">
      <span className="fl">Obra</span>
      <select className="fsel" value={fObra} onChange={e=>setFObra(e.target.value)}>
        <option value="all">Todas</option>
        {data&&data.obras.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      <span className="fl">Proveedor</span>
      <select className="fsel" value={fProv} onChange={e=>setFProv(e.target.value)}>
        <option value="all">Todos</option>
        {data&&data.proveedores.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      <span className="fl">Estado FC Cliente</span>
      <select className="fsel" value={fEstCli} onChange={e=>setFEstCli(e.target.value)}>
        <option value="all">Todos</option>
        {estadosCli.map(e=><option key={e} value={e}>{e}</option>)}
      </select>
      <span className="fl">Rubro</span>
      <select className="fsel" value={fRubro} onChange={e=>setFRubro(e.target.value)}>
        <option value="all">Todos</option>
        {data&&data.rubros.map(r=><option key={r} value={r}>{r}</option>)}
      </select>
      <span className="fl">Fecha FC</span>
      <input type="date" className="fin" value={fDesde} onChange={e=>setFDesde(e.target.value)}/>
      <span className="fl">a</span>
      <input type="date" className="fin" value={fHasta} onChange={e=>setFHasta(e.target.value)}/>
      {fCount>0&&<><span className="fbadge">{fCount}</span><button className="fclr" onClick={resetFilters}>Limpiar</button></>}
    </div>
    
    <div className="content">
      {!data&&<div className="drop" onClick={()=>document.getElementById('fi').click()}>
        <div style={{fontSize:24,marginBottom:8}}>📊</div>
        <div>Arrastrá el Excel de Programación de Gastos aquí, o hacé clic para seleccionar</div>
        <input id="fi" type="file" accept=".xlsx,.xls" onChange={e=>{if(e.target.files[0])handleLocalFile(e.target.files[0])}}/>
      </div>}
      
      {error&&!data&&<div className="drop" onClick={()=>document.getElementById('fi2').click()} style={{borderColor:'var(--err)',color:'var(--err)'}}>
        <div style={{marginBottom:8}}>No se encontró el archivo en el servidor ({error})</div>
        <div style={{color:'var(--c1)'}}>Hacé clic para cargar el Excel manualmente</div>
        <input id="fi2" type="file" accept=".xlsx,.xls" onChange={e=>{if(e.target.files[0])handleLocalFile(e.target.files[0])}}/>
      </div>}
      
      {data&&<>
        {/* KPIs */}
        <div className="kpis">
          <div className="kpi"><div className="kpi-v">{fmtMoney(total,curr)}</div><div className="kpi-l">Total</div></div>
          <div className="kpi err"><div className="kpi-v" style={{color:'var(--err)'}}>{fmtMoney(noPagCli,curr)}</div><div className="kpi-l">No pagado Cliente</div></div>
          <div className="kpi warn"><div className="kpi-v" style={{color:'var(--warn)'}}>{fmtMoney(noPagBvk,curr)}</div><div className="kpi-l">No pagado Bauvek</div></div>
          <div className="kpi"><div className="kpi-v">{fmtMoney(ctaCte,curr)}</div><div className="kpi-l">Cuenta Corriente</div></div>
        </div>
        
        {/* Donuts */}
        <div className="donuts">
          <div className="donut-card">
            <div className="donut-title">Estado Facturas Cliente</div>
            <Donut segments={toDonut(estCliMap)}/>
            {Object.entries(estCliMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>
              <div key={k} className="donut-sub">{k}: {v}</div>
            )}
          </div>
          <div className="donut-card">
            <div className="donut-title">Estado Facturas Bauvek</div>
            <Donut segments={toDonut(estBvkMap)}/>
            {Object.entries(estBvkMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>
              <div key={k} className="donut-sub">{k}: {v}</div>
            )}
          </div>
          <div className="donut-card">
            <div className="donut-title">Estado de Material</div>
            <Donut segments={toDonut(estMatMap)}/>
            {Object.entries(estMatMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>
              <div key={k} className="donut-sub">{k}: {v}</div>
            )}
          </div>
        </div>
        
        {/* Table */}
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead><tr>
              <th onClick={()=>doSort('obra')}>Obra {sortCol==='obra'?(sortDir==='asc'?'↑':'↓'):''}</th>
              <th onClick={()=>doSort('proveedor')}>Proveedor</th>
              <th onClick={()=>doSort(impKey)}>{moneda==='usd'?'Importe USD':'Importe $'} {sortCol===impKey?(sortDir==='asc'?'↑':'↓'):''}</th>
              <th onClick={()=>doSort('fechaFC')}>Fecha FC</th>
              <th>Condición</th>
              <th>Razón social</th>
              <th onClick={()=>doSort('descripcion')}>Descripción</th>
              <th onClick={()=>doSort('rubro')}>Rubro</th>
              <th>Observaciones</th>
              <th onClick={()=>doSort('estadoCliente')}>Estado FC Cliente</th>
            </tr></thead>
            <tbody>
              {sorted.map((inv,i)=>(
                <tr key={i}>
                  <td style={{fontWeight:500}}>{inv.obra}</td>
                  <td>{inv.proveedor}</td>
                  <td className="mono" style={{textAlign:'right'}}>{fmtMoney(inv[impKey],curr)}</td>
                  <td className="mono">{fmtDate(inv.fechaFC)}</td>
                  <td className="mono" style={{fontSize:10}}>{inv.condicion}</td>
                  <td style={{fontSize:11,color:'var(--c1)'}}>{inv.razonSocial}</td>
                  <td title={inv.descripcion}>{inv.descripcion}</td>
                  <td style={{fontSize:11}}>{inv.rubro||'—'}</td>
                  <td style={{fontSize:11,color:'var(--c2)'}} title={inv.observaciones}>{inv.observaciones}</td>
                  <td><span className={`tag ${tagClass(inv.estadoCliente)}`}>{inv.estadoCliente||'—'}</span></td>
                </tr>
              ))}
              <tr className="total-row">
                <td colSpan="2" style={{textAlign:'right'}}>Total ({filtered.length} facturas)</td>
                <td className="mono" style={{textAlign:'right'}}>{fmtMoney(total,curr)}</td>
                <td colSpan="7"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </>}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
