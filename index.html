<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>BuildPlan Viewer — Bauvek</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   BuildPlan Viewer v2 — Design System
   ═══════════════════════════════════════════════ */

:root {
  /* Base palette — Light */
  --bg-primary: #fafbfc;
  --bg-secondary: #f1f3f5;
  --bg-tertiary: #e9ecef;
  --bg-elevated: #ffffff;
  --bg-row-hover: rgba(59, 108, 245, 0.04);
  --bg-row-alt: rgba(0,0,0,0.015);
  --bg-summary: rgba(59, 108, 245, 0.03);

  --text-primary: #1a1f2e;
  --text-secondary: #5a6178;
  --text-tertiary: #8b92a5;
  --text-inverse: #ffffff;

  --border-primary: #e2e5ea;
  --border-secondary: #eef0f3;
  --border-focus: var(--accent);

  --accent: #3b6cf5;
  --accent-hover: #2d5be0;
  --accent-bg: rgba(59, 108, 245, 0.08);
  --accent-bg-solid: #eef2fe;

  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.08);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.08);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.08);

  /* Gantt bar colors */
  --bar-normal: #3b6cf5;
  --bar-normal-bg: rgba(59, 108, 245, 0.18);
  --bar-summary: #3a3f4b;
  --bar-milestone: #d4930d;
  --bar-overdue: #ef4444;
  --bar-overdue-bg: rgba(239, 68, 68, 0.14);
  --bar-complete: #10b981;
  --bar-complete-bg: rgba(16, 185, 129, 0.14);

  --arrow-color: rgba(148, 163, 184, 0.5);
  --arrow-head: #94a3b8;
  --today-line: #ef4444;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);

  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  --header-h: 44px;
  --row-h: 28px;
  --gantt-header-h: 44px;

  --font-sans: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-primary: #0f1419;
    --bg-secondary: #1a2030;
    --bg-tertiary: #242d3d;
    --bg-elevated: #1e2636;
    --bg-row-hover: rgba(59, 108, 245, 0.08);
    --bg-row-alt: rgba(255,255,255,0.02);
    --bg-summary: rgba(59, 108, 245, 0.06);

    --text-primary: #e4e8ee;
    --text-secondary: #8b95a8;
    --text-tertiary: #5e6882;
    --text-inverse: #0f1419;

    --border-primary: #2a3344;
    --border-secondary: #222b3a;

    --accent-bg: rgba(59, 108, 245, 0.12);
    --accent-bg-solid: #1e2d50;

    --bar-normal-bg: rgba(59, 108, 245, 0.25);
    --bar-overdue-bg: rgba(239, 68, 68, 0.2);
    --bar-complete-bg: rgba(16, 185, 129, 0.2);

    --arrow-color: rgba(71, 85, 105, 0.5);
    --arrow-head: #475569;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
  }
}

:root[data-theme="dark"] {
  --bg-primary: #0f1419;
  --bg-secondary: #1a2030;
  --bg-tertiary: #242d3d;
  --bg-elevated: #1e2636;
  --bg-row-hover: rgba(59, 108, 245, 0.08);
  --bg-row-alt: rgba(255,255,255,0.02);
  --bg-summary: rgba(59, 108, 245, 0.06);

  --text-primary: #e4e8ee;
  --text-secondary: #8b95a8;
  --text-tertiary: #5e6882;
  --text-inverse: #0f1419;

  --border-primary: #2a3344;
  --border-secondary: #222b3a;

  --accent-bg: rgba(59, 108, 245, 0.12);
  --accent-bg-solid: #1e2d50;

  --bar-normal-bg: rgba(59, 108, 245, 0.25);
  --bar-overdue-bg: rgba(239, 68, 68, 0.2);
  --bar-complete-bg: rgba(16, 185, 129, 0.2);

  --arrow-color: rgba(71, 85, 105, 0.5);
  --arrow-head: #475569;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
}

#root {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ── Header ── */
.app-header {
  height: var(--header-h);
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 100;
}

.app-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
  white-space: nowrap;
}

.app-logo svg { flex-shrink: 0; }

.app-logo span {
  color: var(--text-tertiary);
  font-weight: 400;
  font-size: 12px;
  margin-left: 2px;
}

.project-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  flex: 1;
  scrollbar-width: none;
}
.project-tabs::-webkit-scrollbar { display: none; }

.project-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  border: none;
  background: none;
  transition: background 0.15s, color 0.15s;
  position: relative;
}

.project-tab:hover { background: var(--bg-secondary); color: var(--text-primary); }
.project-tab.active { background: var(--accent-bg); color: var(--accent); }

.project-tab .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.project-tab .close-tab {
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  opacity: 0;
  transition: opacity 0.15s;
  font-size: 11px;
  line-height: 1;
}
.project-tab:hover .close-tab { opacity: 0.6; }
.project-tab .close-tab:hover { opacity: 1; background: var(--bg-tertiary); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-sans);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-secondary); color: var(--text-primary); }

.btn-icon {
  padding: 5px;
  width: 28px;
  height: 28px;
}

.btn-accent {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-accent:hover { background: var(--accent-hover); color: white; }

.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--bg-secondary); }

/* ── Segmented Control ── */
.segmented {
  display: inline-flex;
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 1px;
}

.segmented button {
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-sans);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.12s;
}
.segmented button:hover { color: var(--text-primary); }
.segmented button.active { background: var(--bg-elevated); color: var(--text-primary); box-shadow: var(--shadow-sm); }

/* ── Welcome / Home ── */
.welcome {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
}

.welcome-header {
  max-width: 640px;
  margin: 0 auto 24px;
}

.welcome-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 4px;
}

.welcome-sub {
  font-size: 13px;
  color: var(--text-secondary);
}

.project-grid {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.project-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.project-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-sm);
}

.project-card-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--accent-bg);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
}

.project-card-info { flex: 1; min-width: 0; }

.project-card-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-card-meta {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 1px;
}

.project-card-arrow {
  color: var(--text-tertiary);
  flex-shrink: 0;
  transition: transform 0.15s;
}
.project-card:hover .project-card-arrow { transform: translateX(2px); color: var(--accent); }

.drop-zone {
  max-width: 640px;
  margin: 20px auto 0;
  padding: 20px;
  border: 1.5px dashed var(--border-primary);
  border-radius: var(--radius-md);
  text-align: center;
  color: var(--text-tertiary);
  font-size: 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
}

.drop-zone input { display: none; }

/* ── Sub-tabs ── */
.sub-tabs-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 36px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border-secondary);
  flex-shrink: 0;
}

.sub-tab {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-tertiary);
  border: none;
  background: none;
  padding: 8px 0;
  cursor: pointer;
  position: relative;
  font-family: var(--font-sans);
  transition: color 0.12s;
}
.sub-tab:hover { color: var(--text-primary); }
.sub-tab.active { color: var(--accent); }
.sub-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 1px 1px 0 0;
}

.sub-tabs-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── Filters ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-secondary);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.filter-select {
  padding: 4px 24px 4px 8px;
  font-size: 11px;
  font-family: var(--font-sans);
  font-weight: 500;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  color: var(--text-primary);
  cursor: pointer;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6178' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 6px center;
}

.filter-input {
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  font-weight: 400;
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  color: var(--text-primary);
  width: 110px;
}

.filter-label {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 500;
}

.filter-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 0 4px;
}

.filter-clear {
  font-size: 11px;
  color: var(--accent);
  border: none;
  background: none;
  cursor: pointer;
  font-family: var(--font-sans);
  font-weight: 500;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
}
.filter-clear:hover { background: var(--accent-bg); }

/* ── Gantt Container ── */
.gantt-wrapper {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.gantt-table-container {
  overflow: auto;
  border-right: 1px solid var(--border-primary);
  flex-shrink: 0;
  background: var(--bg-elevated);
}

.gantt-chart-container {
  flex: 1;
  overflow: auto;
  position: relative;
  background: var(--bg-primary);
}

/* ── Splitter ── */
.splitter {
  width: 5px;
  cursor: col-resize;
  background: var(--border-secondary);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  transition: background 0.15s;
}
.splitter:hover, .splitter.active { background: var(--accent); }

/* ── Gantt Table ── */
.gantt-table {
  border-collapse: collapse;
  min-width: 100%;
  table-layout: fixed;
}

.gantt-table th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-secondary);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: left;
  padding: 0 8px;
  height: var(--gantt-header-h);
  border-bottom: 1px solid var(--border-primary);
  white-space: nowrap;
}

.gantt-table td {
  padding: 0 8px;
  height: var(--row-h);
  border-bottom: 1px solid var(--border-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
  vertical-align: middle;
}

.gantt-table tr:hover td { background: var(--bg-row-hover); }
.gantt-table tr:nth-child(even) td { background: var(--bg-row-alt); }
.gantt-table tr:nth-child(even):hover td { background: var(--bg-row-hover); }
.gantt-table tr.summary td { background: var(--bg-summary); font-weight: 600; }
.gantt-table tr.summary:hover td { background: var(--bg-row-hover); }

.task-name-cell {
  display: flex;
  align-items: center;
  gap: 4px;
  height: var(--row-h);
}

.task-toggle {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 2px;
  flex-shrink: 0;
  color: var(--text-tertiary);
  transition: color 0.1s, background 0.1s;
}
.task-toggle:hover { color: var(--text-primary); background: var(--bg-tertiary); }

.task-milestone-icon {
  color: var(--bar-milestone);
  font-size: 11px;
  flex-shrink: 0;
}

.task-name-text {
  overflow: hidden;
  text-overflow: ellipsis;
}

.progress-mini {
  display: flex;
  align-items: center;
  gap: 4px;
}

.progress-mini-bar {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--bg-tertiary);
  overflow: hidden;
  flex-shrink: 0;
}

.progress-mini-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.2s;
}

.td-mono {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}

/* ── Gantt SVG ── */
.gantt-svg-header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg-secondary);
}

/* ── Dashboard ── */
.dashboard {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.kpi-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md);
  padding: 14px;
  border-left: 3px solid var(--accent);
}

.kpi-card.success { border-left-color: var(--success); }
.kpi-card.danger { border-left-color: var(--danger); }
.kpi-card.warning { border-left-color: var(--warning); }

.kpi-value {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--font-mono);
  line-height: 1.1;
}

.kpi-label {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 500;
}

.dash-section-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-secondary);
}

.dash-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.dash-table th {
  background: var(--bg-secondary);
  font-weight: 600;
  font-size: 11px;
  color: var(--text-secondary);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-primary);
}

.dash-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border-secondary);
}

/* ── Resources ── */
.resources-view {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* ── Search Modal ── */
.search-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 15vh;
}

.search-modal {
  width: 480px;
  max-width: 90vw;
  background: var(--bg-elevated);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  border: 1px solid var(--border-primary);
}

.search-input {
  width: 100%;
  padding: 12px 16px;
  font-size: 14px;
  font-family: var(--font-sans);
  border: none;
  background: transparent;
  color: var(--text-primary);
  outline: none;
  border-bottom: 1px solid var(--border-secondary);
}

.search-results {
  max-height: 300px;
  overflow-y: auto;
}

.search-result-item {
  padding: 8px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  transition: background 0.1s;
}
.search-result-item:hover { background: var(--bg-row-hover); }
.search-result-item .sr-name { flex: 1; }
.search-result-item .sr-project { color: var(--text-tertiary); font-size: 11px; }

/* ── Tooltip ── */
.gantt-tooltip {
  position: fixed;
  z-index: 2000;
  background: var(--bg-elevated);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 10px 12px;
  font-size: 12px;
  max-width: 260px;
  pointer-events: none;
  line-height: 1.5;
}

.gantt-tooltip .tt-name { font-weight: 600; margin-bottom: 4px; }
.gantt-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
.gantt-tooltip .tt-label { color: var(--text-tertiary); }
.gantt-tooltip .tt-value { font-family: var(--font-mono); font-size: 11px; }

/* ── Loading ── */
.loading-state {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 8px;
  color: var(--text-tertiary);
  font-size: 13px;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border-primary);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── Print ── */
@media print {
  body { overflow: visible !important; height: auto !important; background: white !important; }
  #root { height: auto !important; }
  .app-header, .sub-tabs-bar, .filter-bar, .splitter, .search-overlay { display: none !important; }
  .gantt-wrapper { flex-direction: column !important; overflow: visible !important; height: auto !important; }
  .gantt-table-container, .gantt-chart-container { overflow: visible !important; width: 100% !important; max-width: 100% !important; flex: none !important; }
  .gantt-chart-container { border-top: 1px solid #ccc; }
  .print-header { display: block !important; padding: 16px; border-bottom: 2px solid #333; margin-bottom: 8px; }
  .print-header h1 { font-size: 16px; }
  .print-header p { font-size: 11px; color: #666; }
  .print-footer { display: block !important; text-align: center; padding: 8px; font-size: 10px; color: #999; border-top: 1px solid #ccc; margin-top: 8px; }
  @page { size: landscape; margin: 10mm; }
}

.print-header, .print-footer { display: none; }
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;

// ═══════════════════════════════════════════════
// XML Parser (MSPDI) — UNTOUCHED / WORKING
// ═══════════════════════════════════════════════
function parseMSPDI(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'text/xml');
  const ns = doc.documentElement.namespaceURI;

  function getEl(parent, tag) {
    const el = ns
      ? parent.getElementsByTagNameNS(ns, tag)[0]
      : parent.getElementsByTagName(tag)[0];
    return el ? el.textContent.trim() : '';
  }

  function getEls(parent, tag) {
    return ns
      ? parent.getElementsByTagNameNS(ns, tag)
      : parent.getElementsByTagName(tag);
  }

  // Parse calendars
  const calendars = {};
  const calEls = getEls(doc, 'Calendar');
  for (const c of calEls) {
    const uid = getEl(c, 'UID');
    const name = getEl(c, 'Name');
    calendars[uid] = { uid, name };
  }

  // Parse resources
  const resources = {};
  const resEls = getEls(doc, 'Resource');
  for (const r of resEls) {
    const uid = getEl(r, 'UID');
    const name = getEl(r, 'Name');
    if (uid && name) resources[uid] = { uid, name };
  }

  // Parse assignments
  const assignments = [];
  const assignEls = getEls(doc, 'Assignment');
  for (const a of assignEls) {
    const taskUid = getEl(a, 'TaskUID');
    const resUid = getEl(a, 'ResourceUID');
    if (taskUid && resUid && resources[resUid]) {
      assignments.push({ taskUid, resourceUid: resUid, resourceName: resources[resUid].name });
    }
  }

  // Build assignment map
  const taskResMap = {};
  for (const a of assignments) {
    if (!taskResMap[a.taskUid]) taskResMap[a.taskUid] = [];
    taskResMap[a.taskUid].push(a.resourceName);
  }

  // Parse tasks
  const tasks = [];
  const taskEls = getEls(doc, 'Task');
  for (const t of taskEls) {
    const uid = getEl(t, 'UID');
    const id = getEl(t, 'ID');
    const name = getEl(t, 'Name');
    const start = getEl(t, 'Start');
    const finish = getEl(t, 'Finish');
    const duration = getEl(t, 'Duration');
    const pctComplete = parseInt(getEl(t, 'PercentComplete') || '0', 10);
    const outlineLevel = parseInt(getEl(t, 'OutlineLevel') || '0', 10);
    const isSummary = getEl(t, 'Summary') === '1';
    const isMilestone = getEl(t, 'Milestone') === '1';
    const wbs = getEl(t, 'WBS');

    // Parse predecessors
    const predecessors = [];
    const predEls = getEls(t, 'PredecessorLink');
    for (const p of predEls) {
      const predUid = getEl(p, 'PredecessorUID');
      const typeVal = getEl(p, 'Type') || '1';
      const lagStr = getEl(p, 'LinkLag') || '0';
      const lagFmt = getEl(p, 'LagFormat') || '7';
      const typeMap = { '0': 'FF', '1': 'FS', '2': 'SF', '3': 'SS' };
      let lagDays = parseInt(lagStr, 10);
      if (lagFmt === '7') lagDays = lagDays / 10; // tenths of minutes → days approx
      else if (lagFmt === '5' || lagFmt === '6' || lagFmt === '3') lagDays = lagDays / 4800;
      predecessors.push({
        taskUid: predUid,
        type: typeMap[typeVal] || 'FS',
        lagDays: Math.round(lagDays)
      });
    }

    if (uid !== '0' || name) {
      tasks.push({
        uid, id, name: name || '(sin nombre)',
        start: start ? new Date(start) : null,
        finish: finish ? new Date(finish) : null,
        duration, percentComplete: pctComplete,
        outlineLevel, isSummary, isMilestone, wbs,
        resources: taskResMap[uid] || [],
        predecessors,
        children: [],
        expanded: true,
        visible: true
      });
    }
  }

  // Filter out UID 0 dummy
  const filtered = tasks.filter(t => t.uid !== '0');

  // Build hierarchy
  const rootTasks = [];
  const stack = [];
  for (const task of filtered) {
    while (stack.length > 0 && stack[stack.length - 1].outlineLevel >= task.outlineLevel) {
      stack.pop();
    }
    if (stack.length > 0) {
      stack[stack.length - 1].children.push(task);
      task.parent = stack[stack.length - 1];
    } else {
      rootTasks.push(task);
    }
    if (task.isSummary) stack.push(task);
  }

  // Flatten
  function flattenTasks(list, depth = 0) {
    const result = [];
    for (const t of list) {
      t.depth = depth;
      result.push(t);
      if (t.children.length > 0) {
        result.push(...flattenTasks(t.children, depth + 1));
      }
    }
    return result;
  }

  const flatTasks = flattenTasks(rootTasks);

  // Build UID map
  const uidMap = {};
  for (const t of flatTasks) uidMap[t.uid] = t;

  // Date range
  let minDate = null, maxDate = null;
  for (const t of flatTasks) {
    if (t.start && (!minDate || t.start < minDate)) minDate = t.start;
    if (t.finish && (!maxDate || t.finish > maxDate)) maxDate = t.finish;
  }

  // Unique resources
  const resourceList = [...new Set(flatTasks.flatMap(t => t.resources))].sort();

  return {
    tasks: flatTasks,
    rootTasks,
    uidMap,
    resources: resourceList,
    calendars,
    minDate, maxDate,
    rawResources: Object.values(resources)
  };
}

// ═══════════════════════════════════════════════
// Utility functions
// ═══════════════════════════════════════════════
function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: '2-digit' });
}

function daysBetween(a, b) {
  if (!a || !b) return 0;
  return Math.round((b - a) / 86400000);
}

function isOverdue(task) {
  if (!task.finish || task.percentComplete >= 100 || task.isSummary) return false;
  return task.finish < new Date();
}

function getStatus(task) {
  if (task.percentComplete >= 100) return 'completed';
  if (isOverdue(task)) return 'overdue';
  if (task.percentComplete > 0) return 'in_progress';
  return 'pending';
}

function statusColor(status) {
  switch (status) {
    case 'completed': return 'var(--success)';
    case 'overdue': return 'var(--danger)';
    case 'in_progress': return 'var(--warning)';
    default: return 'var(--text-tertiary)';
  }
}

function statusLabel(status) {
  switch (status) {
    case 'completed': return 'Completada';
    case 'overdue': return 'Vencida';
    case 'in_progress': return 'En curso';
    default: return 'Pendiente';
  }
}

// ═══════════════════════════════════════════════
// Theme Toggle
// ═══════════════════════════════════════════════
function useTheme() {
  const [theme, setTheme] = useState(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    return mq.matches ? 'dark' : 'light';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const toggle = useCallback(() => {
    setTheme(t => t === 'light' ? 'dark' : 'light');
  }, []);

  return [theme, toggle];
}

// ═══════════════════════════════════════════════
// Gantt Chart SVG Component
// ═══════════════════════════════════════════════
const ZOOM_LEVELS = {
  day: { label: 'Día', dayWidth: 28 },
  week: { label: 'Semana', dayWidth: 8 },
  month: { label: 'Mes', dayWidth: 2.5 },
  quarter: { label: 'Trimestre', dayWidth: 0.8 },
};

function GanttChart({ tasks, uidMap, minDate, maxDate, zoom, showArrows, tableScrollTop, onScrollSync, onTooltip }) {
  const svgRef = useRef(null);
  const containerRef = useRef(null);
  const rowH = 28;
  const headerH = 44;
  const dayW = ZOOM_LEVELS[zoom].dayWidth;

  // Compute padding
  const padDaysBefore = zoom === 'day' ? 3 : zoom === 'week' ? 7 : zoom === 'month' ? 14 : 30;
  const padDaysAfter = zoom === 'day' ? 7 : zoom === 'week' ? 14 : zoom === 'month' ? 30 : 60;

  const chartStart = useMemo(() => {
    if (!minDate) return new Date();
    const d = new Date(minDate);
    d.setDate(d.getDate() - padDaysBefore);
    return d;
  }, [minDate, padDaysBefore]);

  const chartEnd = useMemo(() => {
    if (!maxDate) return new Date();
    const d = new Date(maxDate);
    d.setDate(d.getDate() + padDaysAfter);
    return d;
  }, [maxDate, padDaysAfter]);

  const totalDays = daysBetween(chartStart, chartEnd);
  const totalWidth = Math.max(totalDays * dayW, 600);
  const totalHeight = tasks.length * rowH;

  // Date → X position
  const dateToX = useCallback((date) => {
    if (!date) return 0;
    return daysBetween(chartStart, date) * dayW;
  }, [chartStart, dayW]);

  // Sync scroll
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    el.scrollTop = tableScrollTop;
  }, [tableScrollTop]);

  const handleScroll = useCallback((e) => {
    onScrollSync(e.target.scrollTop);
  }, [onScrollSync]);

  // Today line
  const today = new Date();
  const todayX = dateToX(today);
  const showToday = today >= chartStart && today <= chartEnd;

  // Generate time grid headers
  const gridLines = useMemo(() => {
    const lines = [];
    const headers1 = []; // top row
    const headers2 = []; // bottom row
    const d = new Date(chartStart);

    if (zoom === 'day') {
      while (d <= chartEnd) {
        const x = dateToX(d);
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        lines.push({ x, isWeekend, isMajor: d.getDay() === 1 });
        headers2.push({ x, w: dayW, label: d.getDate().toString(), isMajor: false });
        if (d.getDate() === 1 || (d.getDay() === 1 && headers1.length === 0)) {
          headers1.push({ x, label: d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }) });
        }
        d.setDate(d.getDate() + 1);
      }
    } else if (zoom === 'week') {
      while (d <= chartEnd) {
        const x = dateToX(d);
        if (d.getDay() === 1 || d.getTime() === chartStart.getTime()) {
          lines.push({ x, isMajor: d.getDate() <= 7 });
          headers2.push({ x, w: dayW * 7, label: d.getDate().toString() });
        }
        if (d.getDate() === 1) {
          headers1.push({ x, label: d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' }) });
        }
        d.setDate(d.getDate() + 1);
      }
    } else if (zoom === 'month') {
      while (d <= chartEnd) {
        if (d.getDate() === 1) {
          const x = dateToX(d);
          lines.push({ x, isMajor: d.getMonth() === 0 });
          const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          headers2.push({ x, w: daysInMonth * dayW, label: d.toLocaleDateString('es-AR', { month: 'short' }) });
          if (d.getMonth() === 0 || headers1.length === 0) {
            headers1.push({ x, label: d.getFullYear().toString() });
          }
        }
        d.setDate(d.getDate() + 1);
      }
    } else {
      // Quarter
      while (d <= chartEnd) {
        if (d.getDate() === 1) {
          const x = dateToX(d);
          if (d.getMonth() % 3 === 0) {
            lines.push({ x, isMajor: d.getMonth() === 0 });
            const q = Math.floor(d.getMonth() / 3) + 1;
            headers2.push({ x, w: 90 * dayW, label: `T${q}` });
          }
          if (d.getMonth() === 0 || headers1.length === 0) {
            headers1.push({ x, label: d.getFullYear().toString() });
          }
        }
        d.setDate(d.getDate() + 1);
      }
    }

    return { lines, headers1, headers2 };
  }, [chartStart, chartEnd, zoom, dayW, dateToX]);

  // Build bar positions
  const barPositions = useMemo(() => {
    const map = {};
    tasks.forEach((task, i) => {
      const y = i * rowH;
      const cy = y + rowH / 2;
      if (task.isMilestone) {
        const mx = dateToX(task.start || task.finish);
        map[task.uid] = { x: mx, y, cy, w: 0, midX: mx, isMilestone: true, startX: mx, endX: mx };
      } else if (task.start && task.finish) {
        const x1 = dateToX(task.start);
        const x2 = dateToX(task.finish);
        const w = Math.max(x2 - x1, 2);
        map[task.uid] = { x: x1, y, cy, w, midX: x1 + w / 2, isMilestone: false, startX: x1, endX: x1 + w };
      }
    });
    return map;
  }, [tasks, dateToX, rowH]);

  // Dependency arrows
  const arrows = useMemo(() => {
    if (!showArrows) return [];
    const result = [];

    for (const task of tasks) {
      for (const pred of task.predecessors) {
        const fromPos = barPositions[pred.taskUid];
        const toPos = barPositions[task.uid];
        if (!fromPos || !toPos) continue;

        let fromX, fromY, toX, toY;

        switch (pred.type) {
          case 'FS':
            fromX = fromPos.endX;
            fromY = fromPos.cy;
            toX = toPos.startX;
            toY = toPos.cy;
            break;
          case 'FF':
            fromX = fromPos.endX;
            fromY = fromPos.cy;
            toX = toPos.endX;
            toY = toPos.cy;
            break;
          case 'SS':
            fromX = fromPos.startX;
            fromY = fromPos.cy;
            toX = toPos.startX;
            toY = toPos.cy;
            break;
          case 'SF':
            fromX = fromPos.startX;
            fromY = fromPos.cy;
            toX = toPos.endX;
            toY = toPos.cy;
            break;
          default:
            fromX = fromPos.endX;
            fromY = fromPos.cy;
            toX = toPos.startX;
            toY = toPos.cy;
        }

        // Rectilinear path
        const gap = 6;
        let path;

        if (pred.type === 'FS') {
          const midX = fromX + gap;
          if (toX > midX + gap) {
            // Simple L shape
            if (Math.abs(fromY - toY) < 2) {
              path = `M${fromX},${fromY} L${toX},${toY}`;
            } else {
              const cornerX = (fromX + toX) / 2;
              path = `M${fromX},${fromY} L${cornerX},${fromY} L${cornerX},${toY} L${toX},${toY}`;
            }
          } else {
            // U shape around
            const detourY = fromY < toY ? Math.max(fromY, toY) + rowH * 0.6 : Math.min(fromY, toY) - rowH * 0.6;
            path = `M${fromX},${fromY} L${midX},${fromY} L${midX},${detourY} L${toX - gap},${detourY} L${toX - gap},${toY} L${toX},${toY}`;
          }
        } else if (pred.type === 'SS') {
          const leftX = Math.min(fromX, toX) - gap;
          path = `M${fromX},${fromY} L${leftX},${fromY} L${leftX},${toY} L${toX},${toY}`;
        } else if (pred.type === 'FF') {
          const rightX = Math.max(fromX, toX) + gap;
          path = `M${fromX},${fromY} L${rightX},${fromY} L${rightX},${toY} L${toX},${toY}`;
        } else { // SF
          const leftX = fromX - gap;
          const rightX = toX + gap;
          if (leftX > rightX) {
            const midX2 = (leftX + rightX) / 2;
            path = `M${fromX},${fromY} L${midX2},${fromY} L${midX2},${toY} L${toX},${toY}`;
          } else {
            path = `M${fromX},${fromY} L${leftX},${fromY} L${leftX},${toY} L${toX},${toY}`;
          }
        }

        result.push({ path, toX, toY, type: pred.type });
      }
    }
    return result;
  }, [tasks, barPositions, showArrows, rowH]);

  // Mouse tooltip
  const handleBarEnter = useCallback((e, task) => {
    const rect = e.currentTarget.getBoundingClientRect();
    onTooltip({
      task,
      x: rect.left + rect.width / 2,
      y: rect.top - 4
    });
  }, [onTooltip]);

  const handleBarLeave = useCallback(() => {
    onTooltip(null);
  }, [onTooltip]);

  return (
    <div ref={containerRef} className="gantt-chart-container" onScroll={handleScroll} style={{ position: 'relative' }}>
      <svg width={totalWidth} height={totalHeight + headerH} style={{ display: 'block' }}>
        {/* Header background */}
        <rect x="0" y="0" width={totalWidth} height={headerH} fill="var(--bg-secondary)" className="gantt-svg-header"/>
        <line x1="0" y1={headerH} x2={totalWidth} y2={headerH} stroke="var(--border-primary)" strokeWidth="1"/>

        {/* Header labels */}
        {gridLines.headers1.map((h, i) => (
          <text key={`h1-${i}`} x={h.x + 4} y={16} fontSize="10" fontWeight="600" fill="var(--text-secondary)" fontFamily="var(--font-sans)">{h.label}</text>
        ))}
        {gridLines.headers2.map((h, i) => (
          <text key={`h2-${i}`} x={h.x + (h.w ? h.w/2 : 4)} y={34} fontSize="10" fill="var(--text-tertiary)" fontFamily="var(--font-mono)" textAnchor={h.w ? 'middle' : 'start'}>{h.label}</text>
        ))}

        {/* Grid lines */}
        {gridLines.lines.map((l, i) => (
          <line key={`gl-${i}`} x1={l.x} y1={headerH} x2={l.x} y2={totalHeight + headerH}
            stroke={l.isMajor ? 'var(--border-primary)' : 'var(--border-secondary)'}
            strokeWidth={l.isMajor ? 1 : 0.5}
            strokeDasharray={l.isMajor ? 'none' : '2,4'}
          />
        ))}

        {/* Weekend shading for day zoom */}
        {zoom === 'day' && gridLines.lines.filter(l => l.isWeekend).map((l, i) => (
          <rect key={`we-${i}`} x={l.x} y={headerH} width={dayW} height={totalHeight} fill="var(--text-tertiary)" opacity="0.04"/>
        ))}

        {/* Row lines */}
        {tasks.map((_, i) => (
          <line key={`rl-${i}`} x1="0" y1={headerH + (i + 1) * rowH} x2={totalWidth} y2={headerH + (i + 1) * rowH} stroke="var(--border-secondary)" strokeWidth="0.5"/>
        ))}

        {/* Dependency arrows */}
        {arrows.map((arrow, i) => (
          <g key={`arr-${i}`}>
            <path d={arrow.path} fill="none" stroke="var(--arrow-color)" strokeWidth="1"
              transform={`translate(0, ${headerH})`}/>
            {/* Arrowhead */}
            <polygon
              points={`${arrow.toX},${arrow.toY + headerH} ${arrow.toX - 4},${arrow.toY - 3 + headerH} ${arrow.toX - 4},${arrow.toY + 3 + headerH}`}
              fill="var(--arrow-head)" opacity="0.6"
            />
          </g>
        ))}

        {/* Today line */}
        {showToday && (
          <g>
            <line x1={todayX} y1={headerH} x2={todayX} y2={totalHeight + headerH} stroke="var(--today-line)" strokeWidth="1.5" strokeDasharray="4,3"/>
            <rect x={todayX - 16} y={headerH - 14} width="32" height="13" rx="2" fill="var(--today-line)"/>
            <text x={todayX} y={headerH - 5} textAnchor="middle" fontSize="9" fontWeight="600" fill="white" fontFamily="var(--font-sans)">HOY</text>
          </g>
        )}

        {/* Task bars */}
        {tasks.map((task, i) => {
          const y = headerH + i * rowH;
          const cy = y + rowH / 2;

          if (task.isMilestone) {
            const mx = dateToX(task.start || task.finish);
            const size = 5;
            const color = isOverdue(task) ? 'var(--bar-overdue)' : 'var(--bar-milestone)';
            return (
              <g key={task.uid}
                onMouseEnter={(e) => handleBarEnter(e, task)}
                onMouseLeave={handleBarLeave}
                style={{ cursor: 'default' }}>
                <polygon
                  points={`${mx},${cy - size} ${mx + size},${cy} ${mx},${cy + size} ${mx - size},${cy}`}
                  fill={color} stroke={color} strokeWidth="1"/>
              </g>
            );
          }

          if (!task.start || !task.finish) return null;

          const x = dateToX(task.start);
          const w = Math.max(dateToX(task.finish) - x, 2);
          const barH = task.isSummary ? 6 : 10;
          const barY = cy - barH / 2;
          const pct = task.percentComplete;
          const overdue = isOverdue(task);
          const complete = pct >= 100;

          let bgColor = 'var(--bar-normal-bg)';
          let fillColor = 'var(--bar-normal)';
          if (overdue) { bgColor = 'var(--bar-overdue-bg)'; fillColor = 'var(--bar-overdue)'; }
          else if (complete) { bgColor = 'var(--bar-complete-bg)'; fillColor = 'var(--bar-complete)'; }

          if (task.isSummary) {
            return (
              <g key={task.uid}
                onMouseEnter={(e) => handleBarEnter(e, task)}
                onMouseLeave={handleBarLeave}
                style={{ cursor: 'default' }}>
                <rect x={x} y={barY} width={w} height={barH} fill="var(--bar-summary)" rx="1" opacity="0.7"/>
                <rect x={x} y={barY} width={w * pct / 100} height={barH} fill="var(--bar-summary)" rx="1"/>
                {/* Summary brackets */}
                <path d={`M${x},${barY} L${x},${barY + barH + 3} L${x + 4},${barY + barH}`} fill="none" stroke="var(--bar-summary)" strokeWidth="1.5"/>
                <path d={`M${x + w},${barY} L${x + w},${barY + barH + 3} L${x + w - 4},${barY + barH}`} fill="none" stroke="var(--bar-summary)" strokeWidth="1.5"/>
              </g>
            );
          }

          return (
            <g key={task.uid}
              onMouseEnter={(e) => handleBarEnter(e, task)}
              onMouseLeave={handleBarLeave}
              style={{ cursor: 'default' }}>
              <rect x={x} y={barY} width={w} height={barH} fill={bgColor} rx="3"/>
              <rect x={x} y={barY} width={Math.max(w * pct / 100, 0)} height={barH} fill={fillColor} rx="3"/>
              {/* Percent label on bar if wide enough */}
              {w > 30 && pct > 0 && (
                <text x={x + 4} y={cy + 3} fontSize="8" fontWeight="600" fill={fillColor === 'var(--bar-normal)' ? 'var(--accent)' : fillColor} fontFamily="var(--font-mono)" opacity="0.8">{pct}%</text>
              )}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ═══════════════════════════════════════════════
// Dashboard Component
// ═══════════════════════════════════════════════
function Dashboard({ project }) {
  if (!project) return null;
  const tasks = project.tasks.filter(t => !t.isSummary);
  const total = tasks.length;
  const completed = tasks.filter(t => t.percentComplete >= 100).length;
  const inProgress = tasks.filter(t => t.percentComplete > 0 && t.percentComplete < 100).length;
  const overdue = tasks.filter(t => isOverdue(t)).length;
  const avgProgress = total > 0 ? Math.round(tasks.reduce((s, t) => s + t.percentComplete, 0) / total) : 0;

  const upcoming = tasks
    .filter(t => t.finish && t.finish >= new Date() && t.isMilestone !== true && t.percentComplete < 100)
    .sort((a, b) => a.finish - b.finish)
    .slice(0, 8);

  const resourceLoad = {};
  tasks.forEach(t => {
    const res = t.resources.length > 0 ? t.resources.join(', ') : 'Sin asignar';
    if (!resourceLoad[res]) resourceLoad[res] = { total: 0, done: 0, overdue: 0 };
    resourceLoad[res].total++;
    if (t.percentComplete >= 100) resourceLoad[res].done++;
    if (isOverdue(t)) resourceLoad[res].overdue++;
  });

  return (
    <div className="dashboard">
      <div className="dash-grid">
        <div className="kpi-card">
          <div className="kpi-value">{total}</div>
          <div className="kpi-label">Tareas totales</div>
        </div>
        <div className="kpi-card success">
          <div className="kpi-value" style={{ color: 'var(--success)' }}>{completed}</div>
          <div className="kpi-label">Completadas</div>
        </div>
        <div className="kpi-card warning">
          <div className="kpi-value" style={{ color: 'var(--warning)' }}>{inProgress}</div>
          <div className="kpi-label">En curso</div>
        </div>
        <div className="kpi-card danger">
          <div className="kpi-value" style={{ color: 'var(--danger)' }}>{overdue}</div>
          <div className="kpi-label">Vencidas</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-value">{avgProgress}%</div>
          <div className="kpi-label">Avance promedio</div>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ marginBottom: 20, background: 'var(--bg-elevated)', border: '1px solid var(--border-secondary)', borderRadius: 'var(--radius-md)', padding: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ fontSize: 12, fontWeight: 600 }}>Avance general</span>
          <span style={{ fontSize: 12, fontFamily: 'var(--font-mono)', color: 'var(--accent)', fontWeight: 600 }}>{avgProgress}%</span>
        </div>
        <div style={{ height: 8, borderRadius: 4, background: 'var(--bg-tertiary)', overflow: 'hidden' }}>
          <div style={{ height: '100%', borderRadius: 4, width: `${avgProgress}%`, background: 'var(--accent)', transition: 'width 0.3s' }}/>
        </div>
        <div style={{ display: 'flex', gap: 16, marginTop: 8, fontSize: 11, color: 'var(--text-secondary)' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--success)' }}/> {completed} completadas
          </span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--warning)' }}/> {inProgress} en curso
          </span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--danger)' }}/> {overdue} vencidas
          </span>
        </div>
      </div>

      {/* Upcoming tasks */}
      {upcoming.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div className="dash-section-title">Próximas entregas</div>
          <table className="dash-table">
            <thead>
              <tr>
                <th>Tarea</th>
                <th style={{ width: 100 }}>Fin</th>
                <th style={{ width: 60 }}>Avance</th>
                <th style={{ width: 120 }}>Recurso</th>
              </tr>
            </thead>
            <tbody>
              {upcoming.map(t => (
                <tr key={t.uid}>
                  <td style={{ fontWeight: 500 }}>{t.name}</td>
                  <td className="td-mono">{fmtDate(t.finish)}</td>
                  <td>
                    <div className="progress-mini">
                      <div className="progress-mini-bar">
                        <div className="progress-mini-fill" style={{ width: `${t.percentComplete}%`, background: 'var(--accent)' }}/>
                      </div>
                      <span className="td-mono">{t.percentComplete}%</span>
                    </div>
                  </td>
                  <td style={{ color: 'var(--text-secondary)', fontSize: 11 }}>{t.resources.join(', ') || '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* Resource load */}
      <div>
        <div className="dash-section-title">Carga por recurso</div>
        <table className="dash-table">
          <thead>
            <tr>
              <th>Recurso</th>
              <th style={{ width: 60 }}>Total</th>
              <th style={{ width: 80 }}>Completadas</th>
              <th style={{ width: 70 }}>Vencidas</th>
            </tr>
          </thead>
          <tbody>
            {Object.entries(resourceLoad).sort((a, b) => b[1].total - a[1].total).map(([name, data]) => (
              <tr key={name}>
                <td style={{ fontWeight: 500 }}>{name}</td>
                <td className="td-mono">{data.total}</td>
                <td className="td-mono" style={{ color: 'var(--success)' }}>{data.done}</td>
                <td className="td-mono" style={{ color: data.overdue > 0 ? 'var(--danger)' : 'var(--text-tertiary)' }}>{data.overdue}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// Resources View
// ═══════════════════════════════════════════════
function ResourcesView({ project }) {
  if (!project) return null;
  const allRes = project.rawResources || [];
  const tasks = project.tasks;

  const resData = allRes.map(r => {
    const myTasks = tasks.filter(t => t.resources.includes(r.name));
    const total = myTasks.length;
    const done = myTasks.filter(t => t.percentComplete >= 100).length;
    const overdue = myTasks.filter(t => isOverdue(t)).length;
    const avgPct = total > 0 ? Math.round(myTasks.reduce((s, t) => s + t.percentComplete, 0) / total) : 0;
    return { ...r, total, done, overdue, avgPct };
  });

  return (
    <div className="resources-view">
      <div className="dash-section-title">Recursos del proyecto</div>
      <table className="dash-table">
        <thead>
          <tr>
            <th>Recurso</th>
            <th style={{ width: 70 }}>Tareas</th>
            <th style={{ width: 90 }}>Completadas</th>
            <th style={{ width: 70 }}>Vencidas</th>
            <th style={{ width: 90 }}>Avance prom.</th>
          </tr>
        </thead>
        <tbody>
          {resData.sort((a, b) => b.total - a.total).map(r => (
            <tr key={r.uid}>
              <td style={{ fontWeight: 500 }}>{r.name}</td>
              <td className="td-mono">{r.total}</td>
              <td className="td-mono" style={{ color: 'var(--success)' }}>{r.done}</td>
              <td className="td-mono" style={{ color: r.overdue > 0 ? 'var(--danger)' : 'var(--text-tertiary)' }}>{r.overdue}</td>
              <td>
                <div className="progress-mini">
                  <div className="progress-mini-bar" style={{ width: 48 }}>
                    <div className="progress-mini-fill" style={{ width: `${r.avgPct}%`, background: 'var(--accent)' }}/>
                  </div>
                  <span className="td-mono">{r.avgPct}%</span>
                </div>
              </td>
            </tr>
          ))}
          {resData.length === 0 && (
            <tr><td colSpan="5" style={{ textAlign: 'center', color: 'var(--text-tertiary)', padding: 20 }}>No hay recursos asignados</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

// ═══════════════════════════════════════════════
// Search Modal
// ═══════════════════════════════════════════════
function SearchModal({ projects, onSelect, onClose }) {
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current?.focus();
  }, []);

  const results = useMemo(() => {
    if (!query.trim()) return [];
    const q = query.toLowerCase();
    const res = [];
    for (const p of projects) {
      if (!p.data) continue;
      for (const t of p.data.tasks) {
        if (t.name.toLowerCase().includes(q)) {
          res.push({ task: t, projectName: p.name });
          if (res.length >= 20) return res;
        }
      }
    }
    return res;
  }, [query, projects]);

  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="search-modal" onClick={e => e.stopPropagation()}>
        <input ref={inputRef} className="search-input" placeholder="Buscar tareas..." value={query} onChange={e => setQuery(e.target.value)}
          onKeyDown={e => { if (e.key === 'Escape') onClose(); }}/>
        <div className="search-results">
          {results.map((r, i) => (
            <div key={i} className="search-result-item" onClick={() => { onSelect(r); onClose(); }}>
              <span style={{ color: r.task.isMilestone ? 'var(--bar-milestone)' : 'var(--text-tertiary)' }}>
                {r.task.isMilestone ? '♦' : '○'}
              </span>
              <span className="sr-name">{r.task.name}</span>
              <span className="sr-project">{r.projectName}</span>
            </div>
          ))}
          {query.trim() && results.length === 0 && (
            <div style={{ padding: '16px', textAlign: 'center', color: 'var(--text-tertiary)', fontSize: 12 }}>Sin resultados</div>
          )}
        </div>
      </div>
    </div>
  );
}

function Tooltip({ info }) {
  if (!info) return null;
  const { task, x, y } = info;
  const status = getStatus(task);

  return (
    <div className="gantt-tooltip" style={{ left: Math.min(x, window.innerWidth - 280), top: y - 100 }}>
      <div className="tt-name">{task.name}</div>
      <div className="tt-row"><span className="tt-label">Estado</span><span className="tt-value" style={{ color: statusColor(status) }}>{statusLabel(status)}</span></div>
      <div className="tt-row"><span className="tt-label">Inicio</span><span className="tt-value">{fmtDate(task.start)}</span></div>
      <div className="tt-row"><span className="tt-label">Fin</span><span className="tt-value">{fmtDate(task.finish)}</span></div>
      <div className="tt-row"><span className="tt-label">Avance</span><span className="tt-value">{task.percentComplete}%</span></div>
      {task.resources.length > 0 && (
        <div className="tt-row"><span className="tt-label">Recurso</span><span className="tt-value">{task.resources.join(', ')}</span></div>
      )}
      {task.predecessors.length > 0 && (
        <div className="tt-row"><span className="tt-label">Predecesoras</span><span className="tt-value">{task.predecessors.length}</span></div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════
function App() {
  const [theme, toggleTheme] = useTheme();
  const [manifest, setManifest] = useState(null);
  const [projects, setProjects] = useState([]); // { id, name, file, data, loading }
  const [openTabs, setOpenTabs] = useState([]); // project ids
  const [activeTab, setActiveTab] = useState(null);
  const [subTab, setSubTab] = useState('gantt'); // gantt | dashboard | resources
  const [zoom, setZoom] = useState('week');
  const [showSearch, setShowSearch] = useState(false);
  const [showArrows, setShowArrows] = useState(true);
  const [tooltipInfo, setTooltipInfo] = useState(null);
  const [tableScrollTop, setTableScrollTop] = useState(0);
  const [tablePaneWidth, setTablePaneWidth] = useState(420);
  const [splitterActive, setSplitterActive] = useState(false);

  // Filters
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterResource, setFilterResource] = useState('all');
  const [filterWbsLevel, setFilterWbsLevel] = useState(99);
  const [filterDateFrom, setFilterDateFrom] = useState('');
  const [filterDateTo, setFilterDateTo] = useState('');

  // Expanded state per project
  const [expandedMap, setExpandedMap] = useState({});

  // Load manifest
  useEffect(() => {
    fetch('data/manifest.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        setManifest(data);
        setProjects(data.projects.map((p, i) => ({
          id: i,
          name: p.name || p.file.replace('.xml', ''),
          file: p.file,
          data: null,
          loading: false,
          size: p.size || null,
          modified: p.modified || null
        })));
      })
      .catch(() => {
        // No manifest — allow local file upload only
        setManifest({ projects: [] });
        setProjects([]);
      });
  }, []);

  // Keyboard shortcut
  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        setShowSearch(s => !s);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  // Open project
  const openProject = useCallback(async (project) => {
    if (openTabs.includes(project.id)) {
      setActiveTab(project.id);
      return;
    }

    if (!project.data && !project.loading) {
      setProjects(prev => prev.map(p => p.id === project.id ? { ...p, loading: true } : p));
      try {
        const res = await fetch(`data/projects/${project.file}?t=${Date.now()}`);
        const text = await res.text();
        const data = parseMSPDI(text);
        setProjects(prev => prev.map(p => p.id === project.id ? { ...p, data, loading: false } : p));

        // Initialize expanded state
        const expMap = {};
        data.tasks.forEach(t => { if (t.isSummary) expMap[t.uid] = true; });
        setExpandedMap(prev => ({ ...prev, [project.id]: expMap }));
      } catch (err) {
        console.error('Error loading project:', err);
        setProjects(prev => prev.map(p => p.id === project.id ? { ...p, loading: false } : p));
        return;
      }
    }

    setOpenTabs(prev => [...prev, project.id]);
    setActiveTab(project.id);
    setSubTab('gantt');
    resetFilters();
  }, [openTabs]);

  // Close tab
  const closeTab = useCallback((id, e) => {
    e?.stopPropagation();
    setOpenTabs(prev => {
      const next = prev.filter(t => t !== id);
      if (activeTab === id) {
        setActiveTab(next.length > 0 ? next[next.length - 1] : null);
      }
      return next;
    });
  }, [activeTab]);

  // Local file upload
  const handleLocalFile = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = parseMSPDI(e.target.result);
        const id = -Date.now();
        const proj = { id, name: file.name.replace('.xml', ''), file: file.name, data, loading: false, size: file.size, local: true };
        setProjects(prev => [...prev, proj]);

        const expMap = {};
        data.tasks.forEach(t => { if (t.isSummary) expMap[t.uid] = true; });
        setExpandedMap(prev => ({ ...prev, [id]: expMap }));

        setOpenTabs(prev => [...prev, id]);
        setActiveTab(id);
        setSubTab('gantt');
        resetFilters();
      } catch (err) {
        console.error('Parse error:', err);
      }
    };
    reader.readAsText(file);
  }, []);

  // Toggle task expansion
  const toggleTask = useCallback((projectId, taskUid) => {
    setExpandedMap(prev => {
      const projMap = { ...prev[projectId] };
      projMap[taskUid] = !projMap[taskUid];
      return { ...prev, [projectId]: projMap };
    });
  }, []);

  // Expand / Collapse all
  const expandAll = useCallback((projectId, tasks) => {
    const expMap = {};
    tasks.forEach(t => { if (t.isSummary) expMap[t.uid] = true; });
    setExpandedMap(prev => ({ ...prev, [projectId]: expMap }));
  }, []);

  const collapseAll = useCallback((projectId, tasks) => {
    const expMap = {};
    tasks.forEach(t => { if (t.isSummary) expMap[t.uid] = false; });
    setExpandedMap(prev => ({ ...prev, [projectId]: expMap }));
  }, []);

  // Reset filters
  const resetFilters = useCallback(() => {
    setFilterStatus('all');
    setFilterResource('all');
    setFilterWbsLevel(99);
    setFilterDateFrom('');
    setFilterDateTo('');
  }, []);

  const activeFiltersCount = useMemo(() => {
    let c = 0;
    if (filterStatus !== 'all') c++;
    if (filterResource !== 'all') c++;
    if (filterWbsLevel < 99) c++;
    if (filterDateFrom || filterDateTo) c++;
    return c;
  }, [filterStatus, filterResource, filterWbsLevel, filterDateFrom, filterDateTo]);

  // Active project
  const activeProject = useMemo(() => projects.find(p => p.id === activeTab), [projects, activeTab]);

  // Filtered & visible tasks
  const visibleTasks = useMemo(() => {
    if (!activeProject?.data) return [];
    const allTasks = activeProject.data.tasks;
    const expMap = expandedMap[activeProject.id] || {};

    // First apply filters
    const matchesFilter = (task) => {
      // Status filter
      if (filterStatus !== 'all') {
        const status = getStatus(task);
        if (filterStatus !== status) return false;
      }

      // Resource filter
      if (filterResource !== 'all') {
        if (filterResource === 'unassigned') {
          if (task.resources.length > 0) return false;
        } else {
          if (!task.resources.includes(filterResource)) return false;
        }
      }

      // WBS level
      if (task.outlineLevel > filterWbsLevel) return false;

      // Date range
      if (filterDateFrom) {
        const from = new Date(filterDateFrom);
        if (task.finish && task.finish < from) return false;
      }
      if (filterDateTo) {
        const to = new Date(filterDateTo);
        if (task.start && task.start > to) return false;
      }

      return true;
    };

    // Check if any descendant matches
    const hasMatchingDescendant = (task) => {
      if (matchesFilter(task)) return true;
      for (const child of task.children) {
        if (hasMatchingDescendant(child)) return true;
      }
      return false;
    };

    // Build visible list
    const result = [];
    const processTask = (task) => {
      // Summary tasks stay visible if any child matches
      if (task.isSummary) {
        if (!hasMatchingDescendant(task) && !matchesFilter(task)) return;
      } else {
        if (!matchesFilter(task)) return;
      }

      result.push(task);

      // Show children only if expanded
      if (task.isSummary && expMap[task.uid]) {
        for (const child of task.children) {
          processTask(child);
        }
      }
    };

    for (const task of activeProject.data.rootTasks || []) {
      processTask(task);
    }

    return result;
  }, [activeProject, expandedMap, filterStatus, filterResource, filterWbsLevel, filterDateFrom, filterDateTo]);

  // Splitter drag
  useEffect(() => {
    if (!splitterActive) return;
    const onMove = (e) => {
      setTablePaneWidth(Math.max(200, Math.min(e.clientX, window.innerWidth - 200)));
    };
    const onUp = () => setSplitterActive(false);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
  }, [splitterActive]);

  // Table scroll sync
  const tableContainerRef = useRef(null);
  const handleTableScroll = useCallback((e) => {
    setTableScrollTop(e.target.scrollTop);
  }, []);
  const handleChartScrollSync = useCallback((scrollTop) => {
    if (tableContainerRef.current) {
      tableContainerRef.current.scrollTop = scrollTop;
    }
    setTableScrollTop(scrollTop);
  }, []);

  // Print
  const handlePrint = useCallback(() => {
    window.print();
  }, []);

  // Drop zone
  const [dragOver, setDragOver] = useState(false);

  if (!manifest) {
    return <div className="loading-state"><div className="spinner"/><span>Cargando...</span></div>;
  }

  // Welcome screen
  if (!activeTab) {
    const serverProjects = projects.filter(p => !p.local);
    return (
      <Fragment>
        <div className="app-header">
          <div className="app-logo">
            {Icons.building(18)}
            BuildPlan <span>Viewer</span>
          </div>
          <div className="project-tabs"/>
          <div className="header-actions">
            <button className="btn btn-ghost btn-icon" onClick={() => setShowSearch(true)} title="Buscar (Ctrl+K)">{Icons.search()}</button>
            <button className="btn btn-ghost btn-icon" onClick={toggleTheme} title="Cambiar tema">
              {theme === 'light' ? Icons.moon() : Icons.sun()}
            </button>
          </div>
        </div>

        <div className="welcome">
          <div className="welcome-header">
            <div className="welcome-title">Proyectos</div>
            <div className="welcome-sub">{serverProjects.length} archivos disponibles</div>
          </div>

          <div className="project-grid">
            {serverProjects.map(p => (
              <div key={p.id} className="project-card" onClick={() => openProject(p)}>
                <div className="project-card-icon">{Icons.building(16)}</div>
                <div className="project-card-info">
                  <div className="project-card-name">{p.name}</div>
                  <div className="project-card-meta">
                    {p.size ? `${(p.size / 1024).toFixed(0)} KB` : 'XML'}
                    {p.modified ? ` · ${new Date(p.modified).toLocaleDateString('es-AR')}` : ''}
                  </div>
                </div>
                <div className="project-card-arrow">{Icons.arrowRight()}</div>
              </div>
            ))}
          </div>

          <div
            className={`drop-zone ${dragOver ? 'drag-over' : ''}`}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); if (e.dataTransfer.files[0]) handleLocalFile(e.dataTransfer.files[0]); }}
            onClick={() => document.getElementById('file-input').click()}
          >
            {Icons.upload(20)}
            <div style={{ marginTop: 6 }}>Soltar un archivo XML de MS Project aquí, o hacer clic para seleccionar</div>
            <input id="file-input" type="file" accept=".xml" onChange={e => { if (e.target.files[0]) handleLocalFile(e.target.files[0]); }}/>
          </div>
        </div>

        {showSearch && <SearchModal projects={projects} onSelect={() => {}} onClose={() => setShowSearch(false)}/>}
      </Fragment>
    );
  }

  // Project view
  const proj = activeProject;
  const projData = proj?.data;
  const isLoading = proj?.loading;

  return (
    <Fragment>
      {/* Print header/footer */}
      <div className="print-header">
        <h1>{proj?.name}</h1>
        <p>Generado el {new Date().toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' })} — BuildPlan Viewer · Bauvek</p>
      </div>

      {/* Header */}
      <div className="app-header">
        <div className="app-logo" style={{ cursor: 'pointer' }} onClick={() => setActiveTab(null)}>
          {Icons.building(18)}
          BuildPlan
        </div>

        <div className="project-tabs">
          {openTabs.map(id => {
            const p = projects.find(pr => pr.id === id);
            if (!p) return null;
            const pData = p.data;
            let dotColor = 'var(--text-tertiary)';
            if (pData) {
              const nonSum = pData.tasks.filter(t => !t.isSummary);
              const overdueCount = nonSum.filter(t => isOverdue(t)).length;
              const avg = nonSum.length > 0 ? nonSum.reduce((s, t) => s + t.percentComplete, 0) / nonSum.length : 0;
              if (avg >= 90) dotColor = 'var(--success)';
              else if (overdueCount > nonSum.length * 0.3) dotColor = 'var(--danger)';
              else if (avg > 30) dotColor = 'var(--warning)';
            }
            return (
              <button key={id} className={`project-tab ${activeTab === id ? 'active' : ''}`}
                onClick={() => { setActiveTab(id); resetFilters(); }}>
                <span className="status-dot" style={{ background: dotColor }}/>
                {p.name}
                <span className="close-tab" onClick={(e) => closeTab(id, e)}>×</span>
              </button>
            );
          })}
        </div>

        <div className="header-actions">
          <button className="btn btn-ghost btn-icon" onClick={() => setShowSearch(true)} title="Buscar (Ctrl+K)">{Icons.search()}</button>
          <button className="btn btn-ghost btn-icon" onClick={toggleTheme}>
            {theme === 'light' ? Icons.moon() : Icons.sun()}
          </button>
        </div>
      </div>

      {/* Sub-tabs */}
      <div className="sub-tabs-bar">
        <button className={`sub-tab ${subTab === 'gantt' ? 'active' : ''}`} onClick={() => setSubTab('gantt')}>Gantt</button>
        <button className={`sub-tab ${subTab === 'dashboard' ? 'active' : ''}`} onClick={() => setSubTab('dashboard')}>Dashboard</button>
        <button className={`sub-tab ${subTab === 'resources' ? 'active' : ''}`} onClick={() => setSubTab('resources')}>Recursos</button>

        {subTab === 'gantt' && projData && (
          <div className="sub-tabs-right">
            <button className="btn btn-ghost btn-icon" onClick={() => expandAll(proj.id, projData.tasks)} title="Expandir todo">{Icons.expandAll()}</button>
            <button className="btn btn-ghost btn-icon" onClick={() => collapseAll(proj.id, projData.tasks)} title="Colapsar todo">{Icons.collapseAll()}</button>

            <div className="segmented">
              {Object.entries(ZOOM_LEVELS).map(([key, val]) => (
                <button key={key} className={zoom === key ? 'active' : ''} onClick={() => setZoom(key)}>{val.label}</button>
              ))}
            </div>

            <button className={`btn btn-ghost btn-icon ${showArrows ? '' : ''}`}
              onClick={() => setShowArrows(a => !a)}
              title={showArrows ? 'Ocultar flechas' : 'Mostrar flechas'}
              style={{ color: showArrows ? 'var(--accent)' : 'var(--text-tertiary)' }}>
              {Icons.link()}
            </button>

            <button className="btn btn-ghost" onClick={handlePrint}>
              {Icons.print()} PDF
            </button>
          </div>
        )}
      </div>

      {/* Filters (gantt only) */}
      {subTab === 'gantt' && projData && (
        <div className="filter-bar">
          <span style={{ color: 'var(--text-tertiary)', marginRight: 2 }}>{Icons.filter()}</span>

          <span className="filter-label">Estado</span>
          <select className="filter-select" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
            <option value="all">Todos</option>
            <option value="pending">Pendiente</option>
            <option value="in_progress">En curso</option>
            <option value="completed">Completada</option>
            <option value="overdue">Vencida</option>
          </select>

          <span className="filter-label">Recurso</span>
          <select className="filter-select" value={filterResource} onChange={e => setFilterResource(e.target.value)}>
            <option value="all">Todos</option>
            <option value="unassigned">Sin asignar</option>
            {projData.resources.map(r => <option key={r} value={r}>{r}</option>)}
          </select>

          <span className="filter-label">Nivel</span>
          <select className="filter-select" value={filterWbsLevel} onChange={e => setFilterWbsLevel(parseInt(e.target.value))}>
            <option value="99">Todos</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>

          <span className="filter-label">Desde</span>
          <input type="date" className="filter-input" value={filterDateFrom} onChange={e => setFilterDateFrom(e.target.value)}/>

          <span className="filter-label">Hasta</span>
          <input type="date" className="filter-input" value={filterDateTo} onChange={e => setFilterDateTo(e.target.value)}/>

          {activeFiltersCount > 0 && (
            <Fragment>
              <span className="filter-badge">{activeFiltersCount}</span>
              <button className="filter-clear" onClick={resetFilters}>Limpiar</button>
            </Fragment>
          )}

          <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)' }}>
            {visibleTasks.length} tareas
          </span>
        </div>
      )}

      {/* Content */}
      {isLoading && <div className="loading-state"><div className="spinner"/><span>Cargando proyecto...</span></div>}

      {!isLoading && projData && subTab === 'gantt' && (
        <div className="gantt-wrapper" style={{ userSelect: splitterActive ? 'none' : 'auto' }}>
          {/* Table */}
          <div className="gantt-table-container" ref={tableContainerRef} style={{ width: tablePaneWidth }} onScroll={handleTableScroll}>
            <table className="gantt-table">
              <colgroup>
                <col style={{ width: '40%' }}/>
                <col style={{ width: '20%' }}/>
                <col style={{ width: '20%' }}/>
                <col style={{ width: '20%' }}/>
              </colgroup>
              <thead>
                <tr>
                  <th>Tarea</th>
                  <th>Inicio</th>
                  <th>Fin</th>
                  <th>Avance</th>
                </tr>
              </thead>
              <tbody>
                {visibleTasks.map(task => {
                  const expMap = expandedMap[proj.id] || {};
                  const overdue = isOverdue(task);
                  const indent = task.depth * 16;

                  return (
                    <tr key={task.uid} className={task.isSummary ? 'summary' : ''}>
                      <td>
                        <div className="task-name-cell" style={{ paddingLeft: indent }}>
                          {task.isSummary ? (
                            <span className="task-toggle" onClick={() => toggleTask(proj.id, task.uid)}>
                              {expMap[task.uid] ? Icons.chevronDown() : Icons.chevronRight()}
                            </span>
                          ) : (
                            <span style={{ width: 16, flexShrink: 0 }}/>
                          )}
                          {task.isMilestone && <span className="task-milestone-icon">♦</span>}
                          <span className="task-name-text" style={{
                            fontWeight: task.isSummary ? 600 : 400,
                            color: overdue ? 'var(--danger)' : 'var(--text-primary)'
                          }} title={task.name}>
                            {task.name}
                          </span>
                        </div>
                      </td>
                      <td className="td-mono">{fmtDate(task.start)}</td>
                      <td className="td-mono" style={{ color: overdue ? 'var(--danger)' : undefined }}>{fmtDate(task.finish)}</td>
                      <td>
                        <div className="progress-mini">
                          <div className="progress-mini-bar">
                            <div className="progress-mini-fill" style={{
                              width: `${task.percentComplete}%`,
                              background: task.percentComplete >= 100 ? 'var(--success)' : overdue ? 'var(--danger)' : 'var(--accent)'
                            }}/>
                          </div>
                          <span className="td-mono" style={{ fontSize: 10 }}>{task.percentComplete}%</span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Splitter */}
          <div className={`splitter ${splitterActive ? 'active' : ''}`}
            onMouseDown={() => setSplitterActive(true)}/>

          {/* Gantt Chart */}
          <GanttChart
            tasks={visibleTasks}
            uidMap={projData.uidMap}
            minDate={projData.minDate}
            maxDate={projData.maxDate}
            zoom={zoom}
            showArrows={showArrows}
            tableScrollTop={tableScrollTop}
            onScrollSync={handleChartScrollSync}
            onTooltip={setTooltipInfo}
          />
        </div>
      )}

      {!isLoading && projData && subTab === 'dashboard' && <Dashboard project={projData}/>}
      {!isLoading && projData && subTab === 'resources' && <ResourcesView project={projData}/>}

      {/* Tooltip */}
      <Tooltip info={tooltipInfo}/>

      {/* Search */}
      {showSearch && <SearchModal projects={projects} onSelect={() => {}} onClose={() => setShowSearch(false)}/>}

      <div className="print-footer">BuildPlan Viewer — Bauvek · {new Date().toLocaleDateString('es-AR')}</div>
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
