<script>
"use strict";
const h = React.createElement;

// âââ XML MSPDI PARSER ââââââââââââââââââââââââââââââââââââââââââââââââ

function parseMSPDI(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, "text/xml");
  const ns = "http://schemas.microsoft.com/project";

  function q(el, tag) {
    const found = el.getElementsByTagNameNS(ns, tag)[0] || el.getElementsByTagName(tag)[0];
    return found ? found.textContent.trim() : "";
  }
  function qAll(el, tag) {
    let list = el.getElementsByTagNameNS(ns, tag);
    if (!list.length) list = el.getElementsByTagName(tag);
    return Array.from(list);
  }
  function qDate(el, tag) {
    const s = q(el, tag);
    return s ? new Date(s) : null;
  }
  function qNum(el, tag, def = 0) {
    const s = q(el, tag);
    return s ? Number(s) : def;
  }
  function qBool(el, tag) { return q(el, tag) === "1" || q(el, tag).toLowerCase() === "true"; }

  const root = doc.getElementsByTagNameNS(ns, "Project")[0] || doc.documentElement;

  // Calendars
  const calendars = {};
  qAll(root, "Calendar").forEach(cal => {
    const uid = qNum(cal, "CalendarUID");
    const weekDays = [];
    qAll(cal, "WeekDay").forEach(wd => {
      weekDays.push({
        dayType: qNum(wd, "DayType"),
        dayWorking: qBool(wd, "DayWorking")
      });
    });
    const exceptions = [];
    qAll(cal, "TimePeriod").forEach(tp => {
      const from = qDate(tp, "FromDate");
      const to = qDate(tp, "ToDate");
      if (from) exceptions.push({ from, to: to || from });
    });
    calendars[uid] = { uid, name: q(cal, "Name"), weekDays, exceptions };
  });

  const projectCalUID = qNum(root, "CalendarUID", 1);

  // Resources
  const resources = [];
  qAll(root, "Resource").forEach(res => {
    const uid = qNum(res, "ResourceUID", -1);
    if (uid < 0) return;
    const name = q(res, "Name");
    if (!name) return;
    resources.push({
      uid,
      name,
      type: qNum(res, "Type") === 0 ? "material" : "work",
      group: q(res, "Group"),
      maxUnits: qNum(res, "MaxUnits", 1),
      cost: qNum(res, "Cost")
    });
  });
  const resourceMap = {};
  resources.forEach(r => { resourceMap[r.uid] = r; });

  // Assignments
  const assignments = [];
  const taskAssignments = {};
  qAll(root, "Assignment").forEach(asgn => {
    const taskUID = qNum(asgn, "TaskUID");
    const resUID = qNum(asgn, "ResourceUID");
    if (resUID < 0) return;
    const a = {
      taskUid: taskUID,
      resourceUid: resUID,
      units: qNum(asgn, "Units", 1),
      work: parseDurationHours(q(asgn, "Work")),
      actualWork: parseDurationHours(q(asgn, "ActualWork")),
      remainingWork: parseDurationHours(q(asgn, "RemainingWork"))
    };
    assignments.push(a);
    if (!taskAssignments[taskUID]) taskAssignments[taskUID] = [];
    taskAssignments[taskUID].push(a);
  });

  // Tasks
  const depTypeMap = { "0": "FF", "1": "FS", "2": "SF", "3": "SS" };
  const tasks = [];
  const now = new Date();
  now.setHours(0, 0, 0, 0);

  qAll(root, "Task").forEach(t => {
    const uid = qNum(t, "TaskUID", -1);
    if (uid === 0) return; // skip project summary
    if (uid < 0) return;

    const start = qDate(t, "Start");
    const finish = qDate(t, "Finish");
    const pct = qNum(t, "PercentComplete");
    const isMilestone = qBool(t, "Milestone");
    const isSummary = qBool(t, "Summary");

    const predecessors = [];
    qAll(t, "PredecessorLink").forEach(pl => {
      predecessors.push({
        taskUid: qNum(pl, "PredecessorUID"),
        type: depTypeMap[q(pl, "Type")] || "FS",
        lagDays: qNum(pl, "LinkLag") / 4800
      });
    });

    const assignedResources = (taskAssignments[uid] || [])
      .map(a => resourceMap[a.resourceUid])
      .filter(Boolean)
      .map(r => r.name);

    const isOverdue = finish && finish < now && pct < 100 && !isSummary;

    tasks.push({
      uid,
      id: qNum(t, "ID"),
      name: q(t, "Name") || "(sin nombre)",
      wbs: q(t, "WBS"),
      outlineLevel: qNum(t, "OutlineLevel"),
      outlineNumber: q(t, "OutlineNumber"),
      start,
      finish,
      duration: parseDurationDays(q(t, "Duration")),
      percentComplete: pct,
      isMilestone,
      isSummary,
      predecessors,
      notes: q(t, "Notes"),
      priority: qNum(t, "Priority", 500),
      constraintType: qNum(t, "ConstraintType"),
      constraintDate: qDate(t, "ConstraintDate"),
      calendarUid: qNum(t, "CalendarUID") || null,
      isOverdue,
      assignedResources,
      children: [],
      collapsed: isSummary
    });
  });

  // Build tree
  const taskTree = buildTaskTree(tasks);

  // Stats
  const nonSummary = tasks.filter(t => !t.isSummary);
  const completed = nonSummary.filter(t => t.percentComplete >= 100).length;
  const overdue = nonSummary.filter(t => t.isOverdue).length;
  const inProgress = nonSummary.filter(t => t.percentComplete > 0 && t.percentComplete < 100).length;
  const pending = nonSummary.filter(t => t.percentComplete === 0 && !t.isMilestone).length;
  const milestones = tasks.filter(t => t.isMilestone);
  const totalDuration = nonSummary.reduce((s, t) => s + (t.duration || 1), 0);
  const weightedProgress = nonSummary.reduce((s, t) => s + t.percentComplete * (t.duration || 1), 0);
  const avgProgress = totalDuration > 0 ? Math.round(weightedProgress / totalDuration) : 0;

  const allDates = tasks.filter(t => t.start && t.finish).flatMap(t => [t.start, t.finish]);
  const minDate = allDates.length ? new Date(Math.min(...allDates.map(d => d.getTime()))) : new Date();
  const maxDate = allDates.length ? new Date(Math.max(...allDates.map(d => d.getTime()))) : new Date();

  const upcomingMilestones = milestones
    .filter(m => m.start && m.start > now && m.percentComplete < 100)
    .sort((a, b) => a.start - b.start)
    .slice(0, 10);

  return {
    id: hashStr(q(root, "Name") || "project"),
    fileName: "",
    name: q(root, "Name") || "Proyecto sin nombre",
    author: q(root, "Author"),
    startDate: qDate(root, "StartDate") || minDate,
    finishDate: qDate(root, "FinishDate") || maxDate,
    lastSaved: qDate(root, "LastSaved"),
    calendar: calendars[projectCalUID] || { uid: projectCalUID, name: "Standard", weekDays: [], exceptions: [] },
    calendars,
    tasks,
    taskTree,
    resources,
    assignments,
    stats: {
      totalTasks: nonSummary.length,
      completed,
      inProgress,
      pending,
      overdue,
      avgProgress,
      milestones: milestones.length,
      upcomingMilestones,
      minDate,
      maxDate
    }
  };
}

function parseDurationDays(iso) {
  if (!iso) return 0;
  const m = iso.match(/PT(\d+)H(\d+)M(\d+)S/);
  if (!m) return 0;
  return (parseInt(m[1]) + parseInt(m[2]) / 60) / 8;
}
function parseDurationHours(iso) {
  if (!iso) return 0;
  const m = iso.match(/PT(\d+)H(\d+)M(\d+)S/);
  if (!m) return 0;
  return parseInt(m[1]) + parseInt(m[2]) / 60;
}

function buildTaskTree(tasks) {
  const tree = [];
  const stack = [{ level: 0, children: tree }];
  tasks.forEach(t => {
    while (stack.length > 1 && stack[stack.length - 1].level >= t.outlineLevel) stack.pop();
    const parent = stack[stack.length - 1];
    t.children = [];
    parent.children.push(t);
    stack.push({ level: t.outlineLevel, children: t.children });
  });
  return tree;
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return "p" + Math.abs(h).toString(36);
}

function fmtDate(d) {
  if (!d) return "â";
  return d.toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" });
}
function fmtDateShort(d) {
  if (!d) return "";
  return d.toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

// âââ REACT COMPONENTS ââââââââââââââââââââââââââââââââââââââââââââââââ

const { useState, useRef, useEffect, useCallback, useMemo } = React;

// ââ App Shell ââ
function App() {
  const [projects, setProjects] = useState([]);
  const [activeTab, setActiveTab] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [manifest, setManifest] = useState(null);
  const [manifestLoading, setManifestLoading] = useState(true);
  const [loadingFile, setLoadingFile] = useState(null);

  // Try to fetch manifest on mount (works on GitHub Pages, fails locally â fallback to upload)
  useEffect(() => {
    fetch("data/manifest.json")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(m => { setManifest(m); setManifestLoading(false); })
      .catch(() => { setManifest(null); setManifestLoading(false); });
  }, []);

  // Load a project from manifest by filename
  const loadFromManifest = useCallback((entry) => {
    setLoadingFile(entry.file);
    fetch("data/projects/" + entry.file)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(xml => {
        const parsed = parseMSPDI(xml);
        parsed.fileName = entry.file;
        parsed.id = hashStr(entry.file);
        addProject(parsed);
        setLoadingFile(null);
      })
      .catch(err => {
        console.error("Error loading " + entry.file, err);
        alert("Error al cargar " + entry.file);
        setLoadingFile(null);
      });
  }, []);

  const addProject = useCallback((parsed) => {
    setProjects(prev => {
      const exists = prev.findIndex(p => p.name === parsed.name);
      if (exists >= 0) {
        const next = [...prev];
        next[exists] = parsed;
        return next;
      }
      return [...prev, parsed];
    });
    setActiveTab(parsed.id);
  }, []);

  const closeProject = useCallback((id) => {
    setProjects(prev => prev.filter(p => p.id !== id));
    setActiveTab(prev => {
      if (prev === id) {
        const remaining = projects.filter(p => p.id !== id);
        return remaining.length ? remaining[0].id : null;
      }
      return prev;
    });
  }, [projects]);

  const handleFiles = useCallback((files) => {
    Array.from(files).forEach(file => {
      if (!file.name.toLowerCase().endsWith(".xml")) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = parseMSPDI(e.target.result);
          parsed.fileName = file.name;
          parsed.id = hashStr(file.name);
          addProject(parsed);
        } catch (err) {
          console.error("Error parsing XML:", err);
          alert("Error al parsear " + file.name + ": " + err.message);
        }
      };
      reader.readAsText(file);
    });
  }, [addProject]);

  const handleDrop = useCallback((e) => {
    e.preventDefault();
    setDragOver(false);
    handleFiles(e.dataTransfer.files);
  }, [handleFiles]);

  const activeProject = projects.find(p => p.id === activeTab);

  // No projects loaded: show welcome + manifest
  if (!projects.length) {
    const hasManifest = manifest && manifest.projects && manifest.projects.length > 0;
    return h("div", {
      className: "flex flex-col items-center justify-center h-screen p-8",
      onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
      onDragLeave: () => setDragOver(false),
      onDrop: handleDrop,
      style: { background: "var(--bg-primary)" }
    },
      h("div", { className: "flex flex-col items-center w-full max-w-2xl" },
        h("div", { style: { fontSize: "3rem", marginBottom: "0.75rem" } }, "ð"),
        h("h1", { className: "text-2xl font-bold mb-1", style: { color: "var(--text-primary)" } }, "BuildPlan Viewer"),
        h("p", { className: "mb-6 text-center text-sm", style: { color: "var(--text-secondary)" } },
          "Visualizador de cronogramas de Microsoft Project"),

        // Manifest projects list
        hasManifest && h("div", { className: "w-full mb-6" },
          h("h2", { className: "text-sm font-semibold mb-3", style: { color: "var(--text-secondary)" } },
            "Proyectos disponibles (" + manifest.projects.length + ")"),
          h("div", {
            className: "rounded-lg overflow-hidden",
            style: { border: "1px solid var(--border)", background: "var(--bg-secondary)" }
          },
            manifest.projects.map((entry, i) =>
              h("button", {
                key: entry.file,
                className: "w-full flex items-center gap-3 px-4 py-3 text-left transition-colors",
                style: {
                  background: "transparent",
                  borderTop: i > 0 ? "1px solid var(--border)" : "none",
                  cursor: loadingFile ? "wait" : "pointer",
                  opacity: loadingFile && loadingFile !== entry.file ? 0.5 : 1
                },
                disabled: !!loadingFile,
                onClick: () => loadFromManifest(entry),
                onMouseOver: (e) => { e.currentTarget.style.background = "var(--bg-hover)"; },
                onMouseOut: (e) => { e.currentTarget.style.background = "transparent"; }
              },
                h("div", {
                  className: "w-8 h-8 rounded flex items-center justify-center shrink-0 text-sm",
                  style: { background: "var(--accent-light)", color: "var(--accent)" }
                }, loadingFile === entry.file ? "â³" : "ð"),
                h("div", { className: "flex-1 min-w-0" },
                  h("div", { className: "font-medium text-sm truncate", style: { color: "var(--text-primary)" } }, entry.name),
                  h("div", { className: "text-xs mt-0.5", style: { color: "var(--text-tertiary)" } },
                    entry.file + " Â· " + entry.sizeKB + " KB")
                ),
                h("div", { className: "text-xs shrink-0 mono", style: { color: "var(--text-tertiary)" } },
                  entry.lastModified ? new Date(entry.lastModified).toLocaleDateString("es-AR", { day: "2-digit", month: "short" }) : "")
              )
            )
          )
        ),

        // Loading state
        manifestLoading && h("div", { className: "mb-6 text-sm", style: { color: "var(--text-tertiary)" } }, "Buscando proyectos..."),

        // Upload fallback
        h("div", { className: `drop-zone flex flex-col items-center p-8 w-full ${dragOver ? "drag-over" : ""}` },
          h("p", { className: "text-sm mb-3", style: { color: "var(--text-secondary)" } },
            hasManifest ? "O cargÃ¡ un XML local para previsualizar:" : "ArrastrÃ¡ archivos XML acÃ¡ o hacÃ© clic para seleccionar"),
          h("label", {
            className: "px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition-colors",
            style: { background: hasManifest ? "var(--bg-tertiary)" : "var(--accent)", color: hasManifest ? "var(--text-primary)" : "#fff" }
          },
            "Seleccionar archivos XML",
            h("input", {
              type: "file", accept: ".xml", multiple: true, className: "hidden",
              onChange: (e) => handleFiles(e.target.files)
            })
          )
        )
      )
    );
  }

  return h("div", { className: "flex flex-col h-screen", style: { background: "var(--bg-primary)" } },
    // Header bar
    h("div", {
      className: "flex items-center gap-1 px-3 shrink-0",
      style: { background: "var(--bg-secondary)", borderBottom: "1px solid var(--border)", height: "42px" }
    },
      h("span", { className: "font-semibold text-sm mr-3", style: { color: "var(--text-primary)" } }, "ð BuildPlan"),

// ââ Resources View ââ
function ResourcesView({ project }) {
  const resourceStats = useMemo(() => {
    const map = {};
    project.assignments.forEach(a => {
      const r = project.resources.find(r => r.uid === a.resourceUid);
      if (!r) return;
      if (!map[r.uid]) map[r.uid] = { ...r, taskCount: 0, totalWork: 0, actualWork: 0 };
      map[r.uid].taskCount++;
      map[r.uid].totalWork += a.work;
      map[r.uid].actualWork += a.actualWork;
    });
    return Object.values(map).sort((a, b) => b.taskCount - a.taskCount);

// ââ Gantt View (Table + Chart) ââ
const ROW_H = 28;
const ZOOM_LEVELS = { day: 30, week: 10, month: 2.5, quarter: 0.8 };

function GanttView({ project }) {
  const [zoom, setZoom] = useState("week");
  const [tableWidth, setTableWidth] = useState(480);
  const [dragging, setDragging] = useState(false);
  const [search, setSearch] = useState("");
  const [collapsedSet, setCollapsedSet] = useState(() => {
    const set = new Set();
    project.tasks.filter(t => t.isSummary).forEach(t => set.add(t.uid));
    return set;
  });

  const tableRef = useRef(null);
  const ganttRef = useRef(null);

  // Flatten visible tasks
  const flatTasks = useMemo(() => {
    const result = [];
    const searchLower = search.toLowerCase();
    function walk(tasks, hidden) {
      tasks.forEach(t => {
        const matchesSearch = !search || t.name.toLowerCase().includes(searchLower);
        if (!hidden && (matchesSearch || !search)) result.push(t);
        const isCollapsed = collapsedSet.has(t.uid);
        if (t.children.length) walk(t.children, hidden || isCollapsed || (search && !matchesSearch));
      });
    }
    walk(project.taskTree, false);
    return result;
  }, [project.taskTree, collapsedSet, search]);

  const toggleCollapse = useCallback((uid) => {
    setCollapsedSet(prev => {
      const next = new Set(prev);
      next.has(uid) ? next.delete(uid) : next.add(uid);
      return next;
    });
  }, []);

  // Gantt time calculations
  const pxPerDay = ZOOM_LEVELS[zoom];
  const startDate = new Date(project.stats.minDate);
  startDate.setDate(startDate.getDate() - 7);
  const endDate = new Date(project.stats.maxDate);
  endDate.setDate(endDate.getDate() + 14);
  const totalDays = daysBetween(startDate, endDate);
  const ganttWidth = Math.max(totalDays * pxPerDay, 800);

  const dateToX = useCallback((d) => {
    if (!d) return 0;
    return daysBetween(startDate, d) * pxPerDay;
  }, [startDate, pxPerDay]);

  // Sync scroll
  const syncScroll = useCallback((source) => {
    if (source === "table" && tableRef.current && ganttRef.current) {
      ganttRef.current.scrollTop = tableRef.current.scrollTop;
    } else if (source === "gantt" && ganttRef.current && tableRef.current) {
      tableRef.current.scrollTop = ganttRef.current.scrollTop;
    }
  }, []);

  // Splitter drag
  const onSplitterMouseDown = useCallback((e) => {
    e.preventDefault();
    setDragging(true);
    const startX = e.clientX;
    const startW = tableWidth;
    const onMove = (e) => setTableWidth(Math.max(200, Math.min(900, startW + e.clientX - startX)));
    const onUp = () => { setDragging(false); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }, [tableWidth]);

  // Scroll to today on mount
  useEffect(() => {
    if (ganttRef.current) {
      const todayX = dateToX(new Date());
      ganttRef.current.scrollLeft = Math.max(0, todayX - 200);
    }
  }, [zoom]);

  // Today line
  const todayX = dateToX(new Date());

  // Time header
  const timeHeaders = useMemo(() => {
    const headers = [];
    const d = new Date(startDate);
    if (zoom === "day") {
      while (d <= endDate) {
        headers.push({ date: new Date(d), label: d.getDate().toString(), x: dateToX(d), w: pxPerDay });
        d.setDate(d.getDate() + 1);
      }
    } else if (zoom === "week") {
      while (d <= endDate) {
        const weekStart = new Date(d);
        headers.push({ date: weekStart, label: fmtDateShort(weekStart), x: dateToX(weekStart), w: pxPerDay * 7 });
        d.setDate(d.getDate() + 7);
      }
    } else if (zoom === "month") {
      d.setDate(1);
      while (d <= endDate) {
        const mStart = new Date(d);
        const daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        headers.push({
          date: mStart,
          label: d.toLocaleDateString("es-AR", { month: "short", year: "2-digit" }),
          x: dateToX(mStart),
          w: daysInMonth * pxPerDay
        });
        d.setMonth(d.getMonth() + 1);
      }
    } else {
      d.setMonth(Math.floor(d.getMonth() / 3) * 3, 1);
      while (d <= endDate) {
        const qStart = new Date(d);
        const qEnd = new Date(d.getFullYear(), d.getMonth() + 3, 0);
        const qDays = daysBetween(qStart, qEnd);
        headers.push({
          date: qStart,
          label: "Q" + (Math.floor(d.getMonth() / 3) + 1) + " " + d.getFullYear().toString().slice(2),
          x: dateToX(qStart),
          w: qDays * pxPerDay
        });
        d.setMonth(d.getMonth() + 3);
      }
    }
    return headers;
  }, [startDate, endDate, zoom, pxPerDay, dateToX]);

  const totalHeight = flatTasks.length * ROW_H;

  return h("div", { className: "flex-1 flex flex-col overflow-hidden" },
    // Toolbar
    h("div", {
      className: "flex items-center gap-2 px-3 py-1.5 shrink-0",
      style: { background: "var(--bg-secondary)", borderBottom: "1px solid var(--border)" }
    },
      h("input", {
        type: "text",
        placeholder: "Buscar tareas... (Ctrl+K)",
        className: "px-2.5 py-1 rounded text-xs w-48 outline-none",
        style: { background: "var(--bg-tertiary)", color: "var(--text-primary)", border: "1px solid var(--border)" },
        value: search,
        onChange: (e) => setSearch(e.target.value)
      }),
      h("div", { className: "flex-1" }),
      h("span", { className: "text-xs", style: { color: "var(--text-tertiary)" } },
        flatTasks.length + " tareas"),
      h("div", { className: "flex gap-0.5 ml-2" },
        ["day", "week", "month", "quarter"].map(z =>
          h("button", {
            key: z,
            className: "px-2 py-1 rounded text-xs font-medium transition-colors",
            style: {
              background: zoom === z ? "var(--accent)" : "transparent",
              color: zoom === z ? "#fff" : "var(--text-secondary)"
            },
            onClick: () => setZoom(z)
          }, z === "day" ? "DÃ­a" : z === "week" ? "Sem" : z === "month" ? "Mes" : "Trim")
        )
      ),
      h("button", {
        className: "px-2 py-1 rounded text-xs",
        style: { color: "var(--text-secondary)" },
        onClick: () => setCollapsedSet(new Set()),
        title: "Expandir todo"
      }, "â"),
      h("button", {
        className: "px-2 py-1 rounded text-xs",
        style: { color: "var(--text-secondary)" },
        onClick: () => {
          const set = new Set();
          project.tasks.filter(t => t.isSummary).forEach(t => set.add(t.uid));
          setCollapsedSet(set);
        },
        title: "Colapsar todo"
      }, "â")
    ),
    // Gantt body
    h("div", { className: "flex flex-1 overflow-hidden" },
      // Table
      h("div", {
        ref: tableRef,
        className: "overflow-auto gantt-scroll-sync shrink-0",
        style: { width: tableWidth + "px" },
        onScroll: () => syncScroll("table")
      },
        // Table header
        h("div", {
          className: "flex items-center text-xs font-semibold sticky top-0 z-10",
          style: {
            height: "32px",
            background: "var(--bg-secondary)",
            borderBottom: "1px solid var(--border)",
            color: "var(--text-tertiary)",
            minWidth: tableWidth + "px"
          }
        },
          h("div", { className: "w-12 shrink-0 px-2 text-center" }, "WBS"),
          h("div", { className: "flex-1 px-2", style: { minWidth: "180px" } }, "Nombre"),
          h("div", { className: "w-20 shrink-0 px-1 text-center" }, "Inicio"),
          h("div", { className: "w-20 shrink-0 px-1 text-center" }, "Fin"),
          h("div", { className: "w-12 shrink-0 px-1 text-center" }, "%"),
          h("div", { className: "w-24 shrink-0 px-1" }, "Recurso")
        ),
        // Table rows
        h("div", { style: { minWidth: tableWidth + "px" } },
          flatTasks.map((t, i) =>
            h("div", {
              key: t.uid,
              className: `task-row flex items-center text-xs ${t.isOverdue ? "overdue" : ""}`,

              ),
              h("div", { className: "w-20 shrink-0 px-1 text-center mono", style: { fontSize: "0.7rem" } }, fmtDateShort(t.start)),
              h("div", { className: "w-20 shrink-0 px-1 text-center mono", style: { fontSize: "0.7rem", color: t.isOverdue ? "var(--danger)" : "inherit" } }, fmtDateShort(t.finish)),
              h("div", { className: "w-12 shrink-0 px-1 text-center mono", style: { fontSize: "0.7rem" } },
                t.percentComplete > 0 ? t.percentComplete + "%" : ""),
              h("div", {
                className: "w-24 shrink-0 px-1 truncate",
                style: { fontSize: "0.7rem", color: "var(--text-secondary)" },
                title: t.assignedResources.join(", ")
              }, t.assignedResources[0] || "")
            )
          )
        )
      ),
      // Splitter
      h("div", {
        className: `splitter-handle ${dragging ? "active" : ""}`,
        onMouseDown: onSplitterMouseDown
      }),
      // Gantt chart
      h("div", {
        ref: ganttRef,
        className: "flex-1 overflow-auto gantt-scroll-sync",
        onScroll: () => syncScroll("gantt")
      },
        // Time header
        h("div", {
          className: "sticky top-0 z-10",
          style: { height: "32px", width: ganttWidth + "px", background: "var(--bg-secondary)", borderBottom: "1px solid var(--border)" }
        },
          h("svg", { width: ganttWidth, height: 32, style: { display: "block" } },
            timeHeaders.map((th, i) =>
              h("g", { key: i },
                h("rect", { x: th.x, y: 0, width: th.w, height: 32, fill: "none", stroke: "var(--border)", strokeWidth: 0.5 }),
                h("text", {
                  x: th.x + th.w / 2, y: 20,
                  textAnchor: "middle",
                  style: { fontSize: "10px", fill: "var(--text-tertiary)", fontFamily: "'JetBrains Mono', monospace" }
                }, th.label)
              )
            )
          )
        ),
        // Gantt bars
        h("svg", {
          width: ganttWidth,
          height: Math.max(totalHeight, 400),
          style: { display: "block" }
        },
          // Grid lines
          timeHeaders.map((th, i) =>
            h("line", {
              key: "g" + i,
              x1: th.x, y1: 0, x2: th.x, y2: totalHeight,
              stroke: "var(--gantt-grid-strong)", strokeWidth: 0.5
            })
          ),
          // Row backgrounds
          flatTasks.map((t, i) =>
            h("rect", {
              key: "bg" + t.uid,
              x: 0, y: i * ROW_H, width: ganttWidth, height: ROW_H,
              fill: t.isOverdue ? "var(--gantt-overdue-bg)" : i % 2 === 0 ? "transparent" : "var(--gantt-grid)"
            })
          ),
          // Today line
          todayX > 0 && todayX < ganttWidth && h("line", {
            x1: todayX, y1: 0, x2: todayX, y2: totalHeight,
            stroke: "var(--gantt-today)", strokeWidth: 1.5, strokeDasharray: "4,3", opacity: 0.7
          }),
          // Bars
          flatTasks.map((t, i) => {
            if (!t.start || !t.finish) return null;
            const x = dateToX(t.start);
            const w = Math.max(dateToX(t.finish) - x, 2);
            const y = i * ROW_H + 4;
            const barH = ROW_H - 8;

            if (t.isMilestone) {
              const cx = x;
              const cy = y + barH / 2;
              const s = barH / 2 - 1;
              return h("g", { key: "bar" + t.uid },
                h("polygon", {
                  points: `${cx},${cy - s} ${cx + s},${cy} ${cx},${cy + s} ${cx - s},${cy}`,
                  fill: "var(--gantt-milestone)",
                  stroke: "var(--bg-primary)", strokeWidth: 1
                }),
                h("title", null, `â¦ ${t.name}\n${fmtDate(t.start)}`)
              );
            }

            if (t.isSummary) {
              return h("g", { key: "bar" + t.uid },
                h("rect", { x, y: y + barH - 5, width: w, height: 5, rx: 1, fill: "var(--gantt-summary)" }),
                // Start cap
                h("polygon", { points: `${x},${y + barH - 5} ${x},${y + barH + 2} ${x + 5},${y + barH - 5}`, fill: "var(--gantt-summary)" }),
                // End cap
                h("polygon", { points: `${x + w},${y + barH - 5} ${x + w},${y + barH + 2} ${x + w - 5},${y + barH - 5}`, fill: "var(--gantt-summary)" }),
                h("title", null, `${t.name}\n${fmtDate(t.start)} â ${fmtDate(t.finish)}\n${t.percentComplete}%`)
              );
            }

            const progressW = w * t.percentComplete / 100;
            return h("g", { key: "bar" + t.uid },
              h("rect", { x, y, width: w, height: barH, rx: 3, fill: t.isOverdue ? "var(--gantt-critical)" : "var(--gantt-bar)", opacity: 0.3 }),
              progressW > 0 && h("rect", { x, y, width: progressW, height: barH, rx: 3, fill: t.isOverdue ? "var(--gantt-critical)" : "var(--gantt-bar)" }),
              h("title", null, `${t.name}\n${fmtDate(t.start)} â ${fmtDate(t.finish)}\n${t.percentComplete}%${t.assignedResources.length ? "\n" + t.assignedResources.join(", ") : ""}${t.isOverdue ? "\nâ  VENCIDA" : ""}`)
            );
          }),
          // Today label
          todayX > 0 && todayX < ganttWidth && h("text", {
            x: todayX + 4, y: 12,
            style: { fontSize: "9px", fill: "var(--gantt-today)", fontWeight: 600, fontFamily: "'JetBrains Mono', monospace" }
          }, "HOY")
        )
      )
    )
  );
}

// ââ Mount ââ
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") {
    e.preventDefault();
    const input = document.querySelector('input[placeholder*="Buscar"]');
    if (input) input.focus();
  }
});
</script>
</body>
</html>
