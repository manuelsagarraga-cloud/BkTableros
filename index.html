<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;

/* ═══════ Enterprise field mapping (from XML analysis) ═══════ */
const ENT_FIELD_MAP={
  'b408001':{name:'Salud',type:'guid'},
  'b408007':{name:'Tableros',type:'guid'},
  'b408008':{name:'Nivel',type:'guid'},
  'b40800a':{name:'Rubro',type:'guid'},
  'b40800c':{name:'N° Item',type:'text'},
  'b40800e':{name:'Contratista',type:'text'},
  'b608000':{name:'Depto. Proyectos',type:'guid'},
  'b608003':{name:'Zona',type:'guid'},
  'b608004':{name:'Estado Emprendimiento',type:'guid'},
  'b60800b':{name:'Jefe Obra',type:'guid'},
};

/* Also build reverse map: FieldID decimal → hex tag */
const FIELD_ID_TO_HEX={};
for(const[hex,info] of Object.entries(ENT_FIELD_MAP)){
  FIELD_ID_TO_HEX[parseInt(hex,16)]=hex;
}

/* ═══════ PARSER MSPDI ═══════ */
function parseMSPDI(xmlText){
  const parser=new DOMParser();
  const doc=parser.parseFromString(xmlText,'text/xml');
  const ns=doc.documentElement.namespaceURI;
  const N=ns?ns:'';
  function qn(tag){return ns?`{${ns}}${tag}`:tag}
  function getEl(p,tag){
    const el=ns?p.getElementsByTagNameNS(ns,tag)[0]:p.getElementsByTagName(tag)[0];
    return el?el.textContent.trim():'';
  }
  function getEls(p,tag){return ns?p.getElementsByTagNameNS(ns,tag):p.getElementsByTagName(tag)}

  /* ExtendedAttribute definitions */
  const eaDefs={};
  for(const ea of getEls(doc,'ExtendedAttribute')){
    const fid=getEl(ea,'FieldID'),fname=getEl(ea,'FieldName'),alias=getEl(ea,'Alias');
    if(fid) eaDefs[fid]={fieldName:fname,alias:alias||fname};
  }

  /* Build lookup: FieldID → hex enterprise tag name */
  const fidToHex={};
  for(const fid of Object.keys(eaDefs)){
    const hex=parseInt(fid).toString(16);
    fidToHex[fid]=hex;
  }

  /* Resources */
  const resources={};
  for(const r of getEls(doc,'Resource')){
    const uid=getEl(r,'UID'),name=getEl(r,'Name');
    if(uid&&name) resources[uid]={uid,name};
  }

  /* Assignments */
  const taskResMap={};
  for(const a of getEls(doc,'Assignment')){
    const tUid=getEl(a,'TaskUID'),rUid=getEl(a,'ResourceUID');
    if(tUid&&rUid&&resources[rUid]){
      if(!taskResMap[tUid]) taskResMap[tUid]=[];
      taskResMap[tUid].push(resources[rUid].name);
    }
  }

  /* Tasks */
  const tasks=[];
  for(const t of getEls(doc,'Task')){
    const uid=getEl(t,'UID');
    if(uid==='0') continue;
    const name=getEl(t,'Name')||'(sin nombre)';
    const start=getEl(t,'Start');
    const finish=getEl(t,'Finish');
    const pct=parseInt(getEl(t,'PercentComplete')||'0',10);
    const outLvl=parseInt(getEl(t,'OutlineLevel')||'0',10);
    const isSummary=getEl(t,'Summary')==='1';
    const isMilestone=getEl(t,'Milestone')==='1';
    const wbs=getEl(t,'WBS');
    const duration=getEl(t,'Duration');
    const critical=getEl(t,'Critical')==='1';

    /* Predecessors */
    const predecessors=[];
    for(const p of getEls(t,'PredecessorLink')){
      const predUid=getEl(p,'PredecessorUID');
      const typeVal=getEl(p,'Type')||'1';
      const lagStr=getEl(p,'LinkLag')||'0';
      const lagFmt=getEl(p,'LagFormat')||'7';
      const typeMap={'0':'FF','1':'FS','2':'SF','3':'SS'};
      let lagDays=parseInt(lagStr,10);
      if(lagFmt==='7') lagDays=lagDays/10;
      else if(['3','5','6'].includes(lagFmt)) lagDays=lagDays/4800;
      predecessors.push({taskUid:predUid,type:typeMap[typeVal]||'FS',lagDays:Math.round(lagDays)});
    }

    /* Baselines */
    const baselines=[];
    for(const b of getEls(t,'Baseline')){
      const bNum=getEl(b,'Number'),bStart=getEl(b,'Start'),bFinish=getEl(b,'Finish');
      if(bStart||bFinish) baselines.push({number:parseInt(bNum||'0',10),start:bStart?new Date(bStart):null,finish:bFinish?new Date(bFinish):null});
    }

    /* Enterprise custom fields — read hex-named elements */
    const enterprise={};
    for(const[hexTag,info] of Object.entries(ENT_FIELD_MAP)){
      // Try to find the element directly
      const el=ns?t.getElementsByTagNameNS(ns,hexTag)[0]:t.getElementsByTagName(hexTag)[0];
      if(el&&el.textContent){
        const val=el.textContent.trim();
        if(val&&val!=='None'){
          enterprise[info.name]={value:val,isGuid:info.type==='guid'};
        }
      }
    }

    /* Standard ExtendedAttribute values (for non-enterprise exports) */
    for(const ea of getEls(t,'ExtendedAttribute')){
      const fid=getEl(ea,'FieldID'),val=getEl(ea,'Value');
      if(fid&&val){
        const def=eaDefs[fid];
        const label=def?(def.alias||def.fieldName):`Field${fid}`;
        enterprise[label]={value:val,isGuid:false};
      }
    }

    /* Parse duration to readable format */
    let durationDays=0;
    if(duration){
      const m=duration.match(/PT(\d+)H/);
      if(m) durationDays=Math.round(parseInt(m[1])/8); // 8h workday
    }

    tasks.push({
      uid,name,
      start:start?new Date(start):null,
      finish:finish?new Date(finish):null,
      duration,durationDays,
      percentComplete:pct,outlineLevel:outLvl,
      isSummary,isMilestone,wbs,critical,
      resources:taskResMap[uid]||[],
      predecessors,baselines,enterprise,
      children:[],expanded:true
    });
  }

  /* Hierarchy */
  const rootTasks=[];
  const stack=[];
  for(const task of tasks){
    while(stack.length>0&&stack[stack.length-1].outlineLevel>=task.outlineLevel) stack.pop();
    if(stack.length>0){stack[stack.length-1].children.push(task);task.parent=stack[stack.length-1]}
    else rootTasks.push(task);
    if(task.isSummary) stack.push(task);
  }

  function flattenTasks(list,depth=0){
    const result=[];
    for(const t of list){t.depth=depth;result.push(t);if(t.children.length>0) result.push(...flattenTasks(t.children,depth+1))}
    return result;
  }
  const flatTasks=flattenTasks(rootTasks);
  const uidMap={};
  for(const t of flatTasks) uidMap[t.uid]=t;

  let minDate=null,maxDate=null;
  for(const t of flatTasks){
    if(t.start&&(!minDate||t.start<minDate)) minDate=t.start;
    if(t.finish&&(!maxDate||t.finish>maxDate)) maxDate=t.finish;
    for(const b of t.baselines){
      if(b.start&&(!minDate||b.start<minDate)) minDate=b.start;
      if(b.finish&&(!maxDate||b.finish>maxDate)) maxDate=b.finish;
    }
  }

  const resourceList=[...new Set(flatTasks.flatMap(t=>t.resources))].sort();
  const hasBaselines=flatTasks.some(t=>t.baselines.length>0);

  /* Collect enterprise fields that have text data */
  const entFieldsWithData=new Set();
  for(const t of flatTasks){
    for(const[k,v] of Object.entries(t.enterprise)){
      if(!v.isGuid) entFieldsWithData.add(k);
    }
  }

  /* Collect unique contractors */
  const contractors=new Set();
  for(const t of flatTasks){
    const c=t.enterprise['Contratista'];
    if(c&&!c.isGuid&&c.value) contractors.add(c.value);
  }

  return{
    tasks:flatTasks,rootTasks,uidMap,
    resources:resourceList,
    rawResources:Object.values(resources),
    minDate,maxDate,hasBaselines,
    entFieldsWithData:[...entFieldsWithData],
    contractors:[...contractors].sort()
  };
}

/* ═══════ Utilities ═══════ */
function fmtDate(d){if(!d) return '—';return d.toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'2-digit'})}
function daysBetween(a,b){if(!a||!b) return 0;return Math.round((b-a)/86400000)}
function isOverdue(t){if(!t.finish||t.percentComplete>=100||t.isSummary) return false;return t.finish<new Date()}
function getStatus(t){if(t.percentComplete>=100) return 'completed';if(isOverdue(t)) return 'overdue';if(t.percentComplete>0) return 'in_progress';return 'pending'}
function statusColor(s){switch(s){case 'completed':return 'var(--success)';case 'overdue':return 'var(--danger)';case 'in_progress':return 'var(--warning)';default:return 'var(--text-tertiary)'}}
function statusLabel(s){switch(s){case 'completed':return 'Completada';case 'overdue':return 'Vencida';case 'in_progress':return 'En curso';default:return 'Pendiente'}}
function fmtDuration(d){if(!d) return '—';const m=d.match(/PT(\d+)H/);if(!m) return d;const h=parseInt(m[1]);const days=Math.round(h/8);return days===1?'1 día':`${days} días`}

/* ═══════ Theme ═══════ */
function useTheme(){
  const[theme,setTheme]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
  return[theme,useCallback(()=>setTheme(t=>t==='light'?'dark':'light'),[])];
}

/* ═══════ Zoom ═══════ */
const ZOOM={day:{label:'Día',dayW:28},week:{label:'Semana',dayW:8},month:{label:'Mes',dayW:2.5},quarter:{label:'Trim.',dayW:.8}};

/* ═══════ GANTT SVG ═══════ */
function GanttChart({tasks,minDate,maxDate,zoom,showArrows,showBaseline,scrollTopRef,onTooltip}){
  const containerRef=useRef(null);
  const isScrollingRef=useRef(false);
  const rowH=28,headerH=44;
  const dayW=ZOOM[zoom].dayW;
  const padB=zoom==='day'?3:zoom==='week'?7:14;
  const padA=zoom==='day'?7:zoom==='week'?14:30;

  const chartStart=useMemo(()=>{const d=new Date(minDate||new Date());d.setDate(d.getDate()-padB);return d},[minDate,padB]);
  const chartEnd=useMemo(()=>{const d=new Date(maxDate||new Date());d.setDate(d.getDate()+padA);return d},[maxDate,padA]);
  const totalDays=daysBetween(chartStart,chartEnd);
  const totalW=Math.max(totalDays*dayW,600);
  const totalH=tasks.length*rowH;
  const dateToX=useCallback(date=>{if(!date)return 0;return daysBetween(chartStart,date)*dayW},[chartStart,dayW]);

  const handleScroll=useCallback(e=>{if(isScrollingRef.current)return;scrollTopRef.current={value:e.target.scrollTop,source:'chart'}},[scrollTopRef]);
  useEffect(()=>{let raf;const sync=()=>{const el=containerRef.current;if(el&&scrollTopRef.current?.source==='table'){isScrollingRef.current=true;el.scrollTop=scrollTopRef.current.value;scrollTopRef.current.source=null;requestAnimationFrame(()=>{isScrollingRef.current=false})};raf=requestAnimationFrame(sync)};raf=requestAnimationFrame(sync);return()=>cancelAnimationFrame(raf)},[scrollTopRef]);

  const today=new Date();const todayX=dateToX(today);const showToday=today>=chartStart&&today<=chartEnd;

  /* Grid */
  const grid=useMemo(()=>{
    const lines=[],h1=[],h2=[];const d=new Date(chartStart);
    if(zoom==='day'){while(d<=chartEnd){const x=dateToX(d);lines.push({x,we:d.getDay()===0||d.getDay()===6,maj:d.getDay()===1});h2.push({x,w:dayW,label:d.getDate().toString()});if(d.getDate()===1||(d.getDay()===1&&h1.length===0))h1.push({x,label:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});d.setDate(d.getDate()+1)}}
    else if(zoom==='week'){let lm=-1;while(d<=chartEnd){const x=dateToX(d);if(d.getDay()===1||d.getTime()===chartStart.getTime()){lines.push({x,maj:d.getDate()<=7});h2.push({x,w:dayW*7,label:d.getDate().toString()})}if(d.getMonth()!==lm){h1.push({x,label:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});lm=d.getMonth()}d.setDate(d.getDate()+1)}}
    else if(zoom==='month'){let ly=-1;while(d<=chartEnd){if(d.getDate()===1){const x=dateToX(d);lines.push({x,maj:d.getMonth()===0});const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h2.push({x,w:dim*dayW,label:d.toLocaleDateString('es-AR',{month:'short'})});if(d.getFullYear()!==ly){h1.push({x,label:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    else{let ly=-1;while(d<=chartEnd){if(d.getDate()===1){const x=dateToX(d);if(d.getMonth()%3===0){lines.push({x,maj:d.getMonth()===0});h2.push({x,w:90*dayW,label:`T${Math.floor(d.getMonth()/3)+1}`})}if(d.getFullYear()!==ly){h1.push({x,label:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    return{lines,h1,h2};
  },[chartStart,chartEnd,zoom,dayW,dateToX]);

  /* Bars */
  const barPos=useMemo(()=>{const map={};tasks.forEach((task,i)=>{const y=i*rowH,cy=y+rowH/2;if(task.isMilestone){const mx=dateToX(task.start||task.finish);map[task.uid]={x:mx,y,cy,w:0,startX:mx,endX:mx,ms:true}}else if(task.start&&task.finish){const x1=dateToX(task.start),x2=dateToX(task.finish),w=Math.max(x2-x1,2);map[task.uid]={x:x1,y,cy,w,startX:x1,endX:x1+w,ms:false}}});return map},[tasks,dateToX]);

  /* Arrows */
  const arrows=useMemo(()=>{if(!showArrows)return[];const res=[];for(const task of tasks){for(const pred of task.predecessors){const fp=barPos[pred.taskUid],tp=barPos[task.uid];if(!fp||!tp)continue;let fx,fy,tx,ty;switch(pred.type){case 'FS':fx=fp.endX;fy=fp.cy;tx=tp.startX;ty=tp.cy;break;case 'FF':fx=fp.endX;fy=fp.cy;tx=tp.endX;ty=tp.cy;break;case 'SS':fx=fp.startX;fy=fp.cy;tx=tp.startX;ty=tp.cy;break;default:fx=fp.startX;fy=fp.cy;tx=tp.endX;ty=tp.cy}const g=8;let path;if(pred.type==='FS'){if(tx>fx+g){if(Math.abs(fy-ty)<2)path=`M${fx},${fy} L${tx},${ty}`;else{const mx=(fx+tx)/2;path=`M${fx},${fy} L${mx},${fy} L${mx},${ty} L${tx},${ty}`}}else{const dy=fy<ty?Math.max(fy,ty)+rowH*.6:Math.min(fy,ty)-rowH*.6;path=`M${fx},${fy} L${fx+g},${fy} L${fx+g},${dy} L${tx-g},${dy} L${tx-g},${ty} L${tx},${ty}`}}else if(pred.type==='SS'){const lx=Math.min(fx,tx)-g;path=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}else if(pred.type==='FF'){const rx=Math.max(fx,tx)+g;path=`M${fx},${fy} L${rx},${fy} L${rx},${ty} L${tx},${ty}`}else{const lx=fx-g;path=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}res.push({path,tx,ty})}}return res},[tasks,barPos,showArrows]);

  const handleBarEnter=useCallback((e,task)=>{const r=e.currentTarget.getBoundingClientRect();onTooltip({task,x:r.left+r.width/2,y:r.top-4})},[onTooltip]);
  const handleBarLeave=useCallback(()=>onTooltip(null),[onTooltip]);

  return(
    <div ref={containerRef} className="gantt-chart-container" onScroll={handleScroll}>
      <svg width={totalW} height={totalH+headerH} style={{display:'block'}}>
        <rect x="0" y="0" width={totalW} height={headerH} fill="var(--bg-secondary)"/>
        <line x1="0" y1={headerH} x2={totalW} y2={headerH} stroke="var(--border-primary)"/>
        {grid.h1.map((h,i)=><text key={`h1${i}`} x={h.x+4} y={16} fontSize="10" fontWeight="600" fill="var(--text-secondary)" fontFamily="var(--font-sans)">{h.label}</text>)}
        {grid.h2.map((h,i)=><text key={`h2${i}`} x={h.x+(h.w?h.w/2:4)} y={34} fontSize="10" fill="var(--text-tertiary)" fontFamily="var(--font-mono)" textAnchor={h.w?'middle':'start'}>{h.label}</text>)}
        {grid.lines.map((l,i)=><line key={`gl${i}`} x1={l.x} y1={headerH} x2={l.x} y2={totalH+headerH} stroke={l.maj?'var(--border-primary)':'var(--border-secondary)'} strokeWidth={l.maj?1:.5} strokeDasharray={l.maj?'none':'2,4'}/>)}
        {zoom==='day'&&grid.lines.filter(l=>l.we).map((l,i)=><rect key={`we${i}`} x={l.x} y={headerH} width={dayW} height={totalH} fill="var(--text-tertiary)" opacity=".04"/>)}
        {tasks.map((_,i)=><line key={`rl${i}`} x1="0" y1={headerH+(i+1)*rowH} x2={totalW} y2={headerH+(i+1)*rowH} stroke="var(--border-secondary)" strokeWidth=".5"/>)}
        {arrows.map((a,i)=><g key={`a${i}`}><path d={a.path} fill="none" stroke="var(--arrow-color)" strokeWidth="1" transform={`translate(0,${headerH})`}/><polygon points={`${a.tx},${a.ty+headerH} ${a.tx-4},${a.ty-3+headerH} ${a.tx-4},${a.ty+3+headerH}`} fill="var(--arrow-head)" opacity=".5"/></g>)}
        {showToday&&<g><line x1={todayX} y1={headerH} x2={todayX} y2={totalH+headerH} stroke="var(--today-line)" strokeWidth="1.5" strokeDasharray="4,3"/><rect x={todayX-16} y={headerH-14} width="32" height="13" rx="2" fill="var(--today-line)"/><text x={todayX} y={headerH-5} textAnchor="middle" fontSize="9" fontWeight="600" fill="white" fontFamily="var(--font-sans)">HOY</text></g>}
        {tasks.map((task,i)=>{
          const y=headerH+i*rowH,cy=y+rowH/2;
          let blEl=null;
          if(showBaseline&&task.baselines.length>0){const bl=task.baselines[0];if(bl.start&&bl.finish&&!task.isMilestone){const bx1=dateToX(bl.start),bx2=dateToX(bl.finish),bw=Math.max(bx2-bx1,2);blEl=<rect x={bx1} y={cy+5} width={bw} height={3} fill="var(--bar-baseline)" rx="1.5" opacity=".5"/>}}
          if(task.isMilestone){const mx=dateToX(task.start||task.finish),sz=5,col=isOverdue(task)?'var(--bar-overdue)':'var(--bar-milestone)';return <g key={task.uid} onMouseEnter={e=>handleBarEnter(e,task)} onMouseLeave={handleBarLeave} style={{cursor:'default'}}>{blEl}<polygon points={`${mx},${cy-sz} ${mx+sz},${cy} ${mx},${cy+sz} ${mx-sz},${cy}`} fill={col}/></g>}
          if(!task.start||!task.finish)return blEl?<g key={task.uid}>{blEl}</g>:null;
          const x=dateToX(task.start),w=Math.max(dateToX(task.finish)-x,2),barH=task.isSummary?6:10,barY=cy-barH/2,pct=task.percentComplete,over=isOverdue(task),done=pct>=100;
          let bg='var(--bar-normal-bg)',fg='var(--bar-normal)';if(over){bg='var(--bar-overdue-bg)';fg='var(--bar-overdue)'}else if(done){bg='var(--bar-complete-bg)';fg='var(--bar-complete)'}
          if(task.isSummary)return <g key={task.uid} onMouseEnter={e=>handleBarEnter(e,task)} onMouseLeave={handleBarLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={barY} width={w} height={barH} fill="var(--bar-summary)" rx="1" opacity=".7"/><rect x={x} y={barY} width={w*pct/100} height={barH} fill="var(--bar-summary)" rx="1"/><path d={`M${x},${barY} L${x},${barY+barH+3} L${x+4},${barY+barH}`} fill="none" stroke="var(--bar-summary)" strokeWidth="1.5"/><path d={`M${x+w},${barY} L${x+w},${barY+barH+3} L${x+w-4},${barY+barH}`} fill="none" stroke="var(--bar-summary)" strokeWidth="1.5"/></g>;
          return <g key={task.uid} onMouseEnter={e=>handleBarEnter(e,task)} onMouseLeave={handleBarLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={barY} width={w} height={barH} fill={bg} rx="3"/><rect x={x} y={barY} width={Math.max(w*pct/100,0)} height={barH} fill={fg} rx="3"/>{w>30&&pct>0&&<text x={x+4} y={cy+3} fontSize="8" fontWeight="600" fill={fg} fontFamily="var(--font-mono)" opacity=".8">{pct}%</text>}</g>;
        })}
      </svg>
    </div>
  );
}

/* ═══════ Tooltip ═══════ */
function Tooltip({info}){
  if(!info)return null;
  const{task,x,y}=info;const st=getStatus(task);const bl=task.baselines.length>0?task.baselines[0]:null;
  const ent=Object.entries(task.enterprise).filter(([k,v])=>!v.isGuid);
  return <div className="gantt-tooltip" style={{left:Math.min(x,window.innerWidth-300),top:Math.max(y-140,10)}}>
    <div className="tt-name">{task.name}</div>
    <div className="tt-row"><span className="tt-label">WBS</span><span className="tt-value">{task.wbs||'—'}</span></div>
    <div className="tt-row"><span className="tt-label">Estado</span><span className="tt-value" style={{color:statusColor(st)}}>{statusLabel(st)}</span></div>
    <div className="tt-row"><span className="tt-label">Inicio</span><span className="tt-value">{fmtDate(task.start)}</span></div>
    <div className="tt-row"><span className="tt-label">Fin</span><span className="tt-value">{fmtDate(task.finish)}</span></div>
    <div className="tt-row"><span className="tt-label">Duración</span><span className="tt-value">{fmtDuration(task.duration)}</span></div>
    <div className="tt-row"><span className="tt-label">Avance</span><span className="tt-value">{task.percentComplete}%</span></div>
    {task.critical&&<div className="tt-row"><span className="tt-label">Ruta crítica</span><span className="tt-value" style={{color:'var(--danger)'}}>Sí</span></div>}
    {task.resources.length>0&&<div className="tt-row"><span className="tt-label">Recurso</span><span className="tt-value">{task.resources.join(', ')}</span></div>}
    {ent.map(([k,v])=><div key={k} className="tt-row"><span className="tt-label">{k}</span><span className="tt-value">{v.value}</span></div>)}
    {bl&&<Fragment>
      <div style={{borderTop:'1px solid var(--border-secondary)',margin:'4px 0',fontSize:10,color:'var(--text-tertiary)',paddingTop:3}}>Línea base {bl.number}</div>
      <div className="tt-row"><span className="tt-label">Inicio LB</span><span className="tt-value">{fmtDate(bl.start)}</span></div>
      <div className="tt-row"><span className="tt-label">Fin LB</span><span className="tt-value">{fmtDate(bl.finish)}</span></div>
      {task.finish&&bl.finish&&<div className="tt-row"><span className="tt-label">Desvío</span><span className="tt-value" style={{color:task.finish>bl.finish?'var(--danger)':'var(--success)'}}>{daysBetween(bl.finish,task.finish)} días</span></div>}
    </Fragment>}
  </div>;
}

/* ═══════ Portfolio Dashboard (cross-project) ═══════ */
function PortfolioDashboard({projectList,projectData}){
  const[selectedContractor,setSelectedContractor]=useState(null);

  /* Aggregate all tasks across loaded projects */
  const allData=useMemo(()=>{
    const contractors={};
    const projectSummaries=[];
    for(const p of projectList){
      const data=projectData[p.key];
      if(!data) continue;
      const nonSummary=data.tasks.filter(t=>!t.isSummary);
      projectSummaries.push({name:p.name,key:p.key,total:nonSummary.length,done:nonSummary.filter(t=>t.percentComplete>=100).length,overdue:nonSummary.filter(t=>isOverdue(t)).length,avg:nonSummary.length?Math.round(nonSummary.reduce((s,t)=>s+t.percentComplete,0)/nonSummary.length):0});

      for(const t of nonSummary){
        const c=t.enterprise['Contratista'];
        const cName=c&&!c.isGuid?c.value:'Sin contratista';
        if(!contractors[cName]) contractors[cName]={tasks:[],projects:new Set(),total:0,done:0,overdue:0,inProgress:0};
        contractors[cName].tasks.push({...t,projectName:p.name,projectKey:p.key});
        contractors[cName].projects.add(p.name);
        contractors[cName].total++;
        if(t.percentComplete>=100) contractors[cName].done++;
        if(isOverdue(t)) contractors[cName].overdue++;
        if(t.percentComplete>0&&t.percentComplete<100) contractors[cName].inProgress++;
      }
    }
    return{contractors,projectSummaries};
  },[projectList,projectData]);

  const contractorList=Object.entries(allData.contractors).sort((a,b)=>b[1].total-a[1].total);
  const selected=selectedContractor?allData.contractors[selectedContractor]:null;

  /* Group selected contractor's tasks by project */
  const tasksByProject=useMemo(()=>{
    if(!selected) return[];
    const map={};
    for(const t of selected.tasks){
      if(!map[t.projectName]) map[t.projectName]=[];
      map[t.projectName].push(t);
    }
    return Object.entries(map);
  },[selected]);

  const loadedCount=Object.keys(projectData).length;

  return <div className="dashboard">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="dash-section-title" style={{margin:0}}>Portfolio — {loadedCount} proyectos cargados</div>
      {loadedCount===0&&<div style={{color:'var(--text-tertiary)',fontSize:12}}>Abrí proyectos desde la lista para verlos acá</div>}
    </div>

    {/* Project KPIs */}
    {allData.projectSummaries.length>0&&<div style={{marginBottom:20}}>
      <div className="dash-section-title">Proyectos</div>
      <table className="dash-table"><thead><tr><th>Proyecto</th><th style={{width:60}}>Tareas</th><th style={{width:60}}>Hechas</th><th style={{width:70}}>Vencidas</th><th style={{width:70}}>Avance</th></tr></thead>
      <tbody>{allData.projectSummaries.map(p=><tr key={p.key}><td style={{fontWeight:500}}>{p.name}</td><td className="td-mono">{p.total}</td><td className="td-mono" style={{color:'var(--success)'}}>{p.done}</td><td className="td-mono" style={{color:p.overdue?'var(--danger)':'var(--text-tertiary)'}}>{p.overdue}</td><td className="td-mono">{p.avg}%</td></tr>)}</tbody></table>
    </div>}

    {/* Contractor cards */}
    {contractorList.length>0&&<Fragment>
      <div className="dash-section-title">Contratistas — clic para ver detalle</div>
      <div className="contractor-grid">
        {contractorList.map(([name,data])=>(
          <div key={name} className={`contractor-card ${selectedContractor===name?'active':''}`} onClick={()=>setSelectedContractor(selectedContractor===name?null:name)}>
            <h4>{name}</h4>
            <div className="contractor-stat"><span>Proyectos</span><span className="val">{data.projects.size}</span></div>
            <div className="contractor-stat"><span>Tareas</span><span className="val">{data.total}</span></div>
            <div className="contractor-stat"><span>Completadas</span><span className="val" style={{color:'var(--success)'}}>{data.done}</span></div>
            <div className="contractor-stat"><span>Vencidas</span><span className="val" style={{color:data.overdue?'var(--danger)':'var(--text-tertiary)'}}>{data.overdue}</span></div>
            <div className="contractor-stat"><span>En curso</span><span className="val" style={{color:data.inProgress?'var(--warning)':'var(--text-tertiary)'}}>{data.inProgress}</span></div>
            <div style={{marginTop:6}}>
              <div className="progress-mini"><div className="progress-mini-bar" style={{width:'100%'}}><div className="progress-mini-fill" style={{width:`${data.total?Math.round(data.done/data.total*100):0}%`,background:'var(--accent)'}}/></div><span className="td-mono">{data.total?Math.round(data.done/data.total*100):0}%</span></div>
            </div>
          </div>
        ))}
      </div>
    </Fragment>}

    {/* Selected contractor detail */}
    {selected&&<Fragment>
      <div className="dash-section-title">{selectedContractor} — detalle por proyecto</div>
      {tasksByProject.map(([projName,tasks])=>(
        <div key={projName} style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'var(--accent)'}}>{projName} ({tasks.length} tareas)</div>
          <table className="dash-table"><thead><tr><th>Tarea</th><th style={{width:90}}>Inicio</th><th style={{width:90}}>Fin</th><th style={{width:50}}>%</th><th style={{width:70}}>Estado</th><th style={{width:80}}>N° Item</th></tr></thead>
          <tbody>{tasks.sort((a,b)=>(a.start||new Date(0))-(b.start||new Date(0))).map(t=>{
            const st=getStatus(t);
            return <tr key={t.uid}><td style={{fontWeight:500}}>{t.name}</td><td className="td-mono">{fmtDate(t.start)}</td><td className="td-mono">{fmtDate(t.finish)}</td><td className="td-mono">{t.percentComplete}%</td><td style={{color:statusColor(st),fontSize:11,fontWeight:500}}>{statusLabel(st)}</td><td className="td-mono">{t.enterprise['N° Item']?.value||'—'}</td></tr>
          })}</tbody></table>
        </div>
      ))}
    </Fragment>}
  </div>;
}

/* ═══════ Project Dashboard ═══════ */
function Dashboard({data,projectName}){
  if(!data)return null;
  const tasks=data.tasks.filter(t=>!t.isSummary);
  const total=tasks.length,completed=tasks.filter(t=>t.percentComplete>=100).length;
  const inProg=tasks.filter(t=>t.percentComplete>0&&t.percentComplete<100).length;
  const overdue=tasks.filter(t=>isOverdue(t)).length;
  const avg=total?Math.round(tasks.reduce((s,t)=>s+t.percentComplete,0)/total):0;

  /* Contractor breakdown */
  const contractors={};
  tasks.forEach(t=>{
    const c=t.enterprise['Contratista'];
    const name=c&&!c.isGuid?c.value:'Sin contratista';
    if(!contractors[name]) contractors[name]={total:0,done:0,overdue:0};
    contractors[name].total++;
    if(t.percentComplete>=100) contractors[name].done++;
    if(isOverdue(t)) contractors[name].overdue++;
  });

  const upcoming=tasks.filter(t=>t.finish&&t.finish>=new Date()&&t.percentComplete<100).sort((a,b)=>a.finish-b.finish).slice(0,10);

  return <div className="dashboard">
    <div className="dash-grid">
      <div className="kpi-card"><div className="kpi-value">{total}</div><div className="kpi-label">Tareas</div></div>
      <div className="kpi-card success"><div className="kpi-value" style={{color:'var(--success)'}}>{completed}</div><div className="kpi-label">Completadas</div></div>
      <div className="kpi-card warning"><div className="kpi-value" style={{color:'var(--warning)'}}>{inProg}</div><div className="kpi-label">En curso</div></div>
      <div className="kpi-card danger"><div className="kpi-value" style={{color:'var(--danger)'}}>{overdue}</div><div className="kpi-label">Vencidas</div></div>
      <div className="kpi-card"><div className="kpi-value">{avg}%</div><div className="kpi-label">Avance</div></div>
    </div>

    <div style={{marginBottom:20,background:'var(--bg-elevated)',border:'1px solid var(--border-secondary)',borderRadius:'var(--radius-md)',padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{fontSize:12,fontWeight:600}}>Avance general</span><span style={{fontSize:12,fontFamily:'var(--font-mono)',color:'var(--accent)',fontWeight:600}}>{avg}%</span></div>
      <div style={{height:8,borderRadius:4,background:'var(--bg-tertiary)',overflow:'hidden'}}><div style={{height:'100%',borderRadius:4,width:`${avg}%`,background:'var(--accent)'}}/></div>
    </div>

    {Object.keys(contractors).length>1&&<div style={{marginBottom:20}}>
      <div className="dash-section-title">Carga por contratista</div>
      <table className="dash-table"><thead><tr><th>Contratista</th><th style={{width:60}}>Total</th><th style={{width:80}}>Hechas</th><th style={{width:70}}>Vencidas</th></tr></thead>
      <tbody>{Object.entries(contractors).sort((a,b)=>b[1].total-a[1].total).map(([n,d])=><tr key={n}><td style={{fontWeight:500}}>{n}</td><td className="td-mono">{d.total}</td><td className="td-mono" style={{color:'var(--success)'}}>{d.done}</td><td className="td-mono" style={{color:d.overdue?'var(--danger)':'var(--text-tertiary)'}}>{d.overdue}</td></tr>)}</tbody></table>
    </div>}

    {upcoming.length>0&&<div><div className="dash-section-title">Próximas entregas</div>
      <table className="dash-table"><thead><tr><th>Tarea</th><th style={{width:90}}>Fin</th><th style={{width:50}}>%</th><th style={{width:100}}>Contratista</th><th style={{width:80}}>Recurso</th></tr></thead>
      <tbody>{upcoming.map(t=><tr key={t.uid}><td style={{fontWeight:500}}>{t.name}</td><td className="td-mono">{fmtDate(t.finish)}</td><td className="td-mono">{t.percentComplete}%</td><td style={{fontSize:11,color:'var(--text-secondary)'}}>{t.enterprise['Contratista']?.value||'—'}</td><td style={{fontSize:11,color:'var(--text-secondary)'}}>{t.resources.join(', ')||'—'}</td></tr>)}</tbody></table>
    </div>}
  </div>;
}

/* ═══════ MAIN APP ═══════ */
function App(){
  const[theme,toggleTheme]=useTheme();
  const[projectList,setProjectList]=useState(null);
  const[projectData,setProjectData]=useState({});
  const[loadingKeys,setLoadingKeys]=useState({});
  const[errorKeys,setErrorKeys]=useState({});
  const[openTabs,setOpenTabs]=useState([]);
  const[activeTab,setActiveTab]=useState(null);
  const[subTab,setSubTab]=useState('gantt');
  const[zoom,setZoom]=useState('week');
  const[showSearch,setShowSearch]=useState(false);
  const[showArrows,setShowArrows]=useState(true);
  const[showBaseline,setShowBaseline]=useState(true);
  const[tooltipInfo,setTooltipInfo]=useState(null);
  const[tablePaneWidth,setTablePaneWidth]=useState(560);
  const[splitterActive,setSplitterActive]=useState(false);
  const[filterStatus,setFilterStatus]=useState('all');
  const[filterResource,setFilterResource]=useState('all');
  const[filterContractor,setFilterContractor]=useState('all');
  const[filterWbsLevel,setFilterWbsLevel]=useState(99);
  const[filterDateFrom,setFilterDateFrom]=useState('');
  const[filterDateTo,setFilterDateTo]=useState('');
  const[expandedMap,setExpandedMap]=useState({});
  const[dragOver,setDragOver]=useState(false);

  const scrollTopRef=useRef({value:0,source:null});
  const tableContainerRef=useRef(null);
  const isTableScrolling=useRef(false);

  useEffect(()=>{
    fetch('data/manifest.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
      const list=(data.projects||data||[]).map((p,i)=>({key:'srv_'+(p.file||p.name||i),name:p.name||p.file?.replace('.xml','')||`Proyecto ${i+1}`,file:p.file||p,size:p.size||null,modified:p.modified||null}));
      setProjectList(list);
    }).catch(()=>setProjectList([]));
  },[]);

  useEffect(()=>{const h=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setShowSearch(s=>!s)}};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);

  const resetFilters=useCallback(()=>{setFilterStatus('all');setFilterResource('all');setFilterContractor('all');setFilterWbsLevel(99);setFilterDateFrom('');setFilterDateTo('')},[]);

  const openProject=useCallback(async(proj)=>{
    const key=proj.key;
    if(openTabs.includes(key)){setActiveTab(key);return}
    if(!projectData[key]&&!loadingKeys[key]){
      setLoadingKeys(prev=>({...prev,[key]:true}));
      setErrorKeys(prev=>{const n={...prev};delete n[key];return n});
      try{
        const res=await fetch(`data/projects/${proj.file}?t=${Date.now()}`);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const text=await res.text();
        const data=parseMSPDI(text);
        setProjectData(prev=>({...prev,[key]:data}));
        const expMap={};data.tasks.forEach(t=>{if(t.isSummary) expMap[t.uid]=true});
        setExpandedMap(prev=>({...prev,[key]:expMap}));
      }catch(err){setErrorKeys(prev=>({...prev,[key]:err.message}))}
      finally{setLoadingKeys(prev=>{const n={...prev};delete n[key];return n})}
    }
    setOpenTabs(prev=>prev.includes(key)?prev:[...prev,key]);
    setActiveTab(key);setSubTab('gantt');resetFilters();
  },[openTabs,projectData,loadingKeys,resetFilters]);

  const closeTab=useCallback((key,e)=>{e?.stopPropagation();setOpenTabs(prev=>{const next=prev.filter(k=>k!==key);if(activeTab===key) setActiveTab(next.length?next[next.length-1]:null);return next})},[activeTab]);

  const handleLocalFile=useCallback(file=>{
    const reader=new FileReader();
    reader.onload=e=>{try{
      const data=parseMSPDI(e.target.result);
      const key='local_'+Date.now();
      const proj={key,name:file.name.replace('.xml',''),file:file.name,size:file.size,local:true};
      setProjectList(prev=>[...(prev||[]),proj]);setProjectData(prev=>({...prev,[key]:data}));
      const expMap={};data.tasks.forEach(t=>{if(t.isSummary) expMap[t.uid]=true});setExpandedMap(prev=>({...prev,[key]:expMap}));
      setOpenTabs(prev=>[...prev,key]);setActiveTab(key);setSubTab('gantt');resetFilters();
    }catch(err){console.error('Parse error:',err)}};
    reader.readAsText(file);
  },[resetFilters]);

  const toggleTask=useCallback((key,uid)=>{setExpandedMap(prev=>{const m={...prev[key]};m[uid]=!m[uid];return{...prev,[key]:m}})},[]);
  const expandAll=useCallback((key,tasks)=>{const m={};tasks.forEach(t=>{if(t.isSummary) m[t.uid]=true});setExpandedMap(prev=>({...prev,[key]:m}))},[]);
  const collapseAll=useCallback((key,tasks)=>{const m={};tasks.forEach(t=>{if(t.isSummary) m[t.uid]=false});setExpandedMap(prev=>({...prev,[key]:m}))},[]);

  const activeFiltersCount=useMemo(()=>{let c=0;if(filterStatus!=='all')c++;if(filterResource!=='all')c++;if(filterContractor!=='all')c++;if(filterWbsLevel<99)c++;if(filterDateFrom||filterDateTo)c++;return c},[filterStatus,filterResource,filterContractor,filterWbsLevel,filterDateFrom,filterDateTo]);

  const activeProj=useMemo(()=>(projectList||[]).find(p=>p.key===activeTab),[projectList,activeTab]);
  const activeData=activeTab?projectData[activeTab]:null;
  const isLoading=activeTab?!!loadingKeys[activeTab]:false;
  const error=activeTab?errorKeys[activeTab]:null;

  const visibleTasks=useMemo(()=>{
    if(!activeData) return[];
    const expMap=expandedMap[activeTab]||{};
    const matchesFilter=task=>{
      if(filterStatus!=='all'&&getStatus(task)!==filterStatus) return false;
      if(filterResource!=='all'){if(filterResource==='unassigned'){if(task.resources.length>0)return false}else{if(!task.resources.includes(filterResource))return false}}
      if(filterContractor!=='all'){const c=task.enterprise['Contratista'];const cv=c&&!c.isGuid?c.value:'';if(filterContractor==='none'){if(cv)return false}else{if(cv!==filterContractor)return false}}
      if(task.outlineLevel>filterWbsLevel) return false;
      if(filterDateFrom){const f=new Date(filterDateFrom);if(task.finish&&task.finish<f)return false}
      if(filterDateTo){const t2=new Date(filterDateTo);if(task.start&&task.start>t2)return false}
      return true;
    };
    const hasMatch=task=>{if(matchesFilter(task))return true;for(const c of task.children)if(hasMatch(c))return true;return false};
    const result=[];
    const process=task=>{if(task.isSummary){if(!hasMatch(task))return}else{if(!matchesFilter(task))return};result.push(task);if(task.isSummary&&expMap[task.uid]){for(const c of task.children) process(c)}};
    for(const t of activeData.rootTasks||[]) process(t);
    return result;
  },[activeData,activeTab,expandedMap,filterStatus,filterResource,filterContractor,filterWbsLevel,filterDateFrom,filterDateTo]);

  /* Splitter */
  useEffect(()=>{if(!splitterActive)return;const onMove=e=>setTablePaneWidth(Math.max(300,Math.min(e.clientX,window.innerWidth-200)));const onUp=()=>setSplitterActive(false);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);return()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}},[splitterActive]);

  const handleTableScroll=useCallback(e=>{if(isTableScrolling.current)return;scrollTopRef.current={value:e.target.scrollTop,source:'table'}},[]);
  useEffect(()=>{let raf;const sync=()=>{const el=tableContainerRef.current;if(el&&scrollTopRef.current?.source==='chart'){isTableScrolling.current=true;el.scrollTop=scrollTopRef.current.value;scrollTopRef.current.source=null;requestAnimationFrame(()=>{isTableScrolling.current=false})};raf=requestAnimationFrame(sync)};raf=requestAnimationFrame(sync);return()=>cancelAnimationFrame(raf)},[]);

  if(!projectList) return <div className="loading-state"><div className="spinner"/><span>Cargando...</span></div>;

  /* Welcome */
  if(!activeTab){
    const sp=projectList.filter(p=>!p.local);
    return <Fragment>
      <div className="app-header">
        <div className="app-logo">{I.building(18)} BuildPlan <span>Viewer</span></div>
        <div className="project-tabs">
          {/* Portfolio tab always visible */}
          <button className="project-tab" onClick={()=>{setActiveTab('__portfolio');setSubTab('portfolio')}} style={{color:'var(--accent)'}}>
            {I.users()} Portfolio
          </button>
        </div>
        <div className="header-actions">
          <button className="btn btn-ghost btn-icon" onClick={()=>setShowSearch(true)} title="Buscar (Ctrl+K)">{I.search()}</button>
          <button className="btn btn-ghost btn-icon" onClick={toggleTheme}>{theme==='light'?I.moon():I.sun()}</button>
        </div>
      </div>
      <div className="welcome">
        <div className="welcome-header"><div className="welcome-title">Proyectos</div><div className="welcome-sub">{sp.length} archivos disponibles</div></div>
        <div className="project-grid">
          {sp.map(p=><div key={p.key} className="project-card" onClick={()=>openProject(p)}>
            <div className="project-card-icon">{I.building(16)}</div>
            <div className="project-card-info"><div className="project-card-name">{p.name}</div><div className="project-card-meta">{p.size?`${(p.size/1024).toFixed(0)} KB`:'XML'}{p.modified?` · ${new Date(p.modified).toLocaleDateString('es-AR')}`:''}</div></div>
            <div className="project-card-arrow">{I.arrowR()}</div>
          </div>)}
        </div>
        <div className={`drop-zone ${dragOver?'drag-over':''}`} onDragOver={e=>{e.preventDefault();setDragOver(true)}} onDragLeave={()=>setDragOver(false)} onDrop={e=>{e.preventDefault();setDragOver(false);if(e.dataTransfer.files[0])handleLocalFile(e.dataTransfer.files[0])}} onClick={()=>document.getElementById('fi').click()}>
          {I.upload(20)}<div style={{marginTop:6}}>Soltar un XML de MS Project aquí, o hacer clic para seleccionar</div>
          <input id="fi" type="file" accept=".xml" onChange={e=>{if(e.target.files[0])handleLocalFile(e.target.files[0])}}/>
        </div>
      </div>
      {showSearch&&<div className="search-overlay" onClick={()=>setShowSearch(false)}><div className="search-modal" onClick={e=>e.stopPropagation()}><input className="search-input" placeholder="Buscar tareas..." autoFocus onKeyDown={e=>{if(e.key==='Escape')setShowSearch(false)}}/></div></div>}
    </Fragment>;
  }

  /* Portfolio view */
  if(activeTab==='__portfolio'){
    return <Fragment>
      <div className="app-header">
        <div className="app-logo" onClick={()=>setActiveTab(null)}>{I.building(18)} BuildPlan</div>
        <div className="project-tabs">
          <button className="project-tab active">{I.users()} Portfolio</button>
          {openTabs.filter(k=>k!=='__portfolio').map(key=>{
            const p=(projectList||[]).find(pr=>pr.key===key);
            return p?<button key={key} className="project-tab" onClick={()=>{setActiveTab(key);setSubTab('gantt');resetFilters()}}><span className="dot" style={{background:'var(--text-tertiary)'}}/>{p.name}<span className="close-btn" onClick={e=>closeTab(key,e)}>×</span></button>:null;
          })}
        </div>
        <div className="header-actions">
          <button className="btn btn-ghost btn-icon" onClick={toggleTheme}>{theme==='light'?I.moon():I.sun()}</button>
        </div>
      </div>
      <PortfolioDashboard projectList={projectList} projectData={projectData}/>
    </Fragment>;
  }

  /* Project view */
  return <Fragment>
    <div className="print-header"><h1>{activeProj?.name}</h1><p>Generado el {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})} — BuildPlan Viewer · Bauvek</p></div>
    <div className="app-header">
      <div className="app-logo" onClick={()=>setActiveTab(null)}>{I.building(18)} BuildPlan</div>
      <div className="project-tabs">
        <button className="project-tab" onClick={()=>{setActiveTab('__portfolio');setSubTab('portfolio')}}>{I.users()} Portfolio</button>
        {openTabs.filter(k=>k!=='__portfolio').map(key=>{
          const p=(projectList||[]).find(pr=>pr.key===key);if(!p) return null;
          return <button key={key} className={`project-tab ${activeTab===key?'active':''}`} onClick={()=>{setActiveTab(key);setSubTab('gantt');resetFilters()}}><span className="dot" style={{background:'var(--text-tertiary)'}}/>{p.name}<span className="close-btn" onClick={e=>closeTab(key,e)}>×</span></button>
        })}
      </div>
      <div className="header-actions">
        <button className="btn btn-ghost btn-icon" onClick={()=>setShowSearch(true)} title="Ctrl+K">{I.search()}</button>
        <button className="btn btn-ghost btn-icon" onClick={toggleTheme}>{theme==='light'?I.moon():I.sun()}</button>
      </div>
    </div>

    <div className="sub-tabs-bar">
      <button className={`sub-tab ${subTab==='gantt'?'active':''}`} onClick={()=>setSubTab('gantt')}>Gantt</button>
      <button className={`sub-tab ${subTab==='dashboard'?'active':''}`} onClick={()=>setSubTab('dashboard')}>Dashboard</button>
      {subTab==='gantt'&&activeData&&<div className="sub-tabs-right">
        <button className="btn btn-ghost btn-icon" onClick={()=>expandAll(activeTab,activeData.tasks)} title="Expandir">{I.expandAll()}</button>
        <button className="btn btn-ghost btn-icon" onClick={()=>collapseAll(activeTab,activeData.tasks)} title="Colapsar">{I.collapseAll()}</button>
        <div className="segmented">{Object.entries(ZOOM).map(([k,v])=><button key={k} className={zoom===k?'active':''} onClick={()=>setZoom(k)}>{v.label}</button>)}</div>
        <button className="btn btn-ghost btn-icon" onClick={()=>setShowArrows(a=>!a)} title="Flechas" style={{color:showArrows?'var(--accent)':'var(--text-tertiary)'}}>{I.link()}</button>
        {activeData.hasBaselines&&<button className="btn btn-ghost btn-icon" onClick={()=>setShowBaseline(b=>!b)} title="Línea base" style={{color:showBaseline?'var(--accent)':'var(--text-tertiary)'}}>{I.baseline()}</button>}
        <button className="btn btn-ghost" onClick={()=>window.print()}>{I.print()} PDF</button>
      </div>}
    </div>

    {subTab==='gantt'&&activeData&&<div className="filter-bar">
      <span style={{color:'var(--text-tertiary)',marginRight:2}}>{I.filter()}</span>
      <span className="filter-label">Estado</span>
      <select className="filter-select" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="all">Todos</option><option value="pending">Pendiente</option><option value="in_progress">En curso</option><option value="completed">Completada</option><option value="overdue">Vencida</option></select>
      <span className="filter-label">Recurso</span>
      <select className="filter-select" value={filterResource} onChange={e=>setFilterResource(e.target.value)}><option value="all">Todos</option><option value="unassigned">Sin asignar</option>{activeData.resources.map(r=><option key={r} value={r}>{r}</option>)}</select>
      <span className="filter-label">Contratista</span>
      <select className="filter-select" value={filterContractor} onChange={e=>setFilterContractor(e.target.value)}><option value="all">Todos</option><option value="none">Sin contratista</option>{activeData.contractors.map(c=><option key={c} value={c}>{c}</option>)}</select>
      <span className="filter-label">Nivel</span>
      <select className="filter-select" value={filterWbsLevel} onChange={e=>setFilterWbsLevel(parseInt(e.target.value))}><option value="99">Todos</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
      <span className="filter-label">Desde</span><input type="date" className="filter-input" value={filterDateFrom} onChange={e=>setFilterDateFrom(e.target.value)}/>
      <span className="filter-label">Hasta</span><input type="date" className="filter-input" value={filterDateTo} onChange={e=>setFilterDateTo(e.target.value)}/>
      {activeFiltersCount>0&&<Fragment><span className="filter-badge">{activeFiltersCount}</span><button className="filter-clear" onClick={resetFilters}>Limpiar</button></Fragment>}
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--text-tertiary)',fontFamily:'var(--font-mono)'}}>{visibleTasks.length} tareas</span>
    </div>}

    {error&&<div className="error-banner">Error: {error}</div>}
    {isLoading&&<div className="loading-state"><div className="spinner"/><span>Cargando...</span></div>}

    {!isLoading&&activeData&&subTab==='gantt'&&<div className="gantt-wrapper" style={{userSelect:splitterActive?'none':'auto'}}>
      <div className="gantt-table-container" ref={tableContainerRef} style={{width:tablePaneWidth}} onScroll={handleTableScroll}>
        <table className="gantt-table">
          <colgroup>
            <col style={{width:30}}/>{/* WBS */}
            <col style={{width:180}}/>{/* Name */}
            <col style={{width:70}}/>{/* Inicio */}
            <col style={{width:70}}/>{/* Fin */}
            <col style={{width:55}}/>{/* Dur */}
            <col style={{width:45}}/>{/* % */}
            <col style={{width:80}}/>{/* Recurso */}
            <col style={{width:80}}/>{/* Contratista */}
            <col style={{width:55}}/>{/* N° Item */}
          </colgroup>
          <thead><tr>
            <th>WBS</th><th>Tarea</th><th>Inicio</th><th>Fin</th><th>Dur.</th><th>%</th><th>Recurso</th><th>Contratista</th><th>N° Item</th>
          </tr></thead>
          <tbody>
            {visibleTasks.map(task=>{
              const expMap=expandedMap[activeTab]||{};
              const over=isOverdue(task);
              const indent=task.depth*14;
              const contr=task.enterprise['Contratista'];
              const nitem=task.enterprise['N° Item'];
              return <tr key={task.uid} className={task.isSummary?'summary':''}>
                <td className="td-mono" style={{fontSize:10}}>{task.wbs}</td>
                <td>
                  <div className="task-name-cell" style={{paddingLeft:indent}}>
                    {task.isSummary?<button className="task-toggle" onClick={()=>toggleTask(activeTab,task.uid)}>{expMap[task.uid]?I.chevDown():I.chevRight()}</button>:<span style={{width:16,flexShrink:0}}/>}
                    {task.isMilestone&&<span style={{color:'var(--bar-milestone)',fontSize:10,flexShrink:0}}>♦</span>}
                    <span style={{overflow:'hidden',textOverflow:'ellipsis',fontWeight:task.isSummary?600:400,color:over?'var(--danger)':task.critical?'var(--accent)':'var(--text-primary)'}} title={task.name}>{task.name}</span>
                  </div>
                </td>
                <td className="td-mono">{fmtDate(task.start)}</td>
                <td className="td-mono" style={{color:over?'var(--danger)':undefined}}>{fmtDate(task.finish)}</td>
                <td className="td-mono" style={{fontSize:10}}>{fmtDuration(task.duration)}</td>
                <td><div className="progress-mini"><div className="progress-mini-bar"><div className="progress-mini-fill" style={{width:`${task.percentComplete}%`,background:task.percentComplete>=100?'var(--success)':over?'var(--danger)':'var(--accent)'}}/></div><span className="td-mono" style={{fontSize:10}}>{task.percentComplete}%</span></div></td>
                <td style={{fontSize:11,color:'var(--text-secondary)',overflow:'hidden',textOverflow:'ellipsis'}} title={task.resources.join(', ')}>{task.resources.join(', ')||'—'}</td>
                <td style={{fontSize:11,color:'var(--text-secondary)'}} title={contr&&!contr.isGuid?contr.value:''}>{contr&&!contr.isGuid?contr.value:'—'}</td>
                <td className="td-mono" style={{fontSize:10}}>{nitem&&!nitem.isGuid?nitem.value:'—'}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
      <div className={`splitter ${splitterActive?'active':''}`} onMouseDown={()=>setSplitterActive(true)}/>
      <GanttChart tasks={visibleTasks} minDate={activeData.minDate} maxDate={activeData.maxDate} zoom={zoom} showArrows={showArrows} showBaseline={showBaseline} scrollTopRef={scrollTopRef} onTooltip={setTooltipInfo}/>
    </div>}

    {!isLoading&&activeData&&subTab==='dashboard'&&<Dashboard data={activeData} projectName={activeProj?.name}/>}
    <Tooltip info={tooltipInfo}/>
    {showSearch&&<div className="search-overlay" onClick={()=>setShowSearch(false)}><div className="search-modal" onClick={e=>e.stopPropagation()}><input className="search-input" placeholder="Buscar tareas..." autoFocus onKeyDown={e=>{if(e.key==='Escape')setShowSearch(false)}}/></div></div>}
    <div className="print-footer">BuildPlan Viewer — Bauvek · {new Date().toLocaleDateString('es-AR')}</div>
  </Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
