<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
/* ═══════ Enterprise field mapping ═══════ */
const ENT={
  'b408001':{n:'Salud',t:'guid'},'b408007':{n:'Tableros',t:'guid'},'b408008':{n:'Nivel',t:'guid'},
  'b40800a':{n:'Rubro',t:'guid'},'b40800c':{n:'N° Item',t:'text'},'b40800e':{n:'Contratista',t:'text'},
  'b608003':{n:'Zona',t:'guid'},'b60800b':{n:'Jefe Obra',t:'guid'},
};

/* ═══════ Project metadata from Excel ═══════ */
const CITY_COORDS={
  'mendiolaza':{lat:-31.317,lng:-64.290,label:'Mendiolaza'},
  'mendiolaza - el terrón':{lat:-31.305,lng:-64.295,label:'Mendiolaza - El Terrón'},
  'mendiolaza - q2':{lat:-31.310,lng:-64.285,label:'Mendiolaza - Q2'},
  'la calera - vistas de la deseada':{lat:-31.345,lng:-64.335,label:'La Calera'},
  'malagueño - cañitas':{lat:-31.463,lng:-64.358,label:'Malagueño'},
  'villa ciudad parque - molvento':{lat:-31.593,lng:-64.463,label:'Molvento'},
  'molvento':{lat:-31.593,lng:-64.463,label:'Molvento'},
};

function normalizeForMatch(s){
  return(s||'').toLowerCase().replace(/[_\-\s.]+/g,'').replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n').replace('.xml','');
}

async function loadProjectMeta(){
  try{
    const r=await fetch('data/Proyectos_Bauvek.xlsx?t='+Date.now());
    if(!r.ok) return[];
    const buf=await r.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    return rows.map(row=>{
      const city=(row['Ciudad / Localidad']||'').toLowerCase();
      const coordEntry=CITY_COORDS[city];
      return{
        proyecto:row['Proyecto']||'',
        estado:row['Estado']||'',
        cicloVida:row['Ciclo de Vida']||'',
        provincia:row['Provincia']||'',
        ciudad:row['Ciudad / Localidad']||'',
        comitente:row['Comitente']||'',
        m2Cubierta:row['m² Construidos cubierta']||0,
        m2Semi:row['m² Construidos semicubierta']||0,
        m2Terreno:row['m² Terreno']||0,
        archivoXML:row['Archivo XML']||'',
        contratista:row['Contratista Principal']||'',
        lat:coordEntry?.lat||null,
        lng:coordEntry?.lng||null,
        cityLabel:coordEntry?.label||row['Ciudad / Localidad']||'',
        _norm:normalizeForMatch(row['Proyecto']),
      };
    });
  }catch(e){console.warn('No se pudo cargar metadata:',e);return[]}
}

function matchMeta(projectName,metaList){
  if(!metaList||!metaList.length) return null;
  const norm=normalizeForMatch(projectName);
  /* Try exact contains match */
  let best=metaList.find(m=>norm.includes(m._norm)||m._norm.includes(norm));
  if(!best){
    /* Try partial: first word match */
    const words=norm.replace(/vivienda|loteo|losa|proyecto|casa/g,'').trim();
    if(words.length>2) best=metaList.find(m=>m._norm.includes(words)||words.includes(m._norm.replace(/vivienda|loteo|losa|proyecto|casa/g,'').trim()));
  }
  return best||null;
}

/* ═══════ Map Component ═══════ */
function CbaMap({projects,metaList,selectedCity,onSelectCity}){
  /* Group by city label */
  const cityGroups=useMemo(()=>{
    const map={};
    for(const p of projects){
      const m=matchMeta(p.name,metaList);
      if(!m||!m.lat) continue;
      const key=m.cityLabel;
      if(!map[key]) map[key]={label:key,lat:m.lat,lng:m.lng,count:0,projects:[]};
      map[key].count++;
      map[key].projects.push(p.name);
    }
    return Object.values(map);
  },[projects,metaList]);

  if(!cityGroups.length) return null;

  /* SVG viewport: map lat/lng to SVG x/y */
  const svgW=500,svgH=280;
  const minLat=-31.65,maxLat=-31.27,minLng=-64.50,maxLng=-64.22;
  const toX=lng=>(lng-minLng)/(maxLng-minLng)*svgW;
  const toY=lat=>(lat-minLat)/(maxLat-minLat)*svgH;

  /* Córdoba capital reference point */
  const cbaX=toX(-64.18),cbaY=toY(-31.42);

  return(
    <div className="map-section">
      <div className="map-header">
        <span>📍 Ubicación de obras — Córdoba</span>
        {selectedCity&&<button className="clear-btn" onClick={()=>onSelectCity(null)}>Mostrar todas</button>}
      </div>
      <div className="map-body">
        <svg viewBox={`-10 -10 ${svgW+20} ${svgH+20}`} width="100%" height="auto" style={{maxWidth:svgW,maxHeight:svgH}}>
          {/* Background */}
          <rect x="-10" y="-10" width={svgW+20} height={svgH+20} fill="var(--bg-1)" rx="4"/>

          {/* Reference: Córdoba capital */}
          <circle cx={cbaX} cy={cbaY} r="3" fill="var(--c2)" opacity=".4"/>
          <text x={cbaX+6} y={cbaY+3} className="map-ref">Córdoba capital</text>

          {/* Reference: Ruta E53 approximate line */}
          <line x1={toX(-64.45)} y1={toY(-31.60)} x2={toX(-64.22)} y2={toY(-31.30)} stroke="var(--b0)" strokeWidth="1.5" strokeDasharray="4,3"/>
          <text x={toX(-64.44)} y={toY(-31.58)} className="map-ref">Sierras Chicas</text>

          {/* City dots */}
          {cityGroups.map(c=>{
            const x=toX(c.lng),y=toY(c.lat);
            const isSelected=selectedCity===c.label;
            const r=Math.max(6,Math.min(12,c.count*3+4));
            return(
              <g key={c.label} onClick={()=>onSelectCity(isSelected?null:c.label)} style={{cursor:'pointer'}}>
                <circle cx={x} cy={y} r={r+3} fill={isSelected?'var(--ac)':'var(--ac)'} opacity={isSelected?.2:.08}/>
                <circle cx={x} cy={y} r={r} fill={isSelected?'var(--ac)':'var(--ac)'} opacity={isSelected?1:.7} className="map-dot"/>
                <text x={x} y={y+3.5} textAnchor="middle" className="map-count">{c.count}</text>
                <text x={x} y={y+r+12} textAnchor="middle" className="map-label" style={{fontWeight:isSelected?700:400,fill:isSelected?'var(--ac)':'var(--c1)'}}>{c.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
    </div>
  );
}

/* ═══════ PARSER MSPDI ═══════ */
function parseMSPDI(xmlText){
  const p=new DOMParser(),doc=p.parseFromString(xmlText,'text/xml');
  const ns=doc.documentElement.namespaceURI;
  const g=(el,tag)=>{const e=ns?el.getElementsByTagNameNS(ns,tag)[0]:el.getElementsByTagName(tag)[0];return e?e.textContent.trim():''};
  const ga=(el,tag)=>ns?el.getElementsByTagNameNS(ns,tag):el.getElementsByTagName(tag);

  /* ExtendedAttribute definitions */
  const eaDefs={};
  for(const ea of ga(doc,'ExtendedAttribute')){
    const fid=g(ea,'FieldID'),fn=g(ea,'FieldName'),al=g(ea,'Alias');
    if(fid) eaDefs[fid]={fn,al:al||fn};
  }

  /* Resources */
  const res={};
  for(const r of ga(doc,'Resource')){const uid=g(r,'UID'),nm=g(r,'Name');if(uid&&nm)res[uid]={uid,name:nm}}

  /* Assignment map */
  const trMap={};
  for(const a of ga(doc,'Assignment')){
    const tu=g(a,'TaskUID'),ru=g(a,'ResourceUID');
    if(tu&&ru&&res[ru]){if(!trMap[tu])trMap[tu]=[];trMap[tu].push(res[ru].name)}
  }

  /* Parse tasks */
  const tasks=[];
  for(const t of ga(doc,'Task')){
    const uid=g(t,'UID');if(uid==='0')continue;
    const nm=g(t,'Name')||'(sin nombre)';
    const st=g(t,'Start'),fn=g(t,'Finish'),dur=g(t,'Duration');
    const pct=parseInt(g(t,'PercentComplete')||'0',10);
    const ol=parseInt(g(t,'OutlineLevel')||'0',10);
    const isSm=g(t,'Summary')==='1',isMs=g(t,'Milestone')==='1';
    const wbs=g(t,'WBS'),crit=g(t,'Critical')==='1';

    /* Duration → days */
    let durDays=0;
    if(dur){const m=dur.match(/PT(\d+)H/);if(m)durDays=Math.round(parseInt(m[1])/8)}

    /* Predecessors */
    const preds=[];
    for(const pl of ga(t,'PredecessorLink')){
      const pu=g(pl,'PredecessorUID'),ty=g(pl,'Type')||'1';
      const ls=g(pl,'LinkLag')||'0',lf=g(pl,'LagFormat')||'7';
      const tm={'0':'FF','1':'FS','2':'SF','3':'SS'};
      let ld=parseInt(ls,10);if(lf==='7')ld=ld/10;else if(['3','5','6'].includes(lf))ld=ld/4800;
      preds.push({taskUid:pu,type:tm[ty]||'FS',lagDays:Math.round(ld)});
    }

    /* Baselines */
    const bls=[];
    for(const b of ga(t,'Baseline')){
      const bn=g(b,'Number'),bs=g(b,'Start'),bf=g(b,'Finish');
      if(bs||bf)bls.push({number:parseInt(bn||'0',10),start:bs?new Date(bs):null,finish:bf?new Date(bf):null});
    }

    /* Enterprise custom fields */
    const ent={};
    for(const[hex,info] of Object.entries(ENT)){
      const el=ns?t.getElementsByTagNameNS(ns,hex)[0]:t.getElementsByTagName(hex)[0];
      if(el&&el.textContent){
        const v=el.textContent.trim();
        if(v&&v!=='None')ent[info.n]={value:v,guid:info.t==='guid'};
      }
    }
    /* Standard ExtendedAttribute */
    for(const ea of ga(t,'ExtendedAttribute')){
      const fid=g(ea,'FieldID'),val=g(ea,'Value');
      if(fid&&val){const d=eaDefs[fid];ent[d?(d.al||d.fn):`F${fid}`]={value:val,guid:false}}
    }

    tasks.push({
      uid,name:nm,start:st?new Date(st):null,finish:fn?new Date(fn):null,
      duration:dur,durDays,percentComplete:pct,outlineLevel:ol,
      isSummary:isSm,isMilestone:isMs,wbs,critical:crit,
      resources:trMap[uid]||[],predecessors:preds,baselines:bls,ent,
      children:[],depth:0
    });
  }

  /* Hierarchy */
  const roots=[];const stk=[];
  for(const t of tasks){
    while(stk.length&&stk[stk.length-1].outlineLevel>=t.outlineLevel)stk.pop();
    if(stk.length){stk[stk.length-1].children.push(t);t.parent=stk[stk.length-1]}else roots.push(t);
    if(t.isSummary)stk.push(t);
  }
  function flat(list,d=0){const r=[];for(const t of list){t.depth=d;r.push(t);if(t.children.length)r.push(...flat(t.children,d+1))}return r}
  const allTasks=flat(roots);
  const uidMap={};for(const t of allTasks)uidMap[t.uid]=t;

  let minD=null,maxD=null;
  for(const t of allTasks){
    if(t.start&&(!minD||t.start<minD))minD=t.start;
    if(t.finish&&(!maxD||t.finish>maxD))maxD=t.finish;
    for(const b of t.baselines){
      if(b.start&&(!minD||b.start<minD))minD=b.start;
      if(b.finish&&(!maxD||b.finish>maxD))maxD=b.finish;
    }
  }

  const resList=[...new Set(allTasks.flatMap(t=>t.resources))].sort();
  const hasBL=allTasks.some(t=>t.baselines.length>0);
  const contractors=new Set();
  for(const t of allTasks){const c=t.ent['Contratista'];if(c&&!c.guid&&c.value)contractors.add(c.value)}

  return{tasks:allTasks,roots,uidMap,resources:resList,rawRes:Object.values(res),
    minDate:minD,maxDate:maxD,hasBL,contractors:[...contractors].sort()};
}

/* ═══════ Utilities ═══════ */
function fD(d){if(!d)return'—';return d.toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'2-digit'})}
function dB(a,b){if(!a||!b)return 0;return Math.round((b-a)/86400000)}
function isOv(t){return!!(t.finish&&t.percentComplete<100&&!t.isSummary&&t.finish<new Date())}
function gSt(t){if(t.percentComplete>=100)return'ok';if(isOv(t))return'ov';if(t.percentComplete>0)return'ip';return'pe'}
function stC(s){return s==='ok'?'var(--ok)':s==='ov'?'var(--err)':s==='ip'?'var(--warn)':'var(--c2)'}
function stL(s){return s==='ok'?'Completada':s==='ov'?'Vencida':s==='ip'?'En curso':'Pendiente'}
function fDur(d){if(!d)return'—';const m=d.match(/PT(\d+)H/);if(!m)return'—';const h=parseInt(m[1]);const dy=Math.round(h/8);return dy===0?'0d':`${dy}d`}
function entV(t,k){const e=t.ent[k];return e&&!e.guid?e.value:''}
/* ═══════ Theme ═══════ */
function useTheme(){
  const[th,setTh]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',th)},[th]);
  return[th,useCallback(()=>setTh(t=>t==='light'?'dark':'light'),[])];
}

/* ═══════ Zoom ═══════ */
const ZM={day:{l:'Día',w:28},week:{l:'Semana',w:8},month:{l:'Mes',w:2.5},qtr:{l:'Trim.',w:.8}};

function Tooltip({info}){
  if(!info)return null;
  const{task:t,x,y}=info;const s=gSt(t);const bl=t.baselines.length?t.baselines[0]:null;
  const ef=Object.entries(t.ent).filter(([,v])=>!v.guid);
  return <div className="tt" style={{left:Math.min(x,window.innerWidth-300),top:Math.max(y-150,10)}}>
    <div className="tn">{t.name}</div>
    {t.wbs&&<div className="tr"><span className="tl">WBS</span><span className="tv">{t.wbs}</span></div>}
    <div className="tr"><span className="tl">Estado</span><span className="tv" style={{color:stC(s)}}>{stL(s)}</span></div>
    <div className="tr"><span className="tl">Inicio</span><span className="tv">{fD(t.start)}</span></div>
    <div className="tr"><span className="tl">Fin</span><span className="tv">{fD(t.finish)}</span></div>
    <div className="tr"><span className="tl">Duración</span><span className="tv">{fDur(t.duration)}</span></div>
    <div className="tr"><span className="tl">Avance</span><span className="tv">{t.percentComplete}%</span></div>
    {t.critical&&<div className="tr"><span className="tl">Ruta crítica</span><span className="tv" style={{color:'var(--err)'}}>Sí</span></div>}
    {t.resources.length>0&&<div className="tr"><span className="tl">Recurso</span><span className="tv">{t.resources.join(', ')}</span></div>}
    {ef.map(([k,v])=><div key={k} className="tr"><span className="tl">{k}</span><span className="tv">{v.value}</span></div>)}
    {bl&&<Fragment>
      <div style={{borderTop:'1px solid var(--b1)',margin:'4px 0',fontSize:10,color:'var(--c2)',paddingTop:3}}>Línea base {bl.number}</div>
      <div className="tr"><span className="tl">Inicio LB</span><span className="tv">{fD(bl.start)}</span></div>
      <div className="tr"><span className="tl">Fin LB</span><span className="tv">{fD(bl.finish)}</span></div>
      {t.finish&&bl.finish&&<div className="tr"><span className="tl">Desvío</span><span className="tv" style={{color:t.finish>bl.finish?'var(--err)':'var(--ok)'}}>{dB(bl.finish,t.finish)} días</span></div>}
    </Fragment>}
  </div>;
}
/* ═══════ GANTT SVG ═══════ */
function GanttSVG({tasks,minDate,maxDate,zoom,showArr,showBL,scrollRef,onTT}){
  const cRef=useRef(null);
  const scrolling=useRef(false);
  const rowH=28,hdrH=44;
  const dW=ZM[zoom].w;
  const padB=zoom==='day'?3:zoom==='week'?7:14;
  const padA=zoom==='day'?7:zoom==='week'?14:30;

  const cStart=useMemo(()=>{const d=new Date(minDate||new Date());d.setDate(d.getDate()-padB);return d},[minDate,padB]);
  const cEnd=useMemo(()=>{const d=new Date(maxDate||new Date());d.setDate(d.getDate()+padA);return d},[maxDate,padA]);
  const totD=dB(cStart,cEnd);
  const totW=Math.max(totD*dW,600);
  const totH=tasks.length*rowH;
  const d2x=useCallback(d=>{if(!d)return 0;return dB(cStart,d)*dW},[cStart,dW]);

  /* Scroll sync — ref based, no state */
  const onScroll=useCallback(e=>{if(scrolling.current)return;scrollRef.current={v:e.target.scrollTop,src:'chart'}},[scrollRef]);
  useEffect(()=>{let r;const s=()=>{const el=cRef.current;if(el&&scrollRef.current?.src==='table'){scrolling.current=true;el.scrollTop=scrollRef.current.v;scrollRef.current.src=null;requestAnimationFrame(()=>{scrolling.current=false})};r=requestAnimationFrame(s)};r=requestAnimationFrame(s);return()=>cancelAnimationFrame(r)},[scrollRef]);

  const now=new Date();const nowX=d2x(now);const showNow=now>=cStart&&now<=cEnd;

  /* Grid lines */
  const grid=useMemo(()=>{
    const ln=[],h1=[],h2=[];const d=new Date(cStart);
    if(zoom==='day'){while(d<=cEnd){const x=d2x(d);ln.push({x,we:d.getDay()===0||d.getDay()===6,mj:d.getDay()===1});h2.push({x,w:dW,l:d.getDate().toString()});if(d.getDate()===1||(d.getDay()===1&&!h1.length))h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});d.setDate(d.getDate()+1)}}
    else if(zoom==='week'){let lm=-1;while(d<=cEnd){const x=d2x(d);if(d.getDay()===1||d.getTime()===cStart.getTime()){ln.push({x,mj:d.getDate()<=7});h2.push({x,w:dW*7,l:d.getDate().toString()})}if(d.getMonth()!==lm){h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});lm=d.getMonth()}d.setDate(d.getDate()+1)}}
    else if(zoom==='month'){let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);ln.push({x,mj:d.getMonth()===0});const dm=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h2.push({x,w:dm*dW,l:d.toLocaleDateString('es-AR',{month:'short'})});if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    else{let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);if(d.getMonth()%3===0){ln.push({x,mj:d.getMonth()===0});h2.push({x,w:90*dW,l:`T${Math.floor(d.getMonth()/3)+1}`})}if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    return{ln,h1,h2};
  },[cStart,cEnd,zoom,dW,d2x]);

  /* Bar positions */
  const bp=useMemo(()=>{const m={};tasks.forEach((t,i)=>{const y=i*rowH,cy=y+rowH/2;if(t.isMilestone){const mx=d2x(t.start||t.finish);m[t.uid]={x:mx,y,cy,w:0,sx:mx,ex:mx}}else if(t.start&&t.finish){const x1=d2x(t.start),x2=d2x(t.finish),w=Math.max(x2-x1,2);m[t.uid]={x:x1,y,cy,w,sx:x1,ex:x1+w}}});return m},[tasks,d2x]);

  /* Dependency arrows */
  const arrs=useMemo(()=>{if(!showArr)return[];const r=[];for(const t of tasks){for(const pr of t.predecessors){const f=bp[pr.taskUid],tp=bp[t.uid];if(!f||!tp)continue;let fx,fy,tx,ty;switch(pr.type){case'FS':fx=f.ex;fy=f.cy;tx=tp.sx;ty=tp.cy;break;case'FF':fx=f.ex;fy=f.cy;tx=tp.ex;ty=tp.cy;break;case'SS':fx=f.sx;fy=f.cy;tx=tp.sx;ty=tp.cy;break;default:fx=f.sx;fy=f.cy;tx=tp.ex;ty=tp.cy}const g=8;let pa;if(pr.type==='FS'){if(tx>fx+g){if(Math.abs(fy-ty)<2)pa=`M${fx},${fy} L${tx},${ty}`;else{const mx=(fx+tx)/2;pa=`M${fx},${fy} L${mx},${fy} L${mx},${ty} L${tx},${ty}`}}else{const dy=fy<ty?Math.max(fy,ty)+rowH*.6:Math.min(fy,ty)-rowH*.6;pa=`M${fx},${fy} L${fx+g},${fy} L${fx+g},${dy} L${tx-g},${dy} L${tx-g},${ty} L${tx},${ty}`}}else if(pr.type==='SS'){const lx=Math.min(fx,tx)-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}else if(pr.type==='FF'){const rx=Math.max(fx,tx)+g;pa=`M${fx},${fy} L${rx},${fy} L${rx},${ty} L${tx},${ty}`}else{const lx=fx-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}r.push({pa,tx,ty})}}return r},[tasks,bp,showArr]);

  const bEnter=useCallback((e,t)=>{const r=e.currentTarget.getBoundingClientRect();onTT({task:t,x:r.left+r.width/2,y:r.top-4})},[onTT]);
  const bLeave=useCallback(()=>onTT(null),[onTT]);

  return(
    <div ref={cRef} className="gcc" onScroll={onScroll}>
      <svg width={totW} height={totH+hdrH} style={{display:'block'}}>
        <rect x="0" y="0" width={totW} height={hdrH} fill="var(--bg-1)"/>
        <line x1="0" y1={hdrH} x2={totW} y2={hdrH} stroke="var(--b0)"/>
        {grid.h1.map((h,i)=><text key={i} x={h.x+4} y={16} fontSize="10" fontWeight="600" fill="var(--c1)" fontFamily="var(--ff)">{h.l}</text>)}
        {grid.h2.map((h,i)=><text key={i} x={h.x+(h.w?h.w/2:4)} y={34} fontSize="10" fill="var(--c2)" fontFamily="var(--fm)" textAnchor={h.w?'middle':'start'}>{h.l}</text>)}
        {grid.ln.map((l,i)=><line key={i} x1={l.x} y1={hdrH} x2={l.x} y2={totH+hdrH} stroke={l.mj?'var(--b0)':'var(--b1)'} strokeWidth={l.mj?1:.5} strokeDasharray={l.mj?'none':'2,4'}/>)}
        {zoom==='day'&&grid.ln.filter(l=>l.we).map((l,i)=><rect key={i} x={l.x} y={hdrH} width={dW} height={totH} fill="var(--c2)" opacity=".04"/>)}
        {tasks.map((_,i)=><line key={i} x1="0" y1={hdrH+(i+1)*rowH} x2={totW} y2={hdrH+(i+1)*rowH} stroke="var(--b1)" strokeWidth=".5"/>)}
        {arrs.map((a,i)=><g key={i}><path d={a.pa} fill="none" stroke="var(--arr)" strokeWidth="1" transform={`translate(0,${hdrH})`}/><polygon points={`${a.tx},${a.ty+hdrH} ${a.tx-4},${a.ty-3+hdrH} ${a.tx-4},${a.ty+3+hdrH}`} fill="var(--arr-h)" opacity=".5"/></g>)}
        {showNow&&<g><line x1={nowX} y1={hdrH} x2={nowX} y2={totH+hdrH} stroke="var(--today)" strokeWidth="1.5" strokeDasharray="4,3"/><rect x={nowX-16} y={hdrH-14} width="32" height="13" rx="2" fill="var(--today)"/><text x={nowX} y={hdrH-5} textAnchor="middle" fontSize="9" fontWeight="600" fill="white" fontFamily="var(--ff)">HOY</text></g>}
        {tasks.map((t,i)=>{
          const y=hdrH+i*rowH,cy=y+rowH/2;
          let blEl=null;
          if(showBL&&t.baselines.length>0){const b=t.baselines[0];if(b.start&&b.finish&&!t.isMilestone){const bx=d2x(b.start),bw=Math.max(d2x(b.finish)-bx,2);blEl=<rect x={bx} y={cy+5} width={bw} height={3} fill="var(--bar-bl)" rx="1.5" opacity=".5"/>}}
          if(t.isMilestone){const mx=d2x(t.start||t.finish),sz=5,c=isOv(t)?'var(--bar-ov)':'var(--bar-ms)';return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<polygon points={`${mx},${cy-sz} ${mx+sz},${cy} ${mx},${cy+sz} ${mx-sz},${cy}`} fill={c}/></g>}
          if(!t.start||!t.finish)return blEl?<g key={t.uid}>{blEl}</g>:null;
          const x=d2x(t.start),w=Math.max(d2x(t.finish)-x,2),bH=t.isSummary?6:10,bY=cy-bH/2,p=t.percentComplete,ov=isOv(t),dn=p>=100;
          let bg='var(--bar-bg)',fg='var(--bar)';if(ov){bg='var(--bar-ov-bg)';fg='var(--bar-ov)'}else if(dn){bg='var(--bar-ok-bg)';fg='var(--bar-ok)'}
          if(t.isSummary)return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill="var(--bar-sum)" rx="1" opacity=".7"/><rect x={x} y={bY} width={w*p/100} height={bH} fill="var(--bar-sum)" rx="1"/><path d={`M${x},${bY} L${x},${bY+bH+3} L${x+4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/><path d={`M${x+w},${bY} L${x+w},${bY+bH+3} L${x+w-4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/></g>;
          return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill={bg} rx="3"/><rect x={x} y={bY} width={Math.max(w*p/100,0)} height={bH} fill={fg} rx="3"/>{w>30&&p>0&&<text x={x+4} y={cy+3} fontSize="8" fontWeight="600" fill={fg} fontFamily="var(--fm)" opacity=".8">{p}%</text>}</g>;
        })}
      </svg>
    </div>
  );
}
/* ═══════ Dashboard por proyecto ═══════ */
function ProjDash({data}){
  if(!data)return null;
  const ts=data.tasks.filter(t=>!t.isSummary);
  const tot=ts.length,done=ts.filter(t=>t.percentComplete>=100).length;
  const ip=ts.filter(t=>t.percentComplete>0&&t.percentComplete<100).length;
  const ov=ts.filter(t=>isOv(t)).length;
  const avg=tot?Math.round(ts.reduce((s,t)=>s+t.percentComplete,0)/tot):0;

  const cMap={};
  ts.forEach(t=>{const c=entV(t,'Contratista')||'Sin contratista';if(!cMap[c])cMap[c]={tot:0,done:0,ov:0};cMap[c].tot++;if(t.percentComplete>=100)cMap[c].done++;if(isOv(t))cMap[c].ov++});

  const upcoming=ts.filter(t=>t.finish&&t.finish>=new Date()&&t.percentComplete<100).sort((a,b)=>a.finish-b.finish).slice(0,10);

  return <div className="dash">
    <div className="dgrid">
      <div className="kpi"><div className="kpi-v">{tot}</div><div className="kpi-l">Tareas</div></div>
      <div className="kpi ok"><div className="kpi-v" style={{color:'var(--ok)'}}>{done}</div><div className="kpi-l">Completadas</div></div>
      <div className="kpi warn"><div className="kpi-v" style={{color:'var(--warn)'}}>{ip}</div><div className="kpi-l">En curso</div></div>
      <div className="kpi err"><div className="kpi-v" style={{color:'var(--err)'}}>{ov}</div><div className="kpi-l">Vencidas</div></div>
      <div className="kpi"><div className="kpi-v">{avg}%</div><div className="kpi-l">Avance</div></div>
    </div>
    <div style={{marginBottom:20,background:'var(--bg-el)',border:'1px solid var(--b1)',borderRadius:'var(--r-m)',padding:14}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{fontSize:12,fontWeight:600}}>Avance general</span><span style={{fontSize:12,fontFamily:'var(--fm)',color:'var(--ac)',fontWeight:600}}>{avg}%</span></div>
      <div style={{height:8,borderRadius:4,background:'var(--bg-2)',overflow:'hidden'}}><div style={{height:'100%',borderRadius:4,width:`${avg}%`,background:'var(--ac)'}}/></div>
    </div>
    {Object.keys(cMap).length>1&&<div style={{marginBottom:20}}>
      <div className="dst">Carga por contratista</div>
      <table className="dt"><thead><tr><th>Contratista</th><th style={{width:60}}>Total</th><th style={{width:80}}>Hechas</th><th style={{width:70}}>Vencidas</th></tr></thead>
      <tbody>{Object.entries(cMap).sort((a,b)=>b[1].tot-a[1].tot).map(([n,d])=><tr key={n}><td style={{fontWeight:500}}>{n}</td><td className="mono">{d.tot}</td><td className="mono" style={{color:'var(--ok)'}}>{d.done}</td><td className="mono" style={{color:d.ov?'var(--err)':'var(--c2)'}}>{d.ov}</td></tr>)}</tbody></table>
    </div>}
    {upcoming.length>0&&<div><div className="dst">Próximas entregas</div>
      <table className="dt"><thead><tr><th>Tarea</th><th style={{width:85}}>Fin</th><th style={{width:45}}>%</th><th style={{width:95}}>Contratista</th><th style={{width:80}}>Recurso</th></tr></thead>
      <tbody>{upcoming.map(t=><tr key={t.uid}><td style={{fontWeight:500}}>{t.name}</td><td className="mono">{fD(t.finish)}</td><td className="mono">{t.percentComplete}%</td><td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Contratista')||'—'}</td><td style={{fontSize:11,color:'var(--c1)'}}>{t.resources.join(', ')||'—'}</td></tr>)}</tbody></table>
    </div>}
  </div>;
}

/* ═══════ Demoras sub-tab ═══════ */
function DemorasView({data}){
  if(!data)return null;
  const[view,setView]=useState('table');
  const[sortCol,setSortCol]=useState('devFin');
  const[sortDir,setSortDir]=useState('desc');

  const rows=useMemo(()=>{
    return data.tasks.filter(t=>!t.isSummary&&t.baselines.length>0).map(t=>{
      const bl=t.baselines[0];
      const devStart=t.start&&bl.start?dB(bl.start,t.start):null;
      const devFin=t.finish&&bl.finish?dB(bl.finish,t.finish):null;
      return{...t,blStart:bl.start,blFinish:bl.finish,blNum:bl.number,devStart,devFin};
    });
  },[data.tasks]);

  const sorted=useMemo(()=>{
    const r=[...rows];
    r.sort((a,b)=>{
      let va=a[sortCol],vb=b[sortCol];
      if(va===null)va=sortDir==='desc'?-Infinity:Infinity;
      if(vb===null)vb=sortDir==='desc'?-Infinity:Infinity;
      return sortDir==='desc'?vb-va:va-vb;
    });
    return r;
  },[rows,sortCol,sortDir]);

  const doSort=col=>{if(sortCol===col)setSortDir(d=>d==='desc'?'asc':'desc');else{setSortCol(col);setSortDir('desc')}};

  /* KPIs */
  const withDev=rows.filter(r=>r.devFin!==null);
  const onTime=withDev.filter(r=>Math.abs(r.devFin)<=2).length;
  const late=withDev.filter(r=>r.devFin>2).length;
  const early=withDev.filter(r=>r.devFin<-2).length;
  const avgDev=withDev.length?Math.round(withDev.reduce((s,r)=>s+r.devFin,0)/withDev.length):0;

  if(!rows.length)return <div className="dash"><div style={{textAlign:'center',color:'var(--c2)',padding:40}}>Este proyecto no tiene datos de línea base en el XML. Para ver demoras, se necesita guardar al menos una línea base en MS Project antes de exportar.</div></div>;

  return <div className="dash">
    <div className="dgrid">
      <div className="kpi"><div className="kpi-v">{rows.length}</div><div className="kpi-l">Con baseline</div></div>
      <div className="kpi ok"><div className="kpi-v" style={{color:'var(--ok)'}}>{onTime}</div><div className="kpi-l">En fecha (±2d)</div></div>
      <div className="kpi err"><div className="kpi-v" style={{color:'var(--err)'}}>{late}</div><div className="kpi-l">Atrasadas</div></div>
      <div className="kpi" style={{borderLeftColor:early?'var(--ok)':'var(--c2)'}}><div className="kpi-v" style={{color:'var(--ok)'}}>{early}</div><div className="kpi-l">Adelantadas</div></div>
      <div className="kpi" style={{borderLeftColor:avgDev>0?'var(--err)':avgDev<0?'var(--ok)':'var(--c2)'}}><div className="kpi-v" style={{color:avgDev>0?'var(--err)':avgDev<0?'var(--ok)':'var(--c0)'}}>{avgDev>0?'+':''}{avgDev}d</div><div className="kpi-l">Desvío promedio</div></div>
    </div>

    <div style={{marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
      <div className="dst" style={{margin:0}}>Detalle de desvíos — Línea base {rows[0]?.blNum}</div>
    </div>

    <table className="dt">
      <thead><tr>
        <th style={{cursor:'pointer'}} onClick={()=>doSort('name')}>Tarea</th>
        <th style={{width:80,cursor:'pointer'}} onClick={()=>doSort('blStart')}>Inicio LB</th>
        <th style={{width:80}}>Inicio real</th>
        <th style={{width:80,cursor:'pointer'}} onClick={()=>doSort('blFinish')}>Fin LB</th>
        <th style={{width:80}}>Fin real</th>
        <th style={{width:65,cursor:'pointer'}} onClick={()=>doSort('devStart')}>Δ Inicio</th>
        <th style={{width:65,cursor:'pointer'}} onClick={()=>doSort('devFin')}>Δ Fin {sortCol==='devFin'?(sortDir==='desc'?'↓':'↑'):''}</th>
        <th style={{width:45}}>%</th>
        <th style={{width:90}}>Contratista</th>
      </tr></thead>
      <tbody>{sorted.map(r=>(
        <tr key={r.uid}>
          <td style={{fontWeight:500}}>{r.name}</td>
          <td className="mono">{fD(r.blStart)}</td>
          <td className="mono">{fD(r.start)}</td>
          <td className="mono">{fD(r.blFinish)}</td>
          <td className="mono">{fD(r.finish)}</td>
          <td className="mono">{r.devStart!==null?<span className={r.devStart>2?'dev-pos':r.devStart<-2?'dev-neg':'dev-zero'}>{r.devStart>0?'+':''}{r.devStart}d</span>:'—'}</td>
          <td className="mono">{r.devFin!==null?<span className={r.devFin>2?'dev-pos':r.devFin<-2?'dev-neg':'dev-zero'}>{r.devFin>0?'+':''}{r.devFin}d</span>:'—'}</td>
          <td className="mono">{r.percentComplete}%</td>
          <td style={{fontSize:11,color:'var(--c1)'}}>{entV(r,'Contratista')||'—'}</td>
        </tr>
      ))}</tbody>
    </table>

    {/* Breakdown por contratista */}
    {(()=>{
      const cm={};
      rows.forEach(r=>{const c=entV(r,'Contratista')||'Sin contratista';if(!cm[c])cm[c]={tot:0,late:0,early:0,sumDev:0};cm[c].tot++;if(r.devFin>2)cm[c].late++;if(r.devFin<-2)cm[c].early++;cm[c].sumDev+=(r.devFin||0)});
      const entries=Object.entries(cm).sort((a,b)=>b[1].tot-a[1].tot);
      if(entries.length<2)return null;
      return <div style={{marginTop:20}}>
        <div className="dst">Desvío por contratista</div>
        <table className="dt"><thead><tr><th>Contratista</th><th style={{width:50}}>Tareas</th><th style={{width:70}}>Atrasadas</th><th style={{width:75}}>Adelantadas</th><th style={{width:75}}>Desvío prom.</th></tr></thead>
        <tbody>{entries.map(([n,d])=>{const avg2=d.tot?Math.round(d.sumDev/d.tot):0;return <tr key={n}><td style={{fontWeight:500}}>{n}</td><td className="mono">{d.tot}</td><td className="mono" style={{color:d.late?'var(--err)':'var(--c2)'}}>{d.late}</td><td className="mono" style={{color:d.early?'var(--ok)':'var(--c2)'}}>{d.early}</td><td className="mono"><span className={avg2>2?'dev-pos':avg2<-2?'dev-neg':'dev-zero'}>{avg2>0?'+':''}{avg2}d</span></td></tr>})}</tbody></table>
      </div>;
    })()}
  </div>;
}

/* ═══════ Portfolio cross-project ═══════ */
function Portfolio({projList,projData}){
  const[selC,setSelC]=useState(null);
  const all=useMemo(()=>{
    const cs={};const ps=[];
    for(const p of projList){
      const d=projData[p.key];if(!d)continue;
      const ns=d.tasks.filter(t=>!t.isSummary);
      ps.push({name:p.name,key:p.key,tot:ns.length,done:ns.filter(t=>t.percentComplete>=100).length,ov:ns.filter(t=>isOv(t)).length,avg:ns.length?Math.round(ns.reduce((s,t)=>s+t.percentComplete,0)/ns.length):0});
      for(const t of ns){
        const c=entV(t,'Contratista')||'Sin contratista';
        if(!cs[c])cs[c]={tasks:[],projs:new Set(),tot:0,done:0,ov:0,ip:0};
        cs[c].tasks.push({...t,pName:p.name,pKey:p.key});cs[c].projs.add(p.name);cs[c].tot++;
        if(t.percentComplete>=100)cs[c].done++;if(isOv(t))cs[c].ov++;if(t.percentComplete>0&&t.percentComplete<100)cs[c].ip++;
      }
    }
    return{cs,ps};
  },[projList,projData]);

  const cList=Object.entries(all.cs).sort((a,b)=>b[1].tot-a[1].tot);
  const sel=selC?all.cs[selC]:null;
  const byProj=useMemo(()=>{if(!sel)return[];const m={};for(const t of sel.tasks){if(!m[t.pName])m[t.pName]=[];m[t.pName].push(t)}return Object.entries(m)},[sel]);
  const loaded=Object.keys(projData).length;

  return <div className="dash">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <div className="dst" style={{margin:0}}>Portfolio — {loaded} proyectos cargados</div>
      {loaded===0&&<div style={{color:'var(--c2)',fontSize:12}}>Abrí proyectos desde la lista para verlos acá</div>}
    </div>
    {all.ps.length>0&&<div style={{marginBottom:20}}>
      <div className="dst">Proyectos</div>
      <table className="dt"><thead><tr><th>Proyecto</th><th style={{width:55}}>Tareas</th><th style={{width:55}}>Hechas</th><th style={{width:65}}>Vencidas</th><th style={{width:60}}>Avance</th></tr></thead>
      <tbody>{all.ps.map(p=><tr key={p.key}><td style={{fontWeight:500}}>{p.name}</td><td className="mono">{p.tot}</td><td className="mono" style={{color:'var(--ok)'}}>{p.done}</td><td className="mono" style={{color:p.ov?'var(--err)':'var(--c2)'}}>{p.ov}</td><td className="mono">{p.avg}%</td></tr>)}</tbody></table>
    </div>}
    {cList.length>0&&<Fragment>
      <div className="dst">Contratistas — clic para ver detalle</div>
      <div className="cgrid">
        {cList.map(([n,d])=><div key={n} className={`ccrd ${selC===n?'on':''}`} onClick={()=>setSelC(selC===n?null:n)}>
          <h4>{n}</h4>
          <div className="cstat"><span>Proyectos</span><span className="v">{d.projs.size}</span></div>
          <div className="cstat"><span>Tareas</span><span className="v">{d.tot}</span></div>
          <div className="cstat"><span>Completadas</span><span className="v" style={{color:'var(--ok)'}}>{d.done}</span></div>
          <div className="cstat"><span>Vencidas</span><span className="v" style={{color:d.ov?'var(--err)':'var(--c2)'}}>{d.ov}</span></div>
          <div style={{marginTop:6}}><div className="pm"><div className="pmb" style={{width:'100%'}}><div className="pmf" style={{width:`${d.tot?Math.round(d.done/d.tot*100):0}%`,background:'var(--ac)'}}/></div><span className="mono">{d.tot?Math.round(d.done/d.tot*100):0}%</span></div></div>
        </div>)}
      </div>
    </Fragment>}
    {sel&&<Fragment>
      <div className="dst">{selC} — detalle por proyecto</div>
      {byProj.map(([pn,tasks])=><div key={pn} style={{marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'var(--ac)'}}>{pn} ({tasks.length} tareas)</div>
        <table className="dt"><thead><tr><th>Tarea</th><th style={{width:85}}>Inicio</th><th style={{width:85}}>Fin</th><th style={{width:45}}>%</th><th style={{width:65}}>Estado</th><th style={{width:65}}>N° Item</th></tr></thead>
        <tbody>{tasks.sort((a,b)=>(a.start||new Date(0))-(b.start||new Date(0))).map(t=>{const s=gSt(t);return <tr key={t.uid}><td style={{fontWeight:500}}>{t.name}</td><td className="mono">{fD(t.start)}</td><td className="mono">{fD(t.finish)}</td><td className="mono">{t.percentComplete}%</td><td style={{color:stC(s),fontSize:11,fontWeight:500}}>{stL(s)}</td><td className="mono">{entV(t,'N° Item')||'—'}</td></tr>})}</tbody></table>
      </div>)}
    </Fragment>}
  </div>;
}

  const[tblW,setTblW]=useState(560);
  const[splOn,setSplOn]=useState(false);
  const[fSt,setFSt]=useState('all');
  const[fRes,setFRes]=useState('all');
  const[fCon,setFCon]=useState('all');
  const[fWbs,setFWbs]=useState(99);
  const[fDf,setFDf]=useState('');
  const[fDt,setFDt]=useState('');
  const[expMap,setExpMap]=useState({});
  const[dragO,setDragO]=useState(false);
  const[metaList,setMetaList]=useState([]);
  const[mapCity,setMapCity]=useState(null);

  const scrollRef=useRef({v:0,src:null});
  const tblRef=useRef(null);
  const tblScrolling=useRef(false);

  /* Load manifest + project metadata */
  useEffect(()=>{
    fetch('data/manifest.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
      const list=(d.projects||d||[]).map((p,i)=>({key:'srv_'+(p.file||p.name||i),name:p.name||(typeof p.file==='string'?p.file.replace('.xml',''):null)||`Proyecto ${i+1}`,file:typeof p==='string'?p:p.file,size:p.size||null,modified:p.modified||null}));
      setPList(list);
    }).catch(()=>setPList([]));
    loadProjectMeta().then(m=>setMetaList(m));
  },[]);

  useEffect(()=>{const h=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setShowSrch(s=>!s)}};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);

  const resetF=useCallback(()=>{setFSt('all');setFRes('all');setFCon('all');setFWbs(99);setFDf('');setFDt('')},[]);

  const openProj=useCallback(async(proj)=>{
    const k=proj.key;
    if(openTabs.includes(k)){setActive(k);return}
    if(!pData[k]&&!loading[k]){
      setLoading(p=>({...p,[k]:true}));
      setErrors(p=>{const n={...p};delete n[k];return n});
      try{
        const r=await fetch(`data/projects/${proj.file}?t=${Date.now()}`);
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const txt=await r.text();
        const d=parseMSPDI(txt);
        setPData(p=>({...p,[k]:d}));
        const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});
        setExpMap(p=>({...p,[k]:em}));
      }catch(e){setErrors(p=>({...p,[k]:e.message}))}
      finally{setLoading(p=>{const n={...p};delete n[k];return n})}
    }
    setOpen(p=>p.includes(k)?p:[...p,k]);
    setActive(k);setSub('gantt');resetF();
  },[openTabs,pData,loading,resetF]);

  const closeTab=useCallback((k,e)=>{e?.stopPropagation();setOpen(p=>{const n=p.filter(x=>x!==k);if(active===k)setActive(n.length?n[n.length-1]:null);return n})},[active]);

  const handleLocal=useCallback(file=>{
    const reader=new FileReader();
    reader.onload=e=>{try{
      const d=parseMSPDI(e.target.result);
      const k='loc_'+Date.now();
      const proj={key:k,name:file.name.replace('.xml',''),file:file.name,size:file.size,local:true};
      setPList(p=>[...(p||[]),proj]);setPData(p=>({...p,[k]:d}));
      const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});setExpMap(p=>({...p,[k]:em}));
      setOpen(p=>[...p,k]);setActive(k);setSub('gantt');resetF();
    }catch(err){console.error(err)}};
    reader.readAsText(file);
  },[resetF]);

  const togTask=useCallback((k,uid)=>{setExpMap(p=>{const m={...p[k]};m[uid]=!m[uid];return{...p,[k]:m}})},[]);
  const expAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=true});setExpMap(p=>({...p,[k]:m}))},[]);
  const colAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=false});setExpMap(p=>({...p,[k]:m}))},[]);

  const fCount=useMemo(()=>{let c=0;if(fSt!=='all')c++;if(fRes!=='all')c++;if(fCon!=='all')c++;if(fWbs<99)c++;if(fDf||fDt)c++;return c},[fSt,fRes,fCon,fWbs,fDf,fDt]);

  const aProj=useMemo(()=>(pList||[]).find(p=>p.key===active),[pList,active]);
  const aData=active?pData[active]:null;
  const aLoading=active?!!loading[active]:false;
  const aErr=active?errors[active]:null;

  /* Visible tasks with filters */
  const visTasks=useMemo(()=>{
    if(!aData)return[];
    const em=expMap[active]||{};
    const mf=t=>{
      if(fSt!=='all'&&gSt(t)!==fSt)return false;
      if(fRes!=='all'){if(fRes==='none'){if(t.resources.length>0)return false}else{if(!t.resources.includes(fRes))return false}}
      if(fCon!=='all'){const cv=entV(t,'Contratista');if(fCon==='none'){if(cv)return false}else{if(cv!==fCon)return false}}
      if(t.outlineLevel>fWbs)return false;
      if(fDf){const f=new Date(fDf);if(t.finish&&t.finish<f)return false}
      if(fDt){const f=new Date(fDt);if(t.start&&t.start>f)return false}
      return true;
    };
    const hm=t=>{if(mf(t))return true;for(const c of t.children)if(hm(c))return true;return false};
    const res=[];
    const proc=t=>{if(t.isSummary){if(!hm(t))return}else{if(!mf(t))return};res.push(t);if(t.isSummary&&em[t.uid]){for(const c of t.children)proc(c)}};
    for(const t of aData.roots||[])proc(t);
    return res;
  },[aData,active,expMap,fSt,fRes,fCon,fWbs,fDf,fDt]);

  /* Splitter */
  useEffect(()=>{if(!splOn)return;const mv=e=>setTblW(Math.max(300,Math.min(e.clientX,window.innerWidth-200)));const up=()=>setSplOn(false);document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);return()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)}},[splOn]);

  /* Table scroll sync */
  const onTblScroll=useCallback(e=>{if(tblScrolling.current)return;scrollRef.current={v:e.target.scrollTop,src:'table'}},[]);
  useEffect(()=>{let r;const s=()=>{const el=tblRef.current;if(el&&scrollRef.current?.src==='chart'){tblScrolling.current=true;el.scrollTop=scrollRef.current.v;scrollRef.current.src=null;requestAnimationFrame(()=>{tblScrolling.current=false})};r=requestAnimationFrame(s)};r=requestAnimationFrame(s);return()=>cancelAnimationFrame(r)},[]);

  /* Search */
  const SearchModal=useCallback(({onClose})=>{
    const[q,setQ]=useState('');const ref=useRef(null);
    useEffect(()=>{ref.current?.focus()},[]);
    const res=useMemo(()=>{if(!q.trim())return[];const lw=q.toLowerCase();const r=[];for(const p of(pList||[])){const d=pData[p.key];if(!d)continue;for(const t of d.tasks){if(t.name.toLowerCase().includes(lw)){r.push({t,pn:p.name});if(r.length>=20)return r}}}return r},[q,pList,pData]);
    return <div className="so" onClick={onClose}><div className="sm" onClick={e=>e.stopPropagation()}>
      <input ref={ref} className="si" placeholder="Buscar tareas..." value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Escape')onClose()}}/>
      <div className="sr">{res.map((r,i)=><div key={i} className="sri"><span style={{color:r.t.isMilestone?'var(--bar-ms)':'var(--c2)'}}>{r.t.isMilestone?'♦':'○'}</span><span style={{flex:1}}>{r.t.name}</span><span style={{color:'var(--c2)',fontSize:11}}>{r.pn}</span></div>)}
      {q.trim()&&!res.length&&<div style={{padding:16,textAlign:'center',color:'var(--c2)',fontSize:12}}>Sin resultados</div>}</div>
    </div></div>;
  },[pList,pData]);

  if(!pList)return <div className="ld"><div className="sp"/><span>Cargando...</span></div>;

  /* ═══ HOME ═══ */
  if(!active){
    const sp=(pList||[]).filter(p=>!p.local);
    /* Filter by map selection */
    const filteredSp=mapCity?sp.filter(p=>{const m=matchMeta(p.name,metaList);return m&&m.cityLabel===mapCity}):sp;

    return <Fragment>
      <div className="hdr">
        <a href="index.html" style={{color:'var(--c2)',fontSize:11,textDecoration:'none',marginRight:6}}>← BkTableros</a><div className="logo">{I.bld(18)} BuildPlan <span>360°</span></div>
        <div className="tabs">
          <button className="tab" onClick={()=>{setActive('__pf');setSub('portfolio')}} style={{color:'var(--ac)'}}>{I.usr()} Portfolio</button>
        </div>
        <div className="acts">
          <button className="btn btn-g btn-i" onClick={()=>setShowSrch(true)} title="Ctrl+K">{I.srch()}</button>
          <button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button>
        </div>
      </div>
      <div className="home">
        <div className="home-h">
          <div className="home-title">Proyectos</div>
          <div className="home-sub">{sp.length} obras{mapCity?` · filtrado: ${mapCity}`:''}</div>
        </div>

        {/* Map */}
        <CbaMap projects={sp} metaList={metaList} selectedCity={mapCity} onSelectCity={setMapCity}/>

        {/* Enhanced project cards */}
        <div className="pgrid2">
          {filteredSp.map(p=>{
            const m=matchMeta(p.name,metaList);
            const estado=m?.estado||'';
            const dotColor=estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':'var(--c2)';
            const stBg=estado==='Activo'?'rgba(16,185,129,.1)':estado==='En pausa'?'rgba(245,158,11,.1)':'rgba(139,146,165,.1)';
            const stColor=estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':'var(--c2)';
            const m2t=(m?.m2Cubierta||0)+(m?.m2Semi||0);
            return <div key={p.key} className="pcard2" onClick={()=>openProj(p)}>
              <div className="pcard2-top">
                <span className="pcard2-dot" style={{background:dotColor}}/>
                <span className="pcard2-name">{p.name}</span>
                {estado&&<span className="pcard2-status" style={{background:stBg,color:stColor}}>{estado}</span>}
              </div>
              <div className="pcard2-meta">
                {m?.ciudad&&<span>📍 {m.cityLabel||m.ciudad}</span>}
                {m2t>0&&<span>🏠 {Math.round(m2t)} m² cub</span>}
                {m?.m2Terreno>0&&<span>📐 {m.m2Terreno.toLocaleString('es-AR')} m² ter</span>}
                {m?.comitente&&<span>👤 {m.comitente}</span>}
              </div>
              {p.size&&<div className="pcard2-bottom"><span>{(p.size/1024).toFixed(0)} KB</span></div>}
            </div>;
          })}
        </div>

        <div className={`dropz ${dragO?'over':''}`} onDragOver={e=>{e.preventDefault();setDragO(true)}} onDragLeave={()=>setDragO(false)} onDrop={e=>{e.preventDefault();setDragO(false);if(e.dataTransfer.files[0])handleLocal(e.dataTransfer.files[0])}} onClick={()=>document.getElementById('fi').click()}>
          {I.up(20)}<div style={{marginTop:6}}>Soltar un XML de MS Project aquí, o hacer clic</div>
          <input id="fi" type="file" accept=".xml" onChange={e=>{if(e.target.files[0])handleLocal(e.target.files[0])}}/>
        </div>
      </div>
      {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
    </Fragment>;
  }

  /* ═══ PORTFOLIO ═══ */
  if(active==='__pf'){
    return <Fragment>
      <div className="hdr">
        <a href="index.html" style={{color:'var(--c2)',fontSize:11,textDecoration:'none',marginRight:6}}>← BkTableros</a><div className="logo" onClick={()=>setActive(null)}>{I.bld(18)} BuildPlan</div>
        <div className="tabs">
          <button className="tab on">{I.usr()} Portfolio</button>
          {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);return p?<button key={k} className="tab" onClick={()=>{setActive(k);setSub('gantt');resetF()}}><span className="dot" style={{background:'var(--c2)'}}/>{p.name}<span className="x" onClick={e=>closeTab(k,e)}>×</span></button>:null})}
        </div>
        <div className="acts"><button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button></div>
      </div>
      <Portfolio projList={pList} projData={pData}/>
    </Fragment>;
  }

  /* ═══ PROJECT VIEW ═══ */
  return <Fragment>
    <div className="ph"><h1>{aProj?.name}</h1><p>Generado el {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})} — BuildPlan Viewer · Bauvek</p></div>
    <div className="hdr">
      <a href="index.html" style={{color:'var(--c2)',fontSize:11,textDecoration:'none',marginRight:6}}>← BkTableros</a><div className="logo" onClick={()=>setActive(null)}>{I.bld(18)} BuildPlan</div>
      <div className="tabs">
        <button className="tab" onClick={()=>{setActive('__pf');setSub('portfolio')}}>{I.usr()} Portfolio</button>
        {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);if(!p)return null;
          return <button key={k} className={`tab ${active===k?'on':''}`} onClick={()=>{setActive(k);setSub('gantt');resetF()}}><span className="dot" style={{background:'var(--c2)'}}/>{p.name}<span className="x" onClick={e=>closeTab(k,e)}>×</span></button>})}
      </div>
      <div className="acts">
        <button className="btn btn-g btn-i" onClick={()=>setShowSrch(true)} title="Ctrl+K">{I.srch()}</button>
        <button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button>
      </div>
    </div>

    <div className="stbar">
      <button className={`st ${sub==='gantt'?'on':''}`} onClick={()=>setSub('gantt')}>Gantt</button>
      <button className={`st ${sub==='dash'?'on':''}`} onClick={()=>setSub('dash')}>Dashboard</button>
      <button className={`st ${sub==='demoras'?'on':''}`} onClick={()=>setSub('demoras')}>Demoras</button>
      {sub==='gantt'&&aData&&<div className="str">
        <button className="btn btn-g btn-i" onClick={()=>expAll(active,aData.tasks)} title="Expandir">{I.exp()}</button>
        <button className="btn btn-g btn-i" onClick={()=>colAll(active,aData.tasks)} title="Colapsar">{I.col()}</button>
        <div className="seg">{Object.entries(ZM).map(([k,v])=><button key={k} className={zoom===k?'on':''} onClick={()=>setZoom(k)}>{v.l}</button>)}</div>
        <button className="btn btn-g btn-i" onClick={()=>setShowArr(a=>!a)} title="Flechas" style={{color:showArr?'var(--ac)':'var(--c2)'}}>{I.lnk()}</button>
        {aData.hasBL&&<button className="btn btn-g btn-i" onClick={()=>setShowBL(b=>!b)} title="Línea base" style={{color:showBL?'var(--ac)':'var(--c2)'}}>{I.bl()}</button>}
        <button className="btn btn-g" onClick={()=>window.print()}>{I.prt()} PDF</button>
      </div>}
    </div>

    {sub==='gantt'&&aData&&<div className="fbar">
      <span style={{color:'var(--c2)',marginRight:2}}>{I.flt()}</span>
      <span className="fl">Estado</span>
      <select className="fsel" value={fSt} onChange={e=>setFSt(e.target.value)}><option value="all">Todos</option><option value="pe">Pendiente</option><option value="ip">En curso</option><option value="ok">Completada</option><option value="ov">Vencida</option></select>
      <span className="fl">Recurso</span>
      <select className="fsel" value={fRes} onChange={e=>setFRes(e.target.value)}><option value="all">Todos</option><option value="none">Sin asignar</option>{aData.resources.map(r=><option key={r} value={r}>{r}</option>)}</select>
      <span className="fl">Contratista</span>
      <select className="fsel" value={fCon} onChange={e=>setFCon(e.target.value)}><option value="all">Todos</option><option value="none">Sin contratista</option>{aData.contractors.map(c=><option key={c} value={c}>{c}</option>)}</select>
      <span className="fl">Nivel</span>
      <select className="fsel" value={fWbs} onChange={e=>setFWbs(parseInt(e.target.value))}><option value="99">Todos</option>{[1,2,3,4,5].map(n=><option key={n} value={n}>{n}</option>)}</select>
      <span className="fl">Desde</span><input type="date" className="fin" value={fDf} onChange={e=>setFDf(e.target.value)}/>
      <span className="fl">Hasta</span><input type="date" className="fin" value={fDt} onChange={e=>setFDt(e.target.value)}/>
      {fCount>0&&<Fragment><span className="fbadge">{fCount}</span><button className="fclr" onClick={resetF}>Limpiar</button></Fragment>}
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)'}}>{visTasks.length} tareas</span>
    </div>}

    {aErr&&<div className="err-b">Error: {aErr}</div>}
    {aLoading&&<div className="ld"><div className="sp"/><span>Cargando...</span></div>}

    {!aLoading&&aData&&sub==='gantt'&&<div className="gw" style={{userSelect:splOn?'none':'auto'}}>
      <div className="gtc" ref={tblRef} style={{width:tblW}} onScroll={onTblScroll}>
        <table className="gt">
          <colgroup>
            <col style={{width:35}}/><col style={{width:180}}/><col style={{width:72}}/><col style={{width:72}}/><col style={{width:42}}/><col style={{width:50}}/><col style={{width:80}}/><col style={{width:85}}/><col style={{width:50}}/>
          </colgroup>
          <thead><tr><th>WBS</th><th>Tarea</th><th>Inicio</th><th>Fin</th><th>Dur.</th><th>%</th><th>Recurso</th><th>Contratista</th><th>N° Item</th></tr></thead>
          <tbody>{visTasks.map(t=>{
            const em=expMap[active]||{};const ov=isOv(t);const ind=t.depth*14;
            return <tr key={t.uid} className={t.isSummary?'sum':''}>
              <td className="mono" style={{fontSize:10}}>{t.wbs}</td>
              <td><div className="tnc" style={{paddingLeft:ind}}>
                {t.isSummary?<button className="ttog" onClick={()=>togTask(active,t.uid)}>{em[t.uid]?I.chD():I.chR()}</button>:<span style={{width:16,flexShrink:0}}/>}
                {t.isMilestone&&<span style={{color:'var(--bar-ms)',fontSize:10,flexShrink:0}}>♦</span>}
                <span style={{overflow:'hidden',textOverflow:'ellipsis',fontWeight:t.isSummary?600:400,color:ov?'var(--err)':t.critical?'var(--ac)':'var(--c0)'}} title={t.name}>{t.name}</span>
              </div></td>
              <td className="mono">{fD(t.start)}</td>
              <td className="mono" style={{color:ov?'var(--err)':undefined}}>{fD(t.finish)}</td>
              <td className="mono" style={{fontSize:10}}>{fDur(t.duration)}</td>
              <td><div className="pm"><div className="pmb"><div className="pmf" style={{width:`${t.percentComplete}%`,background:t.percentComplete>=100?'var(--ok)':ov?'var(--err)':'var(--ac)'}}/></div><span className="mono" style={{fontSize:10}}>{t.percentComplete}%</span></div></td>
              <td style={{fontSize:11,color:'var(--c1)',overflow:'hidden',textOverflow:'ellipsis'}} title={t.resources.join(', ')}>{t.resources.join(', ')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Contratista')||'—'}</td>
              <td className="mono" style={{fontSize:10}}>{entV(t,'N° Item')||'—'}</td>
            </tr>
          })}</tbody>
        </table>
      </div>
      <div className={`spl ${splOn?'on':''}`} onMouseDown={()=>setSplOn(true)}/>
      <GanttSVG tasks={visTasks} minDate={aData.minDate} maxDate={aData.maxDate} zoom={zoom} showArr={showArr} showBL={showBL} scrollRef={scrollRef} onTT={setTTInfo}/>
    </div>}

    {!aLoading&&aData&&sub==='dash'&&<ProjDash data={aData}/>}
    {!aLoading&&aData&&sub==='demoras'&&<DemorasView data={aData}/>}

    <Tooltip info={ttInfo}/>
    {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
    <div className="pf">BuildPlan Viewer — Bauvek · {new Date().toLocaleDateString('es-AR')}</div>
  </Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
