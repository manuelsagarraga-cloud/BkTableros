<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>BuildPlan — BkTableros</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  /* Tokens Bauvek (mismos valores en buildplan, pagos y portada): neutros cálidos, bordó solo para marca y navegación */
  --bg-0:#f6f5f4;--bg-1:#efedeb;--bg-2:#e4e1de;--bg-el:#fff;
  --bg-hover:rgba(158,1,1,.04);--bg-alt:rgba(20,20,20,.015);--bg-sum:rgba(158,1,1,.03);
  --c0:#141414;--c1:#4d4845;--c2:#6b6561;
  --b0:#dedad6;--b1:#ebe8e5;
  --ac:#9E0101;--ac2:#E40000;--ac-bg:rgba(158,1,1,.07);
  --ok:#10b981;--err:#ef4444;--warn:#f59e0b;--q:#6d5bd0;--q-bg:rgba(109,91,208,.1);
  --bar:#9E0101;--bar-bg:rgba(158,1,1,.15);--bar-sum:#3a3633;
  --bar-ms:#d4930d;--bar-ov:#ef4444;--bar-ov-bg:rgba(239,68,68,.14);
  --bar-ok:#10b981;--bar-ok-bg:rgba(16,185,129,.14);--bar-bl:#a8a29e;
  --arr:rgba(107,101,97,.4);--arr-h:#6b6561;--today:#ef4444;
  /* Sin sombras salvo en lo que flota (tooltips, menús, modales); radios casi rectos */
  --sh-s:none;--sh-m:none;--sh-l:0 6px 24px rgba(20,20,20,.14);
  --r-s:2px;--r-m:3px;--r-l:4px;--hdr:44px;--row:28px;--ghdr:44px;
  --ff:'Lato',-apple-system,'Segoe UI',Roboto,sans-serif;--fm:'JetBrains Mono',monospace;
  color-scheme:light dark
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-0:#121111;--bg-1:#1c1b1a;--bg-2:#2a2826;--bg-el:#1a1918;
  --bg-hover:rgba(238,93,98,.06);--bg-alt:rgba(255,255,255,.02);--bg-sum:rgba(238,93,98,.05);
  --c0:#efecea;--c1:#b9b3ae;--c2:#8f8984;--q:#a594f9;--q-bg:rgba(165,148,249,.12);
  --b0:#34312e;--b1:#262422;
  --ac:#ee5d62;--ac-bg:rgba(238,93,98,.12);--bar:#c42a2f;
  --bar-bg:rgba(196,42,47,.22);--bar-ov-bg:rgba(239,68,68,.2);--bar-ok-bg:rgba(16,185,129,.2);--bar-bl:#5c5753;--bar-sum:#8f8984;
  --arr:rgba(143,137,132,.45);--arr-h:#8f8984;
  --sh-s:none;--sh-m:none;--sh-l:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg-0:#121111;--bg-1:#1c1b1a;--bg-2:#2a2826;--bg-el:#1a1918;
  --bg-hover:rgba(238,93,98,.06);--bg-alt:rgba(255,255,255,.02);--bg-sum:rgba(238,93,98,.05);
  --c0:#efecea;--c1:#b9b3ae;--c2:#8f8984;--q:#a594f9;--q-bg:rgba(165,148,249,.12);
  --b0:#34312e;--b1:#262422;
  --ac:#ee5d62;--ac-bg:rgba(238,93,98,.12);--bar:#c42a2f;
  --bar-bg:rgba(196,42,47,.22);--bar-ov-bg:rgba(239,68,68,.2);--bar-ok-bg:rgba(16,185,129,.2);--bar-bl:#5c5753;--bar-sum:#8f8984;
  --arr:rgba(143,137,132,.45);--arr-h:#8f8984;
  --sh-s:none;--sh-m:none;--sh-l:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg-0);color:var(--c0);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b0);border-radius:3px}

.hdr{height:var(--hdr);background:var(--bg-el);border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--c2);font-weight:400;font-size:12px;margin-left:2px}
.tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--c1);border-radius:var(--r-s);cursor:pointer;white-space:nowrap;border:none;background:none;font-family:var(--ff)}.tab:hover{background:var(--bg-1);color:var(--c0)}.tab.on{background:var(--ac-bg);color:var(--ac)}
.tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tab .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:2px;opacity:0;font-size:11px}.tab:hover .x{opacity:.6}.tab .x:hover{opacity:1;background:var(--bg-2)}
.acts{display:flex;align-items:center;gap:4px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;font-size:12px;font-weight:500;font-family:var(--ff);border-radius:var(--r-s);border:1px solid var(--b0);background:var(--bg-el);color:var(--c1);cursor:pointer;white-space:nowrap}.btn:hover{background:var(--bg-1);color:var(--c0)}
.btn-i{padding:5px;width:28px;height:28px}
.btn-g{border-color:transparent;background:transparent}.btn-g:hover{background:var(--bg-1)}
.seg{display:inline-flex;background:var(--bg-1);border-radius:var(--r-s);padding:2px;gap:1px}
.seg button{padding:3px 10px;font-size:11px;font-weight:500;font-family:var(--ff);border:none;background:transparent;color:var(--c1);cursor:pointer;border-radius:3px}.seg button:hover{color:var(--c0)}.seg button.on{background:var(--bg-el);color:var(--c0);box-shadow:var(--sh-s)}

.home{flex:1;overflow-y:auto;display:flex}
.home-sidebar{width:320px;flex-shrink:0;border-right:1px solid var(--b0);overflow-y:auto;background:var(--bg-el)}
.home-main{flex:1;overflow-y:auto;padding:24px}
.home-h{max-width:100%;margin:0 0 16px}.home-title{font-size:20px;font-weight:600;margin-bottom:4px}.home-sub{font-size:13px;color:var(--c1)}
.pgrid{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);cursor:pointer}.pcard:hover{border-color:var(--ac);box-shadow:var(--sh-s)}
.pcard-icon{width:34px;height:34px;border-radius:var(--r-s);background:var(--ac-bg);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcard-info{flex:1;min-width:0}.pcard-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcard-meta{font-size:11px;color:var(--c2);font-family:var(--fm);margin-top:1px}
.pcard-arr{color:var(--c2);flex-shrink:0}.pcard:hover .pcard-arr{transform:translateX(2px);color:var(--ac)}
.dropz{max-width:640px;margin:20px auto 0;padding:20px;border:1.5px dashed var(--b0);border-radius:var(--r-m);text-align:center;color:var(--c2);font-size:12px;cursor:pointer}.dropz:hover,.dropz.over{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
.dropz input{display:none}

.stbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:36px;background:var(--bg-el);border-bottom:1px solid var(--b1);flex-shrink:0}
.st{font-size:12px;font-weight:500;color:var(--c2);border:none;background:none;padding:8px 0;cursor:pointer;position:relative;font-family:var(--ff);white-space:nowrap;flex-shrink:0}.st:hover{color:var(--c0)}.st.on{color:var(--ac)}.st.on::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--ac);border-radius:1px 1px 0 0}
.str{margin-left:auto;display:flex;align-items:center;gap:4px}

.fbar{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--bg-1);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap}
.fsel{padding:4px 24px 4px 8px;font-size:11px;font-family:var(--ff);font-weight:500;border:1px solid var(--b0);border-radius:var(--r-s);background:var(--bg-el);color:var(--c0);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6178' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center}
.fin{padding:4px 8px;font-size:11px;font-family:var(--fm);border:1px solid var(--b0);border-radius:var(--r-s);background:var(--bg-el);color:var(--c0);width:110px}
.fl{font-size:11px;color:var(--c2);font-weight:500}
.fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:white;font-size:11px;font-weight:600;padding:0 4px}
.fclr{font-size:11px;color:var(--ac);border:none;background:none;cursor:pointer;font-family:var(--ff);font-weight:500;padding:4px 6px;border-radius:var(--r-s)}.fclr:hover{background:var(--ac-bg)}

.gw{flex:1;display:flex;overflow:hidden}
.gtc{overflow:auto;border-right:1px solid var(--b0);flex-shrink:0;background:var(--bg-el)}
.gcc{flex:1;overflow:auto;background:var(--bg-0)}
.spl{width:5px;cursor:col-resize;background:var(--b1);flex-shrink:0;z-index:10}.spl:hover,.spl.on{background:var(--ac)}

.gt{border-collapse:collapse;table-layout:fixed}
.gt th{position:sticky}
.col-rs{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.col-rs:hover,.col-rs.on{background:var(--ac);opacity:.5}
.gt th{position:sticky;top:0;z-index:5;background:var(--bg-1);font-size:11px;font-weight:600;color:var(--c1);text-align:left;padding:0 5px;height:var(--ghdr);border-bottom:1px solid var(--b0);white-space:nowrap}
.gt td{padding:0 5px;height:var(--row);border-bottom:1px solid var(--b1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;vertical-align:middle}
.gt tr:hover td{background:var(--bg-hover)}
.gt tr:nth-child(even) td{background:var(--bg-alt)}.gt tr:nth-child(even):hover td{background:var(--bg-hover)}
.gt tr.sum td{background:var(--bg-sum);font-weight:600}.gt tr.sum:hover td{background:var(--bg-hover)}
.tnc{display:flex;align-items:center;gap:3px;height:var(--row)}
.ttog{width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px;flex-shrink:0;color:var(--c2);border:none;background:none;padding:0}.ttog:hover{color:var(--c0);background:var(--bg-2)}
.pm{display:flex;align-items:center;gap:3px}
.pmb{width:30px;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden;flex-shrink:0}
.pmf{height:100%;border-radius:2px}
.mono{font-family:var(--fm);font-size:11px;color:var(--c1)}

.dash{flex:1;overflow-y:auto;padding:20px 24px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:14px;border-left:3px solid var(--ac)}
.kpi.ok{border-left-color:var(--ok)}.kpi.err{border-left-color:var(--err)}.kpi.warn{border-left-color:var(--warn)}.kpi.q{border-left-color:var(--q)}
.kpi-s{font-size:11px;color:var(--c2);margin-top:1px}
.fresh{font-family:var(--fm);font-size:11px;padding:2px 7px;border-radius:2px;white-space:nowrap}
.fresh.none{padding:0;color:var(--c2)}
.fresh.ok{background:rgba(16,185,129,.1);color:var(--ok)}.fresh.mid{background:rgba(245,158,11,.12);color:var(--warn)}.fresh.old{background:var(--q-bg);color:var(--q)}
.kpi-v{font-size:22px;font-weight:700;font-family:var(--fm);line-height:1.1}
.kpi-l{font-size:11px;color:var(--c1);margin-top:4px;font-weight:500}
.dst{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--c1)}
.dt{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);overflow:hidden;margin-bottom:16px}
.dt th{background:var(--bg-1);font-weight:600;font-size:11px;color:var(--c1);text-align:left;padding:8px 10px;border-bottom:1px solid var(--b0)}
.dt td{padding:6px 10px;border-bottom:1px solid var(--b1)}
.dt tr:hover td{background:var(--bg-hover)}

.ccrd{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:14px;cursor:pointer}.ccrd:hover,.ccrd.on{border-color:var(--ac)}.ccrd.on{background:var(--ac-bg)}
.ccrd h4{font-size:13px;font-weight:600;margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.cstat{display:flex;justify-content:space-between;font-size:11px;color:var(--c1);margin:2px 0}
.cstat .v{font-family:var(--fm);font-weight:500}

.tt{position:fixed;z-index:2000;background:var(--bg-el);border:1px solid var(--b0);border-radius:var(--r-m);box-shadow:var(--sh-l);padding:10px 12px;font-size:12px;max-width:280px;pointer-events:none;line-height:1.6}
.tt .tn{font-weight:600;margin-bottom:4px}
.tt .tr{display:flex;justify-content:space-between;gap:12px}
.tt .tl{color:var(--c2)}.tt .tv{font-family:var(--fm);font-size:11px}

.ld{display:flex;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--c2);font-size:13px}
.sp{width:18px;height:18px;border:2px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-b{padding:8px 16px;background:rgba(239,68,68,.08);color:var(--err);font-size:12px;border-bottom:1px solid var(--err)}

.so{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh}
.sm{width:480px;max-width:90vw;background:var(--bg-el);border-radius:var(--r-l);box-shadow:var(--sh-l);overflow:hidden;border:1px solid var(--b0)}
.si{width:100%;padding:12px 16px;font-size:14px;font-family:var(--ff);border:none;background:transparent;color:var(--c0);outline:none;border-bottom:1px solid var(--b1)}
.sr{max-height:300px;overflow-y:auto}
.sri{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px}.sri:hover{background:var(--bg-hover)}

/* Demoras tab */
.dev-pos{color:var(--err);font-weight:500}
.dev-neg{color:var(--ok);font-weight:500}
.dev-zero{color:var(--c2)}

@media print{
  body{overflow:visible!important;height:auto!important;background:white!important}
  #root{height:auto!important}
  .hdr,.stbar,.fbar,.spl,.so{display:none!important}
  .gw{flex-direction:column!important;overflow:visible!important;height:auto!important}
  .gtc,.gcc{overflow:visible!important;width:100%!important;flex:none!important}
  .ph{display:block!important;padding:16px;border-bottom:2px solid #333;margin-bottom:8px}
  .pf{display:block!important;text-align:center;padding:8px;font-size:11px;color:#999;border-top:1px solid #ccc;margin-top:8px}
  @page{size:landscape;margin:10mm}
}
.ph,.pf{display:none}

/* ═══ Semáforo health cards ═══ */
.pcard2.health-g{border-left:4px solid var(--ok)}
.pcard2.health-y{border-left:4px solid var(--warn)}
.pcard2.health-r{border-left:4px solid var(--err)}
.pcard2.health-x{border-left:4px solid var(--c2)}
.pcard2.health-q{border-left:4px solid var(--q)}
.health-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.health-badge.g{background:rgba(16,185,129,.12);color:var(--ok)}
.health-badge.y{background:rgba(245,158,11,.12);color:var(--warn)}
.health-badge.r{background:rgba(239,68,68,.12);color:var(--err)}
.health-badge.x{background:rgba(139,146,165,.1);color:var(--c2)}
.health-badge.q{background:var(--q-bg);color:var(--q)}
.pcard2-health{display:flex;align-items:center;gap:8px;margin-top:4px}
.pcard2-stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;font-family:var(--fm);color:var(--c1)}
.pcard2-stats span{white-space:nowrap}
.pcard2-stats span{display:flex;align-items:center;gap:3px}
.pcard2-loading{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--c2)}
.pcard2-loading .mini-sp{width:10px;height:10px;border:1.5px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}

/* ═══ Navigation sidebar ═══ */
.app-layout{display:flex;flex:1;overflow:hidden}
.nav-side{width:52px;background:var(--bg-el);border-right:1px solid var(--b0);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;overflow-y:auto}
.nav-item{width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:var(--r-s);cursor:pointer;border:none;background:none;color:var(--c2);font-family:var(--ff);font-size:11px;font-weight:500;padding:0;position:relative}
.nav-item:hover{background:var(--bg-1);color:var(--c0)}
.nav-item.on{background:var(--ac-bg);color:var(--ac)}
.nav-item .nav-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
.nav-sep{width:28px;height:1px;background:var(--b0);margin:4px 0}
.app-content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ═══ Weekly view ═══ */
.week-view{flex:1;overflow-y:auto;padding:20px 24px}
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.week-nav h3{font-size:14px;font-weight:600;flex:1}
.week-nav button{padding:4px 10px;font-size:12px;font-weight:500;font-family:var(--ff);border-radius:var(--r-s);border:1px solid var(--b0);background:var(--bg-el);color:var(--c1);cursor:pointer}.week-nav button:hover{background:var(--bg-1);color:var(--c0)}
.week-day{margin-bottom:16px}
.week-day-hdr{font-size:11px;font-weight:600;color:var(--c2);text-transform:uppercase;letter-spacing:.5px;padding:6px 0;border-bottom:1px solid var(--b1);margin-bottom:4px}
.week-task{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-s);cursor:default}
.week-task:hover{background:var(--bg-hover)}
.week-task.ov{background:rgba(239,68,68,.04)}
.wt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wt-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-meta{font-size:11px;color:var(--c1);font-family:var(--fm)}
.wt-bar{width:50px;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden}
.wt-fill{height:100%;border-radius:2px}
.week-empty{text-align:center;color:var(--c2);padding:40px 20px;font-size:13px}

/* ═══ Sparkline trend ═══ */
.sparkline{display:inline-block;vertical-align:middle}
.trend-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.trend-label{font-size:11px;color:var(--c2);font-family:var(--fm)}
.trend-delta{font-size:11px;font-weight:600;font-family:var(--fm)}
.trend-delta.up{color:var(--ok)}
.trend-delta.down{color:var(--err)}
.trend-delta.flat{color:var(--c2)}

/* ═══ Mobile responsive ═══ */
@media(max-width:768px){
  .home{flex-direction:column}
  .home-sidebar{width:100%;max-height:200px;border-right:none;border-top:1px solid var(--b0);overflow:hidden;order:2}
  .home-sidebar .map-body{padding:6px}
  .home-sidebar .map-body svg{max-height:160px}
  .home-main{padding:12px}
  .pgrid2{grid-template-columns:1fr}
  .hdr{padding:0 8px;gap:6px;overflow-x:auto}
  .logo span{display:none}
  .tabs{gap:1px}
  .tab{padding:4px 8px;font-size:11px}
  .acts{gap:2px}
  .stbar{padding:0 8px;gap:6px;overflow-x:auto}
  .fbar{padding:4px 8px;gap:4px}
  .fsel{font-size:11px;padding:3px 18px 3px 6px}
  .fl{font-size:11px}
  .gw{flex-direction:column}
  .gtc{width:100%!important;max-height:40vh;border-right:none;border-bottom:1px solid var(--b0)}
  .spl{display:none}
  .gcc{min-height:300px}
  .gt th,.gt td{font-size:11px;padding:0 3px}
  .gt col:nth-child(n+7){width:0!important;display:none}
  .gt th:nth-child(n+7),.gt td:nth-child(n+7){display:none}
  .dash{padding:12px}
  .dgrid{grid-template-columns:repeat(2,1fr);gap:6px}
  .kpi{padding:10px}
  .kpi-v{font-size:18px}
  .dt{font-size:11px}
  .dt th,.dt td{padding:4px 6px}
  .cgrid{grid-template-columns:1fr}
  .proj-info{grid-template-columns:1fr 1fr}
  .week-view{padding:12px}
  .week-task{gap:4px;padding:6px 4px}
  .wt-name{font-size:12px}
  .wt-meta{font-size:11px}
  .week-nav{gap:6px}
  .week-nav h3{font-size:13px}
  .so .sm{width:95vw}
  /* Mobile bottom nav */
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg-el);border-top:1px solid var(--b0);z-index:200;padding:4px 0;padding-bottom:max(4px,env(safe-area-inset-bottom))}
  .mob-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:var(--c2);font-family:var(--ff);font-size:11px;font-weight:500;padding:6px 0;cursor:pointer}
  .mob-nav button.on{color:var(--ac)}
  body{padding-bottom:60px}
}
@media(min-width:769px){
  .mob-nav{display:none}
}

/* ═══ Onboarding tour ═══ */
.tour-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center}
.tour-card{background:var(--bg-el);border:1px solid var(--b0);border-radius:var(--r-l);box-shadow:var(--sh-l);padding:24px;max-width:420px;width:90vw}
.tour-title{font-size:16px;font-weight:700;margin-bottom:8px}
.tour-body{font-size:13px;color:var(--c1);line-height:1.6;margin-bottom:16px}
.tour-dots{display:flex;gap:6px;align-items:center}
.tour-dot{width:8px;height:8px;border-radius:50%;background:var(--b0)}.tour-dot.on{background:var(--ac)}
.tour-acts{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.tour-skip{font-size:12px;color:var(--c2);border:none;background:none;cursor:pointer;font-family:var(--ff)}.tour-skip:hover{color:var(--c0)}
.tour-next{padding:6px 16px;font-size:12px;font-weight:600;font-family:var(--ff);border-radius:var(--r-s);border:none;background:var(--ac);color:white;cursor:pointer}.tour-next:hover{opacity:.9}

/* ═══ Client share view ═══ */
.client-view{min-height:100vh;background:var(--bg-0);padding:24px}
.client-hdr{text-align:center;padding:20px 0 24px;border-bottom:1px solid var(--b1);margin-bottom:24px}
.client-hdr h1{font-size:22px;font-weight:700;margin-bottom:4px}
.client-hdr p{font-size:13px;color:var(--c1)}
.client-hdr .client-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:16px;font-size:12px;font-weight:600;margin-top:8px}
.client-progress{max-width:480px;margin:0 auto 24px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:20px}
.client-progress h3{font-size:14px;font-weight:600;margin-bottom:12px}
.client-bar{height:12px;border-radius:6px;background:var(--bg-2);overflow:hidden;margin-bottom:8px}
.client-fill{height:100%;border-radius:6px;transition:width .5s}
.client-milestones{max-width:480px;margin:0 auto}
.client-ms{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.client-ms:last-child{border-bottom:none}
.client-ms-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.client-ms-info{flex:1}
.client-ms-name{font-size:13px;font-weight:500}
.client-ms-date{font-size:11px;color:var(--c1);font-family:var(--fm)}
.client-footer{text-align:center;margin-top:32px;padding-top:16px;border-top:1px solid var(--b1);font-size:11px;color:var(--c2)}

/* ═══ Procurement forecast ═══ */
.proc-view{flex:1;overflow-y:auto;padding:20px 24px}
.proc-controls{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.proc-group{margin-bottom:20px}
.proc-group-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid var(--b1);margin-bottom:6px}
.proc-group-hdr h4{font-size:13px;font-weight:600;flex:1}
.proc-group-hdr .proc-count{font-size:11px;font-family:var(--fm);color:var(--c1);background:var(--bg-1);padding:2px 8px;border-radius:10px}
.proc-task{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12px;border-radius:var(--r-s)}
.proc-task:hover{background:var(--bg-hover)}
.proc-task.urgent{background:rgba(239,68,68,.05)}
.proc-alert{font-size:11px;font-weight:600;padding:1px 6px;border-radius:8px;background:rgba(239,68,68,.1);color:var(--err)}
.proc-empty{text-align:center;color:var(--c2);padding:40px 20px;font-size:13px}

/* Map */
.map-section{background:var(--bg-el);overflow:hidden}
.map-header{padding:10px 14px;font-size:12px;font-weight:600;color:var(--c1);border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.5px}
.map-header .clear-btn{font-size:11px;color:var(--ac);cursor:pointer;border:none;background:none;font-family:var(--ff);font-weight:500;text-transform:none;letter-spacing:0}
.map-body{padding:10px 12px 4px}
.map-body svg path{transition:fill-opacity .2s,stroke-opacity .2s,stroke-width .15s}
.map-label{font-family:var(--ff);font-size:9px;fill:var(--c1);pointer-events:none}
.map-count{font-family:var(--fm);font-size:8px;fill:white;pointer-events:none;font-weight:700}
.map-ref{font-family:var(--ff);font-size:8px;fill:var(--c2)}

/* Enhanced project cards */
.pcard2{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pcard2:hover{border-color:var(--ac);box-shadow:var(--sh-m)}
.pcard2-top{display:flex;align-items:center;gap:8px}
.pcard2-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pcard2-name{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard2-status{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:2px}
.pcard2-meta{font-size:11px;color:var(--c1);display:flex;flex-wrap:wrap;gap:4px 12px}
.pcard2-meta span{display:flex;align-items:center;gap:3px}
.pcard2-bar{height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden;margin-top:2px}
.pcard2-fill{height:100%;border-radius:2px;transition:width .3s}
.pcard2-bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--c2);font-family:var(--fm)}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}

/* Project info header in dashboard */
.proj-info{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.proj-info-item{display:flex;flex-direction:column;gap:2px}
.proj-info-label{font-size:11px;font-weight:600;color:var(--c2);text-transform:uppercase;letter-spacing:.5px}
.proj-info-value{font-size:13px;font-weight:500}
.proj-info-value.mono{font-family:var(--fm);font-size:12px}
/* ═══════ Materials integration ═══════ */
.mat-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 5px;border-radius:8px;background:var(--ac-bg);color:var(--ac);font-weight:600;margin-left:4px;vertical-align:middle}
.mat-tt{border-top:1px solid var(--b1);margin-top:6px;padding-top:6px}
.mat-tt-title{font-size:11px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.mat-tt-item{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0}
.mat-tt-item .mn{color:var(--c0);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-tt-item .mq{font-family:var(--fm);color:var(--ac);white-space:nowrap}
.mat-panel{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);overflow:hidden}
.mat-panel-hdr{padding:12px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.mat-panel-hdr h3{font-size:14px;font-weight:600;margin:0}
.mat-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--b1);background:var(--bg-0)}
.mat-table{width:100%;border-collapse:collapse;font-size:12px}
.mat-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--c2);border-bottom:2px solid var(--b0);position:sticky;top:0;background:var(--bg-el);z-index:1}
.mat-table td{padding:6px 12px;border-bottom:1px solid var(--b1)}
.mat-table tr:hover td{background:var(--bg-hover)}
.mat-table .mono{font-family:var(--fm);font-size:11px}
.mat-kpi{display:flex;gap:12px;padding:12px 16px;flex-wrap:wrap}
.mat-kpi-card{flex:1;min-width:140px;padding:12px;background:var(--bg-0);border-radius:var(--r-s);border:1px solid var(--b1)}
.mat-kpi-card .label{font-size:11px;color:var(--c2);text-transform:uppercase;letter-spacing:.5px}
.mat-kpi-card .value{font-size:20px;font-weight:700;font-family:var(--fm);color:var(--ac);margin-top:2px}
.mat-kpi-card .sub{font-size:11px;color:var(--c1);margin-top:1px}
.mat-status{display:inline-block;padding:2px 6px;border-radius:8px;font-size:11px;font-weight:600}
.mat-status.linked{background:rgba(16,185,129,.12);color:#059669}
.mat-status.no-link{background:var(--bg-2);color:var(--c2)}
.mat-empty{padding:40px 20px;text-align:center;color:var(--c2);font-size:13px}
.mat-scroll{max-height:60vh;overflow-y:auto}
.alc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.alc-card{background:var(--bg-el);border:1px solid var(--b1);border-top:3px solid;border-radius:var(--r-m);padding:12px 14px}
.alc-hd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.alc-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--c1);margin-top:8px}
.cod{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:2px;background:var(--ac);color:#fff;flex-shrink:0;margin-right:5px}
.cod.lg{font-size:11px;padding:2px 6px;min-width:28px}
.cod.off{background:var(--bg-2);color:var(--c2)}
.obra-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--c1);background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px}
/* ═══════ Vencidas por responsable ═══════ */
.rv-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rv-card{background:var(--bg-el);border:1px solid var(--b1);border-left:3px solid var(--err);border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.rv-card:hover{border-color:var(--ac)}.rv-card.on{border-color:var(--ac);background:var(--ac-bg)}
.rv-card.area{border-left-color:var(--c2);opacity:.75}
.rv-name{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:1px 5px;border-radius:2px}
.rv-role.r{background:var(--ac-bg);color:var(--ac)}.rv-role.c{background:var(--bg-2);color:var(--c1)}
.rv-ov{font-size:24px;font-weight:700;font-family:var(--fm);line-height:1}
.rv-meta{font-size:11px;color:var(--c2);font-family:var(--fm);margin-top:4px}
.rv-mx-wrap{overflow-x:auto;border:1px solid var(--b1);border-radius:var(--r-m)}
.rv-mx{margin:0;border:none;width:auto;min-width:100%}
.rv-mx th{vertical-align:bottom;padding:6px 4px}
.rv-mx td{padding:5px 8px}
.rv-vh{writing-mode:vertical-rl;transform:rotate(180deg);max-height:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;margin:0 auto}

/* ═══════ Portfolio — Gantt multi-obra ═══════ */
.pg-root{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;--pgl:340px}
.pg-ctrl{gap:8px}
.pg-chk{font-size:11px;color:var(--c1);display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.pg-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:5px 16px;font-size:11px;color:var(--c1);background:var(--bg-el);border-bottom:1px solid var(--b1);flex-shrink:0}
.pg-legend span{display:inline-flex;align-items:center;gap:5px}
.pg-legend i{display:inline-block;width:14px;height:8px;border-radius:2px}
.pg-legend i.hatch{background:repeating-linear-gradient(45deg,rgba(158,1,1,.45) 0 2px,var(--bar-bg) 2px 5px)}
.pg-pick{position:relative}
.pg-pick-btn{min-width:200px;max-width:280px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 26px 5px 10px;font-size:12px;font-weight:600}
.pg-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:500;width:380px;max-width:92vw;background:var(--bg-el);border:1px solid var(--b0);border-radius:var(--r-m);box-shadow:var(--sh-l);overflow:hidden}
.pg-pop .si{font-size:13px;padding:10px 12px}
.pg-pop-q{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--b1);background:var(--bg-1)}
.pg-pop-q button{font-size:11px;font-family:var(--ff);font-weight:600;border:1px solid var(--b0);background:var(--bg-el);color:var(--c1);border-radius:var(--r-s);padding:3px 10px;cursor:pointer}
.pg-pop-q button:hover{color:var(--ac);border-color:var(--ac)}
.pg-pop-list{max-height:340px;overflow-y:auto;padding:4px 0}
.pg-opt{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.pg-opt:hover{background:var(--bg-hover)}
.pg-opt-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-opt-e{font-size:11px;color:var(--c2);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.pg-solo{font-size:11px;font-family:var(--ff);border:none;background:none;color:var(--c2);cursor:pointer;padding:2px 4px;border-radius:2px;opacity:0}
.pg-opt:hover .pg-solo{opacity:1}.pg-solo:hover{color:var(--ac);background:var(--ac-bg)}
.pg-pop-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--c2);padding:8px 12px 4px;border-top:1px solid var(--b1);margin-top:4px}
.pg-hdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pg-scroll{flex:1;min-height:120px;overflow:auto;background:var(--bg-0)}
.pg-grid{display:grid;grid-template-columns:var(--pgl) auto;min-width:100%}
.pg-corner{position:sticky;top:0;left:0;z-index:6;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;background:var(--bg-1);border-bottom:1px solid var(--b0);border-right:1px solid var(--b0);font-size:11px;font-weight:700;color:var(--c1);text-transform:uppercase;letter-spacing:.4px}
.pg-thead{position:sticky;top:0;z-index:5}
.pg-rs{position:absolute;top:0;right:-4px;bottom:0;width:8px;cursor:col-resize;z-index:7}
.pg-rs:hover,.pg-rs:active{background:var(--ac);opacity:.45}
.pg-names{position:sticky;left:0;z-index:4;background:var(--bg-el);border-right:1px solid var(--b0)}
.pg-n{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-bottom:1px solid var(--b1);font-size:12px;cursor:pointer;white-space:nowrap}
.pg-n:hover{background:var(--bg-hover)}
.pg-n.hl{background:var(--ac-bg);box-shadow:inset 3px 0 0 var(--ac)}
.pg-n-obra{background:var(--bg-sum);font-weight:700;font-size:13px}
.pg-n-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pg-n-m{font-family:var(--fm);font-size:11px;color:var(--c2);flex-shrink:0;font-weight:500}
.pg-tog{width:16px;display:flex;align-items:center;justify-content:center;color:var(--c2);flex-shrink:0}
.pg-sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pg-body{position:relative}
.pg-split{height:7px;flex-shrink:0;cursor:row-resize;background:var(--bg-1);border-top:1px solid var(--b0);border-bottom:1px solid var(--b0);display:flex;align-items:center;justify-content:center}
.pg-split span{width:40px;height:3px;border-radius:2px;background:var(--b0)}
.pg-split:hover span{background:var(--ac)}
.pg-det{flex-shrink:0;display:flex;flex-direction:column;background:var(--bg-el);min-height:36px}
.pg-det-hdr{display:flex;align-items:center;gap:10px;padding:4px 16px;height:36px;flex-shrink:0;border-bottom:1px solid var(--b1)}
.pg-det-scroll{flex:1;overflow:auto;min-height:0}
.pg-dt{margin:0;border:none;border-radius:0}
.pg-dt thead th{position:sticky;top:0;z-index:1;white-space:nowrap;user-select:none}
.pg-dt tfoot td{position:sticky;bottom:0;background:var(--bg-1);border-top:1px solid var(--b0);font-size:12px}
.pg-dt tr{cursor:pointer}.pg-dt tr.hl td{background:var(--ac-bg)}
@media(max-width:768px){.pg-root{--pgl:170px}.pg-pick-btn{min-width:140px}.pg-legend{display:none}}

/* ═══════ Encabezado único (Inicio, Portfolio y obra) ═══════ */
.bk-home{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--c1);font-size:12px;font-weight:700;letter-spacing:.3px;flex-shrink:0}
.bk-home:hover{color:var(--ac)}
.bv{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#9E0101;color:#fff;font-weight:900;font-size:11px;letter-spacing:.3px;border-radius:2px}
.crumb-sep{color:var(--b0);font-size:16px;flex-shrink:0}
button.logo{border:none;background:none;color:var(--c0);font-family:var(--ff);font-size:15px;font-weight:700;padding:0;flex-shrink:0}
.tab-n{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.hdr-ov{font-size:12px;color:var(--err);font-weight:700;font-family:var(--fm)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:3000;background:var(--c0);color:var(--bg-0);border-radius:var(--r-s);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;max-width:92vw;flex-wrap:wrap}
.toast input{font-family:var(--fm);font-size:12px;padding:4px 6px;border:none;border-radius:2px;min-width:0;flex:1;width:280px;max-width:100%}
.toast .fclr{color:var(--bg-0)}

const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
/* ═══════ N° Item = Texto4 (MS Project) ═══════
   Desde oct-2026 el N° Item vive en Texto4 (texto libre: admite letras y ceros, ej. "2.01", "A2.10").
   Tiene prioridad sobre el campo enterprise "N° Item". Se compara SIEMPRE como texto: "2.10" ≠ "2.1" ≠ "2.100". */

/* ═══════ Códigos de obra (mismos que las hojas "Obra XX" del Excel de pagos) ═══════
   Clave: nombre del XML. Vinculan cronograma ↔ Cómputo-Obras ↔ Pagos.
   Para una obra nueva: agregar una línea acá, o una columna "Código" en Proyectos_Bauvek.xlsx (tiene prioridad). */
const OBRA_CODES={
  'Vivienda Hermanos Rossi':{cod:'RR',cliente:'Hnos. Rossi',lote:'Lote 12, Mza 59, Molvento'},
  'Vivienda Julieta Santiago':{cod:'JS',cliente:'Julieta Santiago - Iván Petrini',lote:'Mza 58, Lote 10, Molvento'},
  'Vivienda Esteban y Matias':{cod:'EM',cliente:'Esteban y Matías',lote:'Mza 3, Lote 16, Vistas de La Deseada'},
  'Vivienda Lugon':{cod:'RL',cliente:'Rodrigo Lugón',lote:'Lote 426, Estancia Q2'},
  'Vivienda Reboni':{cod:'HR',cliente:'Hernán Reboni',lote:'Lote 456, El Terrón'},
  'Vivienda Lew-Subias':{cod:'LS',cliente:'Rodolfo Subías y Melisa Lew',lote:'Lote 364, El Terrón'},
  'Vivienda AZ':{cod:'AZ',cliente:'Agustín Zampol',lote:'Mza 7, Lote 4, Vistas de La Deseada'},
  'Vivienda Venturelli-Bernal':{cod:'VB',cliente:'Venturelli-Bernal',lote:'Mza 49, Lote 8, Las Cañitas'},
  'Vivienda Casali D':{cod:'DC',cliente:'Diego Casalis',lote:'Lote 494, El Terrón'},

};
let _obraIdx=null;
function obraCode(fileOrName){
  if(!_obraIdx){_obraIdx={};for(const[k,v] of Object.entries(OBRA_CODES))_obraIdx[normalizeForMatch(k)]=v}
  const n=normalizeForMatch((fileOrName||'').replace(/\.xml$/i,''));
  return _obraIdx[n]||null;
}
/* "RR · Vivienda Hermanos Rossi" */
function pLabel(p){return p?(p.cod?p.cod+' · ':'')+p.name:''}

function normalizeForMatch(s){
  return(s||'').toLowerCase().replace(/[_\-\s.]+/g,'').replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n').replace('.xml','');
}

async function loadProjectMeta(){
  try{
    let buf=null;
    const b=await sbDownload('proyectos.xlsx');
    if(b)buf=await b.arrayBuffer();
    else if(_empresa!==REPO_EMPRESA)return[];
    else{const r=await fetch('data/Proyectos_Bauvek.xlsx?t='+Date.now());if(!r.ok)return[];buf=await r.arrayBuffer()}
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    return rows.map(row=>{
      const city=(row['Ciudad / Localidad']||'').toLowerCase();
      const coordEntry=CITY_COORDS[city];
      const dept=coordEntry?.dept||CITY_TO_DEPT[city]||null;
      return{
        proyecto:row['Proyecto']||'',
        estado:row['Estado']||'',
        cicloVida:row['Ciclo de Vida']||'',
        provincia:row['Provincia']||'',
        ciudad:row['Ciudad / Localidad']||'',
        comitente:row['Comitente']||'',
        m2Cubierta:row['m² Construidos cubierta']||0,
        m2Semi:row['m² Construidos semicubierta']||0,
        m2Terreno:row['m² Terreno']||0,
        archivoXML:row['Archivo XML']||'',
        contratista:row['Contratista Principal']||'',
        codigo:String(row['Código']||row['Codigo']||'').trim().toUpperCase(),
        lat:coordEntry?.lat||null,
        lng:coordEntry?.lng||null,
        cityLabel:coordEntry?.label||row['Ciudad / Localidad']||'',
        dept:dept,
        _norm:normalizeForMatch(row['Proyecto']),
        _normXml:normalizeForMatch(row['Archivo XML']||''),
      };
    });
  }catch(e){console.warn('No se pudo cargar metadata:',e);return[]}
}

function matchMeta(projectName,metaList){
  if(!metaList||!metaList.length) return null;
  const norm=normalizeForMatch(projectName);
  /* Try exact contains match on project name */
  let best=metaList.find(m=>norm.includes(m._norm)||m._norm.includes(norm));
  if(!best){
    /* Try matching by archivoXML column (e.g. "Vivienda RC.xml" matches the XML filename) */
    best=metaList.find(m=>m._normXml&&(norm.includes(m._normXml)||m._normXml.includes(norm)));
  }
  if(!best){
    /* Try partial: strip common prefixes and match core words */
    const words=norm.replace(/vivienda|viviendas|vivivenda|loteo|losa|proyecto|casa|quincho|qincho/g,'').trim();
    if(words.length>2) best=metaList.find(m=>{
      const mw=m._norm.replace(/vivienda|viviendas|vivivenda|loteo|losa|proyecto|casa|quincho|qincho/g,'').trim();
      return mw.length>2&&(words.includes(mw)||mw.includes(words));
    });
  }
  return best||null;
}

const DEPT_COLORS={
  'Colón':'#9E0101',
  'Santa María':'#D4930D',
  'Calamuchita':'#10b981',
  'Capital':'#6366f1',
};

function DeptMap({projects,metaList,selectedDept,onSelectDept}){
  const deptCounts=useMemo(()=>{
    const counts={};
    for(const d of Object.keys(ALL_DEPTS)) counts[d]={count:0,projects:[]};
    for(const p of projects){
      const m=matchMeta(p.name,metaList);
      if(!m||!m.dept) continue;
      if(counts[m.dept]){counts[m.dept].count++;counts[m.dept].projects.push(p.name)}
    }
    return counts;
  },[projects,metaList]);

  const cityDots=useMemo(()=>{
    const dots={};
    for(const p of projects){
      const m=matchMeta(p.name,metaList);
      if(!m||!m.lat||!m.dept) continue;
      const key=m.cityLabel;
      if(!dots[key]) dots[key]={label:key,lat:m.lat,lng:m.lng,dept:m.dept,count:0};
      dots[key].count++;
    }
    return Object.values(dots);
  },[projects,metaList]);

  const activeDepts=Object.entries(deptCounts).filter(([,v])=>v.count>0);

  /* Geo → SVG for city dots within the 400×550 viewBox */
  const geoToSvg=(lat,lng)=>({
    x:((lng-(-65.00))/(-62.80-(-65.00)))*400,
    y:((lat-(-29.30))/(-35.00-(-29.30)))*550
  });

  return(
    <div className="map-section">
      <div className="map-header">
        <span>Córdoba · Departamentos</span>
        {selectedDept&&<button className="clear-btn" onClick={()=>onSelectDept(null)}>Mostrar todas</button>}
      </div>
      <div className="map-body">
        <svg viewBox="-5 -5 395 525" width="100%" style={{display:'block'}}>
          {/* All 26 departments */}
          {Object.entries(ALL_DEPTS).map(([name,dept])=>{
            const count=deptCounts[name]?.count||0;
            const hasProjects=count>0;
            const color=DEPT_COLORS[name]||'var(--c2)';
            const isSel=selectedDept===name;
            const isOther=selectedDept&&!isSel;
            const isSmall=name==='Capital'||name==='Minas'||name==='Ischilín';
            return(
              <g key={name}
                 onClick={hasProjects?()=>onSelectDept(isSel?null:name):undefined}
                 style={{cursor:hasProjects?'pointer':'default'}}>
                <path d={dept.path}
                  fill={isSel?color:hasProjects?color:'var(--bg-2)'}
                  fillOpacity={isSel?.25:hasProjects?(isOther?.05:.15):.5}
                  stroke={isSel?color:hasProjects?color:'var(--b0)'}
                  strokeWidth={isSel?2.5:hasProjects?1.5:.7}
                  strokeOpacity={isSel?1:hasProjects?(isOther?.3:.7):.4}
                />
                {/* Label — hide smallest depts when not selected, show all active ones */}
                {(!isSmall||isSel||hasProjects)&&!isOther&&<text x={dept.cx} y={dept.cy-(hasProjects?8:2)}
                  textAnchor="middle" className="map-label"
                  style={{
                    fontSize:isSel?9:hasProjects?8:6,
                    fontWeight:isSel?700:hasProjects?600:400,
                    fill:isSel?color:hasProjects?color:'var(--c2)',
                    opacity:hasProjects?1:.5
                  }}>{name}</text>}
                {/* Count badge for departments with projects */}
                {hasProjects&&<g>
                  <circle cx={dept.cx} cy={dept.cy+(isSmall?6:10)} r={isSmall?8:11}
                    fill={isSel?color:'var(--c0)'} opacity={isOther?.2:isSel?1:.8}/>
                  <text x={dept.cx} y={dept.cy+(isSmall?10:14)} textAnchor="middle"
                    style={{fontSize:isSmall?9:11,fontWeight:700,fill:'white',fontFamily:'var(--fm)'}}>{count}</text>
                </g>}
              </g>
            );
          })}

          {/* City dots inside selected department */}
          {selectedDept&&cityDots.filter(c=>c.dept===selectedDept).map(c=>{
            const pos=geoToSvg(c.lat,c.lng);
            const color=DEPT_COLORS[selectedDept]||'var(--ac)';
            return(
              <g key={c.label}>
                <circle cx={pos.x} cy={pos.y} r={5} fill={color} opacity=".9"/>
                <circle cx={pos.x} cy={pos.y} r={9} fill={color} opacity=".12"/>
                <text x={pos.x} y={pos.y+3.5} textAnchor="middle" style={{fontSize:7,fontWeight:700,fill:'white',fontFamily:'var(--fm)'}}>{c.count}</text>
                <text x={pos.x+8} y={pos.y+3} className="map-label" style={{fontSize:8,fontWeight:500,fill:'var(--c0)',textAnchor:'start'}}>{c.label}</text>
              </g>
            );
          })}
        </svg>
      </div>

      {/* Legend: only departments with projects */}
      <div style={{padding:'8px 12px',borderTop:'1px solid var(--b1)',display:'flex',flexDirection:'column',gap:4}}>
        {activeDepts.map(([name,data])=>{
          const color=DEPT_COLORS[name]||'var(--c2)';
          const isSel=selectedDept===name;
          return(
            <div key={name} onClick={()=>onSelectDept(isSel?null:name)}
              style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:'var(--r-s)',cursor:'pointer',
                background:isSel?color+'14':'transparent',border:isSel?'1px solid '+color+'40':'1px solid transparent'}}>
              <span style={{width:10,height:10,borderRadius:2,background:color,opacity:isSel?1:.6,flexShrink:0}}/>
              <span style={{flex:1,fontSize:12,fontWeight:isSel?600:400,color:isSel?color:'var(--c0)'}}>{name}</span>

          );
        })}

    </div>
  );
}

/* ═══════ PARSER MSPDI ═══════ */
/* XML de una obra: primero la copia liviana que arma el deploy (sin TimephasedData, ~4 veces más chica);
   si no está, el original. ?v=hash deja que el navegador reutilice lo ya descargado hasta que el XML cambie. */
/* Cronogramas: primero el almacenamiento privado (bucket "cronogramas"), y solo mientras dure la migración el repo */
let _dataOrigen='repo';
async function fetchXml(proj){
  if(_dataOrigen==='privado'){
    for(const pre of['lite/','xml/']){const b=await sbDownload(pre+storageKey(proj.file));if(b)return b.text()}
    throw new Error('no se encontró '+proj.file+' en el almacenamiento privado');
  }
  const v=proj.ver?`?v=${proj.ver}`:`?t=${Date.now()}`;
  try{const r=await fetch(`data/projects-lite/${proj.file}${v}`);if(r.ok)return r.text()}catch(e){}
  const r=await fetch(`data/projects/${proj.file}${v}`);
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.text();
}
function parseMSPDI(xmlText){
  /* MS Project deja caracteres de control en Notas (ej. \x0B) → XML inválido. Se reemplazan por espacio. */
  xmlText=String(xmlText).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,' ');
  const p=new DOMParser(),doc=p.parseFromString(xmlText,'text/xml');
  if(doc.getElementsByTagName('parsererror').length)console.warn('XML con errores de formato: puede faltar información');
  const ns=doc.documentElement.namespaceURI;
  const g=(el,tag)=>{const e=ns?el.getElementsByTagNameNS(ns,tag)[0]:el.getElementsByTagName(tag)[0];return e?e.textContent.trim():''};
  const ga=(el,tag)=>ns?el.getElementsByTagNameNS(ns,tag):el.getElementsByTagName(tag);

  /* ExtendedAttribute definitions */
  const eaDefs={};
  for(const ea of ga(doc,'ExtendedAttribute')){
    const fid=g(ea,'FieldID'),fn=g(ea,'FieldName'),al=g(ea,'Alias');
    if(fid) eaDefs[fid]={fn,al:al||fn};
  }

  /* Resources */
  const res={};
  for(const r of ga(doc,'Resource')){const uid=g(r,'UID'),nm=g(r,'Name');if(uid&&nm)res[uid]={uid,name:nm}}

  /* Assignment map */
  const trMap={};
  for(const a of ga(doc,'Assignment')){
    const tu=g(a,'TaskUID'),ru=g(a,'ResourceUID');
    if(tu&&ru&&res[ru]){if(!trMap[tu])trMap[tu]=[];trMap[tu].push(res[ru].name)}
  }

  /* Parse tasks */
  const tasks=[];
  for(const t of ga(doc,'Task')){
    const uid=g(t,'UID');if(uid==='0')continue;
    const nm=g(t,'Name')||'(sin nombre)';
    const st=g(t,'Start'),fn=g(t,'Finish'),dur=g(t,'Duration');
    const pct=parseInt(g(t,'PercentComplete')||'0',10);
    const ol=parseInt(g(t,'OutlineLevel')||'0',10);
    const isSm=g(t,'Summary')==='1',isMs=g(t,'Milestone')==='1';
    const wbs=g(t,'WBS'),crit=g(t,'Critical')==='1';

    /* Duration → days */
    let durDays=0;
    if(dur){const m=dur.match(/PT(\d+)H/);if(m)durDays=Math.round(parseInt(m[1])/8)}

    /* Predecessors */
    const preds=[];
    for(const pl of ga(t,'PredecessorLink')){
      const pu=g(pl,'PredecessorUID'),ty=g(pl,'Type')||'1';
      const ls=g(pl,'LinkLag')||'0',lf=g(pl,'LagFormat')||'7';
      const tm={'0':'FF','1':'FS','2':'SF','3':'SS'};
      let ld=parseInt(ls,10);if(lf==='7')ld=ld/10;else if(['3','5','6'].includes(lf))ld=ld/4800;
      preds.push({taskUid:pu,type:tm[ty]||'FS',lagDays:Math.round(ld)});
    }

    /* Baselines */
    const bls=[];
    for(const b of ga(t,'Baseline')){
      const bn=g(b,'Number'),bs=g(b,'Start'),bf=g(b,'Finish');
      if(bs||bf)bls.push({number:parseInt(bn||'0',10),start:bs?new Date(bs):null,finish:bf?new Date(bf):null});
    }

    /* Enterprise custom fields */
    const ent={};
    for(const[hex,info] of Object.entries(ENT)){
      const el=ns?t.getElementsByTagNameNS(ns,hex)[0]:t.getElementsByTagName(hex)[0];
      if(el&&el.textContent){
        const v=el.textContent.trim();
        if(v&&v!=='None')ent[info.n]={value:v,guid:info.t==='guid'};
      }
    }
    /* Standard ExtendedAttribute — with fallback for Text1/2/3 */
    const textFieldMap={'188743731':'Rubro','188743732':'Nivel','188743733':'Tableros'};
    let texto4='';
    for(const ea of ga(t,'ExtendedAttribute')){
      const fid=g(ea,'FieldID'),val=g(ea,'Value');
      if(fid===FID_TEXTO4){texto4=(val||'').trim();continue}
      if(fid&&val){
        const d=eaDefs[fid];
        let label=d?(d.al||d.fn):`F${fid}`;
        /* Fallback: if no alias, use our known mapping */
        if(textFieldMap[fid]&&(!d||!d.al||d.al===d.fn)) label=textFieldMap[fid];
        ent[label]={value:val,guid:false};
      }
    }
    if(texto4)ent['N° Item']={value:texto4,guid:false};

    tasks.push({
      uid,name:nm,start:st?new Date(st):null,finish:fn?new Date(fn):null,
      duration:dur,durDays,percentComplete:pct,outlineLevel:ol,
      isSummary:isSm,isMilestone:isMs,wbs,critical:crit,
      resources:trMap[uid]||[],predecessors:preds,baselines:bls,ent,
      children:[],depth:0
    });
  }

  /* Hierarchy */
  const roots=[];const stk=[];
  for(const t of tasks){
    while(stk.length&&stk[stk.length-1].outlineLevel>=t.outlineLevel)stk.pop();
    if(stk.length){stk[stk.length-1].children.push(t);t.parent=stk[stk.length-1]}else roots.push(t);
    if(t.isSummary)stk.push(t);
  }
  function flat(list,d=0){const r=[];for(const t of list){t.depth=d;r.push(t);if(t.children.length)r.push(...flat(t.children,d+1))}return r}
  const allTasks=flat(roots);
  const uidMap={};for(const t of allTasks)uidMap[t.uid]=t;
  const alcInfo=classifyAlcance(allTasks);

  let minD=null,maxD=null;
  for(const t of allTasks){
    if(t.start&&(!minD||t.start<minD))minD=t.start;
    if(t.finish&&(!maxD||t.finish>maxD))maxD=t.finish;
    for(const b of t.baselines){
      if(b.start&&(!minD||b.start<minD))minD=b.start;
      if(b.finish&&(!maxD||b.finish>maxD))maxD=b.finish;
    }
  }

  const resList=[...new Set(allTasks.flatMap(t=>t.resources))].sort();
  const hasBL=allTasks.some(t=>t.baselines.length>0);
  const contractors=new Set();
  const rubros=new Set();
  const niveles=new Set();
  const tableros=new Set();
  for(const t of allTasks){
    const c=t.ent['Contratista'];if(c&&!c.guid&&c.value)contractors.add(c.value);
    const r=t.ent['Rubro'];if(r&&!r.guid&&r.value)rubros.add(r.value);
    const n=t.ent['Nivel'];if(n&&!n.guid&&n.value)niveles.add(n.value);
    const tb=t.ent['Tableros'];if(tb&&!tb.guid&&tb.value)tableros.add(tb.value);
  }

  /* Fecha de estado de MS Project: hasta cuándo está reportado el avance */
  const sdTxt=g(doc.documentElement,'StatusDate');
  const statusDate=sdTxt&&!/^1984/.test(sdTxt)?new Date(sdTxt):null;
  return{tasks:allTasks,roots,uidMap,resources:resList,rawRes:Object.values(res),statusDate,
    minDate:minD,maxDate:maxD,hasBL,contractors:[...contractors].sort(),
    rubros:[...rubros].sort(),niveles:[...niveles].sort(),tableros:[...tableros].sort(),
    hasAlcance:alcInfo.ok,obraRootName:alcInfo.root?alcInfo.root.name:null};
}

/* ═══════ Alcance: Obra base vs Adicional ═══════
   Solo se clasifican tareas (no resumen) que cuelgan del resumen "Obra …" del cronograma.
   - Obra base: tiene N° Item (Texto4), propio o heredado del resumen padre, sin "*".
   - Adicional: sin N° Item, o con "*" en el N° Item o al final del nombre.
   - Quedan sin clasificar (t.alc=null): todo lo que está fuera de la fase Obra, hitos y standby.
   - Si la fase Obra no tiene NINGÚN N° Item cargado, no se clasifica (si no, todo saldría Adicional). */
function countItems(t){let n=entV(t,'N° Item')?1:0;for(const c of t.children)n+=countItems(c);return n}
function findObraRoot(tasks){
  /* Candidatos: resúmenes llamados "Obra …" o "Cronograma …". Gana el que tiene más N° Item cargados
     (en algunas obras "Obra - X" solo agrupa Contratada/barra del semáforo y el trabajo real está en "CRONOGRAMA X"). */
  const cands=tasks.filter(t=>t.isSummary&&t.children.length&&/^[\s✔✓\-]*(obra|cronograma)\b/i.test(t.name))
    .map(t=>({t,n:countItems(t)})).filter(x=>x.n>0);
  if(!cands.length){
    /* Obras chicas sin resumen "Obra…" (ej. Losa Mogetta): todo el cronograma es obra → resumen principal (nivel 1) */
    const top=tasks.filter(t=>t.isSummary&&t.outlineLevel===1&&countItems(t)>0).sort((a,b)=>countItems(b)-countItems(a))[0];
    return top||null;
  }
  cands.sort((a,b)=>b.n-a.n||a.t.outlineLevel-b.t.outlineLevel);
  /* Si el ganador está dentro de otro candidato (ej. "Obra" > "Cronograma"), usar el exterior solo si suma los mismos ítems */
  let r=cands[0].t;
  for(let p=r.parent;p;p=p.parent){const c=cands.find(x=>x.t===p);if(c&&c.n===cands[0].n)r=p}
  return r;
}
function classifyAlcance(tasks){
  for(const t of tasks)t.alc=null;
  const root=findObraRoot(tasks);
  if(!root)return{ok:false,root:null};
  const visit=(t,inherited)=>{
    const own=entV(t,'N° Item');
    const item=own||inherited;
    if(t.isSummary){for(const c of t.children)visit(c,item);return}
    /* fuera: hitos, standby y las barras del semáforo ("… Contratada" / "Obra …") */
    if(t.isMilestone||/stand[\s\-]?by/i.test(t.name)||/contratad[ao]/i.test(t.name)||/^[\s✔✓\-]*obra\b/i.test(t.name))return;
    const star=item.includes('*')||/\*\s*$/.test(t.name);
    t.alc=item&&!star?'base':'adic';
  };
  for(const c of root.children)visit(c,entV(root,'N° Item'));
  return{ok:true,root};
}

/* ═══════ Utilities ═══════ */
function fD(d){if(!d)return'—';return `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`}
function dB(a,b){if(!a||!b)return 0;return Math.round((b-a)/86400000)}
function isOv(t){return!!(t.finish&&t.percentComplete<100&&!t.isSummary&&t.finish<new Date())}
/* Vencida "sin actualizar": el avance no se reportó, no necesariamente está atrasada.
   - termina después de la fecha de estado del XML (el avance se cargó hasta antes de esa fecha), o
   - está en 0 % y venció hace más de STALE_DAYS días. */
const STALE_DAYS=60;
function isStale(t,statusDate){
  if(!isOv(t))return false;
  if(statusDate&&t.finish>statusDate)return true;
  return t.percentComplete===0&&(Date.now()-t.finish)/86400000>STALE_DAYS;
}
/* Avance ponderado por duración: una tarea de 40 días pesa 40 veces lo que una de 1 día. Los hitos no pesan. */
function wAvg(ts){
  let s=0,w=0;
  for(const t of ts){if(t.isSummary||t.isMilestone)continue;const d=Math.max(t.durDays||0,1);s+=t.percentComplete*d;w+=d}
  if(!w)return ts.length?Math.round(ts.reduce((a,t)=>a+t.percentComplete,0)/ts.length):0;
  return Math.round(s/w);
}
function daysAgo(d){return d?Math.floor((Date.now()-d)/86400000):null}
function gSt(t){if(t.percentComplete>=100)return'ok';if(isOv(t))return'ov';if(t.percentComplete>0)return'ip';return'pe'}
function stC(s){return s==='ok'?'var(--ok)':s==='ov'?'var(--err)':s==='ip'?'var(--warn)':'var(--c2)'}
function stL(s){return s==='ok'?'Completada':s==='ov'?'Vencida':s==='ip'?'En curso':'Pendiente'}
function fDur(d){if(!d)return'—';const m=d.match(/PT(\d+)H/);if(!m)return'—';const h=parseInt(m[1]);const dy=Math.round(h/8);return dy===0?'0d':`${dy}d`}
function entV(t,k){const e=t.ent[k];return e&&!e.guid?e.value:''}
/* ═══════ Theme ═══════ */
function useTheme(){
  const[th,setTh]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',th)},[th]);
  return[th,useCallback(()=>setTh(t=>t==='light'?'dark':'light'),[])];
}

/* ═══════ GANTT SVG ═══════ */
function GanttSVG({tasks,minDate,maxDate,zoom,showArr,showBL,scrollRef,onTT}){
  const cRef=useRef(null);
  const scrolling=useRef(false);
  const rowH=28,hdrH=44;
  const dW=ZM[zoom].w;
  const padB=zoom==='day'?3:zoom==='week'?7:14;
  const padA=zoom==='day'?7:zoom==='week'?14:30;

  const cStart=useMemo(()=>{const d=new Date(minDate||new Date());d.setDate(d.getDate()-padB);return d},[minDate,padB]);
  const cEnd=useMemo(()=>{const d=new Date(maxDate||new Date());d.setDate(d.getDate()+padA);return d},[maxDate,padA]);
  const totD=dB(cStart,cEnd);
  const totW=Math.max(totD*dW,600);
  const totH=tasks.length*rowH;
  const d2x=useCallback(d=>{if(!d)return 0;return dB(cStart,d)*dW},[cStart,dW]);

  /* Scroll sync — ref based, no state */
  const onScroll=useCallback(e=>{if(scrolling.current)return;scrollRef.current={v:e.target.scrollTop,src:'chart'}},[scrollRef]);
  useEffect(()=>{let r;const s=()=>{const el=cRef.current;if(el&&scrollRef.current?.src==='table'){scrolling.current=true;el.scrollTop=scrollRef.current.v;scrollRef.current.src=null;requestAnimationFrame(()=>{scrolling.current=false})};r=requestAnimationFrame(s)};r=requestAnimationFrame(s);return()=>cancelAnimationFrame(r)},[scrollRef]);

  const now=new Date();const nowX=d2x(now);const showNow=now>=cStart&&now<=cEnd;
  /* Abrir el Gantt en la fecha de hoy (a un cuarto del borde izquierdo), no en el inicio de la obra */
  useEffect(()=>{const el=cRef.current;if(!el)return;const n=new Date();const tx=n<cStart?0:n>cEnd?totW:d2x(n);el.scrollLeft=Math.max(0,tx-el.clientWidth*.25)},[zoom,cStart,cEnd]);

  /* Grid lines */
  const grid=useMemo(()=>{
    const ln=[],h1=[],h2=[];const d=new Date(cStart);
    if(zoom==='day'){while(d<=cEnd){const x=d2x(d);ln.push({x,we:d.getDay()===0||d.getDay()===6,mj:d.getDay()===1});h2.push({x,w:dW,l:d.getDate().toString()});if(d.getDate()===1||(d.getDay()===1&&!h1.length))h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});d.setDate(d.getDate()+1)}}
    else if(zoom==='week'){let lm=-1;while(d<=cEnd){const x=d2x(d);if(d.getDay()===1||d.getTime()===cStart.getTime()){ln.push({x,mj:d.getDate()<=7});h2.push({x,w:dW*7,l:d.getDate().toString()})}if(d.getMonth()!==lm){h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});lm=d.getMonth()}d.setDate(d.getDate()+1)}}
    else if(zoom==='month'){let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);ln.push({x,mj:d.getMonth()===0});const dm=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h2.push({x,w:dm*dW,l:d.toLocaleDateString('es-AR',{month:'short'})});if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    else{let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);if(d.getMonth()%3===0){ln.push({x,mj:d.getMonth()===0});h2.push({x,w:90*dW,l:`T${Math.floor(d.getMonth()/3)+1}`})}if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    return{ln,h1,h2};
  },[cStart,cEnd,zoom,dW,d2x]);

  /* Bar positions */
  const bp=useMemo(()=>{const m={};tasks.forEach((t,i)=>{const y=i*rowH,cy=y+rowH/2;if(t.isMilestone){const mx=d2x(t.start||t.finish);m[t.uid]={x:mx,y,cy,w:0,sx:mx,ex:mx}}else if(t.start&&t.finish){const x1=d2x(t.start),x2=d2x(t.finish),w=Math.max(x2-x1,2);m[t.uid]={x:x1,y,cy,w,sx:x1,ex:x1+w}}});return m},[tasks,d2x]);

  /* Dependency arrows */
  const arrs=useMemo(()=>{if(!showArr)return[];const r=[];for(const t of tasks){for(const pr of t.predecessors){const f=bp[pr.taskUid],tp=bp[t.uid];if(!f||!tp)continue;let fx,fy,tx,ty;switch(pr.type){case'FS':fx=f.ex;fy=f.cy;tx=tp.sx;ty=tp.cy;break;case'FF':fx=f.ex;fy=f.cy;tx=tp.ex;ty=tp.cy;break;case'SS':fx=f.sx;fy=f.cy;tx=tp.sx;ty=tp.cy;break;default:fx=f.sx;fy=f.cy;tx=tp.ex;ty=tp.cy}const g=8;let pa;if(pr.type==='FS'){if(tx>fx+g){if(Math.abs(fy-ty)<2)pa=`M${fx},${fy} L${tx},${ty}`;else{const mx=(fx+tx)/2;pa=`M${fx},${fy} L${mx},${fy} L${mx},${ty} L${tx},${ty}`}}else{const dy=fy<ty?Math.max(fy,ty)+rowH*.6:Math.min(fy,ty)-rowH*.6;pa=`M${fx},${fy} L${fx+g},${fy} L${fx+g},${dy} L${tx-g},${dy} L${tx-g},${ty} L${tx},${ty}`}}else if(pr.type==='SS'){const lx=Math.min(fx,tx)-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}else if(pr.type==='FF'){const rx=Math.max(fx,tx)+g;pa=`M${fx},${fy} L${rx},${fy} L${rx},${ty} L${tx},${ty}`}else{const lx=fx-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}r.push({pa,tx,ty})}}return r},[tasks,bp,showArr]);

  const bEnter=useCallback((e,t)=>{const r=e.currentTarget.getBoundingClientRect();onTT({task:t,x:r.left+r.width/2,y:r.top-4})},[onTT]);
  const bLeave=useCallback(()=>onTT(null),[onTT]);

  return(
    <div ref={cRef} className="gcc" onScroll={onScroll}>
      <svg width={totW} height={totH+hdrH} style={{display:'block'}}>
        <rect x="0" y="0" width={totW} height={hdrH} fill="var(--bg-1)"/>
        <line x1="0" y1={hdrH} x2={totW} y2={hdrH} stroke="var(--b0)"/>
        {grid.h1.map((h,i)=><text key={i} x={h.x+4} y={16} fontSize="10" fontWeight="600" fill="var(--c1)" fontFamily="var(--ff)">{h.l}</text>)}
        {grid.h2.map((h,i)=><text key={i} x={h.x+(h.w?h.w/2:4)} y={34} fontSize="10" fill="var(--c2)" fontFamily="var(--fm)" textAnchor={h.w?'middle':'start'}>{h.l}</text>)}
        {grid.ln.map((l,i)=><line key={i} x1={l.x} y1={hdrH} x2={l.x} y2={totH+hdrH} stroke={l.mj?'var(--b0)':'var(--b1)'} strokeWidth={l.mj?1:.5} strokeDasharray={l.mj?'none':'2,4'}/>)}
        {zoom==='day'&&grid.ln.filter(l=>l.we).map((l,i)=><rect key={i} x={l.x} y={hdrH} width={dW} height={totH} fill="var(--c2)" opacity=".04"/>)}
        {tasks.map((_,i)=><line key={i} x1="0" y1={hdrH+(i+1)*rowH} x2={totW} y2={hdrH+(i+1)*rowH} stroke="var(--b1)" strokeWidth=".5"/>)}
        {arrs.map((a,i)=><g key={i}><path d={a.pa} fill="none" stroke="var(--arr)" strokeWidth="1" transform={`translate(0,${hdrH})`}/><polygon points={`${a.tx},${a.ty+hdrH} ${a.tx-4},${a.ty-3+hdrH} ${a.tx-4},${a.ty+3+hdrH}`} fill="var(--arr-h)" opacity=".5"/></g>)}
        {showNow&&<g><line x1={nowX} y1={hdrH} x2={nowX} y2={totH+hdrH} stroke="var(--today)" strokeWidth="1.5" strokeDasharray="4,3"/><rect x={nowX-16} y={hdrH-14} width="32" height="13" rx="2" fill="var(--today)"/><text x={nowX} y={hdrH-5} textAnchor="middle" fontSize="9" fontWeight="600" fill="white" fontFamily="var(--ff)">HOY</text></g>}
        {tasks.map((t,i)=>{
          const y=hdrH+i*rowH,cy=y+rowH/2;
          let blEl=null;
          if(showBL&&t.baselines.length>0){const b=t.baselines[0];if(b.start&&b.finish&&!t.isMilestone){const bx=d2x(b.start),bw=Math.max(d2x(b.finish)-bx,2);blEl=<rect x={bx} y={cy+5} width={bw} height={3} fill="var(--bar-bl)" rx="1.5" opacity=".5"/>}}
          if(t.isMilestone){const mx=d2x(t.start||t.finish),sz=5,c=isOv(t)?'var(--bar-ov)':'var(--bar-ms)';return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<polygon points={`${mx},${cy-sz} ${mx+sz},${cy} ${mx},${cy+sz} ${mx-sz},${cy}`} fill={c}/></g>}
          if(!t.start||!t.finish)return blEl?<g key={t.uid}>{blEl}</g>:null;
          const x=d2x(t.start),w=Math.max(d2x(t.finish)-x,2),bH=t.isSummary?6:10,bY=cy-bH/2,p=t.percentComplete,ov=isOv(t),dn=p>=100;
          let bg='var(--bar-bg)',fg='var(--bar)';if(ov){bg='var(--bar-ov-bg)';fg='var(--bar-ov)'}else if(dn){bg='var(--bar-ok-bg)';fg='var(--bar-ok)'}
          if(t.isSummary)return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill="var(--bar-sum)" rx="1" opacity=".7"/><rect x={x} y={bY} width={w*p/100} height={bH} fill="var(--bar-sum)" rx="1"/><path d={`M${x},${bY} L${x},${bY+bH+3} L${x+4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/><path d={`M${x+w},${bY} L${x+w},${bY+bH+3} L${x+w-4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/></g>;
          return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill={bg} rx="3"/><rect x={x} y={bY} width={Math.max(w*p/100,0)} height={bH} fill={fg} rx="3"/>{w>30&&p>0&&<text x={x+4} y={cy+3} fontSize="8" fontWeight="600" fill={fg} fontFamily="var(--fm)" opacity=".8">{p}%</text>}</g>;
        })}
      </svg>
    </div>
  );
}
/* Hasta cuándo está cargado el avance (fecha de estado de MS Project) */
function Frescura({sd,short}){
  const n=daysAgo(sd);
  if(n===null)return <span className={'fresh '+(short?'none':'old')} title="El XML no tiene fecha de estado: en MS Project, Proyecto → Información del proyecto → Fecha de estado">{short?'Sin fecha de estado':'Avance sin fecha de estado'}</span>;
  const cls=n>30?'old':n>10?'mid':'ok';
  return <span className={'fresh '+cls} title={'Fecha de estado del XML: '+fD(sd)}>{short?`Avance al ${fD(sd)}`:`Avance cargado al ${fD(sd)}`} · hace {n} d</span>;
}
/* ═══════ Dashboard por proyecto ═══════ */

  const ovStale=ts.filter(t=>isStale(t,data.statusDate)).length;
  const ovReal=ov-ovStale;
  const avg=wAvg(ts);
  const sdAgo=daysAgo(data.statusDate);

  const cMap={};
  ts.forEach(t=>{const c=entV(t,'Contratista')||'Sin contratista';if(!cMap[c])cMap[c]={tot:0,done:0,ov:0};cMap[c].tot++;if(t.percentComplete>=100)cMap[c].done++;if(isOv(t))cMap[c].ov++});

  const upcoming=ts.filter(t=>t.finish&&t.finish>=new Date()&&t.percentComplete<100).sort((a,b)=>a.finish-b.finish).slice(0,10);
  const alcStats=k=>{const g=ts.filter(t=>t.alc===k);const n=g.length;
    return{n,done:g.filter(t=>t.percentComplete>=100).length,ip:g.filter(t=>t.percentComplete>0&&t.percentComplete<100).length,
      ov:g.filter(t=>isOv(t)).length,avg:wAvg(g),
      fin:g.reduce((m,t)=>t.finish&&(!m||t.finish>m)?t.finish:m,null)}};
  const alc=data.hasAlcance?{base:alcStats('base'),adic:alcStats('adic')}:null;
  const h=health;
  const semaColor=h?SEMA_COL[h.color]:'var(--c2)';

  return <div className="dash">
    {proj&&<div className="obra-strip">
      {proj.cod?<span className="cod lg">{proj.cod}</span>:<span className="cod lg off" title="Sin código asignado">—</span>}
      <span style={{fontWeight:700}}>{proj.name}</span>
      {proj.cliente&&<span>👤 {proj.cliente}</span>}
      {proj.lote&&<span>📌 {proj.lote}</span>}

    </div>}

        <span style={{fontSize:16,fontWeight:700,color:semaColor}}>{SEMA_ICO[h.color]} {h.label}</span>
        <span style={{fontSize:13,color:'var(--c1)'}}>{h.motivo}</span>
      </div>
      {h.hasContratada&&<div style={{display:'flex',gap:24,flexWrap:'wrap',fontSize:12}}>
        <div><span style={{color:'var(--c2)'}}>Fin contratado: </span><span style={{fontFamily:'var(--fm)',fontWeight:600}}>{fD(h.finContratado)}</span></div>
        <div><span style={{color:'var(--c2)'}}>Fin obra: </span><span style={{fontFamily:'var(--fm)',fontWeight:600}}>{fD(h.finObra)}</span></div>
        {h.desvioBruto!==null&&<div><span style={{color:'var(--c2)'}}>Desvío bruto: </span><span style={{fontFamily:'var(--fm)',fontWeight:600}}>{h.desvioBruto>0?'+':''}{h.desvioBruto}d</span></div>}
        {h.standbyDays>0&&<div><span style={{color:'var(--c2)'}}>Standby: </span><span style={{fontFamily:'var(--fm)',fontWeight:600}}>{h.standbyDays}d</span></div>}
        {h.standbyDays>0&&h.desvioNeto!==null&&<div><span style={{color:'var(--c2)'}}>Desvío neto: </span><span style={{fontFamily:'var(--fm)',fontWeight:600,color:h.desvioNeto<=0?'var(--ok)':h.desvioNeto<=15?'var(--warn)':'var(--err)'}}>{h.desvioNeto>0?'+':''}{h.desvioNeto}d</span></div>}
      </div>}

        {h.standbyDetail.map((sb,i)=><div key={i} style={{fontSize:11,display:'flex',gap:12,padding:'2px 0'}}>

      <div style={{height:8,borderRadius:4,background:'var(--bg-2)',overflow:'hidden'}}><div style={{height:'100%',borderRadius:4,width:`${avg}%`,background:'var(--ac)'}}/></div>
