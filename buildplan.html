/* N° de ítem → parte numérica, igual que Cómputo: "[JS 2.35*]" → "2.35" */
function nItemNum(raw){
  let t=String(raw==null?'':raw).trim().replace(/^\[|\]$/g,'').replace(/\s+/g,'').replace(/\*+$/,'');
  if(!t)return'';
  t=t.replace(/,/g,'.').toUpperCase().replace(/^([A-Z]+)[.\-_]+(?=\d)/,'$1');
  const m=t.match(/^([A-Z]{0,4})(\d+\.\d+)$/);return m?m[2]:'';
}
/* "10.01" y "10.1" → "10.1" (segundo intento, solo si no hay ambigüedad) */
const canonNum=n=>n?n.split('.').map(x=>String(parseInt(x,10))).join('.'):'';
const _vacioComputo={coefs:[],coefMap:{},materiales:[],matByName:{},mediciones:[],medByCoef:{},medByItem:{},medByCanon:{},coefById:{},hasItems:false,obra:null};

/* Cache computo data per project code */
const _computoCache={};
async function fetchComputoForProject(projectCode){
  if(!projectCode)return null;
  if(_computoCache[projectCode])return _computoCache[projectCode];
  try{
    const sb=await getComputoSb();
    if(!sb)return{..._vacioComputo,loaded:false,needLogin:true};
    /* Fetch coeficientes (task recipes - shared, read-only) */
    const{data:coefs,error:e1}=await sb.from('coeficientes').select('id,cod,nombre,rubro,unidad,mats');
    if(e1){if(/JWT|401|expired/i.test(e1.message||''))return{..._vacioComputo,loaded:false,needLogin:true};throw e1}
    if(!coefs||!coefs.length)return{..._vacioComputo,loaded:false,needLogin:true};
    /* Fetch materiales (base materials - shared, read-only) */
    const{data:mats,error:e2}=await sb.from('materiales').select('id,cod,nombre,unidad,cat,precio');
    if(e2)throw e2;
    /* Try to fetch obra and mediciones for this specific project */
    let obra=null,mediciones=[];
    const{data:obras}=await sb.from('obras').select('*').eq('cod',projectCode);
    if(obras&&obras.length){
      obra=obras[0];
      const{data:meds}=await sb.from('mediciones').select('*').eq('obra_id',obra.id);
      if(meds&&meds.length){
        /* Si hay varias revisiones se usa la que tiene más mediciones (igual que Cómputo), para no sumar dos veces */
        const cnt={};for(const m of meds){const r=m.revision||'Rev00';cnt[r]=(cnt[r]||0)+1}
        const rev=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
        mediciones=meds.filter(m=>(m.revision||'Rev00')===rev);obra={...obra,_rev:rev};
      }
    }
    /* Build lookup maps */
    const coefMap={},coefById={};for(const c of(coefs||[])){coefMap[c.cod]=c;coefById[String(c.id)]=c}
    const matByName={};for(const m of(mats||[]))matByName[m.nombre]=m;
    /* Build medicion lookup by coef_id */
    const medByCoef={};for(const m of mediciones){if(!medByCoef[m.coef_id])medByCoef[m.coef_id]=[];medByCoef[m.coef_id].push(m)}
    /* Ítem de presupuesto de la obra (mediciones.item_cod) ↔ N° Item del cronograma */
    /* El N° viene en item_cod o al inicio de la descripción: "[2.34] ..." */
    const medByItem={},medByCanon={};
    for(const m of mediciones){
      const k=nItemNum(m.item_cod)||nItemNum(((m.descripcion||'').match(/^\s*\[([^\]]+)\]/)||[])[1]);
      if(!k)continue;
      (medByItem[k]=medByItem[k]||[]).push(m);
      const c=canonNum(k);(medByCanon[c]=medByCanon[c]||{keys:new Set(),meds:[]});medByCanon[c].keys.add(k);medByCanon[c].meds.push(m);
    }
    const result={obra,coefs:coefs||[],coefMap,coefById,materiales:mats||[],matByName,mediciones,medByCoef,medByItem,medByCanon,hasItems:Object.keys(medByItem).length>0,loaded:true};
    _computoCache[projectCode]=result;
    return result;
  }catch(err){
    console.warn('Computo fetch error:',err);
    return{..._vacioComputo,loaded:false,error:err.message||'Error de conexión'};
  }
}

/* Get materials for a task by its N° Item code */
function getTaskMaterials(computoData,nItem){
  if(!computoData||!nItem)return null;
  const key=nItemNum(nItem)||String(nItem).trim();
  /* 1) Vínculo principal: N° Item (Texto4) = ítem del presupuesto de ESA obra */
  let iMeds=computoData.medByItem&&computoData.medByItem[key];
  if(!(iMeds&&iMeds.length)){const c=computoData.medByCanon&&computoData.medByCanon[canonNum(key)];if(c&&c.keys.size===1)iMeds=c.meds}
  if(iMeds&&iMeds.length){
    const agg={};let tot=0,coef0=null;
    for(const med of iMeds){
      const c=computoData.coefById[String(med.coef_id)];if(!c)continue;
      coef0=coef0||c;const q=Number(med.cantidad)||0;tot+=q;
      for(const m of(c.mats||[])){
        const k=m.matRef+'|'+(m.un||'');
        if(!agg[k])agg[k]={...m,materialInfo:computoData.matByName[m.matRef],_need:0};
        agg[k]._need+=q*(Number(m.coef)||0);
      }
    }
    if(!coef0)return null;
    const items=Object.values(agg).map(m=>({...m,cantidadNecesaria:m._need.toFixed(2),cantidadComercial:m.divisor&&m.divisor>1?Math.ceil(m._need/m.divisor):m._need,totalMedido:tot}));
    return{coef:coef0,items,mediciones:iMeds,totalMedido:tot,via:'item'};
  }
  /* 2) Fallback histórico (código de catálogo) — solo si la obra no tiene ítems cargados */
  if(computoData.hasItems||!computoData.coefMap[key])return null;
  const coef=computoData.coefMap[key];
  if(!coef.mats||!coef.mats.length)return{coef,items:[],mediciones:[]};
  const meds=computoData.medByCoef[coef.id]||[];
  const totalQty=meds.reduce((s,m)=>s+(m.cantidad||0),0);
  const items=(coef.mats||[]).map(m=>{
    const mat=computoData.matByName[m.matRef];
    const needed=totalQty>0?totalQty*m.coef:m.coef;
    const commercial=m.divisor&&m.divisor>1?Math.ceil(needed/m.divisor):needed;
    return{...m,materialInfo:mat,cantidadNecesaria:needed.toFixed(2),cantidadComercial:commercial,totalMedido:totalQty};
  });
  return{coef,items,mediciones:meds,totalMedido:totalQty};
}

function MaterialsView({data,computoData,visTasks,onLogin,lead=15}){
  const[viewMode,setViewMode]=useState('list');/*list|period*/
  const[openMat,setOpenMat]=useState({});/* filas desplegadas: "lista|Material" o "2026-10|Material" */
  const togMat=k=>setOpenMat(o=>({...o,[k]:!o[k]}));
  const[periodMode,setPeriodMode]=useState('month');/*week|month*/
  const[selTask,setSelTask]=useState(null);
  const[fRubro,setFRubro]=useState('all');
  const[fMat,setFMat]=useState('');
  /* pend: descuenta lo ya ejecutado (cantidad × (1 − avance)); total: cómputo completo */
  const[qMode,setQMode]=useState('pend');

  if(computoData&&computoData.needLogin)return <ComputoLogin onOk={onLogin}/>;
  if(!computoData)return <div className="ld"><div className="sp"/><span>Conectando con Cómputo…</span></div>;
  if(!computoData.loaded)return <div className="mat-empty">
    <div style={{fontSize:16,marginBottom:8}}>⚠️ No se pudo conectar con Cómputo de Obras</div>
    <div>{computoData?.error||'Verificá la conexión a internet e intentá de nuevo.'}</div>
  </div>;

  /* Build consolidated materials list from all tasks */
  const allMaterials=useMemo(()=>{
    const matMap={};
    const taskMats=[];
    for(const t of(visTasks||data.tasks)){
      if(t.isSummary)continue;
      const nItem=entV(t,'N° Item');
      if(!nItem)continue;
      const info=getTaskMaterials(computoData,nItem);
      if(!info||!info.items.length)continue;
      const fac=qMode==='pend'?Math.max(0,1-(t.percentComplete||0)/100):1;
      if(fac===0)continue;
      taskMats.push({task:t,info});
      const pk=t.start?(periodMode==='week'
            ?`${t.start.getFullYear()}-S${String(Math.ceil((t.start.getDate()+new Date(t.start.getFullYear(),t.start.getMonth(),1).getDay())/7)).padStart(2,'0')}-${String(t.start.getMonth()+1).padStart(2,'0')}`
            :`${t.start.getFullYear()}-${String(t.start.getMonth()+1).padStart(2,'0')}`):null;
      for(const m of info.items){
        const key=m.matRef;
        if(!matMap[key])matMap[key]={matRef:m.matRef,un:m.un,unComercial:m.unComercial||m.un,cat:m.materialInfo?.cat||'',precio:m.materialInfo?.precio||0,totalNeeded:0,tasks:[],byPeriod:{}};
        const q=(parseFloat(m.cantidadNecesaria)||0)*fac;
        matMap[key].totalNeeded+=q;
        matMap[key].tasks.push({task:t,qty:q,pk,nItem});
        /* Group by period */
        if(pk){
          if(!matMap[key].byPeriod[pk])matMap[key].byPeriod[pk]=0;
          matMap[key].byPeriod[pk]+=q;
        }
      }
    }
    /* Pedir antes de: inicio de la primera tarea pendiente que lo usa, menos el plazo de pedido */

      m.firstStart=st;m.orderBy=st?new Date(st.getTime()-lead*86400000):null;
    }
    const list=Object.values(matMap).sort((a,b)=>(a.orderBy?a.orderBy.getTime():Infinity)-(b.orderBy?b.orderBy.getTime():Infinity)||b.totalNeeded-a.totalNeeded);

  const flecha=k=><span style={{display:'inline-block',width:12,color:'var(--c2)'}}>{openMat[k]?'▾':'▸'}</span>;

          </table>

    </div>}
  </div>;
}

/* ═══════ DATOS PRIVADOS (Supabase de Cómputo) ═══════
   BkTableros es solo de Bauvek: entran usuarios de Cómputo con empresa "bauvek" o rol admin, y todo vive en la carpeta bauvek/.
   (Cómputo es multiempresa y usa la misma estructura: <empresa>/ en el bucket; las políticas no dejan leer carpetas de otra empresa.)
   - Bucket "cronogramas", carpeta bauvek/: xml/<archivo> (original), lite/<archivo> (sin TimephasedData), manifest.json, proyectos.xlsx
   - Tabla tendencia_obras: una foto por empresa, obra y semana
   - Tabla enlaces_publicos + función ver_enlace(): links de cliente y de contratista con token, con la marca de la empresa
   Ver supabase/2026-10-20_bktableros_datos_privados.sql */
const CRONO_BUCKET='cronogramas';
const REPO_EMPRESA='bauvek'; /* los XML que todavía están en el repo público son de Bauvek */
let _empresa='bauvek';
/* Marca fija del sitio para lo que ve gente de afuera (links de cliente y contratista) */
const BAUVEK={id:'bauvek',nombre:'Bauvek Construcciones',logo:null,color:'#9E0101'};
function puedeEntrar(c){return!!c&&(c.empresa==='bauvek'||c.admin)}
function jwtClaims(t){try{const p=JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));const am=p.app_metadata||{};return{empresa:am.empresa||null,admin:am.role==='admin',email:p.email||''}}catch(e){return{empresa:null,admin:false,email:''}}}
async function sbDownload(path){
  if(!_empresa)return null;
  try{const sb=await getComputoSb();if(!sb)return null;const{data,error}=await sb.storage.from(CRONO_BUCKET).download(_empresa+'/'+path);return error?null:data}catch(e){return null}
}
async function sbUpload(path,body,type){
  const sb=await getComputoSb();if(!sb)throw new Error('Iniciá sesión para subir archivos');
  if(!_empresa)throw new Error('No hay una empresa elegida');
  const{error}=await sb.storage.from(CRONO_BUCKET).upload(_empresa+'/'+path,body,{upsert:true,contentType:type,cacheControl:'60'});
  if(error)throw new Error(error.message||String(error));
}
/* Índice de cronogramas de la empresa: privado si existe; para Bauvek, mientras dure la migración, el del repo */
async function loadManifest(){
  const b=await sbDownload('manifest.json');
  if(b){try{return{m:JSON.parse(await b.text()),origen:'privado'}}catch(e){}}
  if(_empresa!==REPO_EMPRESA)return{m:{projects:[]},origen:'privado'};
  const r=await fetch('data/manifest.json?t='+Date.now());
  if(!r.ok)throw new Error('No se pudo leer el índice de cronogramas ('+r.status+')');
  return{m:await r.json(),origen:'repo'};
}
/* Mismos controles que scripts/generate-manifest.js */
function revisarXml(xml,file){
  const avisos=[];
  const ctrl=(xml.match(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g)||[]).length;
  if(ctrl)avisos.push(`${ctrl} carácter(es) inválido(s) en el XML (se limpian al leer)`);
  const tareas=xml.split('<Task>').slice(1).map(t=>t.split('</Task>')[0]);
  const reales=tareas.filter(t=>!/<UID>0<\/UID>/.test(t));
  const hojas=reales.filter(t=>!/<Summary>1<\/Summary>/.test(t));
  const sinNombre=reales.filter(t=>!/<Name>[^<]*\S[^<]*<\/Name>/.test(t)).length;
  if(sinNombre)avisos.push(`${sinNombre} tarea(s) sin nombre`);
  if(hojas.length){const conLB=hojas.filter(t=>t.includes('<Baseline>')).length;
    if(conLB===0)avisos.push('sin línea base');else if(conLB<hojas.length*.8)avisos.push(`línea base solo en ${Math.round(100*conLB/hojas.length)}% de las tareas`)}
  if(/^VI[a-z]/.test(file))avisos.push('el nombre del archivo empieza con "VI" mayúscula');
  const m=xml.slice(0,4096).match(/<(?:\w+:)?Name>(.*?)<\/(?:\w+:)?Name>/);
  return{tareas:hojas.length,avisos,name:m?m[1].trim():file.replace(/\.xml$/i,'')};
}
async function sha1(buf){const h=await crypto.subtle.digest('SHA-1',buf);return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12)}
/* Supabase Storage no acepta tildes ni ñ en el nombre del archivo ("Invalid key"). Se guarda con un nombre
   sin acentos ("Remodelación.xml" → "Remodelacion.xml"); el índice conserva el nombre original para mostrarlo.
   Cómputo de Obras usa la misma regla. */
function storageKey(file){return String(file).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._\- ]/g,'_')}
/* Sube uno o varios XML (original + liviano) y actualiza el índice. Si un archivo falla, sigue con el resto
   y lo informa al final. onStep informa el avance. */
async function subirCronogramas(files,onStep){
  let man={projects:[]};
  const b=await sbDownload('manifest.json');if(b){try{man=JSON.parse(await b.text())}catch(e){}}
  const byFile={};for(const p of man.projects||[])byFile[p.file]=p;
  let i=0;const fallas=[];
  for(const f of files){
    i++;onStep&&onStep(`Subiendo ${f.name} (${i}/${files.length})…`);
    try{
      const buf=await f.arrayBuffer();
      const xml=new TextDecoder('utf-8').decode(buf);
      const rev=revisarXml(xml,f.name);
      const lite=xml.replace(/\s*<TimephasedData>[\s\S]*?<\/TimephasedData>/g,'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,' ');
      const k=storageKey(f.name);
      await sbUpload('xml/'+k,new Blob([buf],{type:'application/xml'}),'application/xml');
      await sbUpload('lite/'+k,new Blob([lite],{type:'application/xml'}),'application/xml');
      byFile[f.name]={file:f.name,key:k,name:rev.name,hash:await sha1(buf),sizeKB:Math.round(buf.byteLength/1024),tareas:rev.tareas,avisos:rev.avisos,subido:new Date().toISOString()};
    }catch(e){fallas.push(f.name+': '+(e.message||e))}
  }
  const projects=Object.values(byFile).sort((a,b)=>a.file.localeCompare(b.file));
  const nm={generated:new Date().toISOString(),count:projects.length,projects};
  await sbUpload('manifest.json',new Blob([JSON.stringify(nm,null,2)],{type:'application/json'}),'application/json');
  if(fallas.length)throw new Error(`Se subieron ${files.length-fallas.length} de ${files.length}. No se pudieron subir: ${fallas.join(' · ')}`);
  return nm;
}
/* Copia de una sola vez lo que hoy está en el repo público al almacenamiento privado */
async function migrarDesdeRepo(onStep){
  if(_empresa!==REPO_EMPRESA)throw new Error('Los cronogramas del repo son de Bauvek');
  const r=await fetch('data/manifest.json?t='+Date.now());if(!r.ok)throw new Error('No hay cronogramas en el repo');
  const m=await r.json();const files=[];
  for(const p of m.projects||[]){
    onStep&&onStep(`Leyendo ${p.file} del repo…`);
    const x=await fetch('data/projects/'+encodeURIComponent(p.file)+'?t='+Date.now());
    if(x.ok)files.push(new File([await x.arrayBuffer()],p.file,{type:'application/xml'}));
  }
  const nm=await subirCronogramas(files,onStep);
  const xl=await fetch('data/Proyectos_Bauvek.xlsx?t='+Date.now());
  if(xl.ok){onStep&&onStep('Copiando el Excel de proyectos…');await sbUpload('proyectos.xlsx',await xl.blob(),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
  return nm;
}

const isoD=d=>d&&!isNaN(d)?d.toISOString().slice(0,10):null;
/* Foto para el cliente: sin semáforo, vencidas, recursos ni contratistas */
function snapCliente(p,d,h,meta){
  const ts=d.tasks.filter(t=>!t.isSummary);
  const ms=ts.filter(t=>t.isMilestone).sort((a,b)=>(a.finish||0)-(b.finish||0));
  const now=new Date();
  const next=ms.find(m=>m.percentComplete<100&&m.finish&&m.finish>=now);
  const entrega=h&&h.finObra&&h.finObra.getTime()>0?h.finObra:d.maxDate;
  return{nombre:p.name,lugar:[meta&&(meta.cityLabel||meta.ciudad),meta&&meta.comitente].filter(Boolean).join(' · '),
    avance:h?h.avg:wAvg(ts),entrega:isoD(entrega),proximo:next?{nombre:next.name,fecha:isoD(next.finish)}:null,
    etapas:d.tasks.filter(t=>t.isSummary&&t.depth===0).sort((a,b)=>(a.start||0)-(b.start||0)).slice(0,12).map(t=>({nombre:t.name,desde:isoD(t.start),hasta:isoD(t.finish),avance:t.percentComplete})),
    hitos:ms.map(m=>({nombre:m.name,fecha:isoD(m.finish),cumplido:m.percentComplete>=100}))};
}
/* Agenda del contratista: sus tareas pendientes de la semana pasada a 4 semanas adelante, en todas las obras activas */
function snapContratista(nombre,projList,projData,metaList){
  const from=mondayOf(new Date());from.setDate(from.getDate()-7);
  const to=new Date(from);to.setDate(to.getDate()+7*5);
  const items=[];
  for(const p of projList||[]){
    const d=projData[p.key];if(!d||p.local)continue;
    const meta=matchMeta(p.name,metaList);
    if(!pgIsActive(meta?.estado))continue;
    for(const t of d.tasks){
      if(t.isSummary||t.isMilestone||isCtrlTask(t)||t.percentComplete>=100||!t.start||!t.finish)continue;
      if(normName(entV(t,'Contratista'))!==normName(nombre))continue;
      if(t.start>to||t.finish<from)continue;
      items.push({obra:p.name,cod:p.cod||'',lugar:meta?(meta.cityLabel||meta.ciudad||''):'',tarea:t.name,grupo:taskPath(t),desde:isoD(t.start),hasta:isoD(t.finish),avance:t.percentComplete});
    }
  }
  items.sort((a,b)=>a.desde.localeCompare(b.desde)||a.obra.localeCompare(b.obra));
  return{nombre,items};
}

        const k=proj.key;
        if(pData[k])continue; /* already loaded */
        setAutoLoading(p=>({...p,[k]:true}));
        try{
          const txt=await fetchXml(proj);
          const d=parseMSPDI(txt);
          if(cancelled)break;
          setPData(p=>({...p,[k]:d}));
          const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});
          setExpMap(p=>({...p,[k]:em}));
          const h=calcHealth(d);
          setHealthMap(p=>({...p,[k]:h}));
        }catch(e){/* skip failed loads */}
        finally{setAutoLoading(p=>{const n={...p};delete n[k];return n})}
      }
    };
    Promise.all([0,1,2,3].map(()=>worker())).then(()=>{if(!cancelled)setBgDone(true)});
    return()=>{cancelled=true};
  },[pListKeys]);

  /* Recalculate health when project data changes + record trend */
  useEffect(()=>{
    const newH={};
    for(const[k,d] of Object.entries(pData)){
      newH[k]=calcHealth(d);
    }
    setHealthMap(newH);
    /* Sin la tabla compartida, la tendencia se sigue guardando en este navegador */
    if(Object.keys(newH).length>0&&!sharedTrend.current){
      const updated=recordSnapshot(newH);
      setTrendData(updated);
    }
  },[pData]);

  /* Una vez por sesión, con todo cargado: foto semanal compartida y actualización de los links públicos */
  useEffect(()=>{
    if(!bgDone||syncDone.current||!pList||origen===null)return;
    syncDone.current=true;
    const sp=pList.filter(p=>!p.local&&p.file&&pData[p.key]);
    const semana=isoD(mondayOf(new Date()));
    const rows=sp.filter(p=>pgIsActive(matchMeta(p.name,metaList)?.estado)&&healthMap[p.key]).map(p=>{const h=healthMap[p.key];
      return{semana,archivo:p.file,avance:h.avg,vencidas:h.ovReal||0,sin_actualizar:h.ovStale||0,hechas:h.done,total:h.tot}});
    guardarTendencia(rows).then(ok=>{if(ok)cargarTendencia().then(t=>{if(t){sharedTrend.current=true;setTrendData(t)}})});
    (async()=>{try{
      const sb=await getComputoSb();if(!sb)return;
      const{data,error}=await sb.from('enlaces_publicos').select('tipo,clave').eq('empresa',_empresa).eq('activo',true);
      if(error||!data||!data.length)return;
      const upd=[];
      for(const e of data){
        if(e.tipo==='cliente'){const p=sp.find(x=>x.file===e.clave);if(p)upd.push({tipo:'cliente',clave:e.clave,datos:snapCliente(p,pData[p.key],healthMap[p.key],matchMeta(p.name,metaList))})}
        else if(e.tipo==='contratista')upd.push({tipo:'contratista',clave:e.clave,datos:snapContratista(e.clave,pList,pData,metaList)});
      }
      if(upd.length)await guardarEnlaces(upd);
    }catch(e){console.warn('No se pudieron actualizar los links públicos',e)}})();
  },[bgDone,pList,pData,healthMap,metaList,origen]);

  /* Link público con token: lo crea (o reutiliza) y lo copia */
  const makeLink=useCallback(async(tipo,clave)=>{
    try{
      let datos;
      if(tipo==='cliente'){const p=(pList||[]).find(x=>x.file===clave);const d=p&&pData[p.key];if(!d)throw new Error('La obra todavía no terminó de cargar');datos=snapCliente(p,d,healthMap[p.key],matchMeta(p.name,metaList))}
      else datos=snapContratista(clave,pList,pData,metaList);
      const[r]=await guardarEnlaces([{tipo,clave,datos}]);
      const url=window.location.origin+window.location.pathname+'?v='+r.token;
      const label=tipo==='cliente'?'Link de la vista cliente':'Link de la agenda de '+clave;
      try{await navigator.clipboard.writeText(url);setToast({t:label+' copiado',u:url})}catch(e){setToast({t:label+': copialo desde acá',u:url})}
    }catch(e){setToast({t:'No se pudo crear el link: '+(e.message||e)+(String(e.message||'').includes('enlaces_publicos')?' (falta la configuración de Supabase)':'')})}
  },[pList,pData,healthMap,metaList]);

  const resetF=useCallback(()=>{setFSt('all');setFRes('all');setFCon('all');setFRub('all');setFTab('all');setFAlc('all');setFNiv('all');setFWbs(99);setFDf('');setFDt('')},[]);

  const openProj=useCallback(async(proj)=>{

    if(!pData[k]&&!loading[k]){

      try{
        const txt=await fetchXml(proj);
        const d=parseMSPDI(txt);
        setPData(p=>({...p,[k]:d}));
        const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});
        setExpMap(p=>({...p,[k]:em}));
      }catch(e){setErrors(p=>({...p,[k]:e.message}))}
      finally{setLoading(p=>{const n={...p};delete n[k];return n})}
    }
    setOpen(p=>p.includes(k)?p:[...p,k]);
    setActive(k);setSub(s=>PROJ_SUBS.includes(s)?s:'dash');resetF();
  },[openTabs,pData,loading,resetF]);

  const closeTab=useCallback((k,e)=>{e?.stopPropagation();setOpen(p=>{const n=p.filter(x=>x!==k);if(active===k)setActive(n.length?n[n.length-1]:null);return n})},[active]);

  const handleLocal=useCallback(file=>{
    const reader=new FileReader();
    reader.onload=e=>{try{
      const d=parseMSPDI(e.target.result);
      const k='loc_'+Date.now();
      const oc=obraCode(file.name);const proj={key:k,name:file.name.replace('.xml',''),file:file.name,size:file.size,local:true,cod:oc?.cod||null,cliente:oc?.cliente||null,lote:oc?.lote||null};
      setPList(p=>[...(p||[]),proj]);setPData(p=>({...p,[k]:d}));
      const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});setExpMap(p=>({...p,[k]:em}));
      setOpen(p=>[...p,k]);setActive(k);setSub('dash');resetF();
    }catch(err){console.error(err)}};
    reader.readAsText(file);
  },[resetF]);

  const togTask=useCallback((k,uid)=>{setExpMap(p=>{const m={...p[k]};m[uid]=!m[uid];return{...p,[k]:m}})},[]);
  const expAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=true});setExpMap(p=>({...p,[k]:m}))},[]);
  const colAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=false});setExpMap(p=>({...p,[k]:m}))},[]);

  const fCount=useMemo(()=>{let c=0;if(fSt!=='all')c++;if(fRes!=='all')c++;if(fCon!=='all')c++;if(fRub!=='all')c++;if(fTab!=='all')c++;if(fAlc!=='all')c++;if(fNiv!=='all')c++;if(fWbs<99)c++;if(fDf||fDt)c++;return c},[fSt,fRes,fCon,fRub,fTab,fAlc,fNiv,fWbs,fDf,fDt]);

  const aProj=useMemo(()=>(pList||[]).find(p=>p.key===active),[pList,active]);
  const aData=active?pData[active]:null;
  const aLoading=active?!!loading[active]:false;
  const aErr=active?errors[active]:null;

  /* Visible tasks with filters */
  const visTasks=useMemo(()=>{
    if(!aData)return[];
    const em=expMap[active]||{};
    const mf=t=>{
      if(fSt!=='all'&&gSt(t)!==fSt)return false;
      if(fRes!=='all'){if(fRes==='none'){if(t.resources.length>0)return false}else{if(!t.resources.includes(fRes))return false}}
      if(fCon!=='all'){const cv=entV(t,'Contratista');if(fCon==='none'){if(cv)return false}else{if(cv!==fCon)return false}}
      if(fRub!=='all'){const rv=entV(t,'Rubro');if(fRub==='none'){if(rv)return false}else{if(rv!==fRub)return false}}
      if(fTab!=='all'){const tv=entV(t,'Tableros');if(fTab==='none'){if(tv)return false}else{if(tv!==fTab)return false}}
      if(fAlc!=='all'&&t.alc!==fAlc)return false;
      if(fNiv!=='all'){const nv=entV(t,'Nivel');if(fNiv==='none'){if(nv)return false}else{if(nv!==fNiv)return false}}
      if(t.outlineLevel>fWbs)return false;
      if(fDf){const f=new Date(fDf);if(t.finish&&t.finish<f)return false}
      if(fDt){const f=new Date(fDt);if(t.start&&t.start>f)return false}
      return true;
    };
    const hm=t=>{if(mf(t))return true;for(const c of t.children)if(hm(c))return true;return false};
    const res=[];
    const proc=t=>{if(t.isSummary){if(!hm(t))return}else{if(!mf(t))return};res.push(t);if(t.isSummary&&em[t.uid]){for(const c of t.children)proc(c)}};
    for(const t of aData.roots||[])proc(t);
    return res;
  },[aData,active,expMap,fSt,fRes,fCon,fRub,fTab,fAlc,fNiv,fWbs,fDf,fDt]);

  /* Splitter */
  useEffect(()=>{if(!splOn)return;const mv=e=>setTblW(Math.max(300,Math.min(e.clientX,window.innerWidth-200)));const up=()=>setSplOn(false);document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);return()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)}},[splOn]);

  },[pList,pData]);

  /* Classify projects — must be top-level hook (before any conditional return) */

  const classified=useMemo(()=>{
    const used=new Set();
    const result={activo:[],pausa:[],finalizado:[],cancelada:[],sin:[]};
    for(const p of allSp){
      const m=matchMeta(p.name,metaList);
      const mKey=m?.proyecto||null;
      if(m&&mKey&&used.has(mKey))continue;
      if(m&&mKey)used.add(mKey);
      const e=(m?.estado||'').trim();
      /* Sin Excel de proyectos (empresa nueva) todas las obras se tratan como activas */
      if(!metaList.length){result.activo.push(p);continue}
      if(e==='Activo')result.activo.push(p);
      else if(e==='En pausa')result.pausa.push(p);
      else if(e==='Finalizado')result.finalizado.push(p);
      else if(e==='Cancelada'||e==='Cancelado')result.cancelada.push(p);
      else result.sin.push(p);
    }
    return result;
  },[allSp,metaList]);

  /* Resumen de obras activas para la franja de dirección y el encabezado */
  const homeSum=useMemo(()=>{
    const act=[...classified.activo,...classified.pausa];
    const hs=act.map(p=>healthMap[p.key]).filter(Boolean);
    const cnt=c=>hs.filter(h=>h.color===c).length;
    const now=new Date(),lim=new Date(now.getTime()+14*86400000);
    const hitos=[];
    for(const p of act){const d=pData[p.key];if(!d)continue;
      for(const t of d.tasks)if(t.isMilestone&&t.finish&&t.finish>=now&&t.finish<=lim&&t.percentComplete<100)hitos.push({p,t});}
    hitos.sort((a,b)=>a.t.finish-b.t.finish);
    return{n:act.length,analizadas:hs.length,r:cnt('r'),y:cnt('y'),q:cnt('q'),x:cnt('x'),g:cnt('g'),
      ovReal:hs.reduce((s,h)=>s+(h.ovReal||0),0),ovStale:hs.reduce((s,h)=>s+(h.ovStale||0),0),hitos};
  },[classified,healthMap,pData]);

  /* Aviso breve (reemplaza alert) */
  const[toast,setToast]=useState(null);
  useEffect(()=>{if(!toast)return;const id=setTimeout(()=>setToast(null),4500);return()=>clearTimeout(id)},[toast]);
  const[fOpen,setFOpen]=useState(false);

  const shareClient=useCallback(()=>{if(aProj?.file)makeLink('cliente',aProj.file)},[aProj,makeLink]);

  const goObra=k=>{setActive(k);if(!PROJ_SUBS.includes(sub))setSub('dash')};

  /* Encabezado único para Inicio, Portfolio y obra */
  const hdr=cur=><div className="hdr">
    <a href="index.html" className="bk-home" title="Volver a BkTableros"><span className="bv">BV</span><span className="bk-crumb">BkTableros</span></a>
    <span className="crumb-sep">/</span>
    <button className="logo" onClick={()=>setActive(null)} title="Inicio de BuildPlan">BuildPlan</button>
    <div className="tabs">
      <button className={`tab ${cur==='home'?'on':''}`} onClick={()=>setActive(null)}>{I.home(14)} Inicio</button>
      <button className={`tab ${cur==='pf'?'on':''}`} onClick={()=>{setActive('__pf');setSub('portfolio')}}>{I.usr(14)} Portfolio</button>
      {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);if(!p)return null;const h=healthMap[k];
        return <button key={k} className={`tab ${active===k?'on':''}`} onClick={()=>goObra(k)} title={p.name}><span className="dot" style={{background:h?SEMA_COL[h.color]:'var(--c2)'}}/>{p.cod&&<b className="cod">{p.cod}</b>}<span className="tab-n">{p.name}</span><span className="x" role="button" aria-label={'Cerrar '+p.name} onClick={e=>closeTab(k,e)}>×</span></button>})}
    </div>
    <div className="acts">
      {homeSum.ovReal>0&&<button className="btn btn-g hdr-ov" onClick={()=>{setActive('__pf');setSub('portfolio-resp')}} title={`${homeSum.ovReal} vencidas con avance cargado y ${homeSum.ovStale} sin actualizar en obras activas`}>{homeSum.ovReal} vencidas →</button>}
      <button className="btn btn-g btn-i" onClick={()=>setShowSrch(true)} title="Buscar tareas (Ctrl+K)" aria-label="Buscar tareas">{I.srch()}</button>
      <button className="btn btn-g btn-i" onClick={togTh} title="Cambiar tema" aria-label="Cambiar tema">{th==='light'?I.moon():I.sun()}</button>
      <button className={`btn btn-g hdr-datos ${origen==='repo'?'warn':''}`} onClick={()=>setShowDatos(true)} title={origen==='repo'?'Los cronogramas todavía están en el repo público':'Subir cronogramas y Excel de proyectos'}>{origen==='repo'?'⚠ Datos':'Datos'}</button>
      <button className="btn btn-g hdr-salir" onClick={onLogout} title="Cerrar sesión (también en Cómputo)">Salir</button>
    </div>
  </div>;

  const datosEl=showDatos&&<DatosPanel empNombre="Bauvek" origen={origen} manifest={manifest} onClose={()=>setShowDatos(false)} onDone={()=>window.location.reload()}/>;
  const toastEl=toast&&<div className="toast" role="status"><div>{toast.t}</div>{toast.u&&<input readOnly value={toast.u} onFocus={e=>e.target.select()}/>}<button className="fclr" onClick={()=>setToast(null)}>Cerrar</button></div>;

  if(!pList)return <div className="ld"><div className="sp"/><span>Cargando...</span></div>;


  /* ═══ HOME ═══ */
  if(!active){
    const sp=allSp;
    const finalizadoProjs=classified.finalizado;
    const canceladaProjs=classified.cancelada;
    const sinEstado=classified.sin;
    /* Obras activas y en pausa, ordenadas por gravedad: crítico, atención, revisar datos, sin fecha, en tiempo */
    const bySev=(a,b)=>{const ha=healthMap[a.key],hb=healthMap[b.key];
      return(ha?ha.rank:9)-(hb?hb.rank:9)||((hb?.ovReal||0)-(ha?.ovReal||0))||a.name.localeCompare(b.name)};
    const activeProjs=[...classified.activo,...classified.pausa].sort(bySev);
    const filteredActive=mapCity?activeProjs.filter(p=>{const m=matchMeta(p.name,metaList);return m&&m.dept===mapCity}):activeProjs;

    const renderCard=(p)=>{
      const m=matchMeta(p.name,metaList);
      const estado=m?.estado||'';
      const h=healthMap[p.key];
      const d=pData[p.key];
      const isLoading=!!autoLoading[p.key];
      const hClass=h?`health-${h.color}`:'';
      const dotColor=h?SEMA_COL[h.color]:(estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':estado==='Cancelada'?'var(--err)':'var(--c2)');
      const stBg=estado==='Activo'?'rgba(16,185,129,.1)':estado==='En pausa'?'rgba(245,158,11,.1)':estado==='Cancelada'?'rgba(239,68,68,.08)':estado==='Finalizado'?'rgba(139,146,165,.08)':'rgba(139,146,165,.1)';
      const stColor=estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':estado==='Cancelada'?'var(--err)':'var(--c2)';
      const m2t=(m?.m2Cubierta||0)+(m?.m2Semi||0);
      const dv=h?(h.standbyDays>0&&h.desvioNeto!==null?h.desvioNeto:h.desvioBruto):null;
      return <div key={p.key} className={`pcard2 ${hClass}`} onClick={()=>openProj(p)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key==='Enter')openProj(p)}}>
        <div className="pcard2-top">
          {p.cod&&<span className="cod lg">{p.cod}</span>}<span className="pcard2-name" title={p.name}>{p.name}</span>
          {h&&<span className={`health-badge ${h.color}`} title={h.motivo}>{SEMA_ICO[h.color]} {h.label}{h.color!=='q'&&dv!==null&&dv!==0&&<span className="hb-d">{dv>0?`+${dv}d`:`${dv}d`}</span>}</span>}

          {estado==='En pausa'&&<span style={{color:'var(--warn)'}}>En pausa</span>}
          {p.avisos&&p.avisos.length>0&&<span title={'Revisar en MS Project:\n• '+p.avisos.join('\n• ')} style={{color:'var(--q)',cursor:'help'}}>{p.avisos.length} aviso{p.avisos.length>1?'s':''} de datos</span>}
        </div>
        {h&&<Fragment>
          <div className="pcard2-bar"><div className="pcard2-fill" style={{width:`${h.avg}%`,background:dotColor}}/></div>

            {h.ovReal>0&&<span style={{color:'var(--err)'}}>{h.ovReal} vencidas</span>}
            {h.ovStale>0&&<span style={{color:'var(--q)'}} title="Vencidas que probablemente no se actualizaron en MS Project">{h.ovStale} sin actualizar</span>}
          </div>
          {d&&<div className="pc-row"><Frescura sd={d.statusDate} short/>{h.standbyDays>0&&<span>⏸ {h.standbyDays}d standby</span>}</div>}
          {h.nextMs&&<div className="pc-row">Próximo hito: {h.nextMs.name} <span className="mono">{fD(h.nextMs.finish)}</span></div>}
          {(()=>{const td=getTrendForProject(trendData,p.key);return td.length>=2?<div className="pc-row"><span>Avance</span><Sparkline data={td} field="avg" color="var(--ac)"/><span style={{marginLeft:4}}>Vencidas</span><Sparkline data={td} field="ov" color="var(--err)" w={40}/></div>:null})()}
        </Fragment>}
        {!h&&isLoading&&<div className="pcard2-loading"><div className="mini-sp"/>Analizando…</div>}
      </div>;
    };

    const S=homeSum;
    return <Fragment>
      {hdr('home')}
      <div className="home">
        <div className="home-sidebar">
          <DeptMap projects={sp} metaList={metaList} selectedDept={mapCity} onSelectDept={setMapCity}/>
        </div>
        <div className="home-main">
          {/* Franja de dirección: lo que hay que mirar hoy */}
          <div className="exec" aria-label="Resumen de obras activas">
            <div className="exec-cell"><b>{S.n}</b><span>obras activas</span></div>
            <div className="exec-cell r"><b>{S.r}</b><span>críticas</span></div>
            <div className="exec-cell y"><b>{S.y}</b><span>en atención</span></div>
            <div className="exec-cell q" title="Desvío de más de 180 días: casi siempre es una fecha contratada mal cargada"><b>{S.q}</b><span>revisar datos</span></div>
            <button className="exec-cell link" onClick={()=>{setActive('__pf');setSub('portfolio-resp')}}><b>{S.ovReal}</b><span>vencidas{S.ovStale>0?` · +${S.ovStale} sin actualizar`:''}</span></button>
            <div className="exec-hitos">
              <div className="exec-h">Hitos de los próximos 14 días</div>
              {S.hitos.length===0&&<div className="exec-none">Ninguno</div>}
              {S.hitos.slice(0,4).map(({p,t})=><button key={p.key+t.uid} className="exec-hito" onClick={()=>openProj(p)}><span className="mono">{fD(t.finish)}</span>{p.cod&&<b className="cod">{p.cod}</b>}<span className="eh-n">{t.name}</span></button>)}
              {S.hitos.length>4&&<div className="exec-none">+{S.hitos.length-4} más</div>}
            </div>
          </div>

          <div className="home-h">
            <div className="home-title">Obras activas</div>
            <div className="home-sub">{filteredActive.length} obras · ordenadas por gravedad{mapCity?` · Depto. ${mapCity}`:''}{mapCity&&<button className="fclr" onClick={()=>setMapCity(null)} style={{marginLeft:8}}>Mostrar todas</button>}{S.analizadas<S.n&&<span style={{marginLeft:8}}>· analizando {S.n-S.analizadas}…</span>}</div>
          </div>
          {(pList||[]).length===0&&<div className="empty-emp">
            <b>Todavía no hay cronogramas cargados</b>
            <p>Exportá cada obra desde MS Project (Archivo → Guardar como → XML) y subila desde Datos. Para ver estado, comitente y ubicación de cada obra, subí también el Excel de proyectos.</p>
            <button className="btn" onClick={()=>setShowDatos(true)}>Abrir Datos</button>
          </div>}
          <div className="pgrid2">
            {filteredActive.map(renderCard)}
          </div>

          {/* FINALIZADAS — collapsible */}
          {finalizadoProjs.length>0&&<div style={{marginTop:32}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='fin'?false:'fin')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--ok)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Obras finalizadas</span>
              <span style={{fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)',background:'rgba(16,185,129,.1)',color:'var(--ok)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{finalizadoProjs.length}</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='fin'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='fin'&&<div className="pgrid2" style={{opacity:.6}}>
              {finalizadoProjs.map(renderCard)}
            </div>}
          </div>}

          {/* CANCELADAS — collapsible */}
          {canceladaProjs.length>0&&<div style={{marginTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='can'?false:'can')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--err)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Obras canceladas</span>
              <span style={{fontSize:11,fontFamily:'var(--fm)',background:'rgba(239,68,68,.1)',color:'var(--err)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{canceladaProjs.length}</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='can'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='can'&&<div className="pgrid2" style={{opacity:.6}}>
              {canceladaProjs.map(renderCard)}
            </div>}
          </div>}

          {/* SIN CLASIFICAR — projects not in Excel */}
          {sinEstado.length>0&&<div style={{marginTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='other'?false:'other')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--c2)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Sin clasificar</span>
              <span style={{fontSize:11,fontFamily:'var(--fm)',background:'var(--bg-2)',padding:'2px 8px',borderRadius:10,color:'var(--c2)',fontWeight:600}}>{sinEstado.length}</span>
              <span style={{fontSize:11,color:'var(--c2)'}}>No están en el Excel de proyectos</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='other'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='other'&&<div className="pgrid2" style={{opacity:.5}}>
              {sinEstado.map(renderCard)}
            </div>}
          </div>}
        </div>
      </div>
      {showTour&&<Tour onDone={dismissTour}/>}
      {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
      {toastEl}{datosEl}
      <div className="mob-nav">
        <button className="on" onClick={()=>setActive(null)}>{I.home(18)}<span>Inicio</span></button>
        <button onClick={()=>{setActive('__pf');setSub('portfolio')}}>{I.chart(18)}<span>Portfolio</span></button>
        <button onClick={()=>setShowSrch(true)}>{I.srch(18)}<span>Buscar</span></button>
        <button onClick={togTh}>{th==='light'?I.moon(18):I.sun(18)}<span>Tema</span></button>
      </div>
    </Fragment>;
  }

  /* ═══ PORTFOLIO ═══ */
  if(active==='__pf'){
    return <Fragment>
      {hdr('pf')}
      {datosEl}{toastEl}
      <Portfolio key={sub} onLinkCon={n=>makeLink('contratista',n)} initialMode={sub==='portfolio-resp'?'resp':null} onOpenObra={p=>openProj(p)} projList={pList} projData={pData} metaList={metaList} healthMap={healthMap} onOpen={async(k,raw,role)=>{const p=(pList||[]).find(x=>x.key===k);if(!p)return;await openProj(p);setSub('gantt');setFSt('ov');if(role==='Contratista'){setFRes('all');setFCon(raw)}else{setFCon('all');setFRes(raw==='Sin asignar'?'none':raw)}}}/>
      {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
      <div className="mob-nav">
        <button onClick={()=>setActive(null)}>{I.home(18)}<span>Inicio</span></button>
        <button className="on">{I.chart(18)}<span>Portfolio</span></button>
        <button onClick={()=>setShowSrch(true)}>{I.srch(18)}<span>Buscar</span></button>
        <button onClick={togTh}>{th==='light'?I.moon(18):I.sun(18)}<span>Tema</span></button>
      </div>
    </Fragment>;
  }

  /* ═══ PROJECT VIEW ═══ */
  return <Fragment>
    <div className="ph"><div className="ph-bv">BV</div><div><h1>{pLabel(aProj)}</h1><p>{empInfo?.nombre?empInfo.nombre+' · ':''}Generado el {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})}</p></div></div>
    {hdr('obra')}

    <div className="stbar">
      {PROJ_TABS.map(([k,l])=><button key={k} className={`st ${sub===k?'on':''}`} onClick={()=>setSub(k)}>{l}</button>)}
      <div className="str">
        {sub==='gantt'&&aData&&<Fragment>
          <button className="btn btn-g ftog" onClick={()=>setFOpen(o=>!o)} aria-expanded={fOpen}>{I.flt()} Filtros{fCount>0?` (${fCount})`:''}</button>
          <span className="gt-tools">
        <button className="btn btn-g btn-i" onClick={()=>expAll(active,aData.tasks)} title="Expandir">{I.exp()}</button>
        <button className="btn btn-g btn-i" onClick={()=>colAll(active,aData.tasks)} title="Colapsar">{I.col()}</button>
        <button className="btn btn-g" onClick={()=>setColW(COLW_DEF)} title="Restablecer anchos de columna">↔ Columnas</button>
        <div className="seg">{Object.entries(ZM).map(([k,v])=><button key={k} className={zoom===k?'on':''} onClick={()=>setZoom(k)}>{v.l}</button>)}</div>
        <button className="btn btn-g btn-i" onClick={()=>setShowArr(a=>!a)} title="Flechas" style={{color:showArr?'var(--ac)':'var(--c2)'}}>{I.lnk()}</button>
        {aData.hasBL&&<button className="btn btn-g btn-i" onClick={()=>setShowBL(b=>!b)} title="Línea base" style={{color:showBL?'var(--ac)':'var(--c2)'}}>{I.bl()}</button>}
          </span>
          <span className="tool-sep"/>
        </Fragment>}
        <button className="btn btn-g" onClick={()=>window.print()} title="Imprimir o guardar como PDF">{I.prt()} PDF</button>
        <a href="pagos.html" className="btn btn-g" style={{textDecoration:'none'}} title="Ver programación de pagos">$ Pagos</a>
        <button className="btn btn-g" onClick={shareClient} title="Copiar el link de la vista para el cliente">{I.lnk()} Compartir</button>
      </div>
    </div>

    {sub==='gantt'&&aData&&<div className={`fbar ${fOpen?'open':''}`}>
      <span style={{color:'var(--c2)',marginRight:2}}>{I.flt()}</span>
      <span className="fl">Estado</span>
      <select className="fsel" value={fSt} onChange={e=>setFSt(e.target.value)}><option value="all">Todos</option><option value="pe">Pendiente</option><option value="ip">En curso</option><option value="ok">Completada</option><option value="ov">Vencida</option></select>
      <span className="fl">Recurso</span>
      <select className="fsel" value={fRes} onChange={e=>setFRes(e.target.value)}><option value="all">Todos</option><option value="none">Sin asignar</option>{aData.resources.map(r=><option key={r} value={r}>{r}</option>)}</select>
      <span className="fl">Contratista</span>
      <select className="fsel" value={fCon} onChange={e=>setFCon(e.target.value)}><option value="all">Todos</option><option value="none">Sin contratista</option>{aData.contractors.map(c=><option key={c} value={c}>{c}</option>)}</select>
      {aData.rubros.length>0&&<Fragment><span className="fl">Rubro</span>
      <select className="fsel" value={fRub} onChange={e=>setFRub(e.target.value)}><option value="all">Todos</option><option value="none">Sin rubro</option>{aData.rubros.map(r=><option key={r} value={r}>{r}</option>)}</select></Fragment>}
      {aData.tableros.length>0&&<Fragment><span className="fl">Fase</span>
      <select className="fsel" value={fTab} onChange={e=>setFTab(e.target.value)}><option value="all">Todas</option>{aData.tableros.map(t=><option key={t} value={t}>{t}</option>)}</select></Fragment>}
      {aData.hasAlcance&&<Fragment><span className="fl" title={'Clasifica las tareas dentro de "'+aData.obraRootName+'". Obra base = con N° Item; Adicional = sin N° Item o con *'}>Alcance</span>
      <select className="fsel" value={fAlc} onChange={e=>setFAlc(e.target.value)}><option value="all">Todo</option><option value="base">Obra base</option><option value="adic">Adicionales</option></select></Fragment>}
      {aData.niveles.length>0&&<Fragment><span className="fl">Nivel obra</span>
      <select className="fsel" value={fNiv} onChange={e=>setFNiv(e.target.value)}><option value="all">Todos</option>{aData.niveles.map(n=><option key={n} value={n}>{n}</option>)}</select></Fragment>}
      <span className="fl">Prof. WBS</span>
      <select className="fsel" value={fWbs} onChange={e=>setFWbs(parseInt(e.target.value))}><option value="99">Todos</option>{[1,2,3,4,5].map(n=><option key={n} value={n}>{n}</option>)}</select>
      <span className="fl">Desde</span><input type="date" className="fin" value={fDf} onChange={e=>setFDf(e.target.value)}/>
      <span className="fl">Hasta</span><input type="date" className="fin" value={fDt} onChange={e=>setFDt(e.target.value)}/>
      {fCount>0&&<Fragment><span className="fbadge">{fCount}</span><button className="fclr" onClick={resetF}>Limpiar</button></Fragment>}
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)'}}>{visTasks.length} tareas</span>
    </div>}

    {aErr&&<div className="err-b">No se pudo cargar el cronograma ({aErr}). Probá recargar la página; si sigue, revisá que el XML esté en data/projects.</div>}
    {aLoading&&<div className="ld"><div className="sp"/><span>Cargando...</span></div>}

    {!aLoading&&aData&&sub==='gantt'&&<div className="gw" style={{userSelect:splOn?'none':'auto'}}>
      <div className="gtc" ref={tblRef} style={{width:tblW}} onScroll={onTblScroll}>
        <table className="gt" style={{width:colW.reduce((a,b)=>a+b,0)}}>
          <colgroup>{colW.map((w,i)=><col key={i} style={{width:w}}/>)}</colgroup>
          <thead><tr>{['WBS','Tarea','Inicio','Fin','Dur.','%','Recurso','Contratista','Rubro','Nivel','Fase','N° Item'].map((h,i)=><th key={h} title="Arrastrá el borde derecho para ajustar · doble clic restablece">{h}<span className="col-rs" onMouseDown={e=>startColDrag(i,e)} onDoubleClick={()=>resetCol(i)}/></th>)}</tr></thead>
          <tbody>{visTasks.map(t=>{
            const em=expMap[active]||{};const ov=isOv(t);const ind=t.depth*14;
            return <tr key={t.uid} className={t.isSummary?'sum':''}>
              <td className="mono" style={{fontSize:11}}>{t.wbs}</td>
              <td><div className="tnc" style={{paddingLeft:ind}}>
                {t.isSummary?<button className="ttog" onClick={()=>togTask(active,t.uid)}>{em[t.uid]?I.chD():I.chR()}</button>:<span style={{width:16,flexShrink:0}}/>}
                {t.isMilestone&&<span style={{color:'var(--bar-ms)',fontSize:11,flexShrink:0}}>♦</span>}
                <span style={{overflow:'hidden',textOverflow:'ellipsis',fontWeight:t.isSummary?600:400,color:ov?'var(--err)':t.critical?'var(--ac)':'var(--c0)'}} title={t.name}>{t.name}</span>
              </div></td>
              <td className="mono">{fD(t.start)}</td>
              <td className="mono" style={{color:ov?'var(--err)':undefined}}>{fD(t.finish)}</td>
              <td className="mono" style={{fontSize:11}}>{fDur(t.duration)}</td>
              <td><div className="pm"><div className="pmb"><div className="pmf" style={{width:`${t.percentComplete}%`,background:t.percentComplete>=100?'var(--ok)':ov?'var(--err)':'var(--ac)'}}/></div><span className="mono" style={{fontSize:11}}>{t.percentComplete}%</span></div></td>
              <td style={{fontSize:11,color:'var(--c1)',overflow:'hidden',textOverflow:'ellipsis'}} title={t.resources.join(', ')}>{t.resources.join(', ')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Contratista')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Rubro')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Nivel')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c2)'}}>{entV(t,'Tableros')||'—'}</td>
              <td className="mono" style={{fontSize:11}}>{entV(t,'N° Item')||'—'}{!t.isSummary&&entV(t,'N° Item')&&getTaskMaterials(computoData[active],entV(t,'N° Item'))?.items?.length>0&&<span className="mat-badge" title="Tiene materiales en cómputo">⬡</span>}</td>
            </tr>
          })}</tbody>
        </table>
      </div>
      <div className={`spl ${splOn?'on':''}`} onMouseDown={()=>setSplOn(true)}/>
      <GanttSVG tasks={visTasks} minDate={aData.minDate} maxDate={aData.maxDate} zoom={zoom} showArr={showArr} showBL={showBL} scrollRef={scrollRef} onTT={setTTInfo}/>
    </div>}

    {!aLoading&&aData&&sub==='semana'&&<WeekView data={aData}/>}
    {!aLoading&&aData&&sub==='abast'&&<AbastView matKey={active+(computoData[active]?.loaded?':ok':computoData[active]?.needLogin?':login':':x')} data={aData} computoData={computoData[active]||null} visTasks={visTasks} onLogin={()=>{setComputoData({});setComputoAuth(n=>n+1)}}/>}
    {!aLoading&&aData&&sub==='dash'&&<ProjDash data={aData} health={healthMap[active]} proj={aProj}/>}
    {!aLoading&&aData&&sub==='demoras'&&<DemorasView data={aData}/>}

    <Tooltip info={ttInfo} computoData={computoData[active]||null}/>
    {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
    {toastEl}{datosEl}
    <div className="pf">BuildPlan{empInfo?.nombre?' · '+empInfo.nombre:''} · {new Date().toLocaleDateString('es-AR')}</div>
    <div className="mob-nav">
      <button onClick={()=>setActive(null)}>{I.home(18)}<span>Inicio</span></button>
      <button className={sub==='dash'?'on':''} onClick={()=>setSub('dash')}>{I.chart(18)}<span>Resumen</span></button>
      <button className={sub==='semana'?'on':''} onClick={()=>setSub('semana')}>{I.cal(18)}<span>Semana</span></button>
      <button className={sub==='gantt'?'on':''} onClick={()=>setSub('gantt')}>{I.bld(18)}<span>Gantt</span></button>
    </div>
  </Fragment>;
}

/* Entrada: links públicos por token, o login de Bauvek antes de mostrar cualquier cronograma */
function Root(){
  const q=new URLSearchParams(window.location.search);
  const tok=q.get('v');const viejo=q.get('proyecto')||q.get('project');
  const[auth,setAuth]=useState(null);       /* null cargando · false sin sesión · claims del usuario */
  useEffect(()=>{if(tok||viejo)return;computoToken().then(t=>setAuth(t?jwtClaims(t):false)).catch(()=>setAuth(false))},[]);
  if(tok)return <TokenView token={tok}/>;
  if(viejo)return <PublicShell emp={BAUVEK}><div className="client-hdr"><Brand emp={BAUVEK}/><h1>Este link ya no se usa</h1><p>Pedile a Bauvek el link nuevo de tu obra.</p></div></PublicShell>;
  if(auth===null)return <div className="ld"><div className="sp"/><span>Cargando…</span></div>;
  if(!auth)return <LoginScreen onOk={()=>computoToken().then(t=>setAuth(t?jwtClaims(t):false))}/>;
  const logout=()=>{try{['sb_access_token','sb_refresh_token','sb_user'].forEach(k=>localStorage.removeItem(k))}catch(e){}setAuth(false)};
  if(!puedeEntrar(auth))return <div className="login-wrap"><div className="login-card"><Brand emp={BAUVEK}/><h1 className="login-h">Sin acceso</h1><p className="login-p">BkTableros es de uso interno de Bauvek y tu usuario no pertenece a la empresa. Cómputo de Obras lo podés seguir usando con tu usuario.</p><a className="btn" href="https://manuelsagarraga-cloud.github.io/Computo-Obras/">Ir a Cómputo de Obras</a><button className="btn" onClick={logout}>Salir</button></div></div>;
  _empresa='bauvek';
  return <App onLogout={logout}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body></html>
