          return <div key={k} className="alc-card" style={{borderTopColor:col}}>
            <div className="alc-hd"><span style={{fontWeight:700}}>{l}</span><span className="mono" style={{color:'var(--c2)',fontSize:11}}>{g.n} tareas · {pctT}%</span></div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,margin:'8px 0 4px'}}><span style={{color:'var(--c2)'}}>Avance</span><span className="mono" style={{fontWeight:700,color:col}}>{g.avg}%</span></div>
            <div style={{height:6,borderRadius:3,background:'var(--bg-2)',overflow:'hidden'}}><div style={{height:'100%',width:`${g.avg}%`,background:col}}/></div>
            <div className="alc-row"><span>Completadas <b className="mono" style={{color:'var(--ok)'}}>{g.done}</b></span><span>En curso <b className="mono" style={{color:'var(--warn)'}}>{g.ip}</b></span><span>Vencidas <b className="mono" style={{color:g.ov?'var(--err)':'var(--c2)'}}>{g.ov}</b></span></div>
            <div className="alc-row"><span>Termina <b className="mono">{fD(g.fin)}</b></span></div>
          </div>})}
      </div>
      {alc.adic.fin&&alc.base.fin&&alc.adic.fin>alc.base.fin&&<div style={{fontSize:11,color:'var(--warn)',marginTop:6}}>Los adicionales terminan {dB(alc.base.fin,alc.adic.fin)}d después que la obra base: parte del desvío se explica por ellos.</div>}
    </div>}
    {Object.keys(cMap).length>1&&<div style={{marginBottom:20}}>
      <div className="dst">Carga por contratista</div>
      <table className="dt"><thead><tr><th>Contratista</th><th style={{width:60}}>Total</th><th style={{width:80}}>Hechas</th><th style={{width:70}}>Vencidas</th></tr></thead>
      <tbody>{Object.entries(cMap).sort((a,b)=>b[1].tot-a[1].tot).map(([n,d])=><tr key={n}><td style={{fontWeight:500}}>{n}</td><td className="mono">{d.tot}</td><td className="mono" style={{color:'var(--ok)'}}>{d.done}</td><td className="mono" style={{color:d.ov?'var(--err)':'var(--c2)'}}>{d.ov}</td></tr>)}</tbody></table>
    </div>}
    {upcoming.length>0&&<div><div className="dst">Próximas entregas</div>
      <table className="dt"><thead><tr><th>Tarea</th><th style={{width:85}}>Fin</th><th style={{width:45}}>%</th><th style={{width:95}}>Contratista</th><th style={{width:80}}>Recurso</th></tr></thead>
      <tbody>{upcoming.map(t=><tr key={t.uid}><td style={{fontWeight:500}}>{t.name}</td><td className="mono">{fD(t.finish)}</td><td className="mono">{t.percentComplete}%</td><td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Contratista')||'—'}</td><td style={{fontSize:11,color:'var(--c1)'}}>{t.resources.join(', ')||'—'}</td></tr>)}</tbody></table>
    </div>}
  </div>;
}

/* ═══════ Curva S ═══════
   Avance acumulado ponderado por duración: cada tarea suma su peso de forma lineal entre su inicio y su fin.
   Línea base = cómo se planificó; Cronograma = cómo está programado hoy; el punto es el avance real cargado. */
function SCurve({data}){
  /* El gráfico se dibuja al ancho real del contenedor para que el texto no se agrande ni se achique */
  const boxRef=useRef(null);const[bw,setBw]=useState(760);
  useEffect(()=>{const el=boxRef.current;if(!el)return;const set=()=>setBw(Math.max(320,Math.round(el.clientWidth)));set();
    if(typeof ResizeObserver==='undefined')return;const ro=new ResizeObserver(set);ro.observe(el);return()=>ro.disconnect()},[]);
  const ts=useMemo(()=>data.tasks.filter(t=>!t.isSummary&&!t.isMilestone&&!isCtrlTask(t)&&t.start&&t.finish),[data.tasks]);
  const m=useMemo(()=>{
    const bl=ts.filter(t=>t.baselines[0]?.start&&t.baselines[0]?.finish);
    let a=null,b=null;
    for(const t of ts){if(!a||t.start<a)a=t.start;if(!b||t.finish>b)b=t.finish;const x=t.baselines[0];if(x?.start&&x.start<a)a=x.start;if(x?.finish&&x.finish>b)b=x.finish}
    if(!a||!b||b<=a)return null;
    const w=t=>Math.max(t.durDays||0,1);
    const cum=(list,get,x)=>{let s=0,W=0;for(const t of list){const[s0,f0]=get(t);const wt=w(t);W+=wt;if(x>=f0)s+=wt;else if(x>s0)s+=wt*(x-s0)/Math.max(f0-s0,1)}return W?s*100/W:0};
    const N=80,pts=[];
    for(let i=0;i<=N;i++){const x=new Date(a.getTime()+(b-a)*i/N);pts.push({x,bl:bl.length?cum(bl,t=>[t.baselines[0].start,t.baselines[0].finish],x):null,cr:cum(ts,t=>[t.start,t.finish],x)})}
    const now=new Date();
    return{a,b,pts,hasBL:bl.length>0,real:wAvg(ts),blNow:bl.length?cum(bl,t=>[t.baselines[0].start,t.baselines[0].finish],now):null,crNow:cum(ts,t=>[t.start,t.finish],now),now};
  },[ts]);
  if(!m)return null;
  const W=bw,H=240,L=40,R=12,T=14,B=28;
  const X=d=>L+(d-m.a)/(m.b-m.a)*(W-L-R),Y=v=>T+(100-v)/100*(H-T-B);
  const path=k=>m.pts.filter(p=>p[k]!==null).map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+','+Y(p[k]).toFixed(1)).join('');
  const months=[];{const d=new Date(m.a.getFullYear(),m.a.getMonth()+1,1);const span=(m.b-m.a)/86400000;const fit=Math.max(1,Math.floor((W-L-R)/48));const step=[1,2,3,6,12].find(k=>span/30.4/k<=fit)||12;while(d<=m.b){months.push(new Date(d));d.setMonth(d.getMonth()+step)}}
  const inRange=m.now>=m.a&&m.now<=m.b;
  const gap=m.blNow!==null?Math.round(m.real-m.blNow):null;
  return <div className="sc-wrap">
    <div className="sc-head">
      <div className="dst" style={{margin:0}}>Curva S</div>
      <div className="sc-facts">
        <span><i className="sc-k real"/>Real hoy <b>{m.real}%</b></span>
        {m.blNow!==null&&<span><i className="sc-k bl"/>Según línea base <b>{Math.round(m.blNow)}%</b></span>}
        <span><i className="sc-k cr"/>Según cronograma actual <b>{Math.round(m.crNow)}%</b></span>
        {gap!==null&&<span className={gap<-5?'neg':gap>5?'pos':''}>{gap<0?`${-gap} puntos detrás de lo planificado`:gap>0?`${gap} puntos adelante de lo planificado`:'En línea con lo planificado'}</span>}
      </div>
    </div>
    <div ref={boxRef}><svg viewBox={`0 0 ${W} ${H}`} width={W} height={H} style={{display:'block',maxWidth:'100%'}} role="img" aria-label="Curva S de avance acumulado">
      {[0,25,50,75,100].map(v=><g key={v}><line x1={L} x2={W-R} y1={Y(v)} y2={Y(v)} stroke="var(--b1)"/><text x={L-6} y={Y(v)+4} fontSize="11" textAnchor="end" fill="var(--c2)" fontFamily="var(--fm)">{v}%</text></g>)}
      {months.map((d,i)=><g key={i}><line x1={X(d)} x2={X(d)} y1={Y(0)} y2={Y(0)+4} stroke="var(--b0)"/><text x={X(d)} y={H-8} fontSize="11" textAnchor="middle" fill="var(--c2)" fontFamily="var(--ff)">{d.toLocaleDateString('es-AR',{month:'short'})}{d.getMonth()===0?' '+String(d.getFullYear()).slice(-2):''}</text></g>)}
      {m.hasBL&&<path d={path('bl')} fill="none" stroke="var(--bar-bl)" strokeWidth="2" strokeDasharray="5,4"/>}
      <path d={path('cr')} fill="none" stroke="var(--c1)" strokeWidth="2"/>
      {inRange&&<g><line x1={X(m.now)} x2={X(m.now)} y1={T} y2={Y(0)} stroke="var(--today)" strokeDasharray="3,3"/>
        <circle cx={X(m.now)} cy={Y(m.real)} r="5" fill="var(--ac)" stroke="var(--bg-el)" strokeWidth="2"/>
        <text x={X(m.now)+(X(m.now)>W-120?-8:8)} y={Y(m.real)-8} fontSize="12" fontWeight="700" fill="var(--ac)" fontFamily="var(--fm)" textAnchor={X(m.now)>W-120?'end':'start'}>{m.real}% real</text></g>}
    </svg></div>
    <div className="sc-note">El real es un único punto: MS Project no guarda la historia del avance. La tendencia semanal se va a ver cuando el avance se guarde todas las semanas.</div>
  </div>;
}

/* ═══════ Demoras sub-tab ═══════ */
function DemorasView({data}){
  if(!data)return null;
  const[view,setView]=useState('table');
  const[sortCol,setSortCol]=useState('devFin');
  const[sortDir,setSortDir]=useState('desc');

  const rows=useMemo(()=>{
    return data.tasks.filter(t=>!t.isSummary&&t.baselines.length>0).map(t=>{
      const bl=t.baselines[0];
      const devStart=t.start&&bl.start?dB(bl.start,t.start):null;
      const devFin=t.finish&&bl.finish?dB(bl.finish,t.finish):null;
      return{...t,blStart:bl.start,blFinish:bl.finish,blNum:bl.number,devStart,devFin};
    });
  },[data.tasks]);

  const sorted=useMemo(()=>{
    const r=[...rows];
    r.sort((a,b)=>{
      let va=a[sortCol],vb=b[sortCol];
      if(va===null)va=sortDir==='desc'?-Infinity:Infinity;
      if(vb===null)vb=sortDir==='desc'?-Infinity:Infinity;
      return sortDir==='desc'?vb-va:va-vb;
    });
    return r;
  },[rows,sortCol,sortDir]);

  const doSort=col=>{if(sortCol===col)setSortDir(d=>d==='desc'?'asc':'desc');else{setSortCol(col);setSortDir('desc')}};

  /* KPIs */
  const withDev=rows.filter(r=>r.devFin!==null);
  const onTime=withDev.filter(r=>Math.abs(r.devFin)<=2).length;
  const late=withDev.filter(r=>r.devFin>2).length;
  const early=withDev.filter(r=>r.devFin<-2).length;
  const avgDev=withDev.length?Math.round(withDev.reduce((s,r)=>s+r.devFin,0)/withDev.length):0;

  if(!rows.length)return <div className="dash"><SCurve data={data}/><div style={{textAlign:'center',color:'var(--c2)',padding:40}}>Este proyecto no tiene datos de línea base en el XML. Para ver demoras, se necesita guardar al menos una línea base en MS Project antes de exportar.</div></div>;

  return <div className="dash">
    <SCurve data={data}/>
    <div className="dgrid">
      <div className="kpi"><div className="kpi-v">{rows.length}</div><div className="kpi-l">Con baseline</div></div>
      <div className="kpi ok"><div className="kpi-v" style={{color:'var(--ok)'}}>{onTime}</div><div className="kpi-l">En fecha (±2d)</div></div>
      <div className="kpi err"><div className="kpi-v" style={{color:'var(--err)'}}>{late}</div><div className="kpi-l">Atrasadas</div></div>
      <div className="kpi" style={{borderLeftColor:early?'var(--ok)':'var(--c2)'}}><div className="kpi-v" style={{color:'var(--ok)'}}>{early}</div><div className="kpi-l">Adelantadas</div></div>
      <div className="kpi" style={{borderLeftColor:avgDev>0?'var(--err)':avgDev<0?'var(--ok)':'var(--c2)'}}><div className="kpi-v" style={{color:avgDev>0?'var(--err)':avgDev<0?'var(--ok)':'var(--c0)'}}>{avgDev>0?'+':''}{avgDev}d</div><div className="kpi-l">Desvío promedio</div></div>
    </div>

    <div style={{marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
      <div className="dst" style={{margin:0}}>Detalle de desvíos — Línea base {rows[0]?.blNum}{rows[0]?.blStart?` (${fD(rows[0].blStart)})`:''}</div>
    </div>

    <table className="dt">
      <thead><tr>
        <th style={{cursor:'pointer'}} onClick={()=>doSort('name')}>Tarea</th>
        <th style={{width:80,cursor:'pointer'}} onClick={()=>doSort('blStart')}>Inicio LB</th>
        <th style={{width:80}}>Inicio real</th>
        <th style={{width:80,cursor:'pointer'}} onClick={()=>doSort('blFinish')}>Fin LB</th>
        <th style={{width:80}}>Fin real</th>
        <th style={{width:65,cursor:'pointer'}} onClick={()=>doSort('devStart')}>Δ Inicio</th>
        <th style={{width:65,cursor:'pointer'}} onClick={()=>doSort('devFin')}>Δ Fin {sortCol==='devFin'?(sortDir==='desc'?'↓':'↑'):''}</th>
        <th style={{width:45}}>%</th>
        <th style={{width:90}}>Contratista</th>
      </tr></thead>
      <tbody>{sorted.map(r=>(
        <tr key={r.uid}>
          <td style={{fontWeight:500}}>{r.name}</td>
          <td className="mono">{fD(r.blStart)}</td>
          <td className="mono">{fD(r.start)}</td>
          <td className="mono">{fD(r.blFinish)}</td>
          <td className="mono">{fD(r.finish)}</td>
          <td className="mono">{r.devStart!==null?<span className={r.devStart>2?'dev-pos':r.devStart<-2?'dev-neg':'dev-zero'}>{r.devStart>0?'+':''}{r.devStart}d</span>:'—'}</td>
          <td className="mono">{r.devFin!==null?<span className={r.devFin>2?'dev-pos':r.devFin<-2?'dev-neg':'dev-zero'}>{r.devFin>0?'+':''}{r.devFin}d</span>:'—'}</td>
          <td className="mono">{r.percentComplete}%</td>
          <td style={{fontSize:11,color:'var(--c1)'}}>{entV(r,'Contratista')||'—'}</td>
        </tr>
      ))}</tbody>
    </table>

    {/* Breakdown por contratista */}
    {(()=>{
      const cm={};
      rows.forEach(r=>{const c=entV(r,'Contratista')||'Sin contratista';if(!cm[c])cm[c]={tot:0,late:0,early:0,sumDev:0};cm[c].tot++;if(r.devFin>2)cm[c].late++;if(r.devFin<-2)cm[c].early++;cm[c].sumDev+=(r.devFin||0)});
      const entries=Object.entries(cm).sort((a,b)=>b[1].tot-a[1].tot);
      if(entries.length<2)return null;
      return <div style={{marginTop:20}}>
        <div className="dst">Desvío por contratista</div>
        <table className="dt"><thead><tr><th>Contratista</th><th style={{width:50}}>Tareas</th><th style={{width:70}}>Atrasadas</th><th style={{width:75}}>Adelantadas</th><th style={{width:75}}>Desvío prom.</th></tr></thead>
        <tbody>{entries.map(([n,d])=>{const avg2=d.tot?Math.round(d.sumDev/d.tot):0;return <tr key={n}><td style={{fontWeight:500}}>{n}</td><td className="mono">{d.tot}</td><td className="mono" style={{color:d.late?'var(--err)':'var(--c2)'}}>{d.late}</td><td className="mono" style={{color:d.early?'var(--ok)':'var(--c2)'}}>{d.early}</td><td className="mono"><span className={avg2>2?'dev-pos':avg2<-2?'dev-neg':'dev-zero'}>{avg2>0?'+':''}{avg2}d</span></td></tr>})}</tbody></table>
      </div>;
    })()}
  </div>;
}

/* ═══════ Vencidas por responsable (recursos + contratistas, todas las obras) ═══════ */
/* Unifica variantes del mismo nombre entre XMLs. Clave: nombre normalizado → nombre a mostrar */
const PERSON_ALIAS={
  'mariana v':'Mariana Valdez',
  'maximiliano euguaras':'Maximiliano Eguaras',
  'leo subias':'Leopoldo Subias',
};
/* Recursos genéricos (áreas, no personas) — se muestran aparte */
const NON_PERSON=new Set(['proyectos','posventa','obras','externo','a definir','geotecnia','enas','sin asignar']);
function normName(s){return(s||'').trim().replace(/\s+/g,' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function daysLate(t,now){return t.finish?Math.max(0,Math.floor((now-t.finish)/86400000)):0}
function taskPath(t){const p=[];let x=t.parent;while(x){p.unshift(x.name);x=x.parent}return p.slice(-2).join(' › ')}

/* Excel: hoja con anchos, filtro y fechas reales */
function xlsSheet(rows,widths){const ws=XLSX.utils.json_to_sheet(rows,{dateNF:'dd/mm/yyyy'});if(widths)ws['!cols']=widths.map(w=>({wch:w}));if(rows.length&&ws['!ref'])ws['!autofilter']={ref:ws['!ref']};return ws}
function xlsName(s,used){let n=(s||'Hoja').replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31)||'Hoja';const b=n;let i=2;while(used.has(n.toLowerCase()))n=b.slice(0,27)+' ('+(i++)+')';used.add(n.toLowerCase());return n}
const XLS_DET_W=[22,12,8,28,9,50,40,11,11,9,16,9,16,10];
function xlsDetRow(P,r){return{'Responsable':P.display,'Rol':r.role,'Código':r.p.cod||'','Obra':r.p.name,'WBS':r.t.wbs,'Tarea':r.t.name,'Grupo':taskPath(r.t),'Inicio':r.t.start||'','Fin':r.t.finish||'','Días atraso':r.st==='ov'?r.late:'','Estado':r.st==='ov'?'Vencida':'Vence en 7 días','% avance':r.t.percentComplete,'Rubro':entV(r.t,'Rubro'),'N° Item':entV(r.t,'N° Item')}}
function xlsResRow(P){return{'Responsable':P.display,'Rol':[...P.roles].join(' / '),'Vencidas':P.ov,'Vencen en 7 días':P.soon,'Obras afectadas':P.ovProjs.size,'Atraso promedio (d)':P.ov?Math.round(P.sumLate/P.ov):0,'Atraso máximo (d)':P.maxLate}}
const XLS_RES_W=[24,22,10,15,15,18,17];
function personRows(P,withSoon){return P.rows.filter(r=>r.st==='ov'||(withSoon&&r.st==='soon')).sort((a,b)=>a.p.name.localeCompare(b.p.name)||b.late-a.late)}

function ResponsablesView({projList,projData,metaList,healthMap,onOpen}){
  const[scope,setScope]=useState('activas');   /* activas | todas */
  const[tipo,setTipo]=useState('all');         /* all | Recurso | Contratista */
  const[q,setQ]=useState('');
  const[sel,setSel]=useState(null);
  const[withSoon,setWithSoon]=useState(false);
  const[maxAge,setMaxAge]=useState(0);          /* 0 = sin límite; si no, solo vencidas hace ≤ N días */
  const[withStale,setWithStale]=useState(false); /* por defecto no cuenta las vencidas "sin actualizar" */
  const detailRef=useRef(null);

  const projsInScope=useMemo(()=>(projList||[]).filter(p=>{
    if(!projData[p.key])return false;
    if(scope==='todas')return true;
    const e=(matchMeta(p.name,metaList)?.estado||'').trim();
    return e!=='Finalizado'&&e!=='Cancelada'&&e!=='Cancelado';
  }),[projList,projData,metaList,scope]);

  const model=useMemo(()=>{
    const now=new Date();const soonLim=new Date(now);soonLim.setDate(soonLim.getDate()+7);
    /* 1. Variantes de nombre → nombre canónico */
    const freq={};
    for(const p of projsInScope)for(const t of projData[p.key].tasks){
      if(t.isSummary)continue;
      for(const r of t.resources){const n=normName(r);if(n){freq[n]=freq[n]||{};freq[n][r.trim()]=(freq[n][r.trim()]||0)+1}}
      const c=entV(t,'Contratista');if(c){const n=normName(c);freq[n]=freq[n]||{};freq[n][c.trim()]=(freq[n][c.trim()]||0)+1}
    }
    const fullNames=Object.keys(freq);
    const canon={};
    for(const n of fullNames){
      if(PERSON_ALIAS[n]){canon[n]=PERSON_ALIAS[n];continue}
      const m=n.match(/^(\S+) (\S)\.?$/);/* "Mariana V" → única "Mariana V…" */
      if(m){const c=fullNames.filter(o=>o!==n&&o.startsWith(m[1]+' '+m[2])&&o.length>n.length);
        if(c.length===1){canon[n]=Object.entries(freq[c[0]]).sort((a,b)=>b[1]-a[1])[0][0];continue}}
      canon[n]=Object.entries(freq[n]).sort((a,b)=>b[1]-a[1])[0][0];
    }
    /* 2. Agregar tareas por persona */
    const people={};
    const add=(raw,role,t,p,st)=>{
      const display=canon[normName(raw)]||raw.trim();const key=normName(display);
      if(!people[key])people[key]={key,display,roles:new Set(),area:NON_PERSON.has(key),rows:[],ov:0,soon:0,projs:new Set(),ovProjs:new Set(),maxLate:0,sumLate:0,tot:0};
      const P=people[key];P.roles.add(role);P.tot++;P.projs.add(p.key);
      if(st==='ov'){P.ov++;P.ovProjs.add(p.key);const dl=daysLate(t,now);P.sumLate+=dl;if(dl>P.maxLate)P.maxLate=dl}
      if(st==='soon')P.soon++;
      if(st)P.rows.push({t,p,role,raw,st,late:st==='ov'?daysLate(t,now):0});
    };
    for(const p of projsInScope)for(const t of projData[p.key].tasks){
      if(t.isSummary)continue;
      const st=isOv(t)?(((maxAge&&daysLate(t,now)>maxAge)||(!withStale&&isStale(t,projData[p.key].statusDate)))?null:'ov'):(t.finish&&t.percentComplete<100&&t.finish>=now&&t.finish<=soonLim)?'soon':null;
      const seen=new Set();
      for(const r of t.resources){const k=normName(canon[normName(r)]||r);if(seen.has(k))continue;seen.add(k);add(r,'Recurso',t,p,st)}
      const c=entV(t,'Contratista');
      if(c){const k=normName(canon[normName(c)]||c);if(!seen.has(k)){seen.add(k);add(c,'Contratista',t,p,st)}}
      if(!t.resources.length&&!c)add('Sin asignar','Recurso',t,p,st);
    }
    const list=Object.values(people).sort((a,b)=>b.ov-a.ov||b.soon-a.soon||a.display.localeCompare(b.display));
    return{list,people};
  },[projsInScope,projData,maxAge,withStale]);

  const shown=useMemo(()=>{
    const lq=normName(q);
    return model.list.filter(P=>{
      if(tipo!=='all'&&!P.roles.has(tipo))return false;
      if(lq&&!normName(P.display).includes(lq))return false;
      return P.ov>0||P.soon>0||lq;
    });
  },[model,tipo,q]);

  const selP=sel?model.people[sel]:null;
  const pName=k=>pLabel((projList||[]).find(p=>p.key===k))||k;

  /* Matriz responsable × obra (solo con vencidas) */
  const matrix=useMemo(()=>{
    const rows=shown.filter(P=>P.ov>0&&!P.area);
    const colSet=new Set();for(const P of rows)for(const k of P.ovProjs)colSet.add(k);
    const cols=[...colSet].map(k=>({k,n:pName(k),tot:rows.reduce((s,P)=>s+P.rows.filter(r=>r.st==='ov'&&r.p.key===k).length,0)})).sort((a,b)=>b.tot-a.tot);
    const cell=(P,k)=>P.rows.filter(r=>r.st==='ov'&&r.p.key===k).length;
    return{rows,cols,cell};
  },[shown]);

  const detail=useMemo(()=>{
    if(!selP)return[];
    const g={};
    for(const r of selP.rows){if(r.st==='soon'&&!withSoon)continue;(g[r.p.key]=g[r.p.key]||[]).push(r)}
    return Object.entries(g).map(([k,rows])=>({k,name:pName(k),rows:rows.sort((a,b)=>b.late-a.late||(a.t.finish||0)-(b.t.finish||0)),ov:rows.filter(r=>r.st==='ov').length})).sort((a,b)=>b.ov-a.ov);
  },[selP,withSoon]);

  const pick=k=>{setSel(k);setTimeout(()=>detailRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),50)};

  const today=new Date().toISOString().slice(0,10);
  const filtroTxt=()=>`Alcance: ${scope==='activas'?'obras activas':'todas las obras'} · Tipo: ${tipo==='all'?'todos':tipo} · Vencidas hace: ${maxAge?'≤ '+maxAge+' días':'cualquier fecha'}${withSoon?' · incluye las que vencen en 7 días':''}${withStale?' · incluye vencidas sin actualizar':' · sin las vencidas sin actualizar'} · Generado ${new Date().toLocaleDateString('es-AR')}`;
  /* Reporte de UNA persona: resumen por obra + detalle */
  const exportXls=()=>{
    if(!selP)return;
    const rows=personRows(selP,withSoon);
    const byObra={};for(const r of rows){const o=byObra[r.p.name]=byObra[r.p.name]||{'Código':r.p.cod||'','Obra':r.p.name,'Vencidas':0,'Vencen en 7 días':0,'Atraso máximo (d)':0};if(r.st==='ov'){o['Vencidas']++;o['Atraso máximo (d)']=Math.max(o['Atraso máximo (d)'],r.late)}else o['Vencen en 7 días']++}
    const wb=XLSX.utils.book_new();
    const res=xlsSheet(Object.values(byObra).sort((a,b)=>b['Vencidas']-a['Vencidas']),[8,32,10,15,17]);
    XLSX.utils.sheet_add_aoa(res,[[selP.display+' — '+filtroTxt()]],{origin:'G1'});
    XLSX.utils.book_append_sheet(wb,res,'Resumen por obra');
    XLSX.utils.book_append_sheet(wb,xlsSheet(rows.map(r=>xlsDetRow(selP,r)),XLS_DET_W),'Detalle');
    XLSX.writeFile(wb,`Vencidas_${selP.display.replace(/\s+/g,'_')}_${today}.xlsx`,{cellDates:true});
  };
  /* Reporte de TODAS las personas visibles: resumen + detalle + una hoja por persona */
  const exportAll=()=>{
    const ppl=shown.filter(P=>P.ov>0||(withSoon&&P.soon>0));
    if(!ppl.length)return;
    const wb=XLSX.utils.book_new();const used=new Set(['resumen','detalle']);
    const res=xlsSheet(ppl.map(xlsResRow),XLS_RES_W);
    XLSX.utils.sheet_add_aoa(res,[[filtroTxt()]],{origin:'I1'});
    XLSX.utils.book_append_sheet(wb,res,'Resumen');
    const all=[];for(const P of ppl)for(const r of personRows(P,withSoon))all.push(xlsDetRow(P,r));
    XLSX.utils.book_append_sheet(wb,xlsSheet(all,XLS_DET_W),'Detalle');

    </div>

    <div className="rv-ctrl">
      <div className="seg">
        <button className={scope==='activas'?'on':''} onClick={()=>setScope('activas')}>Obras activas</button>

      </div>
      <label className="pg-chk" title="Vencidas que probablemente no están atrasadas: el avance no se cargó en MS Project"><input type="checkbox" checked={withStale} onChange={e=>setWithStale(e.target.checked)}/> + sin actualizar</label>
      <span className="fl">Vencidas hace</span>
      <select className="fsel" value={maxAge} onChange={e=>setMaxAge(parseInt(e.target.value))}><option value="0">Cualquier fecha</option><option value="30">≤ 30 días</option><option value="90">≤ 90 días</option><option value="180">≤ 180 días</option></select>
      <input className="fin" style={{width:180}} placeholder="Buscar persona…" value={q} onChange={e=>setQ(e.target.value)}/>
      <label style={{fontSize:12,color:'var(--c1)',display:'flex',alignItems:'center',gap:4,cursor:'pointer'}}><input type="checkbox" checked={withSoon} onChange={e=>setWithSoon(e.target.checked)}/> + vencen en 7 días</label>
      <button className="btn" onClick={exportAll} title="Un Excel con resumen, detalle y una hoja por persona (respeta los filtros)">↓ Excel todos</button>
      <span style={{marginLeft:'auto',fontSize:12,fontFamily:'var(--fm)',color:'var(--err)',fontWeight:600}}>{totalOv} asignaciones vencidas</span>
    </div>

    <div className="rv-cards">
      {shown.map(P=><div key={P.key} className={`rv-card ${sel===P.key?'on':''} ${P.area?'area':''}`} onClick={()=>sel===P.key?setSel(null):pick(P.key)}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span className="rv-name" title={P.display}>{P.display}</span>
          {[...P.roles].map(r=><span key={r} className={`rv-role ${r==='Contratista'?'c':'r'}`}>{r==='Contratista'?'Contr.':P.area?'Área':'Equipo'}</span>)}
        </div>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginTop:6}}>
          <span className="rv-ov" style={{color:P.ov?'var(--err)':'var(--c2)'}}>{P.ov}</span>
          <span style={{fontSize:11,color:'var(--c1)'}}>vencidas</span>
          {P.soon>0&&<span style={{fontSize:11,color:'var(--warn)',marginLeft:'auto',fontFamily:'var(--fm)'}}>+{P.soon} en 7d</span>}
        </div>
        <div className="rv-meta">{P.ovProjs.size} obra{P.ovProjs.size!==1?'s':''}{P.ov>0&&<Fragment> · máx {P.maxLate}d · prom {Math.round(P.sumLate/P.ov)}d</Fragment>}</div>
      </div>)}
      {!shown.length&&<div style={{color:'var(--c2)',fontSize:12,padding:20}}>{loaded<total?'Analizando obras…':'Nadie tiene tareas vencidas con estos filtros.'}</div>}
    </div>

    {!selP&&matrix.rows.length>0&&matrix.cols.length>0&&<div style={{marginTop:20}}>
      <div className="dst">Mapa de vencidas — responsable × obra <span style={{fontWeight:400,color:'var(--c2)'}}>(clic en una celda para ver el detalle)</span></div>
      <div className="rv-mx-wrap"><table className="dt rv-mx">
        <thead><tr><th style={{position:'sticky',left:0,zIndex:2,background:'var(--bg-1)'}}>Responsable</th>{matrix.cols.map(c=><th key={c.k} title={c.n}><div className="rv-vh">{c.n}</div></th>)}<th>Total</th></tr></thead>

          <td style={{fontWeight:600,position:'sticky',left:0,background:'var(--bg-el)',whiteSpace:'nowrap'}}>{P.display}</td>

            style={{textAlign:'center',cursor:v?'pointer':'default',background:v?`rgba(239,68,68,${.08+a*.5})`:'transparent',color:v?(a>.6?'#fff':'var(--c0)'):'var(--c2)',fontWeight:v?600:400}}>{v||'·'}</td>})}
          <td className="mono" style={{fontWeight:700,color:'var(--err)',textAlign:'center'}}>{P.ov}</td>
        </tr>)}</tbody>
      </table></div>
    </div>}

    {selP&&<div ref={detailRef} style={{marginTop:20}}>
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700}}>{selP.display}</div>
        <span style={{fontSize:11,color:'var(--c2)'}}>{[...selP.roles].join(' · ')}</span>
        <label style={{fontSize:12,color:'var(--c1)',display:'flex',alignItems:'center',gap:4,marginLeft:'auto',cursor:'pointer'}}><input type="checkbox" checked={withSoon} onChange={e=>setWithSoon(e.target.checked)}/> Incluir las que vencen en 7 días</label>
        <button className="btn" onClick={exportXls}>↓ Excel de {selP.display.split(' ')[0]}</button>
        <button className="btn btn-g" onClick={()=>setSel(null)}>× Cerrar</button>
      </div>
      <div className="dgrid">
        <div className="kpi err"><div className="kpi-v" style={{color:'var(--err)'}}>{selP.ov}</div><div className="kpi-l">Vencidas</div></div>
        <div className="kpi"><div className="kpi-v">{selP.ovProjs.size}</div><div className="kpi-l">Obras afectadas</div></div>
        <div className="kpi warn"><div className="kpi-v">{selP.ov?Math.round(selP.sumLate/selP.ov):0}d</div><div className="kpi-l">Atraso promedio</div></div>
        <div className="kpi err"><div className="kpi-v">{selP.maxLate}d</div><div className="kpi-l">Atraso máximo</div></div>
        <div className="kpi warn"><div className="kpi-v" style={{color:'var(--warn)'}}>{selP.soon}</div><div className="kpi-l">Vencen en 7 días</div></div>
      </div>
      {detail.map(g=><div key={g.k} style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--ac)'}}>{g.name}</span>
          {hc(g.k)}
          <span className="mono" style={{color:'var(--err)'}}>{g.ov} vencidas</span>
          <button className="btn btn-g" style={{marginLeft:'auto'}} onClick={()=>{const r=g.rows[0];onOpen&&onOpen(g.k,r.raw,r.role)}}>Abrir en Gantt →</button>
        </div>
        <table className="dt"><thead><tr><th>Tarea</th><th style={{width:85}}>Fin</th><th style={{width:70}}>Atraso</th><th style={{width:45}}>%</th><th style={{width:85}}>Rol</th><th style={{width:90}}>Rubro</th><th style={{width:60}}>N° Item</th></tr></thead>
        <tbody>{g.rows.map(r=><tr key={r.t.uid+r.role}>
          <td><div style={{fontWeight:500}}>{r.t.name}</div>{taskPath(r.t)&&<div style={{fontSize:11,color:'var(--c2)'}}>{taskPath(r.t)}</div>}</td>
          <td className="mono">{fD(r.t.finish)}</td>
          <td className="mono" style={{fontWeight:600,color:r.st==='ov'?(r.late>15?'var(--err)':'var(--warn)'):'var(--c2)'}}>{r.st==='ov'?`${r.late}d`:'vence'}</td>
          <td className="mono">{r.t.percentComplete}%</td>
          <td style={{fontSize:11,color:'var(--c1)'}}>{r.role}</td>
          <td style={{fontSize:11,color:'var(--c1)'}}>{entV(r.t,'Rubro')||'—'}</td>
          <td className="mono">{entV(r.t,'N° Item')||'—'}</td>
        </tr>)}</tbody></table>
      </div>)}
      {!detail.length&&<div style={{color:'var(--c2)',fontSize:12}}>Sin tareas vencidas en el alcance elegido.</div>}
    </div>}
  </div>;
}

/* ═══════ Portfolio — Gantt multi-obra (seguimiento de todas las obras en una pantalla) ═══════ */
const PG_ZOOM={week:{l:'Semana',w:9},month:{l:'Mes',w:3},qtr:{l:'Trim.',w:1}};
const PG_ROW=32,PG_HDR=46;
const PG_SEL_KEY='bp360_pfgantt_sel_v2',PG_UI_KEY='bp360_pfgantt_ui';
const PG_EST={all:'Todas',falta:'Falta terminar',ok:'Terminadas',ip:'En curso',ov:'Vencidas'};
function pgEstOk(t,f){const s=gSt(t);if(f==='all')return true;if(f==='falta')return s!=='ok';return s===f}
function pgLoad(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v}catch(e){return def}}
function pgSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function pgIsActive(estado){const e=(estado||'').trim();return e!=='Finalizado'&&e!=='Cancelada'&&e!=='Cancelado'}

/* Selector desplegable de obras con casillas */
function ObraPicker({opts,sel,onChange,healthMap}){
  const[open,setOpen]=useState(false);const[q,setQ]=useState('');const ref=useRef(null);
  useEffect(()=>{if(!open)return;const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h)},[open]);
  const selSet=new Set(sel);
  const lq=normName(q);
  const shown=opts.filter(o=>!lq||normName(o.label).includes(lq)).sort((a,b)=>(b.activa-a.activa)||a.name.localeCompare(b.name));
  const tog=k=>onChange(selSet.has(k)?sel.filter(x=>x!==k):[...sel,k]);
  const label=!sel.length?'Ninguna obra':sel.length===1?(opts.find(o=>o.key===sel[0])?.label||'1 obra'):sel.length===opts.length?`Todas las obras (${sel.length})`:`${sel.length} obras seleccionadas`;
  const hcol=SEMA_COL;
  return <div className="pg-pick" ref={ref}>
    <button className="fsel pg-pick-btn" onClick={()=>setOpen(o=>!o)} title="Elegir obras">{label}</button>
    {open&&<div className="pg-pop">
      <input className="si" autoFocus placeholder="Buscar obra…" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Escape')setOpen(false)}}/>
      <div className="pg-pop-q">
        <button onClick={()=>onChange(opts.filter(o=>o.activa).map(o=>o.key))}>Activas</button>
        <button onClick={()=>onChange(opts.map(o=>o.key))}>Todas</button>
        <button onClick={()=>onChange([])}>Ninguna</button>
      </div>
      <div className="pg-pop-list">
        {shown.map((o,i)=>{const h=healthMap?.[o.key];return <Fragment key={o.key}>{!o.activa&&(i===0||shown[i-1].activa)&&<div className="pg-pop-sep">Finalizadas / canceladas</div>}<label className="pg-opt">
          <input type="checkbox" checked={selSet.has(o.key)} onChange={()=>tog(o.key)}/>
          {o.cod?<span className="cod">{o.cod}</span>:<span className="cod off">—</span>}
          <span className="pg-opt-n" title={o.name}>{o.name}</span>
          {o.estado&&<span className="pg-opt-e">{o.estado}</span>}
          <span className="pg-hdot" style={{background:h?hcol[h.color]:'var(--b0)'}} title={h?h.label:'Sin analizar'}/>
          <button className="pg-solo" onClick={e=>{e.preventDefault();e.stopPropagation();onChange([o.key]);setOpen(false)}} title="Ver solo esta obra">solo</button>
        </label></Fragment>})}
        {!shown.length&&<div style={{padding:12,fontSize:12,color:'var(--c2)'}}>Sin coincidencias</div>}
      </div>
    </div>}
  </div>;
}

function PortfolioGantt({projList,projData,metaList,healthMap,onOpenObra}){
  const ui0=pgLoad(PG_UI_KEY,{});
  const[selRaw,setSelRaw]=useState(()=>pgLoad(PG_SEL_KEY,null));
  const[zoom,setZoom]=useState(PG_ZOOM[ui0.zoom]?ui0.zoom:'month');
  const[nivel,setNivel]=useState(ui0.nivel||'tareas');   /* fases | tareas | todo */
  const[fEst,setFEst]=useState(ui0.fEst||'all');
  const[showBL,setShowBL]=useState(ui0.showBL!==false);
  const[showLbl,setShowLbl]=useState(ui0.showLbl!==false);
  const[q,setQ]=useState('');
  const[collapsed,setCollapsed]=useState({});
  const[hl,setHl]=useState(null);
  const[sort,setSort]=useState({col:'start',dir:1});
  const[detH,setDetH]=useState(()=>pgLoad('bp360_pfgantt_det',240));
  /* Ancho de la columna de nombres: arrastrable, se recuerda por navegador; doble clic vuelve a 340 */
  const[nameW,setNameW]=useState(()=>{const v=pgLoad('bp360_pfgantt_namew',0);return v>=160&&v<=900?v:0});
  const startNameDrag=e=>{e.preventDefault();e.stopPropagation();const x0=e.clientX,w0=nameW||(window.innerWidth<=768?170:340);
    const mv=ev=>setNameW(Math.max(160,Math.min(Math.round(window.innerWidth*0.7),w0+ev.clientX-x0)));
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.style.cursor='';document.body.style.userSelect='';setNameW(w=>{pgSave('bp360_pfgantt_namew',w);return w})};
    document.body.style.cursor='col-resize';document.body.style.userSelect='none';document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)};
  const resetNameW=()=>{setNameW(0);pgSave('bp360_pfgantt_namew',0)};
  const[ttInfo,setTT]=useState(null);
  const scRef=useRef(null),detRef=useRef(null),scrolledFor=useRef('');
  useEffect(()=>{pgSave(PG_UI_KEY,{zoom,nivel,fEst,showBL,showLbl})},[zoom,nivel,fEst,showBL,showLbl]);

  /* Obras disponibles */
  const opts=useMemo(()=>(projList||[]).map(p=>{const m=matchMeta(p.name,metaList);const estado=(m?.estado||'').trim();
    return{key:p.key,name:p.name,cod:p.cod,label:pLabel(p),estado,activa:pgIsActive(estado),p}}),[projList,metaList]);
  const sel=useMemo(()=>{const keys=new Set(opts.map(o=>o.key));if(selRaw)return selRaw.filter(k=>keys.has(k));const first=opts.find(o=>o.activa&&o.p&&!o.p.local)||opts[0];return first?[first.key]:[]},[selRaw,opts]);
  const setSel=v=>{setSelRaw(v);pgSave(PG_SEL_KEY,v)};

  /* Filas: cabecera de obra + tareas */
  const rows=useMemo(()=>{
    const out=[];const selSet=new Set(sel);const lq=normName(q);
    for(const o of opts){
      if(!selSet.has(o.key))continue;
      const d=projData[o.key];
      if(!d){out.push({type:'load',key:'L|'+o.key,o});continue}
      const leaves=d.tasks.filter(t=>!t.isSummary);
      const sum={start:null,finish:null,blS:null,blF:null,done:0,ov:0,tot:leaves.length,avg:0};
      let acc=0;
      for(const t of leaves){
        if(t.start&&(!sum.start||t.start<sum.start))sum.start=t.start;
        if(t.finish&&(!sum.finish||t.finish>sum.finish))sum.finish=t.finish;
        const b=t.baselines[0];
        if(b){if(b.start&&(!sum.blS||b.start<sum.blS))sum.blS=b.start;if(b.finish&&(!sum.blF||b.finish>sum.blF))sum.blF=b.finish}
        if(t.percentComplete>=100)sum.done++;if(isOv(t))sum.ov++;acc+=t.percentComplete;
      }
      sum.avg=wAvg(leaves);
      const ts=d.tasks.filter(t=>{
        if(nivel==='tareas'&&t.isSummary)return false;
        if(nivel==='fases'&&!((t.isSummary&&t.depth<=1)||t.isMilestone))return false;
        if(!pgEstOk(t,fEst))return false;
        if(lq&&!normName(t.name).includes(lq))return false;
        return true;
      });
      if(lq&&!ts.length)continue;
      out.push({type:'obra',key:'O|'+o.key,o,sum,count:ts.length});
      if(!collapsed[o.key])for(const t of ts)out.push({type:'task',key:o.key+'|'+t.uid,pk:o.key,o,t});
    }
    return out;
  },[opts,sel,projData,nivel,fEst,q,collapsed]);

  const taskRows=useMemo(()=>rows.filter(r=>r.type==='task'),[rows]);
  const rowIdx=useMemo(()=>{const m={};rows.forEach((r,i)=>m[r.key]=i);return m},[rows]);

  /* Rango del eje temporal */
  const w=PG_ZOOM[zoom].w;
  const[cStart,cEnd]=useMemo(()=>{
    let mn=null,mx=null;const upd=d=>{if(!d)return;if(!mn||d<mn)mn=d;if(!mx||d>mx)mx=d};
    for(const r of rows){if(r.type==='obra'){upd(r.sum.start);upd(r.sum.finish);if(showBL){upd(r.sum.blS);upd(r.sum.blF)}}}
    const now=new Date();if(!mn)mn=now;if(!mx)mx=now;
    const a=new Date(mn.getFullYear(),mn.getMonth(),1);const b=new Date(mx.getFullYear(),mx.getMonth()+2,0);
    return[a,b];
  },[rows,showBL]);
  const d2x=useCallback(d=>d?((d-cStart)/86400000)*w:0,[cStart,w]);
  const totW=Math.max(Math.ceil(((cEnd-cStart)/86400000)*w),600);
  const totH=Math.max(rows.length*PG_ROW,PG_ROW);
  const now=new Date();const nowX=d2x(now);

  /* Encabezado: años arriba, meses/semanas/trimestres abajo */
  const hdr=useMemo(()=>{
    const top=[],bot=[],lines=[],bands=[];
    if(zoom==='week'){
      const d=new Date(cStart);let lm=-1;
      while(d<=cEnd){const x=d2x(d);
        if(d.getMonth()!==lm){top.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'numeric'}).replace('.','')});lines.push({x,mj:true});lm=d.getMonth()}
        else if(d.getDay()===1)lines.push({x,mj:false});
        if(d.getDay()===1)bot.push({x,w:7*w,l:String(d.getDate())});
        d.setDate(d.getDate()+1)}
    }else{
      const step=zoom==='qtr'?3:1;let m=new Date(cStart.getFullYear(),zoom==='qtr'?Math.floor(cStart.getMonth()/3)*3:cStart.getMonth(),1);let ly=-1,i=0;
      while(m<=cEnd){const nx=new Date(m.getFullYear(),m.getMonth()+step,1);const x=d2x(m),wd=d2x(nx)-x;
        bot.push({x,w:wd,l:zoom==='qtr'?`T${Math.floor(m.getMonth()/3)+1}`:m.toLocaleDateString('es-AR',{month:'short'}).replace('.','')});
        if(m.getFullYear()!==ly){top.push({x,l:String(m.getFullYear())});ly=m.getFullYear()}
        lines.push({x,mj:m.getMonth()===0});if(i%2)bands.push({x,w:wd});
        m=nx;i++}
    }
    return{top,bot,lines,bands};
  },[zoom,cStart,cEnd,d2x,w]);

  /* Al abrir (o cambiar zoom) llevar la vista a "hoy" */
  useEffect(()=>{
    const el=scRef.current;if(!el||!rows.length)return;
    const sig=zoom+'|'+cStart.getTime();if(scrolledFor.current===sig)return;scrolledFor.current=sig;
    if(now>=cStart&&now<=cEnd)el.scrollLeft=Math.max(0,nowX-(el.clientWidth-300)*0.45);
  },[rows.length,zoom,cStart,cEnd]);

  const goToday=()=>{const el=scRef.current;if(el)el.scrollTo({left:Math.max(0,nowX-(el.clientWidth-300)*0.45),behavior:'smooth'})};
  const focusRow=(key,fromTable)=>{
    setHl(key);
    const i=rowIdx[key];const el=scRef.current;
    if(fromTable&&el&&i!=null){const r=rows[i];const x=r.t?.start?d2x(r.t.start):0;el.scrollTo({top:Math.max(0,i*PG_ROW-el.clientHeight/3),left:Math.max(0,x-200),behavior:'smooth'})}
    if(!fromTable&&detRef.current){const tr=detRef.current.querySelector(`[data-k="${CSS.escape(key)}"]`);if(tr)tr.scrollIntoView({block:'nearest',behavior:'smooth'})}
  };
  const togObra=k=>setCollapsed(c=>({...c,[k]:!c[k]}));
  const expAll=()=>setCollapsed({});
  const colAll=()=>{const c={};for(const k of sel)c[k]=true;setCollapsed(c)};

  /* Tabla de detalle */
  const detRows=useMemo(()=>{
    const r=taskRows.map(x=>{const b=x.t.baselines[0]||null;return{...x,blS:b?.start||null,blF:b?.finish||null,dev:b?.finish&&x.t.finish?dB(b.finish,x.t.finish):null,st:gSt(x.t)}});
    const{col,dir}=sort;const val=x=>col==='obra'?x.o.label:col==='name'?x.t.name:col==='start'?x.t.start:col==='finish'?x.t.finish:col==='blS'?x.blS:col==='blF'?x.blF:col==='dev'?x.dev:col==='pct'?x.t.percentComplete:x.st;
    return r.sort((a,b)=>{let va=val(a),vb=val(b);if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return-1;
      if(typeof va==='string')return dir*va.localeCompare(vb);return dir*((va>vb)-(va<vb))});
  },[taskRows,sort]);
  const detTot=useMemo(()=>{let s=null,f=null,done=0;for(const x of taskRows){if(x.t.start&&(!s||x.t.start<s))s=x.t.start;if(x.t.finish&&(!f||x.t.finish>f))f=x.t.finish;if(x.t.percentComplete>=100)done++}return{s,f,done,n:taskRows.length}},[taskRows]);
  const th=(col,lbl,w)=><th style={{width:w,cursor:'pointer'}} onClick={()=>setSort(s=>({col,dir:s.col===col?-s.dir:1}))}>{lbl}{sort.col===col?(sort.dir>0?' ▲':' ▼'):''}</th>;
  const exportXls=()=>{
    const data=detRows.map(x=>({'Código':x.o.cod||'','Obra':x.o.name,'WBS':x.t.wbs,'Tarea':x.t.name,'Inicio':x.t.start||'','Fin':x.t.finish||'','Inicio LB':x.blS||'','Fin LB':x.blF||'','Desvío fin (d)':x.dev==null?'':x.dev,'% avance':x.t.percentComplete,'Estado':stL(x.st),'Contratista':entV(x.t,'Contratista'),'Rubro':entV(x.t,'Rubro')}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,xlsSheet(data,[8,30,9,50,11,11,11,11,13,9,12,20,16]),'Gantt de obras');
    XLSX.writeFile(wb,`Gantt_obras_${new Date().toISOString().slice(0,10)}.xlsx`,{cellDates:true});
  };

  /* Divisor arrastrable entre Gantt y detalle */
  const startSplit=e=>{e.preventDefault();const y0=e.clientY,h0=detH;
    const mv=ev=>{const h=Math.max(36,Math.min(window.innerHeight*0.7,h0-(ev.clientY-y0)));setDetH(h)};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.body.style.cursor='';setDetH(h=>{pgSave('bp360_pfgantt_det',h);return h})};
    document.body.style.cursor='row-resize';document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)};

  const hasBL=rows.some(r=>r.type==='obra'&&r.sum.blF);
  const loadingN=rows.filter(r=>r.type==='load').length;
  const hcol=SEMA_COL;
  const tEnter=(e,t)=>{const r=e.currentTarget.getBoundingClientRect();setTT({task:t,x:r.left+Math.min(r.width,200)/2,y:r.top-4})};
  const tLeave=()=>setTT(null);

  /* Barra de una fila */
  const renderBar=(r,i)=>{
    const top=i*PG_ROW,cy=top+PG_ROW/2-3;
    if(r.type==='load')return <text key={r.key} x={Math.max(8,nowX-60)} y={cy+4} fontSize="11" fill="var(--c2)" fontFamily="var(--ff)">Cargando cronograma…</text>;
    if(r.type==='obra'){
      const s=r.sum;if(!s.start||!s.finish)return null;
      const x=d2x(s.start),bw=Math.max(d2x(s.finish)-x,2);const h=r.o.key&&healthMap?.[r.o.key];
      return <g key={r.key}>
        {showBL&&s.blS&&s.blF&&<rect x={d2x(s.blS)} y={cy+8} width={Math.max(d2x(s.blF)-d2x(s.blS),2)} height={4} rx="1" fill="var(--bar-bl)" opacity=".8"/>}
        <rect x={x} y={cy-5} width={bw} height={10} rx="2" fill="var(--bar-sum)" opacity=".25"/>
        <rect x={x} y={cy-5} width={bw*s.avg/100} height={10} rx="2" fill="var(--bar-sum)"/>
        <path d={`M${x},${cy-5} L${x},${cy+9} M${x+bw},${cy-5} L${x+bw},${cy+9}`} stroke="var(--bar-sum)" strokeWidth="2"/>
        {showLbl&&<text x={x+bw+8} y={cy+4} fontSize="11" fontWeight="700" fill="var(--c0)" fontFamily="var(--ff)">{r.o.label} · {s.avg}%{h&&h.desvioBruto!=null&&h.desvioBruto!==0?` · ${h.desvioBruto>0?'+':''}${h.desvioBruto}d`:''}</text>}
      </g>;
    }
    const t=r.t;const st=gSt(t);
    const b=t.baselines[0];
    const blEl=showBL&&b&&b.start&&b.finish?<rect x={d2x(b.start)} y={cy+9} width={Math.max(d2x(b.finish)-d2x(b.start),2)} height={4} rx="1" fill="var(--bar-bl)" opacity=".8"/>:null;
    const lbl=showLbl?<text x={0} y={cy+4} fontSize="11" fill={st==='ov'?'var(--err)':'var(--c1)'} fontFamily="var(--ff)" fontWeight={st==='ok'?600:400}>{st==='ok'&&!/^[✓✔]/.test(t.name)?'✓ ':''}{t.name}</text>:null;
    if(t.isMilestone||(!t.isSummary&&t.start&&t.finish&&t.finish-t.start<3600000&&t.durDays===0)){
      const mx=d2x(t.finish||t.start),sz=6,c=st==='ok'?'var(--bar-ok)':st==='ov'?'var(--bar-ov)':'var(--bar-ms)';
      return <g key={r.key} onMouseEnter={e=>tEnter(e,t)} onMouseLeave={tLeave} onClick={()=>focusRow(r.key)} style={{cursor:'pointer'}}>{blEl}
        <polygon points={`${mx},${cy-sz} ${mx+sz},${cy} ${mx},${cy+sz} ${mx-sz},${cy}`} fill={c}/>
        {lbl&&React.cloneElement(lbl,{x:mx+10})}</g>;
    }
    if(!t.start||!t.finish)return blEl?<g key={r.key}>{blEl}</g>:null;
    const x=d2x(t.start),bw=Math.max(d2x(t.finish)-x,3),p=Math.min(100,t.percentComplete||0);
    const bh=t.isSummary?8:14,by=cy-bh/2;
    let bg='var(--bar-bg)',fg='var(--bar)';if(st==='ov'){bg='var(--bar-ov-bg)';fg='var(--bar-ov)'}else if(st==='ok'){bg='var(--bar-ok-bg)';fg='var(--bar-ok)'}
    if(t.isSummary){bg='rgba(58,63,75,.2)';fg='var(--bar-sum)'}
    return <g key={r.key} onMouseEnter={e=>tEnter(e,t)} onMouseLeave={tLeave} onClick={()=>focusRow(r.key)} style={{cursor:'pointer'}}>
      {blEl}
      <rect x={x} y={by} width={bw} height={bh} rx="2" fill={bg}/>
      {p<100&&<rect x={x+bw*p/100} y={by} width={bw*(100-p)/100} height={bh} rx="2" fill={`url(#${t.isSummary?'pg-h-s':st==='ov'?'pg-h-ov':'pg-h-a'})`}/>}
      {p>0&&<rect x={x} y={by} width={bw*p/100} height={bh} rx="2" fill={fg}/>}
      {!t.isSummary&&bw>34&&p>0&&p<100&&<text x={x+4} y={cy+4} fontSize="9" fontWeight="700" fill="#fff" fontFamily="var(--fm)">{p}%</text>}
      {lbl&&React.cloneElement(lbl,{x:x+bw+6})}
    </g>;
  };

  return <div className="pg-root" style={nameW?{'--pgl':nameW+'px'}:undefined}>
    <div className="fbar pg-ctrl">
      <span className="fl">Obras</span>
      <ObraPicker opts={opts} sel={sel} onChange={setSel} healthMap={healthMap}/>
      <span className="fl">Detalle</span>
      <div className="seg">{[['fases','Fases'],['tareas','Tareas'],['todo','Todo']].map(([k,l])=><button key={k} className={nivel===k?'on':''} onClick={()=>setNivel(k)}>{l}</button>)}</div>
      <span className="fl">Estado</span>
      <select className="fsel" value={fEst} onChange={e=>setFEst(e.target.value)}>{Object.entries(PG_EST).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
      <input className="fin" style={{width:150}} placeholder="Buscar tarea…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div className="seg">{Object.entries(PG_ZOOM).map(([k,v])=><button key={k} className={zoom===k?'on':''} onClick={()=>setZoom(k)}>{v.l}</button>)}</div>
      <button className="btn btn-g" onClick={goToday}>Hoy</button>
      <label className="pg-chk"><input type="checkbox" checked={showBL} onChange={e=>setShowBL(e.target.checked)}/> Línea base</label>
      <label className="pg-chk"><input type="checkbox" checked={showLbl} onChange={e=>setShowLbl(e.target.checked)}/> Nombres</label>
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)'}}>{sel.length} obras · {taskRows.length} tareas{loadingN?` · cargando ${loadingN}…`:''}</span>
    </div>
    <div className="pg-legend">
      <span><i style={{background:'var(--bar-ok)'}}/>Terminado</span>
      <span><i style={{background:'var(--bar)'}}/>Avance</span>
      <span><i className="hatch"/>Falta</span>
      <span><i style={{background:'var(--bar-ov)'}}/>Vencida</span>
      <span><i style={{background:'var(--bar-bl)',height:4}}/>Línea base</span>
      <span><i style={{background:'var(--bar-ms)',transform:'rotate(45deg)',width:8,height:8}}/>Hito</span>
      <span><i style={{background:'var(--today)',width:2,height:12}}/>Hoy</span>
      {!hasBL&&rows.length>0&&<span style={{color:'var(--warn)'}}>Las obras elegidas no tienen línea base guardada en el XML</span>}
    </div>

    <div className="pg-scroll" ref={scRef}>
      {!sel.length?<div className="week-empty">Elegí una o más obras en el desplegable de arriba.</div>:
      <div className="pg-grid" style={{width:'calc(var(--pgl) + '+totW+'px)'}}>
        <div className="pg-corner">
          <span className="pg-rs" onMouseDown={startNameDrag} onDoubleClick={resetNameW} title="Arrastrá para ensanchar la columna de tareas · doble clic restablece"/>
          <span>Obra / tarea</span>
          <span style={{marginLeft:'auto',display:'flex',gap:2}}>
            <button className="btn btn-g btn-i" onClick={expAll} title="Expandir todo">{I.exp()}</button>
            <button className="btn btn-g btn-i" onClick={colAll} title="Colapsar todo">{I.col()}</button>
          </span>
        </div>
        <div className="pg-thead">
          <svg width={totW} height={PG_HDR} style={{display:'block'}}>
            <rect width={totW} height={PG_HDR} fill="var(--bg-1)"/>
            {hdr.top.map((h,i)=><text key={i} x={h.x+5} y={16} fontSize="11" fontWeight="700" fill="var(--c0)" fontFamily="var(--ff)">{h.l}</text>)}
            {hdr.bot.map((h,i)=><text key={i} x={h.x+h.w/2} y={37} fontSize="10" fill="var(--c1)" fontFamily="var(--fm)" textAnchor="middle">{h.w>14?h.l:''}</text>)}
            {hdr.lines.map((l,i)=><line key={i} x1={l.x} y1={l.mj?0:22} x2={l.x} y2={PG_HDR} stroke="var(--b0)"/>)}
            <line x1="0" y1={PG_HDR-.5} x2={totW} y2={PG_HDR-.5} stroke="var(--b0)"/>
            {nowX>=0&&nowX<=totW&&<g><rect x={nowX-17} y={PG_HDR-14} width="34" height="13" rx="2" fill="var(--today)"/><text x={nowX} y={PG_HDR-4.5} textAnchor="middle" fontSize="9" fontWeight="700" fill="#fff" fontFamily="var(--ff)">HOY</text></g>}
          </svg>
        </div>
        <div className="pg-names">
          <span className="pg-rs" onMouseDown={startNameDrag} onDoubleClick={resetNameW} title="Arrastrá para ensanchar la columna de tareas · doble clic restablece"/>
          {rows.map(r=>{
            if(r.type==='load')return <div key={r.key} className="pg-n pg-n-obra" style={{opacity:.6}}>{r.o.cod&&<span className="cod">{r.o.cod}</span>}<span className="pg-n-t">{r.o.name}</span><div className="mini-sp" style={{width:10,height:10,border:'1.5px solid var(--b0)',borderTopColor:'var(--ac)',borderRadius:'50%',animation:'spin .6s linear infinite'}}/></div>;
            if(r.type==='obra'){const h=healthMap?.[r.o.key];return <div key={r.key} className={`pg-n pg-n-obra ${hl===r.key?'hl':''}`} onClick={()=>togObra(r.o.key)} onDoubleClick={()=>onOpenObra&&onOpenObra(r.o.p)} title="Clic: expandir/colapsar · Doble clic: abrir la obra">
              <span className="pg-tog">{collapsed[r.o.key]?I.chR():I.chD()}</span>
              {r.o.cod?<span className="cod">{r.o.cod}</span>:null}
              <span className="pg-n-t">{r.o.name}</span>
              {h&&<span className="pg-hdot" style={{background:hcol[h.color]}} title={h.label}/>}
              <span className="pg-n-m">{r.sum.done}/{r.sum.tot} · {r.sum.avg}%</span>
            </div>}
            const t=r.t,st=gSt(t);const ind=nivel==='todo'?Math.max(0,t.depth)*12:nivel==='fases'?Math.max(0,t.depth)*12:0;
            return <div key={r.key} className={`pg-n ${hl===r.key?'hl':''}`} onClick={()=>focusRow(r.key)} title={taskPath(t)?taskPath(t)+' › '+t.name:t.name}>
              <span style={{width:22+ind,flexShrink:0}}/>
              <span className="pg-sdot" style={{background:stC(st)}}/>
              <span className="pg-n-t" style={{fontWeight:t.isSummary?700:st==='ok'?500:400,color:st==='ov'?'var(--err)':st==='ok'?'var(--c1)':'var(--c0)'}}>{st==='ok'&&!/^[✓✔]/.test(t.name)&&<span style={{color:'var(--ok)'}}>✓ </span>}{t.isMilestone&&<span style={{color:'var(--bar-ms)'}}>♦ </span>}{t.name}</span>
              <span className="pg-n-m">{t.percentComplete}%</span>
            </div>;
          })}
        </div>
        <div className="pg-body">
          <svg width={totW} height={totH} style={{display:'block'}}>
            <defs>{[['pg-h-a','var(--bar)'],['pg-h-ov','var(--bar-ov)'],['pg-h-s','var(--bar-sum)']].map(([id,c])=><pattern key={id} id={id} width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke={c} strokeWidth="2.2" opacity=".45"/></pattern>)}</defs>
            {hdr.bands.map((b,i)=><rect key={i} x={b.x} y={0} width={b.w} height={totH} fill="var(--bg-alt)"/>)}
            {rows.map((r,i)=>r.type==='obra'?<rect key={r.key} x={0} y={i*PG_ROW} width={totW} height={PG_ROW} fill="var(--bg-sum)"/>:null)}
            {hl!=null&&rowIdx[hl]!=null&&<rect x={0} y={rowIdx[hl]*PG_ROW} width={totW} height={PG_ROW} fill="var(--ac-bg)"/>}
            {hdr.lines.map((l,i)=><line key={i} x1={l.x} y1={0} x2={l.x} y2={totH} stroke={l.mj?'var(--b0)':'var(--b1)'} strokeWidth={l.mj?1:.6}/>)}
            {rows.map((_,i)=><line key={i} x1="0" y1={(i+1)*PG_ROW-.5} x2={totW} y2={(i+1)*PG_ROW-.5} stroke="var(--b1)" strokeWidth=".6"/>)}
            {nowX>=0&&nowX<=totW&&<line x1={nowX} y1={0} x2={nowX} y2={totH} stroke="var(--today)" strokeWidth="1.5" strokeDasharray="4,3"/>}
            {rows.map(renderBar)}
          </svg>
        </div>
      </div>}
    </div>

    <div className="pg-split" onMouseDown={startSplit} title="Arrastrá para cambiar el alto del detalle"><span/></div>
    <div className="pg-det" style={{height:detH}}>
      <div className="pg-det-hdr">
        <span style={{fontWeight:700,fontSize:12}}>Detalle de tareas</span>
        <span style={{fontSize:11,color:'var(--c2)'}}>Clic en una fila para ubicarla en el Gantt</span>
        <button className="btn btn-g" style={{marginLeft:'auto'}} onClick={exportXls} disabled={!detRows.length}>↓ Excel</button>
        <button className="btn btn-g" onClick={()=>{const h=detH>60?36:240;setDetH(h);pgSave('bp360_pfgantt_det',h)}}>{detH>60?'▾ Minimizar':'▴ Mostrar'}</button>
      </div>
      <div className="pg-det-scroll" ref={detRef}>
        <table className="dt pg-dt">
          <thead><tr>{th('obra','Obra',170)}{th('name','Tarea')}{th('start','Fecha inicio',92)}{th('finish','Fecha fin',92)}{th('blS','Inicio LB',86)}{th('blF','Fin LB',86)}{th('dev','Desvío',70)}{th('pct','%',50)}{th('st','Estado',90)}</tr></thead>
          <tbody>{detRows.map(x=><tr key={x.key} data-k={x.key} className={hl===x.key?'hl':''} onClick={()=>focusRow(x.key,true)}>
            <td style={{whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:170}} title={x.o.name}>{x.o.cod&&<span className="cod">{x.o.cod}</span>}{x.o.name}</td>
            <td style={{fontWeight:500}}>{x.st==='ok'&&!/^[✓✔]/.test(x.t.name)&&<span style={{color:'var(--ok)'}}>✓ </span>}{x.t.name}</td>
            <td className="mono">{fD(x.t.start)}</td>
            <td className="mono" style={{color:x.st==='ov'?'var(--err)':undefined}}>{fD(x.t.finish)}</td>
            <td className="mono" style={{color:'var(--c2)'}}>{fD(x.blS)}</td>
            <td className="mono" style={{color:'var(--c2)'}}>{fD(x.blF)}</td>
            <td className="mono">{x.dev==null?'—':<span className={x.dev>2?'dev-pos':x.dev<-2?'dev-neg':'dev-zero'}>{x.dev>0?'+':''}{x.dev}d</span>}</td>
            <td className="mono">{x.t.percentComplete}%</td>
            <td style={{color:stC(x.st),fontSize:11,fontWeight:600}}>{stL(x.st)}</td>
          </tr>)}</tbody>
          {detRows.length>0&&<tfoot><tr>
            <td style={{fontWeight:700}}>Total</td>
            <td className="mono" style={{color:'var(--c1)'}}>{detTot.n} tareas · {detTot.done} terminadas · {detTot.n-detTot.done} faltan</td>
            <td className="mono" style={{fontWeight:700}}>{fD(detTot.s)}</td>
            <td className="mono" style={{fontWeight:700}}>{fD(detTot.f)}</td>
            <td colSpan={5}/>
          </tr></tfoot>}
        </table>
        {!detRows.length&&<div style={{padding:16,fontSize:12,color:'var(--c2)'}}>Sin tareas para mostrar con estos filtros.</div>}
      </div>
    </div>
    <Tooltip info={ttInfo} computoData={null}/>
  </div>;
}

/* ═══════ Salud de datos: qué encontró cada regla en cada cronograma ═══════
   Todo lo que el tablero deduce por nombre (contratada, obra, standby) o por campos (contratista, N° Item)
   queda a la vista, con la corrección concreta que hay que hacer en MS Project. */
function dataChecks(p,d,h){
  const ts=d.tasks.filter(t=>!t.isSummary&&!t.isMilestone);
  const n=ts.length||1;
  const sinNombre=d.tasks.filter(t=>t.name==='(sin nombre)');
  const sinCon=ts.filter(t=>!entV(t,'Contratista')&&t.percentComplete<100);
  const sinItem=ts.filter(t=>t.alc==='adic'&&!entV(t,'N° Item'));
  const issues=[];
  const add=(sev,txt,fix,tasks)=>issues.push({sev,txt,fix,tasks:tasks||[]});
  const sdAgo=daysAgo(d.statusDate);
  /* La falta de fecha de estado se informa una sola vez arriba; acá solo la que está vieja */
  if(sdAgo!==null&&sdAgo>14)add('m',`Fecha de estado de hace ${sdAgo} días`,'Actualizar el % completado y la fecha de estado.');
  if(!h?.contratadaName)add('a','Sin tarea "contratada"','Agregar una tarea cuyo nombre incluya "Contratada" con el fin del contrato. Sin ella no hay semáforo de plazo.');
  if(h?.color==='q')add('a','Desvío fuera de rango',h.motivo+'. Revisar que la tarea contratada y la tarea de obra sean las correctas.');
  if(h?.ovStale>0)add('m',`${h.ovStale} ${h.ovStale>1?'vencidas':'vencida'} sin actualizar`,'Cargar el % real de estas tareas o replanificarlas.',d.tasks.filter(t=>isStale(t,d.statusDate)));
  if(!d.hasBL)add('m','Sin línea base','Proyecto → Establecer línea base. Sin ella no hay Demoras ni curva S.');
  if(sinNombre.length)add('b',`${sinNombre.length} tarea${sinNombre.length>1?'s':''} sin nombre`,'Completar o borrar las filas vacías.',sinNombre);
  if(sinCon.length/n>.3)add('b',`${Math.round(sinCon.length*100/n)} % de tareas pendientes sin contratista`,'Cargar el campo Contratista: lo usan Semana, Próximas 3 semanas y Vencidas por responsable.',sinCon);
  if(d.hasAlcance&&sinItem.length/n>.3)add('b',`${sinItem.length} tareas de obra sin N° Item`,'Cargar Texto4: sin N° Item no se vinculan materiales y cuentan como adicionales.',sinItem);
  for(const a of p.avisos||[]){if(/línea base|sin nombre/i.test(a))continue;add('b','Aviso del deploy: '+a,'Revisar el XML en MS Project.')}
  return{issues,score:issues.reduce((s,i)=>s+(i.sev==='a'?3:i.sev==='m'?2:1),0)};
}
function DataHealthView({projList,projData,metaList,healthMap,onOpenObra}){
  const[scope,setScope]=useState('activas');
  const[openK,setOpenK]=useState(null);
  const rows=useMemo(()=>(projList||[]).filter(p=>!p.local&&projData[p.key]&&(scope==='todas'||pgIsActive(matchMeta(p.name,metaList)?.estado)))
    .map(p=>{const d=projData[p.key],h=healthMap[p.key];return{p,d,h,...dataChecks(p,d,h)}})
    .sort((a,b)=>b.score-a.score||a.p.name.localeCompare(b.p.name)),[projList,projData,metaList,healthMap,scope]);
  const ok=rows.filter(r=>!r.issues.length).length;
  const noSd=rows.filter(r=>!r.d.statusDate).length;
  const SEVL={a:'Bloquea el semáforo',m:'Distorsiona los números',b:'Para completar'};
  return <div className="dash">
    <div className="rv-ctrl">
      <div className="dst" style={{margin:0}}>Salud de datos</div>
      <span style={{fontSize:12,color:'var(--c1)'}}>Qué encontró el tablero en cada cronograma y qué corregir en MS Project</span>
      <div className="seg" style={{marginLeft:'auto'}}><button className={scope==='activas'?'on':''} onClick={()=>setScope('activas')}>Obras activas</button><button className={scope==='todas'?'on':''} onClick={()=>setScope('todas')}>Todas</button></div>
    </div>
    <div className="dh-sum"><span><b>{rows.length-ok}</b> obras con algo para corregir</span><span><b>{ok}</b> sin observaciones</span></div>
    {noSd>0&&<div className="la-alert" style={{borderLeftColor:'var(--q)',background:'var(--q-bg)'}}><b>{noSd} de {rows.length} obras no tienen fecha de estado.</b> Cargala en MS Project (Proyecto → Información del proyecto → Fecha de estado) cada vez que actualizás el avance. Sin ella, "sin actualizar" se estima solo con las tareas en 0 % vencidas hace más de {STALE_DAYS} días.</div>}
    <div className="dh-list">
      {rows.map(r=>{

/* ═══════ Próximas 3 semanas (lookahead) ═══════
   Agenda de contratistas cruzada entre obras y lo que tiene que estar resuelto para que cada tarea pueda arrancar. */
const LA_WEEKS=3;
function isCtrlTask(t){return /contratad[ao]/i.test(t.name)||/^[\s✔✓\-]*obra\b/i.test(t.name)||/stand[\s\-]?by/i.test(t.name)}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function LookaheadView({projList,projData,metaList,onOpenObra,onLinkCon}){
  const[onlyClash,setOnlyClash]=useState(false);
  const[q,setQ]=useState('');
  const weeks=useMemo(()=>{const m=mondayOf(new Date());return Array.from({length:LA_WEEKS},(_,i)=>{const a=new Date(m);a.setDate(a.getDate()+7*i);const b=new Date(a);b.setDate(b.getDate()+4);b.setHours(23,59,59,999);return{a,b}})},[]);
  const model=useMemo(()=>{
    const from=weeks[0].a,to=weeks[LA_WEEKS-1].b,now=new Date();
    const cons={},starts=[];
    for(const p of projList||[]){
      const d=projData[p.key];if(!d||p.local)continue;
      if(!pgIsActive(matchMeta(p.name,metaList)?.estado))continue;
      for(const t of d.tasks){
        if(t.isSummary||t.isMilestone||isCtrlTask(t)||t.percentComplete>=100||!t.start||!t.finish)continue;
        if(t.start>to||t.finish<from)continue;
        const c=entV(t,'Contratista')||'Sin contratista';
        const C=cons[c]=cons[c]||{name:c,w:weeks.map(()=>({}))};
        weeks.forEach((w,i)=>{if(t.start<=w.b&&t.finish>=w.a){(C.w[i][p.key]=C.w[i][p.key]||{p,n:0}).n++}});
        if(t.start>=from&&t.start<=to&&t.percentComplete===0){
          const r=[];
          const preds=t.predecessors.map(x=>d.uidMap[x.taskUid]).filter(x=>x&&!x.isSummary);
          const open=preds.filter(x=>x.percentComplete<100);
          if(open.length)r.push({k:'pred',l:`${open.length} predecesora${open.length>1?'s':''} sin terminar`,tip:open.map(x=>`${x.name} (${x.percentComplete} %, fin ${fD(x.finish)})`).join('\n')});
          if(c==='Sin contratista')r.push({k:'con',l:'Sin contratista'});
          if(t.start<now)r.push({k:'late',l:'Debió arrancar'});
          starts.push({p,t,c,r});
        }
      }
    }
    const list=Object.values(cons).map(C=>({...C,clash:C.w.map(x=>Object.keys(x).length>1)})).sort((a,b)=>a.name==='Sin contratista'?1:b.name==='Sin contratista'?-1:(b.clash.filter(Boolean).length-a.clash.filter(Boolean).length)||a.name.localeCompare(b.name));
    starts.sort((a,b)=>a.t.start-b.t.start);
    return{list,starts};
  },[projList,projData,metaList,weeks]);
  const nq=normName(q);
  const list=model.list.filter(C=>(!onlyClash||C.clash.some(Boolean))&&(!nq||normName(C.name).includes(nq)));
  const starts=model.starts.filter(x=>!nq||normName(x.c).includes(nq)||normName(x.p.name).includes(nq));
  const nClash=model.list.filter(C=>C.name!=='Sin contratista'&&C.clash.some(Boolean)).length;
  const wl=w=>`${w.a.getDate()}/${w.a.getMonth()+1} – ${w.b.getDate()}/${w.b.getMonth()+1}`;
  return <div className="dash">
    <div className="rv-ctrl">
      <div className="dst" style={{margin:0}}>Próximas 3 semanas</div>
      <span style={{fontSize:12,color:'var(--c1)'}}>Dónde está cada contratista y qué tiene que estar listo para arrancar</span>
      <input className="fin" style={{width:200,marginLeft:'auto'}} placeholder="Buscar contratista u obra…" value={q} onChange={e=>setQ(e.target.value)}/>
      <label className="pg-chk"><input type="checkbox" checked={onlyClash} onChange={e=>setOnlyClash(e.target.checked)}/> Solo en dos obras a la vez</label>
    </div>
    {nClash>0&&<div className="la-alert">{nClash} contratista{nClash>1?'s están':' está'} programado{nClash>1?'s':''} en más de una obra la misma semana.</div>}
    <div className="rv-mx-wrap">
      <table className="dt la-mx">
        <thead><tr><th>Contratista</th>{weeks.map((w,i)=><th key={i}>{i===0?'Esta semana':i===1?'Próxima':'En 2 semanas'}<div className="mono" style={{fontWeight:400}}>{wl(w)}</div></th>)}</tr></thead>
        <tbody>{list.map(C=><tr key={C.name}>
          <td style={{fontWeight:700}}>{C.name}{C.name!=='Sin contratista'&&onLinkCon&&<button className="fclr la-link" onClick={()=>onLinkCon(C.name)} title={'Crear y copiar un link con la agenda de '+C.name+' (sin montos)'}>Link</button>}</td>
          {C.w.map((cell,i)=><td key={i} className={C.clash[i]&&C.name!=='Sin contratista'?'la-clash':''}>
            {Object.values(cell).map(({p,n})=><button key={p.key} className="la-chip" onClick={()=>onOpenObra&&onOpenObra(p)} title={`${p.name}: ${n} tarea${n>1?'s':''}`}>{p.cod?<b className="cod">{p.cod}</b>:null}{p.cod?n:p.name+' · '+n}</button>)}
          </td>)}
        </tr>)}
        {!list.length&&<tr><td colSpan={LA_WEEKS+1} style={{color:'var(--c2)',textAlign:'center',padding:20}}>Nada programado en las próximas 3 semanas.</td></tr>}
        </tbody>
      </table>
    </div>
    <div className="dst" style={{marginTop:22}}>Tareas que arrancan · {starts.length}</div>
    <div className="rv-mx-wrap"><table className="dt" style={{margin:0}}>
      <thead><tr><th style={{width:80}}>Inicio</th><th style={{width:70}}>Obra</th><th>Tarea</th><th style={{width:170}}>Contratista</th><th style={{width:250}}>Para poder arrancar</th></tr></thead>
      <tbody>{starts.map(({p,t,c,r})=><tr key={p.key+t.uid}>
        <td className="mono">{fD(t.start)}</td>
        <td>{p.cod?<span className="cod">{p.cod}</span>:<span style={{fontSize:11}}>{p.name}</span>}</td>
        <td style={{fontWeight:500}}>{t.name}<div style={{fontSize:11,color:'var(--c2)'}}>{taskPath(t)}</div></td>
        <td style={{fontSize:12}}>{c}</td>
        <td>{r.length?r.map(x=><span key={x.k} className={'la-r '+x.k} title={x.tip||''}>{x.l}</span>):<span className="la-r ok">Sin restricciones en el cronograma</span>}</td>
      </tr>)}</tbody>
    </table></div>
    <p style={{fontSize:12,color:'var(--c2)',marginTop:8}}>Se revisan predecesoras y contratista según MS Project. Material, planos y pagos todavía no están conectados a esta vista.</p>
  </div>;
}

/* ═══════ Trend history (localStorage) ═══════ */
const TREND_KEY='bp360_trend_v2'; /* v2: avance ponderado por duración (v1 era promedio simple) */
function loadTrend(){try{const d=localStorage.getItem(TREND_KEY);return d?JSON.parse(d):{}}catch(e){return{}}}
function saveTrend(data){try{localStorage.setItem(TREND_KEY,JSON.stringify(data))}catch(e){}}
function getWeekKey(d){const dt=d||new Date();const y=dt.getFullYear();const jan1=new Date(y,0,1);const days=Math.floor((dt-jan1)/86400000);const w=Math.ceil((days+jan1.getDay()+1)/7);return `${y}-W${String(w).padStart(2,'0')}`}
function recordSnapshot(healthMap){
  const wk=getWeekKey();const trend=loadTrend();
  if(!trend[wk])trend[wk]={};
  for(const[k,h] of Object.entries(healthMap)){
    if(!h)continue;
    trend[wk][k]={avg:h.avg,ov:h.ovReal??h.ov,done:h.done,tot:h.tot,ts:Date.now()};
  }
  /* Keep only last 12 weeks */
  const keys=Object.keys(trend).sort();
  while(keys.length>12){delete trend[keys.shift()]}
  saveTrend(trend);
  return trend;
}
function getTrendForProject(trend,projKey){
  const weeks=Object.keys(trend).sort();
  return weeks.map(w=>({week:w,...(trend[w][projKey]||{})})).filter(d=>d.avg!==undefined);
}

/* ═══════ Sparkline SVG ═══════ */
function Sparkline({data,field='avg',w=60,h=16,color='var(--ac)'}){
  if(!data||data.length<2)return null;
  const vals=data.map(d=>d[field]||0);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const range=mx-mn||1;
  const pts=vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w;
    const y=h-((v-mn)/range)*(h-2)-1;
    return `${x},${y}`;
  }).join(' ');
  const last=vals[vals.length-1],prev=vals[vals.length-2];
  const delta=last-prev;
  return <span className="trend-row">
    <svg className="sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={w} cy={h-((last-mn)/range)*(h-2)-1} r="2" fill={color}/>
    </svg>
    {delta!==0&&<span className={`trend-delta ${delta>0?'up':'down'}`}>{delta>0?'▲':'▼'}{Math.abs(delta)}</span>}
    {delta===0&&<span className="trend-delta flat">—</span>}
  </span>;
}

/* ═══════ Health calculation ═══════ */
/* Estados del semáforo: una sola palabra por estado en todas las pantallas */
const SEMA_LBL={r:'Crítico',y:'Atención',q:'Revisar datos',x:'Sin fecha contratada',g:'En tiempo'};
const SEMA_ICO={r:'✕',y:'⚠',q:'?',x:'—',g:'✓'};
const SEMA_COL={g:'var(--ok)',y:'var(--warn)',r:'var(--err)',q:'var(--q)',x:'var(--c2)'};
const SEV={r:0,y:1,q:2,x:3,g:4};
const DESVIO_MAX=180;
function calcHealth(data){
  if(!data||!data.tasks)return null;
  const ts=data.tasks.filter(t=>!t.isSummary);
  if(!ts.length)return{color:'x',label:'Sin tareas',motivo:'El cronograma no tiene tareas',rank:SEV.x,tot:0,done:0,ov:0,ovReal:0,ovStale:0,avg:0,ip:0};
  const tot=ts.length;
  const done=ts.filter(t=>t.percentComplete>=100).length;
  const ov=ts.filter(t=>isOv(t)).length;
  const ip=ts.filter(t=>t.percentComplete>0&&t.percentComplete<100).length;
  const avg=wAvg(ts);
  const now=new Date();
  const statusDate=data.statusDate||null;
  const ovStale=ts.filter(t=>isStale(t,statusDate)).length;
  const ovReal=ov-ovStale;

  /* ═══ Semáforo por fecha contratada vs cronograma ═══ */
  /* 1. Find "contratada" task — the committed deadline */
  const allTasks=data.tasks;
  const contratadaTask=allTasks.find(t=>/contratad[ao]/i.test(t.name));
  const finContratado=contratadaTask?.finish||null;

  /* 2. Find main obra task — the real construction schedule to compare against */
  let obraTask=null;
  if(contratadaTask){
    const cLevel=contratadaTask.outlineLevel;
    /* Strategy A: siblings at the same outline level (excluding contratada and milestones with 0 children) */
    const siblings=allTasks.filter(t=>
      t.outlineLevel===cLevel&&t.finish&&t!==contratadaTask&&
      !/contratad[ao]/i.test(t.name));
    /* Prefer summaries (have children) sorted by most children */
    const sibSummaries=siblings.filter(t=>t.isSummary&&t.children&&t.children.length>0);
    if(sibSummaries.length){
      sibSummaries.sort((a,b)=>(b.children?b.children.length:0)-(a.children?a.children.length:0));
      obraTask=sibSummaries[0];
    }
    /* Strategy B: if no sibling summary, use parent of contratada (the root that contains everything) */
    if(!obraTask&&contratadaTask.parent){
      /* Parent's children that are summaries, excluding contratada */
      const parentKids=(contratadaTask.parent.children||[]).filter(t=>
        t.isSummary&&t.children&&t.children.length>0&&t!==contratadaTask&&!/contratad[ao]/i.test(t.name));
      if(parentKids.length){
        parentKids.sort((a,b)=>(b.children?b.children.length:0)-(a.children?a.children.length:0));
        obraTask=parentKids[0];
      }
    }
    /* Strategy C: if still nothing, pick the sibling with the latest finish */
    if(!obraTask&&siblings.length){
      obraTask=siblings.sort((a,b)=>b.finish-a.finish)[0];
    }
  }
  const finObra=obraTask?.finish||ts.reduce((mx,t)=>t.finish&&t.finish>mx?t.finish:mx,new Date(0));

  /* 3. Standby detection — tasks with "standby" / "stand by" / "stand-by" */
  const standbyTasks=allTasks.filter(t=>/stand[\s\-]?by/i.test(t.name)&&!t.isSummary);
  const standbyDays=standbyTasks.reduce((s,t)=>{
    if(t.start&&t.finish){return s+Math.max(0,Math.round((t.finish-t.start)/86400000))}
    return s;
  },0);
  const standbyDetail=standbyTasks.map(t=>({
    name:t.name,
    start:t.start,finish:t.finish,
    days:t.start&&t.finish?Math.max(0,Math.round((t.finish-t.start)/86400000)):0
  }));

  /* 4. Calculate deviation */
  /* Semáforo de dos ejes: plazo (fin de obra vs contratado, neto de standby) y vencidas reales.
     Gana el peor de los dos. Un desvío mayor a ±180 días casi siempre es una fecha mal cargada. */
  let desvioBruto=null,desvioNeto=null,color='x',label='Sin fecha contratada',motivo='No hay una tarea "contratada" en el cronograma';
  const ovPct=tot?Math.round(ovReal*100/tot):0;
  const vColor=ovPct>=25?'r':ovPct>=10?'y':'g';
  if(finContratado){
    desvioBruto=Math.round((finObra-finContratado)/86400000);
    desvioNeto=desvioBruto-standbyDays;
    if(Math.abs(desvioBruto)>DESVIO_MAX){
      color='q';label='Revisar datos';
      motivo=`Desvío de ${desvioBruto>0?'+':''}${desvioBruto} días: revisar la fecha contratada o la tarea de obra`;
    }else{
      const d=standbyDays>0?desvioNeto:desvioBruto;
      const pColor=d<=0?'g':d<=15?'y':'r';
      color=SEV[pColor]<=SEV[vColor]?pColor:vColor;
      label=SEMA_LBL[color];
      const mp=d>0?`fin ${d} días después de lo contratado${standbyDays>0?' (neto de standby)':''}`:'fin dentro del plazo contratado';
      const mv=ovReal?`${ovPct} % de las tareas vencidas`:'sin tareas vencidas';
      motivo=color===vColor&&vColor!==pColor?`${mv}; ${mp}`:`${mp}; ${mv}`;
    }
  }

  /* Next milestone */
  const nextMs=ts.filter(t=>t.isMilestone&&t.finish&&t.finish>=now&&t.percentComplete<100).sort((a,b)=>a.finish-b.finish)[0];

  return{color,label,motivo,rank:SEV[color],tot,done,ov,ovReal,ovStale,ip,avg,nextMs:nextMs||null,statusDate,
    contratadaName:contratadaTask?.name||null,obraName:obraTask?.name||null,
    finContratado,finObra,desvioBruto,desvioNeto,
    standbyDays,standbyDetail,hasContratada:!!finContratado};
}

/* ═══════ Weekly View ═══════ */
function WeekView({data}){
  if(!data)return null;
  const[offset,setOffset]=useState(0);
  const now=new Date();
  const weekStart=useMemo(()=>{
    /* Lunes de la semana actual (el domingo cuenta como fin de la semana que termina, no como inicio de la próxima) */
    const d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);d.setHours(0,0,0,0);return d;
  },[offset]);
  const weekEnd=useMemo(()=>{
    const d=new Date(weekStart);d.setDate(d.getDate()+4);d.setHours(23,59,59);return d;
  },[weekStart]);

  const weekLabel=useMemo(()=>{
    const opts={day:'numeric',month:'short'};
    return `${weekStart.toLocaleDateString('es-AR',opts)} — ${weekEnd.toLocaleDateString('es-AR',opts)}`;
  },[weekStart,weekEnd]);

  const tasks=useMemo(()=>{
    return data.tasks.filter(t=>!t.isSummary&&t.start&&t.finish&&t.start<=weekEnd&&t.finish>=weekStart);
  },[data.tasks,weekStart,weekEnd]);

  const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  const dayDates=useMemo(()=>days.map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d}),[weekStart]);
  const todayIdx=dayDates.findIndex(d=>d.toDateString()===now.toDateString());
  /* Quién está en obra esta semana: agrupado por contratista; cada tarea marca los días hábiles en que está activa.
     Se excluyen las barras de control del semáforo (… Contratada, Obra …) y los standby. */
  const groups=useMemo(()=>{
    const m={};
    for(const t of tasks){
      if(/contratad[ao]/i.test(t.name)||/^[\s✔✓\-]*obra\b/i.test(t.name)||/stand[\s\-]?by/i.test(t.name))continue;
      const c=entV(t,'Contratista')||'Sin contratista';
      const on=dayDates.map(d0=>{const d1=new Date(d0);d1.setHours(23,59,59,999);return t.start<=d1&&t.finish>=d0});
      (m[c]=m[c]||[]).push({t,on});
    }
    return Object.entries(m).sort((a,b)=>a[0]==='Sin contratista'?1:b[0]==='Sin contratista'?-1:a[0].localeCompare(b[0]))
      .map(([c,rows])=>[c,rows.sort((a,b)=>(a.t.start-b.t.start)||(a.t.finish-b.t.finish))]);
  },[tasks,dayDates]);
  const nTasks=groups.reduce((s,[,r])=>s+r.length,0);
  const nCon=groups.filter(([c])=>c!=='Sin contratista').length;

  const isThisWeek=offset===0;

  return <div className="week-view">
    <div className="week-nav">
      <button onClick={()=>setOffset(o=>o-1)}>← Anterior</button>
      <h3>{weekLabel}{isThisWeek&&<span style={{fontSize:12,color:'var(--ac)',marginLeft:8}}>esta semana</span>}</h3>
      <button onClick={()=>setOffset(o=>o+1)}>Siguiente →</button>
      {offset!==0&&<button onClick={()=>setOffset(0)} style={{color:'var(--ac)',borderColor:'var(--ac)'}}>Hoy</button>}
    </div>
    <div style={{fontSize:13,color:'var(--c1)',marginBottom:16}}>{nTasks} tareas{nCon>0?` · ${nCon} contratista${nCon>1?'s':''} en obra`:' · ninguna tarea tiene contratista cargado'}</div>

    {nTasks===0&&<div className="week-empty">No hay tareas programadas para esta semana.</div>}

    {groups.map(([con,rows])=><div key={con} className="week-day">
      <div className="week-day-hdr wk-hdr"><span className="wk-con">{con}</span><span className="wk-days" aria-hidden="true">{days.map((d,i)=><span key={i} className={i===todayIdx?'today':''}>{d[0]}</span>)}</span></div>
      {rows.map(({t,on})=>{
        const s=gSt(t);
        return <div key={t.uid} className={`week-task ${s==='ov'?'ov':''}`}>
          <span className="wt-dot" style={{background:stC(s)}} title={stL(s)}/>
          <span className="wt-name" title={t.name}>{t.isMilestone&&<span style={{color:'var(--bar-ms)',marginRight:4}}>♦</span>}{t.name}</span>
          <span className="wt-meta wt-dates">{fD(t.start)} → {fD(t.finish)}</span>
          <span className="wk-days" aria-label={'Activa: '+days.filter((_,i)=>on[i]).join(', ')}>{on.map((x,i)=><i key={i} className={(x?'on':'')+(i===todayIdx?' today':'')}/>)}</span>
          <span className="wt-meta" style={{width:38,textAlign:'right'}}>{t.percentComplete}%</span>
        </div>;
      })}
    </div>)}
  </div>;
}

async function getComputoSb(){
