/* ═══════ Materials View (full tab) ═══════ */
function MaterialsView({data,computoData,visTasks}){
  const[viewMode,setViewMode]=useState('gantt');/*gantt|list|period*/
  const[periodMode,setPeriodMode]=useState('month');/*week|month*/
  const[selTask,setSelTask]=useState(null);
  const[fRubro,setFRubro]=useState('all');
  const[fMat,setFMat]=useState('');

  if(!computoData||!computoData.loaded)return <div className="mat-empty">
    <div style={{fontSize:16,marginBottom:8}}>⚠️ No se pudo conectar con Cómputo de Obras</div>
    <div>{computoData?.error||'Verificá la conexión a internet e intentá de nuevo.'}</div>
  </div>;

  /* Build consolidated materials list from all tasks */
  const allMaterials=useMemo(()=>{
    const matMap={};
    const taskMats=[];
    for(const t of(visTasks||data.tasks)){
      const nItem=entV(t,'N° Item');
      if(!nItem)continue;
      const info=getTaskMaterials(computoData,nItem);
      if(!info||!info.items.length)continue;
      taskMats.push({task:t,info});
      for(const m of info.items){
        const key=m.matRef;
        if(!matMap[key])matMap[key]={matRef:m.matRef,un:m.un,unComercial:m.unComercial||m.un,cat:m.materialInfo?.cat||'',precio:m.materialInfo?.precio||0,totalNeeded:0,tasks:[],byPeriod:{}};
        matMap[key].totalNeeded+=parseFloat(m.cantidadNecesaria)||0;
        matMap[key].tasks.push({task:t,qty:parseFloat(m.cantidadNecesaria)||0});
        /* Group by period */
        if(t.start){
          const pk=periodMode==='week'
            ?`${t.start.getFullYear()}-S${String(Math.ceil((t.start.getDate()+new Date(t.start.getFullYear(),t.start.getMonth(),1).getDay())/7)).padStart(2,'0')}-${String(t.start.getMonth()+1).padStart(2,'0')}`
            :`${t.start.getFullYear()}-${String(t.start.getMonth()+1).padStart(2,'0')}`;
          if(!matMap[key].byPeriod[pk])matMap[key].byPeriod[pk]=0;
          matMap[key].byPeriod[pk]+=parseFloat(m.cantidadNecesaria)||0;
        }
      }
    }
    return{matMap,taskMats,list:Object.values(matMap).sort((a,b)=>b.totalNeeded-a.totalNeeded)};
  },[visTasks,data.tasks,computoData,periodMode]);

  /* Get unique rubros from coefs */
  const rubros=useMemo(()=>{
    const s=new Set();
    for(const c of computoData.coefs)if(c.rubro)s.add(c.rubro);
    return[...s].sort();
  },[computoData.coefs]);

  /* Get all periods sorted */
  const periods=useMemo(()=>{
    const s=new Set();
    for(const m of allMaterials.list)for(const pk of Object.keys(m.byPeriod))s.add(pk);
    return[...s].sort();
  },[allMaterials.list]);

  /* Filtered list */
  const filtered=useMemo(()=>{
    let list=allMaterials.list;
    if(fRubro!=='all')list=list.filter(m=>m.cat===fRubro);
    if(fMat)list=list.filter(m=>m.matRef.toLowerCase().includes(fMat.toLowerCase()));
    return list;
  },[allMaterials.list,fRubro,fMat]);

  /* KPIs */
  const kpis=useMemo(()=>{
    const linked=allMaterials.taskMats.length;
    const total=(visTasks||data.tasks).filter(t=>!t.isSummary).length;
    return{linked,total,materials:allMaterials.list.length,pct:total?Math.round(linked/total*100):0};
  },[allMaterials,visTasks,data.tasks]);

  /* Export to Excel */
  const exportXls=useCallback(()=>{
    const rows=filtered.map(m=>({'Material':m.matRef,'Cantidad':Math.round(m.totalNeeded*100)/100,'Unidad':m.un,'Unidad Comercial':m.unComercial,'Categoría':m.cat,'Precio unitario':m.precio,'Subtotal':Math.round(m.totalNeeded*m.precio),'Tareas vinculadas':m.tasks.length}));
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Materiales');
    XLSX.writeFile(wb,`Materiales_${data.tasks[0]?.name||'obra'}_${new Date().toISOString().slice(0,10)}.xlsx`);
  },[filtered,data]);

  /* Format period label */
  const fPeriod=pk=>{
    if(periodMode==='week'){const[y,sw,mo]=pk.split('-');const mn=new Date(parseInt(y),parseInt(mo)-1).toLocaleDateString('es-AR',{month:'short'});return`${mn} ${sw}`}
    const[y,mo]=pk.split('-');return new Date(parseInt(y),parseInt(mo)-1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  };

  return <div>
    {/* KPIs */}
    <div className="mat-kpi">
      <div className="mat-kpi-card"><div className="label">Tareas vinculadas</div><div className="value">{kpis.linked}<span style={{fontSize:13,color:'var(--c1)'}}>/{kpis.total}</span></div><div className="sub">{kpis.pct}% con materiales</div></div>
      <div className="mat-kpi-card"><div className="label">Materiales distintos</div><div className="value">{kpis.materials}</div></div>
      <div className="mat-kpi-card"><div className="label">Obra en cómputo</div><div className="value" style={{fontSize:14}}>{computoData.obra?computoData.obra.nombre:'No vinculada'}</div><div className="sub">{computoData.obra?<span className="mat-status linked">Vinculada</span>:<span className="mat-status no-link">Sin mediciones</span>}</div></div>
    </div>

    {/* Controls */}
    <div className="mat-controls">
      <div className="seg">
        <button className={viewMode==='list'?'on':''} onClick={()=>setViewMode('list')}>Lista</button>
        <button className={viewMode==='period'?'on':''} onClick={()=>setViewMode('period')}>Por período</button>
      </div>
      {viewMode==='period'&&<div className="seg">
        <button className={periodMode==='week'?'on':''} onClick={()=>setPeriodMode('week')}>Semana</button>
        <button className={periodMode==='month'?'on':''} onClick={()=>setPeriodMode('month')}>Mes</button>
      </div>}
      <span className="fl">Rubro</span>
      <select className="fsel" value={fRubro} onChange={e=>setFRubro(e.target.value)}>
        <option value="all">Todos</option>
        {rubros.map(r=><option key={r} value={r}>{r}</option>)}
      </select>
      <input type="text" className="fin" placeholder="Buscar material..." value={fMat} onChange={e=>setFMat(e.target.value)} style={{width:160}}/>
      <button className="btn btn-g" onClick={exportXls} style={{marginLeft:'auto'}}>↓ Excel</button>
    </div>

    {/* List view */}
    {viewMode==='list'&&<div className="mat-panel">
      <div className="mat-scroll">
        <table className="mat-table">
          <thead><tr><th>Material</th><th>Cantidad</th><th>Unidad</th><th>U. Comercial</th><th>Categoría</th><th>Precio</th><th>Subtotal</th><th>Tareas</th></tr></thead>
          <tbody>{filtered.map(m=><tr key={m.matRef}>
            <td style={{fontWeight:500,maxWidth:250,overflow:'hidden',textOverflow:'ellipsis'}}>{m.matRef}</td>
            <td className="mono">{Math.round(m.totalNeeded*100)/100}</td>
            <td>{m.un}</td>
            <td>{m.unComercial}</td>
            <td style={{fontSize:11,color:'var(--c1)'}}>{m.cat||'—'}</td>
            <td className="mono">{m.precio?`$${m.precio.toLocaleString('es-AR')}`:' —'}</td>
            <td className="mono" style={{fontWeight:600}}>{m.precio?`$${Math.round(m.totalNeeded*m.precio).toLocaleString('es-AR')}`:' —'}</td>
            <td className="mono">{m.tasks.length}</td>
          </tr>)}</tbody>
        </table>
      </div>
      {filtered.length===0&&<div className="mat-empty">No se encontraron materiales con los filtros actuales.</div>}
    </div>}

    {/* Period view */}
    {viewMode==='period'&&<div className="mat-panel">
      {periods.length===0&&<div className="mat-empty">No hay materiales con fecha de inicio para agrupar por período.</div>}
      {periods.map(pk=>{
        const periodMats=filtered.filter(m=>m.byPeriod[pk]>0).map(m=>({...m,periodQty:m.byPeriod[pk]})).sort((a,b)=>b.periodQty-a.periodQty);
        if(!periodMats.length)return null;
        return <div key={pk}>
          <div style={{padding:'10px 16px',background:'var(--bg-0)',borderBottom:'1px solid var(--b1)',fontWeight:600,fontSize:13,display:'flex',justifyContent:'space-between'}}>
            <span>{fPeriod(pk)}</span>
            <span style={{fontSize:11,color:'var(--c1)',fontWeight:400}}>{periodMats.length} materiales</span>
          </div>
          <table className="mat-table">
            <thead><tr><th>Material</th><th>Cantidad</th><th>Unidad</th><th>Categoría</th><th>Subtotal</th></tr></thead>
            <tbody>{periodMats.map(m=><tr key={m.matRef}>
              <td style={{fontWeight:500}}>{m.matRef}</td>
              <td className="mono">{Math.round(m.periodQty*100)/100}</td>
              <td>{m.un}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{m.cat||'—'}</td>
              <td className="mono" style={{fontWeight:600}}>{m.precio?`$${Math.round(m.periodQty*m.precio).toLocaleString('es-AR')}`:' —'}</td>
            </tr>)}</tbody>
          </table>
        </div>;
      })}
    </div>}
  </div>;
}

/* ═══════ MAIN APP ═══════ */
function App(){
  const[th,togTh]=useTheme();
  const[pList,setPList]=useState(null);
  const[pData,setPData]=useState({});
  const[loading,setLoading]=useState({});
  const[errors,setErrors]=useState({});
  const[openTabs,setOpen]=useState([]);
  const[active,setActive]=useState(null);
  const[sub,setSub]=useState('gantt');
  const[zoom,setZoom]=useState('week');
  const[showSrch,setShowSrch]=useState(false);
  const[showArr,setShowArr]=useState(true);
  const[showBL,setShowBL]=useState(true);
  const[ttInfo,setTTInfo]=useState(null);
  const[tblW,setTblW]=useState(680);
  const[splOn,setSplOn]=useState(false);
  const[fSt,setFSt]=useState('all');
  const[fRes,setFRes]=useState('all');
  const[fCon,setFCon]=useState('all');
  const[fRub,setFRub]=useState('all');
  const[fTab,setFTab]=useState('all');
  const[fNiv,setFNiv]=useState('all');
  const[fWbs,setFWbs]=useState(99);
  const[fDf,setFDf]=useState('');
  const[fDt,setFDt]=useState('');
  const[expMap,setExpMap]=useState({});
  const[dragO,setDragO]=useState(false);
  const[metaList,setMetaList]=useState([]);
  const[mapCity,setMapCity]=useState(null);
  const[healthMap,setHealthMap]=useState({});
  const[autoLoading,setAutoLoading]=useState({});
  const[trendData,setTrendData]=useState(()=>loadTrend());
  const[showTour,setShowTour]=useState(()=>{try{return!localStorage.getItem(TOUR_KEY)}catch(e){return false}});
  const[showFinished,setShowFinished]=useState(false);
  const clientProj=useMemo(()=>{const p=new URLSearchParams(window.location.search);return p.get('proyecto')||p.get('project')||null},[]);

  const[computoData,setComputoData]=useState({});

  const scrollRef=useRef({v:0,src:null});
  const tblRef=useRef(null);
  const tblScrolling=useRef(false);

  /* Load computo data when a project is active */
  useEffect(()=>{
    if(!active||!pData[active])return;
    const d=pData[active];if(!d||!d.tasks)return;
    /* Try to find project code from metadata or N° Item pattern */
    const meta=matchMeta(d.tasks[0]?.name||'',metaList);
    /* Try multiple code sources: meta archivoXML, or first task with N° Item */
    let code=null;
    /* Check if the project Excel metadata has a code-like field */
    if(meta&&meta.proyecto){
      /* Try to derive code from project name - check if obras has matching name */
      code=meta.proyecto;
    }
    /* Also try to match by project name directly */
    const projName=(pList||[]).find(p=>p.key===active)?.name||'';
    fetchComputoForProject(code).then(r=>{
      if(r)setComputoData(prev=>({...prev,[active]:r}));
      /* If code didn't work, try matching by name */
      if((!r||!r.obra)&&projName){
        const sb=getComputoSb();
        sb.from('obras').select('*').then(({data:allObras})=>{
          if(!allObras)return;
          const norm=normalizeForMatch(projName);
          const match=allObras.find(o=>normalizeForMatch(o.nombre).includes(norm)||norm.includes(normalizeForMatch(o.nombre)));
          if(match&&match.cod){
            fetchComputoForProject(match.cod).then(r2=>{
              if(r2)setComputoData(prev=>({...prev,[active]:r2}));
            });
          }
        });
      }
    });
  },[active,pData,metaList,pList]);

  /* Load manifest + project metadata */
  useEffect(()=>{
    fetch('data/manifest.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
      const list=(d.projects||d||[]).map((p,i)=>{const rawName=p.name||(typeof p.file==='string'?p.file.replace('.xml',''):null)||`Proyecto ${i+1}`;return{key:'srv_'+(p.file||p.name||i),name:rawName.replace(/\.xml$/i,''),file:typeof p==='string'?p:p.file,size:p.size||null,modified:p.modified||null}});
      setPList(list);
    }).catch(()=>setPList([]));
    loadProjectMeta().then(m=>setMetaList(m));
  },[]);

  useEffect(()=>{const h=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setShowSrch(s=>!s)}};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);

  /* Auto-load all project XMLs in background for health indicators */
  useEffect(()=>{
    if(!pList||!pList.length)return;
    const serverProjs=pList.filter(p=>!p.local&&p.file);
    let cancelled=false;
    (async()=>{
      for(const proj of serverProjs){
        if(cancelled)break;
        const k=proj.key;
        if(pData[k])continue; /* already loaded */
        setAutoLoading(p=>({...p,[k]:true}));
        try{
          const r=await fetch(`data/projects/${proj.file}?t=${Date.now()}`);
          if(!r.ok)continue;
          const txt=await r.text();
          const d=parseMSPDI(txt);
          if(cancelled)break;
          setPData(p=>({...p,[k]:d}));
          const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});
          setExpMap(p=>({...p,[k]:em}));
          const h=calcHealth(d);
          setHealthMap(p=>({...p,[k]:h}));
        }catch(e){/* skip failed loads */}
        finally{setAutoLoading(p=>{const n={...p};delete n[k];return n})}
      }
    })();
    return()=>{cancelled=true};
  },[pList]);

  /* Recalculate health when project data changes + record trend */
  useEffect(()=>{
    const newH={};
    for(const[k,d] of Object.entries(pData)){
      newH[k]=calcHealth(d);
    }
    setHealthMap(newH);
    if(Object.keys(newH).length>0){
      const updated=recordSnapshot(newH);
      setTrendData(updated);
    }
  },[pData]);

  const resetF=useCallback(()=>{setFSt('all');setFRes('all');setFCon('all');setFRub('all');setFTab('all');setFNiv('all');setFWbs(99);setFDf('');setFDt('')},[]);

  const openProj=useCallback(async(proj)=>{
    const k=proj.key;
    if(openTabs.includes(k)){setActive(k);return}
    if(!pData[k]&&!loading[k]){
      setLoading(p=>({...p,[k]:true}));
      setErrors(p=>{const n={...p};delete n[k];return n});
      try{
        const r=await fetch(`data/projects/${proj.file}?t=${Date.now()}`);
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const txt=await r.text();
        const d=parseMSPDI(txt);
        setPData(p=>({...p,[k]:d}));
        const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});
        setExpMap(p=>({...p,[k]:em}));
      }catch(e){setErrors(p=>({...p,[k]:e.message}))}
      finally{setLoading(p=>{const n={...p};delete n[k];return n})}
    }
    setOpen(p=>p.includes(k)?p:[...p,k]);
    setActive(k);setSub('gantt');resetF();
  },[openTabs,pData,loading,resetF]);

  const closeTab=useCallback((k,e)=>{e?.stopPropagation();setOpen(p=>{const n=p.filter(x=>x!==k);if(active===k)setActive(n.length?n[n.length-1]:null);return n})},[active]);

  const handleLocal=useCallback(file=>{
    const reader=new FileReader();
    reader.onload=e=>{try{
      const d=parseMSPDI(e.target.result);
      const k='loc_'+Date.now();
      const proj={key:k,name:file.name.replace('.xml',''),file:file.name,size:file.size,local:true};
      setPList(p=>[...(p||[]),proj]);setPData(p=>({...p,[k]:d}));
      const em={};d.tasks.forEach(t=>{if(t.isSummary)em[t.uid]=true});setExpMap(p=>({...p,[k]:em}));
      setOpen(p=>[...p,k]);setActive(k);setSub('gantt');resetF();
    }catch(err){console.error(err)}};
    reader.readAsText(file);
  },[resetF]);

  const togTask=useCallback((k,uid)=>{setExpMap(p=>{const m={...p[k]};m[uid]=!m[uid];return{...p,[k]:m}})},[]);
  const expAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=true});setExpMap(p=>({...p,[k]:m}))},[]);
  const colAll=useCallback((k,ts)=>{const m={};ts.forEach(t=>{if(t.isSummary)m[t.uid]=false});setExpMap(p=>({...p,[k]:m}))},[]);

  const fCount=useMemo(()=>{let c=0;if(fSt!=='all')c++;if(fRes!=='all')c++;if(fCon!=='all')c++;if(fRub!=='all')c++;if(fTab!=='all')c++;if(fNiv!=='all')c++;if(fWbs<99)c++;if(fDf||fDt)c++;return c},[fSt,fRes,fCon,fRub,fTab,fNiv,fWbs,fDf,fDt]);

  const aProj=useMemo(()=>(pList||[]).find(p=>p.key===active),[pList,active]);
  const aData=active?pData[active]:null;
  const aLoading=active?!!loading[active]:false;
  const aErr=active?errors[active]:null;

  /* Visible tasks with filters */
  const visTasks=useMemo(()=>{
    if(!aData)return[];
    const em=expMap[active]||{};
    const mf=t=>{
      if(fSt!=='all'&&gSt(t)!==fSt)return false;
      if(fRes!=='all'){if(fRes==='none'){if(t.resources.length>0)return false}else{if(!t.resources.includes(fRes))return false}}
      if(fCon!=='all'){const cv=entV(t,'Contratista');if(fCon==='none'){if(cv)return false}else{if(cv!==fCon)return false}}
      if(fRub!=='all'){const rv=entV(t,'Rubro');if(fRub==='none'){if(rv)return false}else{if(rv!==fRub)return false}}
      if(fTab!=='all'){const tv=entV(t,'Tableros');if(fTab==='none'){if(tv)return false}else{if(tv!==fTab)return false}}
      if(fNiv!=='all'){const nv=entV(t,'Nivel');if(fNiv==='none'){if(nv)return false}else{if(nv!==fNiv)return false}}
      if(t.outlineLevel>fWbs)return false;
      if(fDf){const f=new Date(fDf);if(t.finish&&t.finish<f)return false}
      if(fDt){const f=new Date(fDt);if(t.start&&t.start>f)return false}
      return true;
    };
    const hm=t=>{if(mf(t))return true;for(const c of t.children)if(hm(c))return true;return false};
    const res=[];
    const proc=t=>{if(t.isSummary){if(!hm(t))return}else{if(!mf(t))return};res.push(t);if(t.isSummary&&em[t.uid]){for(const c of t.children)proc(c)}};
    for(const t of aData.roots||[])proc(t);
    return res;
  },[aData,active,expMap,fSt,fRes,fCon,fRub,fTab,fNiv,fWbs,fDf,fDt]);

  /* Splitter */
  useEffect(()=>{if(!splOn)return;const mv=e=>setTblW(Math.max(300,Math.min(e.clientX,window.innerWidth-200)));const up=()=>setSplOn(false);document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);return()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)}},[splOn]);

  /* Table scroll sync */
  const onTblScroll=useCallback(e=>{if(tblScrolling.current)return;scrollRef.current={v:e.target.scrollTop,src:'table'}},[]);
  useEffect(()=>{let r;const s=()=>{const el=tblRef.current;if(el&&scrollRef.current?.src==='chart'){tblScrolling.current=true;el.scrollTop=scrollRef.current.v;scrollRef.current.src=null;requestAnimationFrame(()=>{tblScrolling.current=false})};r=requestAnimationFrame(s)};r=requestAnimationFrame(s);return()=>cancelAnimationFrame(r)},[]);

  /* Search */
  const SearchModal=useCallback(({onClose})=>{
    const[q,setQ]=useState('');const ref=useRef(null);
    useEffect(()=>{ref.current?.focus()},[]);
    const res=useMemo(()=>{if(!q.trim())return[];const lw=q.toLowerCase();const r=[];for(const p of(pList||[])){const d=pData[p.key];if(!d)continue;for(const t of d.tasks){if(t.name.toLowerCase().includes(lw)){r.push({t,pn:p.name});if(r.length>=20)return r}}}return r},[q,pList,pData]);
    return <div className="so" onClick={onClose}><div className="sm" onClick={e=>e.stopPropagation()}>
      <input ref={ref} className="si" placeholder="Buscar tareas..." value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Escape')onClose()}}/>
      <div className="sr">{res.map((r,i)=><div key={i} className="sri"><span style={{color:r.t.isMilestone?'var(--bar-ms)':'var(--c2)'}}>{r.t.isMilestone?'♦':'○'}</span><span style={{flex:1}}>{r.t.name}</span><span style={{color:'var(--c2)',fontSize:11}}>{r.pn}</span></div>)}
      {q.trim()&&!res.length&&<div style={{padding:16,textAlign:'center',color:'var(--c2)',fontSize:12}}>Sin resultados</div>}</div>
    </div></div>;
  },[pList,pData]);

  const dismissTour=useCallback(()=>{setShowTour(false);try{localStorage.setItem(TOUR_KEY,'1')}catch(e){}},[]);

  if(!pList)return <div className="ld"><div className="sp"/><span>Cargando...</span></div>;

  /* ═══ CLIENT SHARE VIEW ═══ */
  if(clientProj){
    return <ClientView projName={clientProj} pList={pList} pData={pData} metaList={metaList}/>;
  }

  /* ═══ HOME ═══ */
  if(!active){
    const sp=(pList||[]).filter(p=>!p.local);
    /* Classify projects by state from Excel metadata */
    const getEstado=p=>{const m=matchMeta(p.name,metaList);return(m?.estado||'').trim()};
    const activoProjs=sp.filter(p=>getEstado(p)==='Activo');
    const pausaProjs=sp.filter(p=>getEstado(p)==='En pausa');
    const finalizadoProjs=sp.filter(p=>getEstado(p)==='Finalizado');
    const canceladaProjs=sp.filter(p=>{const e=getEstado(p);return e==='Cancelada'||e==='Cancelado'});
    const sinEstado=sp.filter(p=>{const e=getEstado(p);return!e||!['Activo','En pausa','Finalizado','Cancelada','Cancelado'].includes(e)});
    const activeProjs=[...activoProjs,...pausaProjs];
    /* Filter by map selection (only active) */
    const filteredActive=mapCity?activeProjs.filter(p=>{const m=matchMeta(p.name,metaList);return m&&m.dept===mapCity}):activeProjs;

    /* Health summary for nav badges (only active projects) */
    const activeKeys=new Set(activeProjs.map(p=>p.key));
    const hVals=Object.entries(healthMap).filter(([k,v])=>v&&activeKeys.has(k)).map(([,v])=>v);
    const totalOv=hVals.reduce((s,h)=>s+h.ov,0);

    /* Render a project card */
    const renderCard=(p)=>{
              const m=matchMeta(p.name,metaList);
              const estado=m?.estado||'';
              const h=healthMap[p.key];
              const isLoading=!!autoLoading[p.key];
              const hClass=h?`health-${h.color}`:'';
              const dotColor=h?({g:'var(--ok)',y:'var(--warn)',r:'var(--err)',x:'var(--c2)'}[h.color]):(estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':estado==='Cancelada'?'var(--err)':'var(--c2)');
              const stBg=estado==='Activo'?'rgba(16,185,129,.1)':estado==='En pausa'?'rgba(245,158,11,.1)':estado==='Cancelada'?'rgba(239,68,68,.08)':estado==='Finalizado'?'rgba(139,146,165,.08)':'rgba(139,146,165,.1)';
              const stColor=estado==='Activo'?'var(--ok)':estado==='En pausa'?'var(--warn)':estado==='Cancelada'?'var(--err)':'var(--c2)';
              const m2t=(m?.m2Cubierta||0)+(m?.m2Semi||0);
              return <div key={p.key} className={`pcard2 ${hClass}`} onClick={()=>openProj(p)}>
                <div className="pcard2-top">
                  <span className="pcard2-dot" style={{background:dotColor}}/>
                  <span className="pcard2-name">{p.name}</span>
                  {h&&<span className={`health-badge ${h.color}`}>{h.color==='g'?'✓':h.color==='y'?'⚠':h.color==='r'?'✕':'—'} {h.label}</span>}
                  {!h&&estado&&<span className="pcard2-status" style={{background:stBg,color:stColor}}>{estado}</span>}
                </div>
                <div className="pcard2-meta">
                  {m?.ciudad&&<span>📍 {m.cityLabel||m.ciudad}</span>}
                  {m?.dept&&<span style={{color:DEPT_COLORS[m.dept]||'var(--c2)'}}>◆ {m.dept}</span>}
                  {m2t>0&&<span>🏠 {Math.round(m2t)} m² cub</span>}
                  {m?.comitente&&<span>👤 {m.comitente}</span>}
                </div>
                {h&&<Fragment>
                  <div className="pcard2-bar"><div className="pcard2-fill" style={{width:`${h.avg}%`,background:dotColor}}/></div>
                  <div className="pcard2-health">
                    <div className="pcard2-stats">
                      <span style={{fontWeight:600,color:'var(--c0)'}}>{h.avg}%</span>
                      <span>{h.done}/{h.tot} hechas</span>
                      {h.ov>0&&<span style={{color:'var(--err)'}}>{h.ov} vencidas</span>}
                      {h.ip>0&&<span style={{color:'var(--warn)'}}>{h.ip} en curso</span>}
                    </div>
                  </div>
                  {h.nextMs&&<div style={{fontSize:10,color:'var(--c2)',marginTop:2}}>Próximo hito: {h.nextMs.name} ({fD(h.nextMs.finish)})</div>}
                  {(()=>{const td=getTrendForProject(trendData,p.key);return td.length>=2?<div style={{display:'flex',alignItems:'center',gap:8,marginTop:3}}><span style={{fontSize:9,color:'var(--c2)'}}>Avance</span><Sparkline data={td} field="avg" color="var(--ac)"/><span style={{fontSize:9,color:'var(--c2)',marginLeft:4}}>Vencidas</span><Sparkline data={td} field="ov" color="var(--err)" w={40}/></div>:null})()}
                </Fragment>}
                {!h&&isLoading&&<div className="pcard2-loading"><div className="mini-sp"/>Analizando...</div>}
                {!h&&!isLoading&&p.size&&<div className="pcard2-bottom"><span>{(p.size/1024).toFixed(0)} KB</span></div>}
              </div>;
    };

    return <Fragment>
      <div className="hdr">
        <a href="index.html" style={{color:'var(--c2)',fontSize:11,textDecoration:'none',marginRight:6}}>← BkTableros</a><div className="logo">{I.bld(18)} BuildPlan <span>360°</span></div>
        <div className="tabs">
          <button className="tab on">{I.home(14)} Inicio</button>
          <button className="tab" onClick={()=>{setActive('__pf');setSub('portfolio')}} style={{color:'var(--ac)'}}>{I.usr(14)} Portfolio</button>
          {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);return p?<button key={k} className="tab" onClick={()=>{setActive(k);setSub('gantt');resetF()}}><span className="dot" style={{background:'var(--c2)'}}/>{p.name}<span className="x" onClick={e=>closeTab(k,e)}>×</span></button>:null})}
        </div>
        <div className="acts">
          {totalOv>0&&<span style={{fontSize:11,color:'var(--err)',fontWeight:600,fontFamily:'var(--fm)'}}>{totalOv} vencidas</span>}
          <button className="btn btn-g btn-i" onClick={()=>setShowSrch(true)} title="Ctrl+K">{I.srch()}</button>
          <button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button>
        </div>
      </div>
      <div className="home">
        {/* Sidebar: Map — all projects */}
        <div className="home-sidebar">
          <DeptMap projects={sp} metaList={metaList} selectedDept={mapCity} onSelectDept={setMapCity}/>
          {/* Health summary under map — only active */}
          {hVals.length>0&&<div style={{padding:'12px',borderTop:'1px solid var(--b1)'}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--c1)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}}>Salud obras activas</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <span className="health-badge g">{hVals.filter(h=>h.color==='g').length} en tiempo</span>
              {hVals.filter(h=>h.color==='y').length>0&&<span className="health-badge y">{hVals.filter(h=>h.color==='y').length} atención</span>}
              {hVals.filter(h=>h.color==='r').length>0&&<span className="health-badge r">{hVals.filter(h=>h.color==='r').length} en riesgo</span>}
            </div>
          </div>}
        </div>

        {/* Main: Project cards — separated */}
        <div className="home-main">
          {/* ACTIVE PROJECTS */}
          <div className="home-h">
            <div className="home-title">Obras activas</div>
            <div className="home-sub">{filteredActive.length} obras{mapCity?` · Depto. ${mapCity}`:''}{mapCity&&<button className="fclr" onClick={()=>setMapCity(null)} style={{marginLeft:8}}>Mostrar todas</button>}{hVals.length>0&&!mapCity&&<span style={{marginLeft:8,color:'var(--c2)'}}>· {hVals.length} analizadas</span>}</div>
          </div>
          <div className="pgrid2">
            {filteredActive.map(renderCard)}
          </div>

          {/* FINALIZADAS — collapsible */}
          {finalizadoProjs.length>0&&<div style={{marginTop:32}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='fin'?false:'fin')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--ok)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Obras finalizadas</span>
              <span style={{fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)',background:'rgba(16,185,129,.1)',color:'var(--ok)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{finalizadoProjs.length}</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='fin'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='fin'&&<div className="pgrid2" style={{opacity:.6}}>
              {finalizadoProjs.map(renderCard)}
            </div>}
          </div>}

          {/* CANCELADAS — collapsible */}
          {canceladaProjs.length>0&&<div style={{marginTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='can'?false:'can')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--err)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Obras canceladas</span>
              <span style={{fontSize:11,fontFamily:'var(--fm)',background:'rgba(239,68,68,.1)',color:'var(--err)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{canceladaProjs.length}</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='can'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='can'&&<div className="pgrid2" style={{opacity:.6}}>
              {canceladaProjs.map(renderCard)}
            </div>}
          </div>}

          {/* SIN CLASIFICAR — projects not in Excel */}
          {sinEstado.length>0&&<div style={{marginTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',padding:'12px 0',borderTop:'1px solid var(--b1)'}} onClick={()=>setShowFinished(f=>f==='other'?false:'other')}>
              <span style={{width:10,height:10,borderRadius:2,background:'var(--c2)',opacity:.5,flexShrink:0}}/>
              <span style={{fontSize:14,fontWeight:600,color:'var(--c1)'}}>Sin clasificar</span>
              <span style={{fontSize:11,fontFamily:'var(--fm)',background:'var(--bg-2)',padding:'2px 8px',borderRadius:10,color:'var(--c2)',fontWeight:600}}>{sinEstado.length}</span>
              <span style={{fontSize:10,color:'var(--c2)'}}>No están en el Excel de proyectos</span>
              <span style={{fontSize:11,color:'var(--c2)',marginLeft:'auto'}}>{showFinished==='other'?'▲ Ocultar':'▼ Mostrar'}</span>
            </div>
            {showFinished==='other'&&<div className="pgrid2" style={{opacity:.5}}>
              {sinEstado.map(renderCard)}
            </div>}
          </div>}
        </div>
      </div>
      {showTour&&<Tour onDone={dismissTour}/>}
      {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
      <div className="mob-nav">
        <button className="on" onClick={()=>setActive(null)}>{I.home(18)}<span>Inicio</span></button>
        <button onClick={()=>{setActive('__pf');setSub('portfolio')}}>{I.chart(18)}<span>Portfolio</span></button>
        <button onClick={()=>setShowSrch(true)}>{I.srch(18)}<span>Buscar</span></button>
        <button onClick={togTh}>{th==='light'?I.moon(18):I.sun(18)}<span>Tema</span></button>
      </div>
    </Fragment>;
  }

  /* ═══ PORTFOLIO ═══ */
  if(active==='__pf'){
    return <Fragment>
      <div className="hdr">
        <a href="index.html" style={{color:'var(--c2)',fontSize:11,textDecoration:'none',marginRight:6}}>← BkTableros</a><div className="logo" onClick={()=>setActive(null)}>{I.bld(18)} BuildPlan</div>
        <div className="tabs">
          <button className="tab on">{I.usr()} Portfolio</button>
          {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);return p?<button key={k} className="tab" onClick={()=>{setActive(k);setSub('gantt');resetF()}}><span className="dot" style={{background:'var(--c2)'}}/>{p.name}<span className="x" onClick={e=>closeTab(k,e)}>×</span></button>:null})}
        </div>
        <div className="acts"><button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button></div>
      </div>
      <Portfolio projList={pList} projData={pData}/>
    </Fragment>;
  }

  /* ═══ PROJECT VIEW ═══ */
  return <Fragment>
    <div className="ph"><h1>{aProj?.name}</h1><p>Generado el {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})} — BuildPlan Viewer · Bauvek</p></div>
    <div className="hdr">
      <button onClick={()=>setActive(null)} style={{background:'none',border:'none',color:'var(--c2)',fontSize:11,cursor:'pointer',marginRight:6,padding:0}}>← BuildPlan</button><div className="logo" onClick={()=>setActive(null)}>{I.bld(18)} BuildPlan</div>
      <div className="tabs">
        <a href="index.html" className="tab" style={{textDecoration:'none',color:'var(--c1)',fontWeight:600,fontSize:12,letterSpacing:'.3px'}}>TABLEROS BK</a>
        <button className="tab" onClick={()=>{setActive('__pf');setSub('portfolio')}}>{I.usr()} Portfolio</button>
        {openTabs.filter(k=>k!=='__pf').map(k=>{const p=(pList||[]).find(pr=>pr.key===k);if(!p)return null;
          return <button key={k} className={`tab ${active===k?'on':''}`} onClick={()=>{setActive(k);setSub('gantt');resetF()}}><span className="dot" style={{background:'var(--c2)'}}/>{p.name}<span className="x" onClick={e=>closeTab(k,e)}>×</span></button>})}
      </div>
      <div className="acts">
        <button className="btn btn-g btn-i" onClick={()=>setShowSrch(true)} title="Ctrl+K">{I.srch()}</button>
        <button className="btn btn-g btn-i" onClick={togTh}>{th==='light'?I.moon():I.sun()}</button>
      </div>
    </div>

    <div className="stbar">
      <button className={`st ${sub==='gantt'?'on':''}`} onClick={()=>setSub('gantt')}>Gantt</button>
      <button className={`st ${sub==='semana'?'on':''}`} onClick={()=>setSub('semana')}>Semana</button>
      <button className={`st ${sub==='compras'?'on':''}`} onClick={()=>setSub('compras')}>Compras</button>
      <button className={`st ${sub==='materiales'?'on':''}`} onClick={()=>setSub('materiales')} style={sub==='materiales'?{borderColor:'var(--ac)'}:{}}>Materiales</button>
      <button className={`st ${sub==='dash'?'on':''}`} onClick={()=>setSub('dash')}>Dashboard</button>
      <button className={`st ${sub==='demoras'?'on':''}`} onClick={()=>setSub('demoras')}>Demoras</button>
      {sub==='gantt'&&aData&&<div className="str">
        <button className="btn btn-g btn-i" onClick={()=>expAll(active,aData.tasks)} title="Expandir">{I.exp()}</button>
        <button className="btn btn-g btn-i" onClick={()=>colAll(active,aData.tasks)} title="Colapsar">{I.col()}</button>
        <div className="seg">{Object.entries(ZM).map(([k,v])=><button key={k} className={zoom===k?'on':''} onClick={()=>setZoom(k)}>{v.l}</button>)}</div>
        <button className="btn btn-g btn-i" onClick={()=>setShowArr(a=>!a)} title="Flechas" style={{color:showArr?'var(--ac)':'var(--c2)'}}>{I.lnk()}</button>
        {aData.hasBL&&<button className="btn btn-g btn-i" onClick={()=>setShowBL(b=>!b)} title="Línea base" style={{color:showBL?'var(--ac)':'var(--c2)'}}>{I.bl()}</button>}
        <button className="btn btn-g" onClick={()=>window.print()}>{I.prt()} PDF</button>
        <a href="pagos.html" className="btn btn-g" style={{textDecoration:'none'}} title="Ver programación de pagos">$ Pagos</a>
        <button className="btn btn-g" onClick={()=>{const url=window.location.origin+window.location.pathname+'?proyecto='+encodeURIComponent(aProj?.name||'');navigator.clipboard.writeText(url).then(()=>alert('Link copiado: '+url)).catch(()=>prompt('Copiá este link para compartir:',url))}} title="Compartir vista cliente">{I.lnk()} Compartir</button>
      </div>}
    </div>

    {sub==='gantt'&&aData&&<div className="fbar">
      <span style={{color:'var(--c2)',marginRight:2}}>{I.flt()}</span>
      <span className="fl">Estado</span>
      <select className="fsel" value={fSt} onChange={e=>setFSt(e.target.value)}><option value="all">Todos</option><option value="pe">Pendiente</option><option value="ip">En curso</option><option value="ok">Completada</option><option value="ov">Vencida</option></select>
      <span className="fl">Recurso</span>
      <select className="fsel" value={fRes} onChange={e=>setFRes(e.target.value)}><option value="all">Todos</option><option value="none">Sin asignar</option>{aData.resources.map(r=><option key={r} value={r}>{r}</option>)}</select>
      <span className="fl">Contratista</span>
      <select className="fsel" value={fCon} onChange={e=>setFCon(e.target.value)}><option value="all">Todos</option><option value="none">Sin contratista</option>{aData.contractors.map(c=><option key={c} value={c}>{c}</option>)}</select>
      {aData.rubros.length>0&&<Fragment><span className="fl">Rubro</span>
      <select className="fsel" value={fRub} onChange={e=>setFRub(e.target.value)}><option value="all">Todos</option><option value="none">Sin rubro</option>{aData.rubros.map(r=><option key={r} value={r}>{r}</option>)}</select></Fragment>}
      {aData.tableros.length>0&&<Fragment><span className="fl">Fase</span>
      <select className="fsel" value={fTab} onChange={e=>setFTab(e.target.value)}><option value="all">Todas</option>{aData.tableros.map(t=><option key={t} value={t}>{t}</option>)}</select></Fragment>}
      {aData.niveles.length>0&&<Fragment><span className="fl">Nivel obra</span>
      <select className="fsel" value={fNiv} onChange={e=>setFNiv(e.target.value)}><option value="all">Todos</option>{aData.niveles.map(n=><option key={n} value={n}>{n}</option>)}</select></Fragment>}
      <span className="fl">Prof. WBS</span>
      <select className="fsel" value={fWbs} onChange={e=>setFWbs(parseInt(e.target.value))}><option value="99">Todos</option>{[1,2,3,4,5].map(n=><option key={n} value={n}>{n}</option>)}</select>
      <span className="fl">Desde</span><input type="date" className="fin" value={fDf} onChange={e=>setFDf(e.target.value)}/>
      <span className="fl">Hasta</span><input type="date" className="fin" value={fDt} onChange={e=>setFDt(e.target.value)}/>
      {fCount>0&&<Fragment><span className="fbadge">{fCount}</span><button className="fclr" onClick={resetF}>Limpiar</button></Fragment>}
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--c2)',fontFamily:'var(--fm)'}}>{visTasks.length} tareas</span>
    </div>}

    {aErr&&<div className="err-b">Error: {aErr}</div>}
    {aLoading&&<div className="ld"><div className="sp"/><span>Cargando...</span></div>}

    {!aLoading&&aData&&sub==='gantt'&&<div className="gw" style={{userSelect:splOn?'none':'auto'}}>
      <div className="gtc" ref={tblRef} style={{width:tblW}} onScroll={onTblScroll}>
        <table className="gt">
          <colgroup>
            <col style={{width:35}}/><col style={{width:170}}/><col style={{width:62}}/><col style={{width:62}}/><col style={{width:38}}/><col style={{width:48}}/><col style={{width:70}}/><col style={{width:75}}/><col style={{width:65}}/><col style={{width:55}}/><col style={{width:55}}/><col style={{width:45}}/>
          </colgroup>
          <thead><tr><th>WBS</th><th>Tarea</th><th>Inicio</th><th>Fin</th><th>Dur.</th><th>%</th><th>Recurso</th><th>Contratista</th><th>Rubro</th><th>Nivel</th><th>Fase</th><th>N° Item</th></tr></thead>
          <tbody>{visTasks.map(t=>{
            const em=expMap[active]||{};const ov=isOv(t);const ind=t.depth*14;
            return <tr key={t.uid} className={t.isSummary?'sum':''}>
              <td className="mono" style={{fontSize:10}}>{t.wbs}</td>
              <td><div className="tnc" style={{paddingLeft:ind}}>
                {t.isSummary?<button className="ttog" onClick={()=>togTask(active,t.uid)}>{em[t.uid]?I.chD():I.chR()}</button>:<span style={{width:16,flexShrink:0}}/>}
                {t.isMilestone&&<span style={{color:'var(--bar-ms)',fontSize:10,flexShrink:0}}>♦</span>}
                <span style={{overflow:'hidden',textOverflow:'ellipsis',fontWeight:t.isSummary?600:400,color:ov?'var(--err)':t.critical?'var(--ac)':'var(--c0)'}} title={t.name}>{t.name}</span>
              </div></td>
              <td className="mono">{fD(t.start)}</td>
              <td className="mono" style={{color:ov?'var(--err)':undefined}}>{fD(t.finish)}</td>
              <td className="mono" style={{fontSize:10}}>{fDur(t.duration)}</td>
              <td><div className="pm"><div className="pmb"><div className="pmf" style={{width:`${t.percentComplete}%`,background:t.percentComplete>=100?'var(--ok)':ov?'var(--err)':'var(--ac)'}}/></div><span className="mono" style={{fontSize:10}}>{t.percentComplete}%</span></div></td>
              <td style={{fontSize:11,color:'var(--c1)',overflow:'hidden',textOverflow:'ellipsis'}} title={t.resources.join(', ')}>{t.resources.join(', ')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Contratista')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Rubro')||'—'}</td>
              <td style={{fontSize:11,color:'var(--c1)'}}>{entV(t,'Nivel')||'—'}</td>
              <td style={{fontSize:10,color:'var(--c2)'}}>{entV(t,'Tableros')||'—'}</td>
              <td className="mono" style={{fontSize:10}}>{entV(t,'N° Item')||'—'}{entV(t,'N° Item')&&computoData[active]?.coefMap?.[entV(t,'N° Item')]&&<span className="mat-badge" title="Tiene materiales en cómputo">⬡</span>}</td>
            </tr>
          })}</tbody>
        </table>
      </div>
      <div className={`spl ${splOn?'on':''}`} onMouseDown={()=>setSplOn(true)}/>
      <GanttSVG tasks={visTasks} minDate={aData.minDate} maxDate={aData.maxDate} zoom={zoom} showArr={showArr} showBL={showBL} scrollRef={scrollRef} onTT={setTTInfo}/>
    </div>}

    {!aLoading&&aData&&sub==='semana'&&<WeekView data={aData}/>}
    {!aLoading&&aData&&sub==='compras'&&<ProcurementView data={aData}/>}
    {!aLoading&&aData&&sub==='materiales'&&<MaterialsView data={aData} computoData={computoData[active]||null} visTasks={visTasks}/>}
    {!aLoading&&aData&&sub==='dash'&&<ProjDash data={aData}/>}
    {!aLoading&&aData&&sub==='demoras'&&<DemorasView data={aData}/>}

    <Tooltip info={ttInfo} computoData={computoData[active]||null}/>
    {showSrch&&<SearchModal onClose={()=>setShowSrch(false)}/>}
    <div className="pf">BuildPlan Viewer — Bauvek · {new Date().toLocaleDateString('es-AR')}</div>
    <div className="mob-nav">
      <button onClick={()=>setActive(null)}>{I.home(18)}<span>Inicio</span></button>
      <button className={sub==='semana'?'on':''} onClick={()=>setSub('semana')}>{I.cal(18)}<span>Semana</span></button>
      <button className={sub==='gantt'?'on':''} onClick={()=>setSub('gantt')}>{I.bld(18)}<span>Gantt</span></button>
      <button className={sub==='dash'?'on':''} onClick={()=>setSub('dash')}>{I.chart(18)}<span>Dashboard</span></button>
    </div>
  </Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
