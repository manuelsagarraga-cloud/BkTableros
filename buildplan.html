<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>BuildPlan Viewer — Bauvek</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg-0:#fafbfc;--bg-1:#f1f3f5;--bg-2:#e9ecef;--bg-el:#fff;
  --bg-hover:rgba(158,1,1,.04);--bg-alt:rgba(0,0,0,.015);--bg-sum:rgba(158,1,1,.03);
  --c0:#1a1f2e;--c1:#5a6178;--c2:#8b92a5;
  --b0:#e2e5ea;--b1:#eef0f3;
  --ac:#9E0101;--ac2:#E40000;--ac-bg:rgba(158,1,1,.07);
  --ok:#10b981;--err:#ef4444;--warn:#f59e0b;
  --bar:#9E0101;--bar-bg:rgba(158,1,1,.15);--bar-sum:#3a3f4b;
  --bar-ms:#d4930d;--bar-ov:#ef4444;--bar-ov-bg:rgba(239,68,68,.14);
  --bar-ok:#10b981;--bar-ok-bg:rgba(16,185,129,.14);--bar-bl:#9ca3af;
  --arr:rgba(148,163,184,.45);--arr-h:#94a3b8;--today:#ef4444;
  --sh-s:0 1px 2px rgba(0,0,0,.04);--sh-m:0 2px 8px rgba(0,0,0,.06);--sh-l:0 4px 16px rgba(0,0,0,.08);
  --r-s:4px;--r-m:6px;--r-l:8px;--hdr:44px;--row:28px;--ghdr:44px;
  --ff:'Lato','Inter',-apple-system,sans-serif;--fm:'JetBrains Mono',monospace;
  color-scheme:light dark
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-0:#0f1419;--bg-1:#1a2030;--bg-2:#242d3d;--bg-el:#1e2636;
  --bg-hover:rgba(158,1,1,.06);--bg-alt:rgba(255,255,255,.02);--bg-sum:rgba(158,1,1,.05);
  --c0:#e4e8ee;--c1:#8b95a8;--c2:#5e6882;
  --b0:#2a3344;--b1:#222b3a;
  --ac-bg:rgba(158,1,1,.1);
  --bar-bg:rgba(158,1,1,.2);--bar-ov-bg:rgba(239,68,68,.2);--bar-ok-bg:rgba(16,185,129,.2);--bar-bl:#555d6e;
  --arr:rgba(71,85,105,.5);--arr-h:#475569;
  --sh-s:0 1px 2px rgba(0,0,0,.2);--sh-m:0 2px 8px rgba(0,0,0,.3);--sh-l:0 4px 16px rgba(0,0,0,.4)
}}
:root[data-theme="dark"]{
  --bg-0:#0f1419;--bg-1:#1a2030;--bg-2:#242d3d;--bg-el:#1e2636;
  --bg-hover:rgba(158,1,1,.06);--bg-alt:rgba(255,255,255,.02);--bg-sum:rgba(158,1,1,.05);
  --c0:#e4e8ee;--c1:#8b95a8;--c2:#5e6882;
  --b0:#2a3344;--b1:#222b3a;
  --ac-bg:rgba(158,1,1,.1);
  --bar-bg:rgba(158,1,1,.2);--bar-ov-bg:rgba(239,68,68,.2);--bar-ok-bg:rgba(16,185,129,.2);--bar-bl:#555d6e;
  --arr:rgba(71,85,105,.5);--arr-h:#475569;
  --sh-s:0 1px 2px rgba(0,0,0,.2);--sh-m:0 2px 8px rgba(0,0,0,.3);--sh-l:0 4px 16px rgba(0,0,0,.4)
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg-0);color:var(--c0);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b0);border-radius:3px}

.hdr{height:var(--hdr);background:var(--bg-el);border-bottom:1px solid var(--b0);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--c2);font-weight:400;font-size:12px;margin-left:2px}
.tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--c1);border-radius:var(--r-s);cursor:pointer;white-space:nowrap;border:none;background:none;font-family:var(--ff)}.tab:hover{background:var(--bg-1);color:var(--c0)}.tab.on{background:var(--ac-bg);color:var(--ac)}
.tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tab .x{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:2px;opacity:0;font-size:11px}.tab:hover .x{opacity:.6}.tab .x:hover{opacity:1;background:var(--bg-2)}
.acts{display:flex;align-items:center;gap:4px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;font-size:12px;font-weight:500;font-family:var(--ff);border-radius:var(--r-s);border:1px solid var(--b0);background:var(--bg-el);color:var(--c1);cursor:pointer;white-space:nowrap}.btn:hover{background:var(--bg-1);color:var(--c0)}
.btn-i{padding:5px;width:28px;height:28px}
.btn-g{border-color:transparent;background:transparent}.btn-g:hover{background:var(--bg-1)}
.seg{display:inline-flex;background:var(--bg-1);border-radius:var(--r-s);padding:2px;gap:1px}
.seg button{padding:3px 10px;font-size:11px;font-weight:500;font-family:var(--ff);border:none;background:transparent;color:var(--c1);cursor:pointer;border-radius:3px}.seg button:hover{color:var(--c0)}.seg button.on{background:var(--bg-el);color:var(--c0);box-shadow:var(--sh-s)}

.home{flex:1;overflow-y:auto;display:flex}
.home-sidebar{width:320px;flex-shrink:0;border-right:1px solid var(--b0);overflow-y:auto;background:var(--bg-el)}
.home-main{flex:1;overflow-y:auto;padding:24px}
.home-h{max-width:100%;margin:0 0 16px}.home-title{font-size:20px;font-weight:600;margin-bottom:4px}.home-sub{font-size:13px;color:var(--c1)}
.pgrid{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);cursor:pointer}.pcard:hover{border-color:var(--ac);box-shadow:var(--sh-s)}
.pcard-icon{width:34px;height:34px;border-radius:var(--r-s);background:var(--ac-bg);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcard-info{flex:1;min-width:0}.pcard-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcard-meta{font-size:11px;color:var(--c2);font-family:var(--fm);margin-top:1px}
.pcard-arr{color:var(--c2);flex-shrink:0}.pcard:hover .pcard-arr{transform:translateX(2px);color:var(--ac)}
.dropz{max-width:640px;margin:20px auto 0;padding:20px;border:1.5px dashed var(--b0);border-radius:var(--r-m);text-align:center;color:var(--c2);font-size:12px;cursor:pointer}.dropz:hover,.dropz.over{border-color:var(--ac);background:var(--ac-bg);color:var(--ac)}
.dropz input{display:none}

.stbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:36px;background:var(--bg-el);border-bottom:1px solid var(--b1);flex-shrink:0}
.st{font-size:12px;font-weight:500;color:var(--c2);border:none;background:none;padding:8px 0;cursor:pointer;position:relative;font-family:var(--ff)}.st:hover{color:var(--c0)}.st.on{color:var(--ac)}.st.on::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--ac);border-radius:1px 1px 0 0}
.str{margin-left:auto;display:flex;align-items:center;gap:4px}

.fbar{display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--bg-1);border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap}
.fsel{padding:4px 24px 4px 8px;font-size:11px;font-family:var(--ff);font-weight:500;border:1px solid var(--b0);border-radius:var(--r-s);background:var(--bg-el);color:var(--c0);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6178' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center}
.fin{padding:4px 8px;font-size:11px;font-family:var(--fm);border:1px solid var(--b0);border-radius:var(--r-s);background:var(--bg-el);color:var(--c0);width:110px}
.fl{font-size:11px;color:var(--c2);font-weight:500}
.fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:var(--ac);color:white;font-size:10px;font-weight:600;padding:0 4px}
.fclr{font-size:11px;color:var(--ac);border:none;background:none;cursor:pointer;font-family:var(--ff);font-weight:500;padding:4px 6px;border-radius:var(--r-s)}.fclr:hover{background:var(--ac-bg)}

.gw{flex:1;display:flex;overflow:hidden}
.gtc{overflow:auto;border-right:1px solid var(--b0);flex-shrink:0;background:var(--bg-el)}
.gcc{flex:1;overflow:auto;background:var(--bg-0)}
.spl{width:5px;cursor:col-resize;background:var(--b1);flex-shrink:0;z-index:10}.spl:hover,.spl.on{background:var(--ac)}

.gt{border-collapse:collapse;min-width:100%;table-layout:fixed}
.gt th{position:sticky;top:0;z-index:5;background:var(--bg-1);font-size:11px;font-weight:600;color:var(--c1);text-align:left;padding:0 5px;height:var(--ghdr);border-bottom:1px solid var(--b0);white-space:nowrap}
.gt td{padding:0 5px;height:var(--row);border-bottom:1px solid var(--b1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;vertical-align:middle}
.gt tr:hover td{background:var(--bg-hover)}
.gt tr:nth-child(even) td{background:var(--bg-alt)}.gt tr:nth-child(even):hover td{background:var(--bg-hover)}
.gt tr.sum td{background:var(--bg-sum);font-weight:600}.gt tr.sum:hover td{background:var(--bg-hover)}
.tnc{display:flex;align-items:center;gap:3px;height:var(--row)}
.ttog{width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px;flex-shrink:0;color:var(--c2);border:none;background:none;padding:0}.ttog:hover{color:var(--c0);background:var(--bg-2)}
.pm{display:flex;align-items:center;gap:3px}
.pmb{width:30px;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden;flex-shrink:0}
.pmf{height:100%;border-radius:2px}
.mono{font-family:var(--fm);font-size:11px;color:var(--c1)}

.dash{flex:1;overflow-y:auto;padding:20px 24px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:14px;border-left:3px solid var(--ac)}
.kpi.ok{border-left-color:var(--ok)}.kpi.err{border-left-color:var(--err)}.kpi.warn{border-left-color:var(--warn)}
.kpi-v{font-size:22px;font-weight:700;font-family:var(--fm);line-height:1.1}
.kpi-l{font-size:11px;color:var(--c1);margin-top:4px;font-weight:500}
.dst{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--c1)}
.dt{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);overflow:hidden;margin-bottom:16px}
.dt th{background:var(--bg-1);font-weight:600;font-size:11px;color:var(--c1);text-align:left;padding:8px 10px;border-bottom:1px solid var(--b0)}
.dt td{padding:6px 10px;border-bottom:1px solid var(--b1)}
.dt tr:hover td{background:var(--bg-hover)}

.ccrd{background:var(--bg-el);border:1px solid var(--b1);border-radius:var(--r-m);padding:14px;cursor:pointer}.ccrd:hover,.ccrd.on{border-color:var(--ac)}.ccrd.on{background:var(--ac-bg)}
.ccrd h4{font-size:13px;font-weight:600;margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.cstat{display:flex;justify-content:space-between;font-size:11px;color:var(--c1);margin:2px 0}
.cstat .v{font-family:var(--fm);font-weight:500}

.tt{position:fixed;z-index:2000;background:var(--bg-el);border:1px solid var(--b0);border-radius:var(--r-m);box-shadow:var(--sh-l);padding:10px 12px;font-size:12px;max-width:280px;pointer-events:none;line-height:1.6}
.tt .tn{font-weight:600;margin-bottom:4px}
.tt .tr{display:flex;justify-content:space-between;gap:12px}
.tt .tl{color:var(--c2)}.tt .tv{font-family:var(--fm);font-size:11px}

.ld{display:flex;align-items:center;justify-content:center;flex:1;gap:8px;color:var(--c2);font-size:13px}
.sp{width:18px;height:18px;border:2px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-b{padding:8px 16px;background:rgba(239,68,68,.08);color:var(--err);font-size:12px;border-bottom:1px solid var(--err)}

.so{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding-top:15vh}
.sm{width:480px;max-width:90vw;background:var(--bg-el);border-radius:var(--r-l);box-shadow:var(--sh-l);overflow:hidden;border:1px solid var(--b0)}
.si{width:100%;padding:12px 16px;font-size:14px;font-family:var(--ff);border:none;background:transparent;color:var(--c0);outline:none;border-bottom:1px solid var(--b1)}
.sr{max-height:300px;overflow-y:auto}
.sri{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px}.sri:hover{background:var(--bg-hover)}

/* Demoras tab */
.dev-pos{color:var(--err);font-weight:500}
.dev-neg{color:var(--ok);font-weight:500}
.dev-zero{color:var(--c2)}

@media print{
  body{overflow:visible!important;height:auto!important;background:white!important}
  #root{height:auto!important}
  .hdr,.stbar,.fbar,.spl,.so{display:none!important}
  .gw{flex-direction:column!important;overflow:visible!important;height:auto!important}
  .gtc,.gcc{overflow:visible!important;width:100%!important;flex:none!important}
  .ph{display:block!important;padding:16px;border-bottom:2px solid #333;margin-bottom:8px}
  .pf{display:block!important;text-align:center;padding:8px;font-size:10px;color:#999;border-top:1px solid #ccc;margin-top:8px}
  @page{size:landscape;margin:10mm}
}
.ph,.pf{display:none}

/* ═══ Semáforo health cards ═══ */
.pcard2.health-g{border-left:4px solid var(--ok)}
.pcard2.health-y{border-left:4px solid var(--warn)}
.pcard2.health-r{border-left:4px solid var(--err)}
.pcard2.health-x{border-left:4px solid var(--c2)}
.health-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.health-badge.g{background:rgba(16,185,129,.12);color:var(--ok)}
.health-badge.y{background:rgba(245,158,11,.12);color:var(--warn)}
.health-badge.r{background:rgba(239,68,68,.12);color:var(--err)}
.health-badge.x{background:rgba(139,146,165,.1);color:var(--c2)}
.pcard2-health{display:flex;align-items:center;gap:8px;margin-top:4px}
.pcard2-stats{display:flex;gap:10px;font-size:10px;font-family:var(--fm);color:var(--c1)}
.pcard2-stats span{display:flex;align-items:center;gap:3px}
.pcard2-loading{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--c2)}
.pcard2-loading .mini-sp{width:10px;height:10px;border:1.5px solid var(--b0);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite}

/* ═══ Navigation sidebar ═══ */
.app-layout{display:flex;flex:1;overflow:hidden}
.nav-side{width:52px;background:var(--bg-el);border-right:1px solid var(--b0);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;overflow-y:auto}
.nav-item{width:40px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:var(--r-s);cursor:pointer;border:none;background:none;color:var(--c2);font-family:var(--ff);font-size:8px;font-weight:500;padding:0;position:relative}
.nav-item:hover{background:var(--bg-1);color:var(--c0)}
.nav-item.on{background:var(--ac-bg);color:var(--ac)}
.nav-item .nav-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
.nav-sep{width:28px;height:1px;background:var(--b0);margin:4px 0}
.app-content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ═══ Weekly view ═══ */
.week-view{flex:1;overflow-y:auto;padding:20px 24px}
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.week-nav h3{font-size:14px;font-weight:600;flex:1}
.week-nav button{padding:4px 10px;font-size:12px;font-weight:500;font-family:var(--ff);border-radius:var(--r-s);border:1px solid var(--b0);background:var(--bg-el);color:var(--c1);cursor:pointer}.week-nav button:hover{background:var(--bg-1);color:var(--c0)}
.week-day{margin-bottom:16px}
.week-day-hdr{font-size:11px;font-weight:600;color:var(--c2);text-transform:uppercase;letter-spacing:.5px;padding:6px 0;border-bottom:1px solid var(--b1);margin-bottom:4px}
.week-task{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-s);cursor:default}
.week-task:hover{background:var(--bg-hover)}
.week-task.ov{background:rgba(239,68,68,.04)}
.wt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wt-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-meta{font-size:11px;color:var(--c1);font-family:var(--fm)}
.wt-bar{width:50px;height:4px;border-radius:2px;background:var(--bg-2);overflow:hidden}
.wt-fill{height:100%;border-radius:2px}
.week-empty{text-align:center;color:var(--c2);padding:40px 20px;font-size:13px}

/* ═══ Sparkline trend ═══ */
.sparkline{display:inline-block;vertical-align:middle}
.trend-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.trend-label{font-size:9px;color:var(--c2);font-family:var(--fm)}
.trend-delta{font-size:9px;font-weight:600;font-family:var(--fm)}
.trend-delta.up{color:var(--ok)}
.trend-delta.down{color:var(--err)}
.trend-delta.flat{color:var(--c2)}

/* ═══ Mobile responsive ═══ */
@media(max-width:768px){
  .home{flex-direction:column}
  .home-sidebar{width:100%;max-height:200px;border-right:none;border-bottom:1px solid var(--b0);overflow:hidden}
  .home-sidebar .map-body{padding:6px}
  .home-sidebar .map-body svg{max-height:160px}
  .home-main{padding:12px}
  .pgrid2{grid-template-columns:1fr}
  .hdr{padding:0 8px;gap:6px;overflow-x:auto}
  .logo span{display:none}
  .tabs{gap:1px}
  .tab{padding:4px 8px;font-size:11px}
  .acts{gap:2px}
  .stbar{padding:0 8px;gap:6px;overflow-x:auto}
  .fbar{padding:4px 8px;gap:4px}
  .fsel{font-size:10px;padding:3px 18px 3px 6px}
  .fl{font-size:10px}
  .gw{flex-direction:column}
  .gtc{width:100%!important;max-height:40vh;border-right:none;border-bottom:1px solid var(--b0)}
  .spl{display:none}
  .gcc{min-height:300px}
  .gt th,.gt td{font-size:11px;padding:0 3px}
  .gt col:nth-child(n+7){width:0!important;display:none}
  .gt th:nth-child(n+7),.gt td:nth-child(n+7){display:none}
  .dash{padding:12px}

function normalizeForMatch(s){
  return(s||'').toLowerCase().replace(/[_\-\s.]+/g,'').replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n').replace('.xml','');
}

async function loadProjectMeta(){
  try{
    const r=await fetch('data/Proyectos_Bauvek.xlsx?t='+Date.now());
    if(!r.ok) return[];
    const buf=await r.arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    return rows.map(row=>{
      const city=(row['Ciudad / Localidad']||'').toLowerCase();
      const coordEntry=CITY_COORDS[city];
      const dept=coordEntry?.dept||CITY_TO_DEPT[city]||null;
      return{
        proyecto:row['Proyecto']||'',
        estado:row['Estado']||'',
        cicloVida:row['Ciclo de Vida']||'',
        provincia:row['Provincia']||'',
        ciudad:row['Ciudad / Localidad']||'',
        comitente:row['Comitente']||'',
        m2Cubierta:row['m² Construidos cubierta']||0,
        m2Semi:row['m² Construidos semicubierta']||0,
        m2Terreno:row['m² Terreno']||0,
        archivoXML:row['Archivo XML']||'',
        contratista:row['Contratista Principal']||'',
        lat:coordEntry?.lat||null,
        lng:coordEntry?.lng||null,
        cityLabel:coordEntry?.label||row['Ciudad / Localidad']||'',
        dept:dept,
        _norm:normalizeForMatch(row['Proyecto']),
        _normXml:normalizeForMatch(row['Archivo XML']||''),
      };
    });
  }catch(e){console.warn('No se pudo cargar metadata:',e);return[]}
}

function matchMeta(projectName,metaList){
  if(!metaList||!metaList.length) return null;
  const norm=normalizeForMatch(projectName);
  /* Try exact contains match on project name */
  let best=metaList.find(m=>norm.includes(m._norm)||m._norm.includes(norm));
  if(!best){
    /* Try matching by archivoXML column (e.g. "Vivienda RC.xml" matches the XML filename) */
    best=metaList.find(m=>m._normXml&&(norm.includes(m._normXml)||m._normXml.includes(norm)));
  }
  if(!best){
    /* Try partial: strip common prefixes and match core words */
    const words=norm.replace(/vivienda|viviendas|vivivenda|loteo|losa|proyecto|casa|quincho|qincho/g,'').trim();
    if(words.length>2) best=metaList.find(m=>{
      const mw=m._norm.replace(/vivienda|viviendas|vivivenda|loteo|losa|proyecto|casa|quincho|qincho/g,'').trim();
      return mw.length>2&&(words.includes(mw)||mw.includes(words));
    });
  }
  return best||null;
}

const DEPT_COLORS={
  'Colón':'#9E0101',
  'Santa María':'#D4930D',
  'Calamuchita':'#10b981',
  'Capital':'#6366f1',
};

function DeptMap({projects,metaList,selectedDept,onSelectDept}){
  const deptCounts=useMemo(()=>{
    const counts={};
    for(const d of Object.keys(ALL_DEPTS)) counts[d]={count:0,projects:[]};
    for(const p of projects){
      const m=matchMeta(p.name,metaList);
      if(!m||!m.dept) continue;
      if(counts[m.dept]){counts[m.dept].count++;counts[m.dept].projects.push(p.name)}
    }
    return counts;
  },[projects,metaList]);

  const cityDots=useMemo(()=>{
    const dots={};
    for(const p of projects){
      const m=matchMeta(p.name,metaList);
      if(!m||!m.lat||!m.dept) continue;
      const key=m.cityLabel;
      if(!dots[key]) dots[key]={label:key,lat:m.lat,lng:m.lng,dept:m.dept,count:0};
      dots[key].count++;
    }
    return Object.values(dots);
  },[projects,metaList]);

  const activeDepts=Object.entries(deptCounts).filter(([,v])=>v.count>0);

  /* Geo → SVG for city dots within the 400×550 viewBox */
  const geoToSvg=(lat,lng)=>({
    x:((lng-(-65.00))/(-62.80-(-65.00)))*400,
    y:((lat-(-29.30))/(-35.00-(-29.30)))*550
  });

  return(
    <div className="map-section">
      <div className="map-header">
        <span>Córdoba · Departamentos</span>
        {selectedDept&&<button className="clear-btn" onClick={()=>onSelectDept(null)}>Mostrar todas</button>}
      </div>
      <div className="map-body">
        <svg viewBox="-5 -5 395 525" width="100%" style={{display:'block'}}>
          {/* All 26 departments */}
          {Object.entries(ALL_DEPTS).map(([name,dept])=>{
            const count=deptCounts[name]?.count||0;
            const hasProjects=count>0;
            const color=DEPT_COLORS[name]||'var(--c2)';
            const isSel=selectedDept===name;
            const isOther=selectedDept&&!isSel;
            const isSmall=name==='Capital'||name==='Minas'||name==='Ischilín';
            return(
              <g key={name}
                 onClick={hasProjects?()=>onSelectDept(isSel?null:name):undefined}
                 style={{cursor:hasProjects?'pointer':'default'}}>
                <path d={dept.path}
                  fill={isSel?color:hasProjects?color:'var(--bg-2)'}
                  fillOpacity={isSel?.25:hasProjects?(isOther?.05:.15):.5}
                  stroke={isSel?color:hasProjects?color:'var(--b0)'}
                  strokeWidth={isSel?2.5:hasProjects?1.5:.7}
                  strokeOpacity={isSel?1:hasProjects?(isOther?.3:.7):.4}
                />
                {/* Label — hide smallest depts when not selected, show all active ones */}
                {(!isSmall||isSel||hasProjects)&&!isOther&&<text x={dept.cx} y={dept.cy-(hasProjects?8:2)}
                  textAnchor="middle" className="map-label"
                  style={{
                    fontSize:isSel?9:hasProjects?8:6,
                    fontWeight:isSel?700:hasProjects?600:400,
                    fill:isSel?color:hasProjects?color:'var(--c2)',
                    opacity:hasProjects?1:.5
                  }}>{name}</text>}
                {/* Count badge for departments with projects */}
                {hasProjects&&<g>
                  <circle cx={dept.cx} cy={dept.cy+(isSmall?6:10)} r={isSmall?8:11}
                    fill={isSel?color:'var(--c0)'} opacity={isOther?.2:isSel?1:.8}/>
                  <text x={dept.cx} y={dept.cy+(isSmall?10:14)} textAnchor="middle"
                    style={{fontSize:isSmall?9:11,fontWeight:700,fill:'white',fontFamily:'var(--fm)'}}>{count}</text>
                </g>}
              </g>
            );
          })}

          {/* City dots inside selected department */}
          {selectedDept&&cityDots.filter(c=>c.dept===selectedDept).map(c=>{
            const pos=geoToSvg(c.lat,c.lng);
            const color=DEPT_COLORS[selectedDept]||'var(--ac)';
            return(
              <g key={c.label}>
                <circle cx={pos.x} cy={pos.y} r={5} fill={color} opacity=".9"/>
                <circle cx={pos.x} cy={pos.y} r={9} fill={color} opacity=".12"/>
                <text x={pos.x} y={pos.y+3.5} textAnchor="middle" style={{fontSize:7,fontWeight:700,fill:'white',fontFamily:'var(--fm)'}}>{c.count}</text>
                <text x={pos.x+8} y={pos.y+3} className="map-label" style={{fontSize:8,fontWeight:500,fill:'var(--c0)',textAnchor:'start'}}>{c.label}</text>
              </g>
            );
          })}
        </svg>
      </div>

      {/* Legend: only departments with projects */}
      <div style={{padding:'8px 12px',borderTop:'1px solid var(--b1)',display:'flex',flexDirection:'column',gap:4}}>
        {activeDepts.map(([name,data])=>{
          const color=DEPT_COLORS[name]||'var(--c2)';
          const isSel=selectedDept===name;
          return(
            <div key={name} onClick={()=>onSelectDept(isSel?null:name)}
              style={{display:'flex',alignItems:'center',gap:8,padding:'5px 8px',borderRadius:'var(--r-s)',cursor:'pointer',
                background:isSel?color+'14':'transparent',border:isSel?'1px solid '+color+'40':'1px solid transparent'}}>
              <span style={{width:10,height:10,borderRadius:2,background:color,opacity:isSel?1:.6,flexShrink:0}}/>
              <span style={{flex:1,fontSize:12,fontWeight:isSel?600:400,color:isSel?color:'var(--c0)'}}>{name}</span>
              <span style={{fontSize:11,fontFamily:'var(--fm)',fontWeight:600,color:isSel?color:'var(--c1)'}}>{data.count}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════ Project Info Header ═══════ */
function ProjectInfo({meta}){
  if(!meta) return null;
  const m2Total=((meta.m2Cubierta||0)+(meta.m2Semi||0));
  return(
    <div className="proj-info">
      {meta.comitente&&<div className="proj-info-item"><span className="proj-info-label">Comitente</span><span className="proj-info-value">{meta.comitente}</span></div>}
      {meta.ciudad&&<div className="proj-info-item"><span className="proj-info-label">Ubicación</span><span className="proj-info-value">{meta.ciudad}{meta.provincia?`, ${meta.provincia}`:''}</span></div>}
      {meta.cicloVida&&<div className="proj-info-item"><span className="proj-info-label">Ciclo de vida</span><span className="proj-info-value">{meta.cicloVida}</span></div>}
      {m2Total>0&&<div className="proj-info-item"><span className="proj-info-label">Superficie cubierta</span><span className="proj-info-value mono">{meta.m2Cubierta?.toLocaleString('es-AR')} m² cub{meta.m2Semi?` + ${meta.m2Semi?.toLocaleString('es-AR')} m² semi`:''}</span></div>}
      {meta.m2Terreno>0&&<div className="proj-info-item"><span className="proj-info-label">Terreno</span><span className="proj-info-value mono">{meta.m2Terreno?.toLocaleString('es-AR')} m²</span></div>}
      {meta.contratista&&<div className="proj-info-item"><span className="proj-info-label">Contratista</span><span className="proj-info-value">{meta.contratista}</span></div>}
    </div>
  );
}

/* ═══════ PARSER MSPDI ═══════ */
function parseMSPDI(xmlText){
  const p=new DOMParser(),doc=p.parseFromString(xmlText,'text/xml');
  const ns=doc.documentElement.namespaceURI;
  const g=(el,tag)=>{const e=ns?el.getElementsByTagNameNS(ns,tag)[0]:el.getElementsByTagName(tag)[0];return e?e.textContent.trim():''};
  const ga=(el,tag)=>ns?el.getElementsByTagNameNS(ns,tag):el.getElementsByTagName(tag);

  /* ExtendedAttribute definitions */
  const eaDefs={};
  for(const ea of ga(doc,'ExtendedAttribute')){
    const fid=g(ea,'FieldID'),fn=g(ea,'FieldName'),al=g(ea,'Alias');
    if(fid) eaDefs[fid]={fn,al:al||fn};
  }

  /* Resources */
  const res={};
  for(const r of ga(doc,'Resource')){const uid=g(r,'UID'),nm=g(r,'Name');if(uid&&nm)res[uid]={uid,name:nm}}

  /* Assignment map */
  const trMap={};
  for(const a of ga(doc,'Assignment')){
    const tu=g(a,'TaskUID'),ru=g(a,'ResourceUID');
    if(tu&&ru&&res[ru]){if(!trMap[tu])trMap[tu]=[];trMap[tu].push(res[ru].name)}
  }

  /* Parse tasks */
  const tasks=[];
  for(const t of ga(doc,'Task')){
    const uid=g(t,'UID');if(uid==='0')continue;
    const nm=g(t,'Name')||'(sin nombre)';
    const st=g(t,'Start'),fn=g(t,'Finish'),dur=g(t,'Duration');
    const pct=parseInt(g(t,'PercentComplete')||'0',10);
    const ol=parseInt(g(t,'OutlineLevel')||'0',10);
    const isSm=g(t,'Summary')==='1',isMs=g(t,'Milestone')==='1';
    const wbs=g(t,'WBS'),crit=g(t,'Critical')==='1';

    /* Duration → days */
    let durDays=0;
    if(dur){const m=dur.match(/PT(\d+)H/);if(m)durDays=Math.round(parseInt(m[1])/8)}

    /* Predecessors */
    const preds=[];
    for(const pl of ga(t,'PredecessorLink')){
      const pu=g(pl,'PredecessorUID'),ty=g(pl,'Type')||'1';
      const ls=g(pl,'LinkLag')||'0',lf=g(pl,'LagFormat')||'7';
      const tm={'0':'FF','1':'FS','2':'SF','3':'SS'};
      let ld=parseInt(ls,10);if(lf==='7')ld=ld/10;else if(['3','5','6'].includes(lf))ld=ld/4800;
      preds.push({taskUid:pu,type:tm[ty]||'FS',lagDays:Math.round(ld)});
    }

    /* Baselines */
    const bls=[];
    for(const b of ga(t,'Baseline')){
      const bn=g(b,'Number'),bs=g(b,'Start'),bf=g(b,'Finish');
      if(bs||bf)bls.push({number:parseInt(bn||'0',10),start:bs?new Date(bs):null,finish:bf?new Date(bf):null});
    }

    /* Enterprise custom fields */
    const ent={};
    for(const[hex,info] of Object.entries(ENT)){
      const el=ns?t.getElementsByTagNameNS(ns,hex)[0]:t.getElementsByTagName(hex)[0];
      if(el&&el.textContent){
        const v=el.textContent.trim();
        if(v&&v!=='None')ent[info.n]={value:v,guid:info.t==='guid'};
      }
    }
    /* Standard ExtendedAttribute — with fallback for Text1/2/3 */
    const textFieldMap={'188743731':'Rubro','188743732':'Nivel','188743733':'Tableros'};
    for(const ea of ga(t,'ExtendedAttribute')){
      const fid=g(ea,'FieldID'),val=g(ea,'Value');
      if(fid&&val){
        const d=eaDefs[fid];
        let label=d?(d.al||d.fn):`F${fid}`;
        /* Fallback: if no alias, use our known mapping */
        if(textFieldMap[fid]&&(!d||!d.al||d.al===d.fn)) label=textFieldMap[fid];
        ent[label]={value:val,guid:false};
      }
    }

    tasks.push({
      uid,name:nm,start:st?new Date(st):null,finish:fn?new Date(fn):null,
      duration:dur,durDays,percentComplete:pct,outlineLevel:ol,
      isSummary:isSm,isMilestone:isMs,wbs,critical:crit,
      resources:trMap[uid]||[],predecessors:preds,baselines:bls,ent,
      children:[],depth:0
    });
  }

  /* Hierarchy */
  const roots=[];const stk=[];
  for(const t of tasks){
    while(stk.length&&stk[stk.length-1].outlineLevel>=t.outlineLevel)stk.pop();
    if(stk.length){stk[stk.length-1].children.push(t);t.parent=stk[stk.length-1]}else roots.push(t);
    if(t.isSummary)stk.push(t);
  }
  function flat(list,d=0){const r=[];for(const t of list){t.depth=d;r.push(t);if(t.children.length)r.push(...flat(t.children,d+1))}return r}
  const allTasks=flat(roots);
  const uidMap={};for(const t of allTasks)uidMap[t.uid]=t;

  let minD=null,maxD=null;
  for(const t of allTasks){
    if(t.start&&(!minD||t.start<minD))minD=t.start;
    if(t.finish&&(!maxD||t.finish>maxD))maxD=t.finish;
    for(const b of t.baselines){
      if(b.start&&(!minD||b.start<minD))minD=b.start;
      if(b.finish&&(!maxD||b.finish>maxD))maxD=b.finish;
    }
  }

  const resList=[...new Set(allTasks.flatMap(t=>t.resources))].sort();
  const hasBL=allTasks.some(t=>t.baselines.length>0);
  const contractors=new Set();
  const rubros=new Set();
  const niveles=new Set();
  const tableros=new Set();
  for(const t of allTasks){
    const c=t.ent['Contratista'];if(c&&!c.guid&&c.value)contractors.add(c.value);
    const r=t.ent['Rubro'];if(r&&!r.guid&&r.value)rubros.add(r.value);
    const n=t.ent['Nivel'];if(n&&!n.guid&&n.value)niveles.add(n.value);
    const tb=t.ent['Tableros'];if(tb&&!tb.guid&&tb.value)tableros.add(tb.value);
  }

  return{tasks:allTasks,roots,uidMap,resources:resList,rawRes:Object.values(res),
    minDate:minD,maxDate:maxD,hasBL,contractors:[...contractors].sort(),
    rubros:[...rubros].sort(),niveles:[...niveles].sort(),tableros:[...tableros].sort()};
}

/* ═══════ Utilities ═══════ */
function fD(d){if(!d)return'—';return `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(-2)}`}
function dB(a,b){if(!a||!b)return 0;return Math.round((b-a)/86400000)}
function isOv(t){return!!(t.finish&&t.percentComplete<100&&!t.isSummary&&t.finish<new Date())}
function gSt(t){if(t.percentComplete>=100)return'ok';if(isOv(t))return'ov';if(t.percentComplete>0)return'ip';return'pe'}
function stC(s){return s==='ok'?'var(--ok)':s==='ov'?'var(--err)':s==='ip'?'var(--warn)':'var(--c2)'}
function stL(s){return s==='ok'?'Completada':s==='ov'?'Vencida':s==='ip'?'En curso':'Pendiente'}
function fDur(d){if(!d)return'—';const m=d.match(/PT(\d+)H/);if(!m)return'—';const h=parseInt(m[1]);const dy=Math.round(h/8);return dy===0?'0d':`${dy}d`}
function entV(t,k){const e=t.ent[k];return e&&!e.guid?e.value:''}
/* ═══════ Theme ═══════ */
function useTheme(){
  const[th,setTh]=useState(()=>window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',th)},[th]);
  return[th,useCallback(()=>setTh(t=>t==='light'?'dark':'light'),[])];
}

const ZM={day:{l:'Día',w:28},week:{l:'Semana',w:8},month:{l:'Mes',w:2.5},qtr:{l:'Trim.',w:.8}};

/* ═══════ Tooltip ═══════ */
function Tooltip({info,computoData}){
  if(!info)return null;
  const{task:t,x,y}=info;const s=gSt(t);const bl=t.baselines.length?t.baselines[0]:null;
  const ef=Object.entries(t.ent).filter(([,v])=>!v.guid);
  const nItem=entV(t,'N° Item');
  return <div className="tt" style={{left:Math.min(x,window.innerWidth-300),top:Math.max(y-200,10),maxWidth:320}}>
    <div className="tn">{t.name}</div>
    {t.wbs&&<div className="tr"><span className="tl">WBS</span><span className="tv">{t.wbs}</span></div>}
    <div className="tr"><span className="tl">Estado</span><span className="tv" style={{color:stC(s)}}>{stL(s)}</span></div>
    <div className="tr"><span className="tl">Inicio</span><span className="tv">{fD(t.start)}</span></div>
    <div className="tr"><span className="tl">Fin</span><span className="tv">{fD(t.finish)}</span></div>
    <div className="tr"><span className="tl">Duración</span><span className="tv">{fDur(t.duration)}</span></div>
    <div className="tr"><span className="tl">Avance</span><span className="tv">{t.percentComplete}%</span></div>
    {t.critical&&<div className="tr"><span className="tl">Ruta crítica</span><span className="tv" style={{color:'var(--err)'}}>Sí</span></div>}
    {t.resources.length>0&&<div className="tr"><span className="tl">Recurso</span><span className="tv">{t.resources.join(', ')}</span></div>}
    {ef.map(([k,v])=><div key={k} className="tr"><span className="tl">{k}</span><span className="tv">{v.value}</span></div>)}
    {bl&&<Fragment>
      <div style={{borderTop:'1px solid var(--b1)',margin:'4px 0',fontSize:10,color:'var(--c2)',paddingTop:3}}>Línea base {bl.number}{bl.start?` (${fD(bl.start)})`:''}</div>
      <div className="tr"><span className="tl">Inicio LB</span><span className="tv">{fD(bl.start)}</span></div>
      <div className="tr"><span className="tl">Fin LB</span><span className="tv">{fD(bl.finish)}</span></div>
      {t.finish&&bl.finish&&<div className="tr"><span className="tl">Desvío</span><span className="tv" style={{color:t.finish>bl.finish?'var(--err)':'var(--ok)'}}>{dB(bl.finish,t.finish)} días</span></div>}
    </Fragment>}
    <MatTooltipSection computoData={computoData} nItem={nItem}/>
  </div>;
}
/* ═══════ GANTT SVG ═══════ */
function GanttSVG({tasks,minDate,maxDate,zoom,showArr,showBL,scrollRef,onTT}){
  const cRef=useRef(null);
  const scrolling=useRef(false);
  const rowH=28,hdrH=44;
  const dW=ZM[zoom].w;
  const padB=zoom==='day'?3:zoom==='week'?7:14;
  const padA=zoom==='day'?7:zoom==='week'?14:30;

  const cStart=useMemo(()=>{const d=new Date(minDate||new Date());d.setDate(d.getDate()-padB);return d},[minDate,padB]);
  const cEnd=useMemo(()=>{const d=new Date(maxDate||new Date());d.setDate(d.getDate()+padA);return d},[maxDate,padA]);
  const totD=dB(cStart,cEnd);
  const totW=Math.max(totD*dW,600);
  const totH=tasks.length*rowH;
  const d2x=useCallback(d=>{if(!d)return 0;return dB(cStart,d)*dW},[cStart,dW]);

  /* Scroll sync — ref based, no state */
  const onScroll=useCallback(e=>{if(scrolling.current)return;scrollRef.current={v:e.target.scrollTop,src:'chart'}},[scrollRef]);
  useEffect(()=>{let r;const s=()=>{const el=cRef.current;if(el&&scrollRef.current?.src==='table'){scrolling.current=true;el.scrollTop=scrollRef.current.v;scrollRef.current.src=null;requestAnimationFrame(()=>{scrolling.current=false})};r=requestAnimationFrame(s)};r=requestAnimationFrame(s);return()=>cancelAnimationFrame(r)},[scrollRef]);

  const now=new Date();const nowX=d2x(now);const showNow=now>=cStart&&now<=cEnd;

  /* Grid lines */
  const grid=useMemo(()=>{
    const ln=[],h1=[],h2=[];const d=new Date(cStart);
    if(zoom==='day'){while(d<=cEnd){const x=d2x(d);ln.push({x,we:d.getDay()===0||d.getDay()===6,mj:d.getDay()===1});h2.push({x,w:dW,l:d.getDate().toString()});if(d.getDate()===1||(d.getDay()===1&&!h1.length))h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});d.setDate(d.getDate()+1)}}
    else if(zoom==='week'){let lm=-1;while(d<=cEnd){const x=d2x(d);if(d.getDay()===1||d.getTime()===cStart.getTime()){ln.push({x,mj:d.getDate()<=7});h2.push({x,w:dW*7,l:d.getDate().toString()})}if(d.getMonth()!==lm){h1.push({x,l:d.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})});lm=d.getMonth()}d.setDate(d.getDate()+1)}}
    else if(zoom==='month'){let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);ln.push({x,mj:d.getMonth()===0});const dm=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h2.push({x,w:dm*dW,l:d.toLocaleDateString('es-AR',{month:'short'})});if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    else{let ly=-1;while(d<=cEnd){if(d.getDate()===1){const x=d2x(d);if(d.getMonth()%3===0){ln.push({x,mj:d.getMonth()===0});h2.push({x,w:90*dW,l:`T${Math.floor(d.getMonth()/3)+1}`})}if(d.getFullYear()!==ly){h1.push({x,l:d.getFullYear().toString()});ly=d.getFullYear()}}d.setDate(d.getDate()+1)}}
    return{ln,h1,h2};
  },[cStart,cEnd,zoom,dW,d2x]);

  /* Bar positions */
  const bp=useMemo(()=>{const m={};tasks.forEach((t,i)=>{const y=i*rowH,cy=y+rowH/2;if(t.isMilestone){const mx=d2x(t.start||t.finish);m[t.uid]={x:mx,y,cy,w:0,sx:mx,ex:mx}}else if(t.start&&t.finish){const x1=d2x(t.start),x2=d2x(t.finish),w=Math.max(x2-x1,2);m[t.uid]={x:x1,y,cy,w,sx:x1,ex:x1+w}}});return m},[tasks,d2x]);

  /* Dependency arrows */
  const arrs=useMemo(()=>{if(!showArr)return[];const r=[];for(const t of tasks){for(const pr of t.predecessors){const f=bp[pr.taskUid],tp=bp[t.uid];if(!f||!tp)continue;let fx,fy,tx,ty;switch(pr.type){case'FS':fx=f.ex;fy=f.cy;tx=tp.sx;ty=tp.cy;break;case'FF':fx=f.ex;fy=f.cy;tx=tp.ex;ty=tp.cy;break;case'SS':fx=f.sx;fy=f.cy;tx=tp.sx;ty=tp.cy;break;default:fx=f.sx;fy=f.cy;tx=tp.ex;ty=tp.cy}const g=8;let pa;if(pr.type==='FS'){if(tx>fx+g){if(Math.abs(fy-ty)<2)pa=`M${fx},${fy} L${tx},${ty}`;else{const mx=(fx+tx)/2;pa=`M${fx},${fy} L${mx},${fy} L${mx},${ty} L${tx},${ty}`}}else{const dy=fy<ty?Math.max(fy,ty)+rowH*.6:Math.min(fy,ty)-rowH*.6;pa=`M${fx},${fy} L${fx+g},${fy} L${fx+g},${dy} L${tx-g},${dy} L${tx-g},${ty} L${tx},${ty}`}}else if(pr.type==='SS'){const lx=Math.min(fx,tx)-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}else if(pr.type==='FF'){const rx=Math.max(fx,tx)+g;pa=`M${fx},${fy} L${rx},${fy} L${rx},${ty} L${tx},${ty}`}else{const lx=fx-g;pa=`M${fx},${fy} L${lx},${fy} L${lx},${ty} L${tx},${ty}`}r.push({pa,tx,ty})}}return r},[tasks,bp,showArr]);

  const bEnter=useCallback((e,t)=>{const r=e.currentTarget.getBoundingClientRect();onTT({task:t,x:r.left+r.width/2,y:r.top-4})},[onTT]);
  const bLeave=useCallback(()=>onTT(null),[onTT]);

  return(
    <div ref={cRef} className="gcc" onScroll={onScroll}>
      <svg width={totW} height={totH+hdrH} style={{display:'block'}}>
        <rect x="0" y="0" width={totW} height={hdrH} fill="var(--bg-1)"/>
        <line x1="0" y1={hdrH} x2={totW} y2={hdrH} stroke="var(--b0)"/>
        {grid.h1.map((h,i)=><text key={i} x={h.x+4} y={16} fontSize="10" fontWeight="600" fill="var(--c1)" fontFamily="var(--ff)">{h.l}</text>)}
        {grid.h2.map((h,i)=><text key={i} x={h.x+(h.w?h.w/2:4)} y={34} fontSize="10" fill="var(--c2)" fontFamily="var(--fm)" textAnchor={h.w?'middle':'start'}>{h.l}</text>)}
        {grid.ln.map((l,i)=><line key={i} x1={l.x} y1={hdrH} x2={l.x} y2={totH+hdrH} stroke={l.mj?'var(--b0)':'var(--b1)'} strokeWidth={l.mj?1:.5} strokeDasharray={l.mj?'none':'2,4'}/>)}
        {zoom==='day'&&grid.ln.filter(l=>l.we).map((l,i)=><rect key={i} x={l.x} y={hdrH} width={dW} height={totH} fill="var(--c2)" opacity=".04"/>)}
        {tasks.map((_,i)=><line key={i} x1="0" y1={hdrH+(i+1)*rowH} x2={totW} y2={hdrH+(i+1)*rowH} stroke="var(--b1)" strokeWidth=".5"/>)}
        {arrs.map((a,i)=><g key={i}><path d={a.pa} fill="none" stroke="var(--arr)" strokeWidth="1" transform={`translate(0,${hdrH})`}/><polygon points={`${a.tx},${a.ty+hdrH} ${a.tx-4},${a.ty-3+hdrH} ${a.tx-4},${a.ty+3+hdrH}`} fill="var(--arr-h)" opacity=".5"/></g>)}
        {showNow&&<g><line x1={nowX} y1={hdrH} x2={nowX} y2={totH+hdrH} stroke="var(--today)" strokeWidth="1.5" strokeDasharray="4,3"/><rect x={nowX-16} y={hdrH-14} width="32" height="13" rx="2" fill="var(--today)"/><text x={nowX} y={hdrH-5} textAnchor="middle" fontSize="9" fontWeight="600" fill="white" fontFamily="var(--ff)">HOY</text></g>}
        {tasks.map((t,i)=>{
          const y=hdrH+i*rowH,cy=y+rowH/2;
          let blEl=null;
          if(showBL&&t.baselines.length>0){const b=t.baselines[0];if(b.start&&b.finish&&!t.isMilestone){const bx=d2x(b.start),bw=Math.max(d2x(b.finish)-bx,2);blEl=<rect x={bx} y={cy+5} width={bw} height={3} fill="var(--bar-bl)" rx="1.5" opacity=".5"/>}}
          if(t.isMilestone){const mx=d2x(t.start||t.finish),sz=5,c=isOv(t)?'var(--bar-ov)':'var(--bar-ms)';return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<polygon points={`${mx},${cy-sz} ${mx+sz},${cy} ${mx},${cy+sz} ${mx-sz},${cy}`} fill={c}/></g>}
          if(!t.start||!t.finish)return blEl?<g key={t.uid}>{blEl}</g>:null;
          const x=d2x(t.start),w=Math.max(d2x(t.finish)-x,2),bH=t.isSummary?6:10,bY=cy-bH/2,p=t.percentComplete,ov=isOv(t),dn=p>=100;
          let bg='var(--bar-bg)',fg='var(--bar)';if(ov){bg='var(--bar-ov-bg)';fg='var(--bar-ov)'}else if(dn){bg='var(--bar-ok-bg)';fg='var(--bar-ok)'}
          if(t.isSummary)return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill="var(--bar-sum)" rx="1" opacity=".7"/><rect x={x} y={bY} width={w*p/100} height={bH} fill="var(--bar-sum)" rx="1"/><path d={`M${x},${bY} L${x},${bY+bH+3} L${x+4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/><path d={`M${x+w},${bY} L${x+w},${bY+bH+3} L${x+w-4},${bY+bH}`} fill="none" stroke="var(--bar-sum)" strokeWidth="1.5"/></g>;
          return<g key={t.uid} onMouseEnter={e=>bEnter(e,t)} onMouseLeave={bLeave} style={{cursor:'default'}}>{blEl}<rect x={x} y={bY} width={w} height={bH} fill={bg} rx="3"/><rect x={x} y={bY} width={Math.max(w*p/100,0)} height={bH} fill={fg} rx="3"/>{w>30&&p>0&&<text x={x+4} y={cy+3} fontSize="8" fontWeight="600" fill={fg} fontFamily="var(--fm)" opacity=".8">{p}%</text>}</g>;
        })}
      </svg>
    </div>
  );

      </tr></thead>
      <tbody>{sorted.map(r=>(
        <tr key={r.uid}>
          <td style={{fontWeight:500}}>{r.name}</td>

          <td className="mono">{r.percentComplete}%</td>
          <td style={{fontSize:11,color:'var(--c1)'}}>{entV(r,'Contratista')||'—'}</td>
        </tr>

    </table>

    {/* Breakdown por contratista */}

      const cm={};
      rows.forEach(r=>{const c=entV(r,'Contratista')||'Sin contratista';if(!cm[c])cm[c]={tot:0,late:0,early:0,sumDev:0};cm[c].tot++;if(r.devFin>2)cm[c].late++;if(r.devFin<-2)cm[c].early++;cm[c].sumDev+=(r.devFin||0)});

/* ═══════ Trend history (localStorage) ═══════ */
const TREND_KEY='bp360_trend_v1';
function loadTrend(){try{const d=localStorage.getItem(TREND_KEY);return d?JSON.parse(d):{}}catch(e){return{}}}
function saveTrend(data){try{localStorage.setItem(TREND_KEY,JSON.stringify(data))}catch(e){}}
function getWeekKey(d){const dt=d||new Date();const y=dt.getFullYear();const jan1=new Date(y,0,1);const days=Math.floor((dt-jan1)/86400000);const w=Math.ceil((days+jan1.getDay()+1)/7);return `${y}-W${String(w).padStart(2,'0')}`}
function recordSnapshot(healthMap){
  const wk=getWeekKey();const trend=loadTrend();
  if(!trend[wk])trend[wk]={};
  for(const[k,h] of Object.entries(healthMap)){
    if(!h)continue;
    trend[wk][k]={avg:h.avg,ov:h.ov,done:h.done,tot:h.tot,ts:Date.now()};
  }
  /* Keep only last 12 weeks */
  const keys=Object.keys(trend).sort();
  while(keys.length>12){delete trend[keys.shift()]}
  saveTrend(trend);
  return trend;
}
function getTrendForProject(trend,projKey){
  const weeks=Object.keys(trend).sort();
  return weeks.map(w=>({week:w,...(trend[w][projKey]||{})})).filter(d=>d.avg!==undefined);
}

/* ═══════ Sparkline SVG ═══════ */
function Sparkline({data,field='avg',w=60,h=16,color='var(--ac)'}){
  if(!data||data.length<2)return null;
  const vals=data.map(d=>d[field]||0);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const range=mx-mn||1;
  const pts=vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w;
    const y=h-((v-mn)/range)*(h-2)-1;
    return `${x},${y}`;
  }).join(' ');
  const last=vals[vals.length-1],prev=vals[vals.length-2];
  const delta=last-prev;
  return <span className="trend-row">
    <svg className="sparkline" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={w} cy={h-((last-mn)/range)*(h-2)-1} r="2" fill={color}/>
    </svg>
    {delta!==0&&<span className={`trend-delta ${delta>0?'up':'down'}`}>{delta>0?'▲':'▼'}{Math.abs(delta)}</span>}
    {delta===0&&<span className="trend-delta flat">—</span>}
  </span>;
}

/* ═══════ Health calculation ═══════ */
function calcHealth(data){
  if(!data||!data.tasks)return null;
  const ts=data.tasks.filter(t=>!t.isSummary);
  if(!ts.length)return{color:'x',label:'Sin tareas',tot:0,done:0,ov:0,avg:0,ip:0};
  const tot=ts.length;
  const done=ts.filter(t=>t.percentComplete>=100).length;
  const ov=ts.filter(t=>isOv(t)).length;
  const ip=ts.filter(t=>t.percentComplete>0&&t.percentComplete<100).length;
  const avg=Math.round(ts.reduce((s,t)=>s+t.percentComplete,0)/tot);
  const ovPct=tot>0?ov/tot:0;
  const msOverdue=ts.filter(t=>t.isMilestone&&isOv(t)).length;
  /* Check if project end date is still in the future (has time buffer) */
  const now=new Date();
  const maxFinish=ts.reduce((mx,t)=>t.finish&&t.finish>mx?t.finish:mx,new Date(0));
  const daysToEnd=maxFinish>now?Math.round((maxFinish-now)/86400000):0;
  const hasBuffer=daysToEnd>30;/* más de 30 días para terminar = tiene margen */
  /* Thresholds are more lenient if the project still has time buffer */
  let color='g',label='En tiempo';
  if(hasBuffer){
    /* Proyecto con margen: solo rojo si >40% vencidas o >8 hitos vencidos */
    if(ovPct>.40||msOverdue>8){color='r';label='En riesgo'}
    else if(ovPct>.25||msOverdue>5){color='y';label='Atención'}
  }else{
    /* Proyecto sin margen o vencido: umbrales más estrictos */
    if(ovPct>.20||msOverdue>3){color='r';label='En riesgo'}
    else if(ovPct>.10||msOverdue>1){color='y';label='Atención'}
  }
  /* Next milestone */
  const nextMs=ts.filter(t=>t.isMilestone&&t.finish&&t.finish>=now&&t.percentComplete<100).sort((a,b)=>a.finish-b.finish)[0];
  return{color,label,tot,done,ov,ip,avg,nextMs:nextMs||null,daysToEnd};
}

/* ═══════ Weekly View ═══════ */
function WeekView({data}){
  if(!data)return null;
  const[offset,setOffset]=useState(0);
  const now=new Date();
  const weekStart=useMemo(()=>{
    const d=new Date(now);d.setDate(d.getDate()-d.getDay()+1+offset*7);d.setHours(0,0,0,0);return d;
  },[offset]);
  const weekEnd=useMemo(()=>{
    const d=new Date(weekStart);d.setDate(d.getDate()+4);d.setHours(23,59,59);return d;
  },[weekStart]);

  const weekLabel=useMemo(()=>{
    const opts={day:'numeric',month:'short'};
    return `${weekStart.toLocaleDateString('es-AR',opts)} — ${weekEnd.toLocaleDateString('es-AR',opts)}`;
  },[weekStart,weekEnd]);

  const tasks=useMemo(()=>{
    return data.tasks.filter(t=>!t.isSummary&&t.start&&t.finish&&t.start<=weekEnd&&t.finish>=weekStart);
  },[data.tasks,weekStart,weekEnd]);

  const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  const grouped=useMemo(()=>{
    const g={};
    days.forEach((d,i)=>{
      const dayDate=new Date(weekStart);dayDate.setDate(dayDate.getDate()+i);
      const dayStr=dayDate.toISOString().slice(0,10);
      g[dayStr]={label:d+' '+dayDate.getDate(),tasks:[]};
    });
    for(const t of tasks){
      /* Place task on its start day if within the week, else first day */
      let placed=false;
      for(let i=0;i<5;i++){
        const dayDate=new Date(weekStart);dayDate.setDate(dayDate.getDate()+i);
        const dayStr=dayDate.toISOString().slice(0,10);
        if(t.start<=dayDate&&t.finish>=dayDate){
          g[dayStr].tasks.push(t);placed=true;break;
        }
      }
      if(!placed){const firstKey=Object.keys(g)[0];if(firstKey)g[firstKey].tasks.push(t)}
    }
    return g;
  },[tasks,weekStart]);

  const isThisWeek=offset===0;

  return <div className="week-view">
    <div className="week-nav">
      <button onClick={()=>setOffset(o=>o-1)}>← Anterior</button>
      <h3>{weekLabel}{isThisWeek&&<span style={{fontSize:11,color:'var(--ac)',marginLeft:8}}>esta semana</span>}</h3>
      <button onClick={()=>setOffset(o=>o+1)}>Siguiente →</button>
      {offset!==0&&<button onClick={()=>setOffset(0)} style={{color:'var(--ac)',borderColor:'var(--ac)'}}>Hoy</button>}
    </div>
    <div style={{fontSize:12,color:'var(--c1)',marginBottom:16}}>{tasks.length} tareas en esta semana</div>

    {tasks.length===0&&<div className="week-empty">No hay tareas programadas para esta semana.</div>}

    {Object.entries(grouped).map(([dayKey,day])=>{
      if(!day.tasks.length)return null;
      return <div key={dayKey} className="week-day">
        <div className="week-day-hdr">{day.label} · {day.tasks.length} tareas</div>
        {day.tasks.sort((a,b)=>(a.finish||0)-(b.finish||0)).map(t=>{
          const s=gSt(t);
          return <div key={t.uid} className={`week-task ${s==='ov'?'ov':''}`}>
            <span className="wt-dot" style={{background:stC(s)}}/>
            <span className="wt-name" title={t.name}>{t.isMilestone&&<span style={{color:'var(--bar-ms)',marginRight:4}}>♦</span>}{t.name}</span>
            <span className="wt-meta">{fD(t.start)} → {fD(t.finish)}</span>

/* ═══════ Procurement Forecast ═══════ */
function ProcurementView({data}){
  if(!data)return null;
  const[weeks,setWeeks]=useState(4);
  const now=new Date();
  const horizon=useMemo(()=>{const d=new Date(now);d.setDate(d.getDate()+weeks*7);return d},[weeks]);

  const upcoming=useMemo(()=>{
    return data.tasks.filter(t=>!t.isSummary&&t.start&&t.start>=now&&t.start<=horizon&&t.percentComplete<100);
  },[data.tasks,now,horizon]);

  /* Group by rubro */
  const byRubro=useMemo(()=>{
    const m={};
    for(const t of upcoming){
      const r=entV(t,'Rubro')||'Sin rubro';
      if(!m[r])m[r]=[];
      m[r].push(t);
    }
    return Object.entries(m).sort((a,b)=>b[1].length-a[1].length);
  },[upcoming]);

  /* Group by contratista */
  const byCon=useMemo(()=>{
    const m={};
    for(const t of upcoming){
      const c=entV(t,'Contratista')||'Sin contratista';
      if(!m[c])m[c]=0;
      m[c]++;
    }
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[upcoming]);

  const daysUntil=t=>{if(!t.start)return 999;return Math.max(0,Math.round((t.start-now)/86400000))};

  return <div className="proc-view">
    <div style={{marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:600,marginBottom:4}}>Próximas necesidades</div>
      <div style={{fontSize:12,color:'var(--c1)'}}>Tareas que arrancan en las próximas semanas, agrupadas por rubro. Útil para anticipar compras y coordinar contratistas.</div>
    </div>
    <div className="proc-controls">
      <span className="fl">Horizonte</span>
      <div className="seg">
        {[2,4,8].map(w=><button key={w} className={weeks===w?'on':''} onClick={()=>setWeeks(w)}>{w} sem</button>)}
      </div>
      <span style={{fontSize:12,fontFamily:'var(--fm)',color:'var(--c1)'}}>{upcoming.length} tareas por arrancar</span>
    </div>

    {byCon.length>1&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
      {byCon.map(([c,n])=><span key={c} style={{fontSize:10,padding:'3px 8px',borderRadius:10,background:'var(--bg-1)',color:'var(--c1)',fontWeight:500}}>{c}: {n}</span>)}
    </div>}

    {upcoming.length===0&&<div className="proc-empty">No hay tareas programadas para arrancar en las próximas {weeks} semanas.</div>}

    {byRubro.map(([rubro,tasks])=><div key={rubro} className="proc-group">
      <div className="proc-group-hdr">
        <h4>{rubro}</h4>
        <span className="proc-count">{tasks.length} tareas</span>
      </div>
      {tasks.sort((a,b)=>(a.start||0)-(b.start||0)).map(t=>{
        const days=daysUntil(t);const urgent=days<=7;
        return <div key={t.uid} className={`proc-task ${urgent?'urgent':''}`}>
          <span style={{flex:1,fontWeight:500}}>{t.name}</span>
          <span className="wt-meta">{fD(t.start)}</span>
          <span className="wt-meta" style={{width:50,textAlign:'right'}}>{days===0?'Hoy':`${days}d`}</span>
          {urgent&&<span className="proc-alert">Urgente</span>}
          <span style={{fontSize:10,color:'var(--c1)',width:80,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{entV(t,'Contratista')||'—'}</span>
        </div>;
      })}
    </div>)}
  </div>;
}

/* Cache computo data per project code */
const _computoCache={};
async function fetchComputoForProject(projectCode){
  if(!projectCode)return null;
  if(_computoCache[projectCode])return _computoCache[projectCode];
  try{
    const sb=getComputoSb();
    /* Fetch coeficientes (task recipes - shared, read-only) */
    const{data:coefs,error:e1}=await sb.from('coeficientes').select('id,cod,nombre,rubro,unidad,mats');
    if(e1)throw e1;
    /* Fetch materiales (base materials - shared, read-only) */
    const{data:mats,error:e2}=await sb.from('materiales').select('id,cod,nombre,unidad,cat,precio');
    if(e2)throw e2;
    /* Try to fetch obra and mediciones for this specific project */
    let obra=null,mediciones=[];
    const{data:obras}=await sb.from('obras').select('*').eq('cod',projectCode);
    if(obras&&obras.length){
      obra=obras[0];
      const{data:meds}=await sb.from('mediciones').select('*').eq('obra_id',obra.id);
      if(meds)mediciones=meds;
    }
    /* Build lookup maps */
    const coefMap={};for(const c of(coefs||[]))coefMap[c.cod]=c;
    const matByName={};for(const m of(mats||[]))matByName[m.nombre]=m;
    /* Build medicion lookup by coef_id */
    const medByCoef={};for(const m of mediciones){if(!medByCoef[m.coef_id])medByCoef[m.coef_id]=[];medByCoef[m.coef_id].push(m)}
    const result={obra,coefs:coefs||[],coefMap,materiales:mats||[],matByName,mediciones,medByCoef,loaded:true};
    _computoCache[projectCode]=result;
    return result;
  }catch(err){
    console.warn('Computo fetch error:',err);
    return{loaded:false,error:err.message||'Error de conexión',coefs:[],coefMap:{},materiales:[],matByName:{},mediciones:[],medByCoef:{},obra:null};
  }
}

/* Get materials for a task by its N° Item code */
function getTaskMaterials(computoData,nItem){
  if(!computoData||!nItem||!computoData.coefMap[nItem])return null;
  const coef=computoData.coefMap[nItem];
  if(!coef.mats||!coef.mats.length)return{coef,items:[],mediciones:[]};
  const meds=computoData.medByCoef[coef.id]||[];
  const totalQty=meds.reduce((s,m)=>s+(m.cantidad||0),0);
  const items=(coef.mats||[]).map(m=>{
    const mat=computoData.matByName[m.matRef];
    const needed=totalQty>0?totalQty*m.coef:m.coef;
    const commercial=m.divisor&&m.divisor>1?Math.ceil(needed/m.divisor):needed;
    return{...m,materialInfo:mat,cantidadNecesaria:needed.toFixed(2),cantidadComercial:commercial,totalMedido:totalQty};
  });
  return{coef,items,mediciones:meds,totalMedido:totalQty};
}
